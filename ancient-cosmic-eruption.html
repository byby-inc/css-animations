<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ancient Cosmic Eruption</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% { transform: translate(0, 0) rotate(0deg); }
    50% { transform: translate(-20px, -20px) rotate(90deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }
  @keyframes core-pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  @keyframes neural-flicker {
    0% { transform: translate(10px, 10px); }
    50% { transform: translate(-10px, -10px); }
    100% { transform: translate(10px, 10px); }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: linear-gradient(90deg, #ff99ff, #ff0000);
  }
  .vortex-container::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    background: radial-gradient(#fff, #999);
    border-radius: 50%;
    box-shadow: 0 0 10px #fff,
                0 0 15px #fff,
                0 0 20px #fff,
                0 0 25px #fff,
                0 0 30px #fff,
                0 0 35px #fff;
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    background: linear-gradient(90deg, #ff0000, #ff99ff);
    border-radius: 50%;
    box-shadow: 0 0 10px #fff,
                0 0 15px #fff,
                0 0 20px #fff,
                0 0 25px #fff,
                0 0 30px #fff,
                0 0 35px #fff;
  }
  .core::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 80px;
    height: 80px;
    background: radial-gradient(#fff, #999);
    border-radius: 50%;
    animation: core-pulse 1.5s infinite;
  }
  .particle {
    position: absolute;
    top: 0;
    left: 0;
    width: 10px;
    height: 10px;
    background: linear-gradient(90deg, #ff99ff, #ff0000);
    border-radius: 50%;
    animation: particle-dance 0.5s infinite;
    transform: translate(0, 0) rotate(0deg);
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
    stroke-width: 2;
  }
  .neural-web path {
    stroke: #fff;
    stroke-width: 2;
  }
  .neural-web path:nth-child(1) {
    fill: #ff00ff;
    opacity: 0.5;
    animation: neural-flicker 2s infinite;
  }
  .neural-web path:nth-child(2) {
    fill: #00ffff;
    opacity: 0.5;
    animation: neural-flicker 1.5s infinite;
  }
  .neural-web path:nth-child(3) {
    fill: #ffff00;
    opacity: 0.5;
    animation: neural-flicker 2.5s infinite;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M100 100 Q200 100 200 0T300 0 Q300 50 300 100"></path>
      <path d="M100 100 Q200 100 200 50T300 50 Q300 0 300 100"></path>
      <path d="M100 100 Q0 100 0 0T0 0 Q0 50 0 100"></path>
    </svg>
    <div class="particle"></div>
    <div class="particle" style="top: 20px; left: 20px;"></div>
    <div class="particle" style="top: 40px; left: 40px;"></div>
    <div class="particle" style="top: 60px; left: 60px;"></div>
    <div class="particle" style="top: 80px; left: 80px;"></div>
    <div class="particle" style="top: 100px; left: 100px;"></div>
  </div>
        </div>
        </body>
        </html>
