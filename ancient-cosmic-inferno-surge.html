<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ancient Cosmic Inferno Surge</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            /* Vortex Container Styles */
.vortex-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
}

/* Core Styles */
.core {
  position: absolute;
  width: 100px;
  height: 100px;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background-image: linear-gradient(to bottom, #FFD700, #FF9900);
}

.core::before {
  content: "";
  position: absolute;
  width: 90%;
  height: 90%;
  top: 5%;
  left: 5%;
  border-radius: 45%;
  background-image: linear-gradient(to bottom, #FFD700, #FF9900);
  box-shadow: 0 0 10px #FFA07A, 0 0 20px #FFC499, 0 0 30px #FFA07A, 0 0 40px #FF9900, 0 0 50px #FFC499;
}

/* Particle Styles */
.particle {
  position: absolute;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background-image: linear-gradient(to bottom, #FFA07A, #FFC499);
  animation: particle-dance 4s infinite;
}

.particle-two {
  animation: particle-dance 5s infinite;
}

.particle-three {
  animation: particle-dance 6s infinite;
}

/* Neural Web Styles */
.neural-web {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

.neural-web path {
  stroke: #fff;
}

.neural-web path:first-child {
  stroke-dasharray: 100;
  stroke-dashoffset: 0;
  animation: neural-flicker 2s infinite;
}

.neural-web path:nth-child(2) {
  stroke-dasharray: 100;
  stroke-dashoffset: 0;
  animation: neural-flicker 3s infinite;
}

.neural-web path:nth-child(3) {
  stroke-dasharray: 100;
  stroke-dashoffset: 0;
  animation: neural-flicker 4s infinite;
}

/* Animations */
@keyframes particle-dance {
  0% {
    transform: translate(0, 0) rotate(0deg);
  }
  25% {
    transform: translate(-20px, -20px) rotate(180deg);
  }
  50% {
    transform: translate(0, 0) rotate(360deg);
  }
  75% {
    transform: translate(20px, 20px) rotate(180deg);
  }
  100% {
    transform: translate(0, 0) rotate(0deg);
  }
}

@keyframes core-pulse {
  0% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.5);
  }
  100% {
    transform: scale(1);
  }
}

@keyframes neural-flicker {
  0% {
    stroke-dashoffset: 0;
  }
  25% {
    stroke-dashoffset: -100;
  }
  50% {
    stroke-dashoffset: 0;
  }
  75% {
    stroke-dashoffset: 100;
  }
  100% {
    stroke-dashoffset: 0;
  }
}
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core">
      <div class="core::before"></div>
    </div>
    <svg class="neural-web">
      <path d="M20 20 L40 20"></path>
      <path d="M60 40 L40 40"></path>
      <path d="M60 60 L60 20"></path>
    </svg>
    <div class="particle"></div>
    <div class="particle particle-two"></div>
    <div class="particle particle-three"></div>
    <div class="particle particle-four"></div>
    <div class="particle particle-five"></div>
    <div class="particle particle-six"></div>
  </div>
        </div>
        </body>
        </html>
