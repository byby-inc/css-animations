<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ancient Cosmic Maelstrom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes core-pulse {
    0% {
      transform: scale(1,1);
    }
    50% {
      transform: scale(1.2,1.2);
    }
    100% {
      transform: scale(1,1);
    }
  }

  @keyframes particle-dance {
    0% {
      transform: translate(0px,0px) rotate(0deg);
    }
    50% {
      transform: translate(50px,50px) rotate(180deg);
    }
    100% {
      transform: translate(0px,0px) rotate(0deg);
    }
  }

  @keyframes neural-flicker {
    0% {
      transform: translateY(10px);
    }
    50% {
      transform: translateY(20px);
    }
    100% {
      transform: translateY(10px);
    }
  }

  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: linear-gradient(to bottom, #3498db, #1abc9c);
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: linear-gradient(to bottom, #1abc9c, #8e44ad);
    box-shadow: 0 0 10px #1abc9c, 0 0 10px #8e44ad, 0 0 10px #3498db, 0 0 10px #16a085, 0 0 10px #f1c40f, 0 0 10px #e67e73;
    animation: core-pulse 5s infinite;
  }

  .particle {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: linear-gradient(to bottom, #f1c40f, #2ecc71);
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    animation: particle-dance 2s infinite;
  }

  .particle:nth-child(1) {
    background: radial-gradient(circle at center, #16a085, #f1c40f);
    animation-delay: 0.5s;
  }

  .particle:nth-child(2) {
    background: linear-gradient(to top, #f1c40f, #16a085);
    animation-delay: 1s;
  }

  .particle:nth-child(3) {
    background: linear-gradient(to bottom, #3498db, #8e44ad);
    animation-delay: 1.5s;
  }

  .particle:nth-child(4) {
    background: radial-gradient(circle at center, #e67e73, #1abc9c);
    animation-delay: 2s;
  }

  .particle:nth-child(5) {
    background: linear-gradient(to top, #1abc9c, #e67e73);
    animation-delay: 2.5s;
  }

  .particle:nth-child(6) {
    background: linear-gradient(to bottom, #3498db, #16a085);
    animation-delay: 3s;
  }

  .particle:nth-child(7) {
    background: radial-gradient(circle at center, #8e44ad, #f1c40f);
    animation-delay: 3.5s;
  }

  .neural-web {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 500px;
    height: 500px;
  }

  .neural-web path {
    stroke: #fff;
    stroke-width: 2px;
  }

  .neural-web path:nth-child(1) {
    stroke-dasharray: 200;
    stroke-dashoffset: 200;
    animation: neural-flicker 10s infinite;
  }

  .neural-web path:nth-child(2) {
    stroke-dasharray: 150;
    stroke-dashoffset: 150;
    animation: neural-flicker 8s infinite;
  }

  .neural-web path:nth-child(3) {
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
    animation: neural-flicker 6s infinite;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 100 100 L 300 100 L 200 300 Z" />
      <path d="M 100 100 L 200 300 L 300 100 Z" />
      <path d="M 100 100 L 150 250 L 250 150 Z" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
