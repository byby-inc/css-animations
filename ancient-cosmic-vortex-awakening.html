<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ancient Cosmic Vortex Awakening</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            .vortex-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  background: linear-gradient(120deg, #3a1c7e, #f77b7e);
  display: flex;
  justify-content: center;
  align-items: center;
}

.core {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background: radial-gradient(#fff, #ff99bb);
  box-shadow: 
    0px 0px 0px 2px #fff, 
    0px 0px 0px 5px #fff, 
    0px 0px 0px 10px #fff, 
    0px 0px 0px 15px #fff, 
    0px 0px 0px 20px #fff, 
    0px 0px 0px 25px #fff;
  animation: core-pulse infinite 2s;
}

.particle {
  position: absolute;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: radial-gradient(#fff, #ff99bb);
  box-shadow: 0px 0px 0px 2px #fff;
  animation: particle-dance infinite 1.5s;
}

.neural-web {
  position: absolute;
  width: 100%;
  height: 100%;
}

.neural-web path {
  stroke: #fff;
  stroke-width: 2px;
}

.neural-web rect {
  fill: radial-gradient(#fff, #ff99bb);
}

@keyframes core-pulse {
  0% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.2);
  }
  100% {
    transform: scale(1);
  }
}

@keyframes particle-dance {
  0% {
    transform: rotate(0deg) translate(0, 0);
  }
  50% {
    transform: rotate(360deg) translate(10px, 10px);
  }
  100% {
    transform: rotate(720deg) translate(0, 0);
  }
}

@keyframes neural-flicker {
  0% {
    transform: rotate(0deg) scale(1);
  }
  50% {
    transform: rotate(180deg) scale(1.2);
  }
  100% {
    transform: rotate(0deg) scale(1);
  }
}
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M50 100L100 50 L 150 100 Z" />
      <path d="M50 50L150 100 L 100 150 Z" />
      <path d="M50 150L100 100 L 150 50 Z" />
    </svg>
    <div class="particle" style="top: 20%; left: 30%" ></div>
    <div class="particle" style="top: 40%; left: 60%" ></div>
    <div class="particle" style="top: 10%; left: 10%" ></div>
    <div class="particle" style="top: 70%; left: 90%" ></div>
    <div class="particle" style="top: 60%; left: 20%" ></div>
    <div class="particle" style="top: 90%; left: 80%" ></div>
  </div>
        </div>
        </body>
        </html>
