<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ancient Cosmic Vortex</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.2) rotate(10deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  @keyframes core-pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }
  @keyframes neural-flicker {
    0% { transform: translate(0%,0%) rotate(0deg); }
    50% { transform: translate(0%,1%) rotate(-10deg); }
    100% { transform: translate(0%,0%) rotate(0deg); }
  }
  .vortex-container { 
    position: absolute; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    z-index: -1;
    clip-path: circle(50% at 50% 50%);
  }
  .core {
    position: absolute; 
    top: 50%; 
    left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: linear-gradient(to bottom right, #66b3ff, #ccffff);
    box-shadow: 
      0 0 0 10px rgba(255, 255, 255, 0.2),
      0 0 0 20px rgba(255, 255, 255, 0.3),
      0 0 0 30px rgba(255, 255, 255, 0.4);
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(to bottom left, #ffcccc, #ccccff);
    animation: particle-dance infinite 1s ease-out;
    animation-timing-function: linear;
  }
  .neural-web {
    position: absolute;
    fill: url('#neural-gradient');
    width: 100%;
    height: 100%;
  }
  .neural-web path {
    stroke: #fff;
    stroke-width: 2px;
    stroke-linecap: round;
  }
  @keyframes core-pulse {
    0% { box-shadow: 0 0 0 10px rgba(255, 255, 255, 0.2), 0 0 0 20px rgba(255, 255, 255, 0.3), 0 0 0 30px rgba(255, 255, 255, 0.4); }
    50% { box-shadow: 0 0 0 15px rgba(255, 255, 255, 0.3), 0 0 0 25px rgba(255, 255, 255, 0.4); }
    100% { box-shadow: 0 0 0 10px rgba(255, 255, 255, 0.2), 0 0 0 20px rgba(255, 255, 255, 0.3), 0 0 0 30px rgba(255, 255, 255, 0.4); }
  }
  @keyframes particle-dance {
    0% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.2) rotate(10deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  @keyframes neural-flicker {
    0% { transform: translate(0%,0%) rotate(0deg); }
    50% { transform: translate(0%,1%) rotate(-10deg); }
    100% { transform: translate(0%,0%) rotate(0deg); }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <defs>

          <stop offset="0%" stop-color="#ccffcc" />

        </linearGradient>

    <div class="particle" style="left: 30%; top: 50%; transform: scale(0.8) rotate(-20deg);"></div>
  </div>
        </div>
        </body>
        </html>
