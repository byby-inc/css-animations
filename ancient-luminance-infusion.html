<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ancient Luminance Infusion</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: translate(0, 0);
    }
    50% {
      transform: translate(20px, 10px) rotate(10deg);
    }
    100% {
      transform: translate(0, 0) rotate(0deg);
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.1);
    }
    100% {
      transform: scale(1);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: rotate(0deg);
    }
    50% {
      transform: rotate(10deg);
    }
    100% {
      transform: rotate(0deg);
    }
  }
  
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  }
  
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background-image: linear-gradient(to bottom, #87CEEB, #ADD8E6);
    box-shadow:
      0 0 10px #87CEEB,
      0 0 20px #ADD8E6,
      0 0 30px #87CEEB,
      0 0 40px #ADD8E6,
      0 0 50px #87CEEB,
      0 0 60px #ADD8E6;
    animation: core-pulse infinite 3s ease-out;
  }
  
  .particle {
    position: absolute;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    background-image: linear-gradient(to bottom, #87CEEB, #ADD8E6);
    animation: particle-dance infinite 1.5s linear;
  }
  
  .particle:nth-child(1) {
    top: 50%;
    left: 50%;
    animation-delay: 0s;
    transform: translate(-50%, -50%);
  }
  .particle:nth-child(2) {
    top: 40%;
    left: 80%;
    animation-delay: 0.5s;
    transform: translate(-50%, -50%) rotate(20deg);
  }
  .particle:nth-child(3) {
    top: 60%;
    left: 20%;
    animation-delay: 1s;
    transform: translate(-50%, -50%) rotate(60deg);
  }
  .particle:nth-child(4) {
    top: 70%;
    left: 40%;
    animation-delay: 1.5s;
    transform: translate(-50%, -50%) scale(1.2);
  }
  .particle:nth-child(5) {
    top: 30%;
    left: 60%;
    animation-delay: 1s;
    transform: translate(-50%, -50%) rotate(90deg);
  }
  .particle:nth-child(6) {
    top: 40%;
    left: 10%;
    animation-delay: 2s;
    transform: translate(-50%, -50%) scale(1.5);
  }
  
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: #fff;
  }
  
  .neural-web path {
    stroke: #fff;
    stroke-width: 2px;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 0 0 L 100 0 L 50 100 L 0 0 M 0 100 L 100 100 L 50 0 L 0 100 M 50 50 L 70 70 L 30 70 L 10 50 L 50 50" />
      <path d="M 20 20 L 80 20 L 60 80 L 20 20 M 20 80 L 80 80 L 60 20 L 20 80 M 40 40 L 60 60 L 40 80 L 20 40 L 40 40" />
      <path d="M 10 10 L 90 10 L 60 90 L 10 10 M 10 90 L 90 90 L 60 10 L 10 90 M 40 40 L 60 60 L 40 80 L 20 40 L 40 40" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
