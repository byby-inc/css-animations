<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ancient Molten Vortex Maelstrom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% { transform: translate(100px, 50px) rotate(0deg); }
    50% { transform: translate(-100px, -50px) rotate(180deg); }
    100% { transform: translate(100px, 50px) rotate(0deg); }
  }
  @keyframes core-pulse {
    0% { transform: scale(0.9); }
    50% { transform: scale(1.1); }
    100% { transform: scale(0.9); }
  }
  @keyframes neural-flicker {
    0% { transform: translate(-20px, -10px); }
    50% { transform: translate(20px, 10px); }
    100% { transform: translate(-20px, -10px); }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background-image: linear-gradient(to bottom, #ff9900, #ccff00);
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    background-image: linear-gradient(to bottom, #ffcc00, #ccff00);
    width: 10px;
    height: 10px;
    animation: particle-dance 2s infinite;
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    background-image: linear-gradient(to bottom, #ff9900, #ccff00);
    box-shadow: 0 0 10px #ff9900, 0 0 10px #ccff00, 0 0 10px #ffcc00, 0 0 10px #cc00ff, 0 0 10px #ff00cc;
    animation: core-pulse 4s infinite;
  }
  .neural-web {
    position: absolute;
    fill: none;
    stroke: #fff;
  }
  .neural-web path {
    animation: neural-flicker 1s infinite;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web" width="100%" height="100%">
      <path d="M 50 50 L 100 50" />
      <path d="M 50 50 L 50 100" />
      <path d="M 50 50 L 0 50" />
      <path d="M 50 50 L 25 75" />
      <path d="M 50 50 L 25 25" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
