<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ancient Quantum Bloom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: translate(0, 0) rotate(0deg);
    }
    50% {
      transform: translate(-10px, -10px) rotate(180deg);
    }
    100% {
      transform: translate(0, 0) rotate(360deg);
    }
  }

  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.1);
    }
    100% {
      transform: scale(1);
    }
  }

  @keyframes neural-flicker {
    0% {
      transform: scale(1) translate(0, 0);
    }
    50% {
      transform: scale(0.9) translate(5px, 5px);
    }
    100% {
      transform: scale(1) translate(0, 0);
    }
  }

  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: linear-gradient(90deg, #2B7BC5, #3498DB);
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: linear-gradient(120deg, #F7DC6F, #FDAF6D);
    box-shadow:
      0 0 10px #F7DC6F,
      0 0 20px #F7DC6F,
      0 0 30px #F7DC6F,
      0 0 40px #F7DC6F,
      0 0 50px #F7DC6F,
      0 0 60px #F7DC6F;
    animation: core-pulse 2s infinite;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    width: 10px;
    height: 10px;
    background: linear-gradient(120deg, #3498DB, #2196F3);
    animation: particle-dance 1.5s infinite;
  }

  .particle:nth-child(1) {
    top: 30%;
    left: 30%;
    animation-duration: 2s;
  }

  .particle:nth-child(2) {
    top: 60%;
    left: 60%;
    animation-duration: 1.8s;
  }

  .particle:nth-child(3) {
    top: 90%;
    left: 90%;
    animation-duration: 2.2s;
  }

  .particle:nth-child(4) {
    top: 20%;
    left: 10%;
    animation-duration: 2.4s;
  }

  .particle:nth-child(5) {
    top: 70%;
    left: 70%;
    animation-duration: 1.6s;
  }

  .particle:nth-child(6) {
    top: 10%;
    left: 50%;
    animation-duration: 2s;
  }

  .particle:nth-child(7) {
    top: 40%;
    left: 80%;
    animation-duration: 1.9s;
  }

  .particle:nth-child(8) {
    top: 20%;
    left: 20%;
    animation-duration: 2.5s;
  }

  .particle:nth-child(9) {
    top: 60%;
    left: 40%;
    animation-duration: 2.1s;
  }

  .particle:nth-child(10) {
    top: 80%;
    left: 60%;
    animation-duration: 1.7s;
  }

  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
    stroke-width: 5;
  }

  .neural-web path {
    animation: neural-flicker 2.5s infinite;
  }

  .neural-web path:nth-child(1) {
    d: M 50 50 C 75 50, 75 25, 50 25;
    animation-duration: 3s;
  }

  .neural-web path:nth-child(2) {
    d: M 50 50 C 25 50, 25 75, 50 75;
    animation-duration: 2.8s;
  }

  .neural-web path:nth-child(3) {
    d: M 50 50 C 25 25, 75 25, 75 50;
    animation-duration: 3.2s;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 50 50 C 75 50, 75 25, 50 25"></path>
      <path d="M 50 50 C 25 50, 25 75, 50 75"></path>
      <path d="M 50 50 C 25 25, 75 25, 75 50"></path>
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
