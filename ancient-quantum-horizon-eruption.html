<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ancient Quantum Horizon Eruption</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% { transform: translate(-50%, -50%) rotate(0deg); }
    50% { transform: translate(-50%, -50%) rotate(20deg); }
    100% { transform: translate(-50%, -50%) rotate(0deg); }
  }

  @keyframes core-pulse {
    0% { transform: scale(0.5); }
    50% { transform: scale(1); }
    100% { transform: scale(0.5); }
  }

  @keyframes neural-flicker {
    0% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.2) rotate(10deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: radial-gradient(circle at 50% 50%, #333, #444, #555);
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: linear-gradient(to bottom, #999, #777);
    box-shadow:
      0 0 0 10px #999,
      0 0 0 20px #777,
      0 0 0 30px #666,
      0 0 0 40px #555,
      0 0 0 50px #444,
      0 0 0 60px #333;
    animation: core-pulse infinite 3s;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(to bottom, #999, #777);
    opacity: 0.5;
    animation: particle-dance infinite 8s;
  }

  .particle:nth-child(1) {
    top: 20%;
    left: 20%;
    width: 30px;
    height: 30px;
    animation-delay: 0s;
  }

  .particle:nth-child(2) {
    top: 30%;
    left: 60%;
    width: 25px;
    height: 25px;
    animation-delay: 1.5s;
  }

  .particle:nth-child(3) {
    top: 50%;
    left: 20%;
    width: 35px;
    height: 35px;
    animation-delay: 3s;
  }

  .particle:nth-child(4) {
    top: 70%;
    left: 40%;
    width: 40px;
    height: 40px;
    animation-delay: 4.5s;
  }

  .particle:nth-child(5) {
    top: 80%;
    left: 10%;
    width: 30px;
    height: 30px;
    animation-delay: 6s;
  }

  .particle:nth-child(6) {
    top: 20%;
    left: 80%;
    width: 25px;
    height: 25px;
    animation-delay: 7.5s;
  }

  .particle:nth-child(7) {
    top: 60%;
    left: 50%;
    width: 35px;
    height: 35px;
    animation-delay: 9s;
  }

  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: #fff;
  }

  .neural-web path {
    stroke: #fff;
  }

  .neural-web path:nth-child(1) {
    d: 'M50,50 C75,50 100,75 100,100 C75,125 50,150 50,100';
  }

  .neural-web path:nth-child(2) {
    d: 'M100,50 C75,50 50,75 50,100 C75,125 100,150 100,100';
  }

  .neural-web path:nth-child(3) {
    d: 'M25,25 C0,25 50,0 25,0';
  }

  .neural-web path:nth-child(4) {
    d: 'M75,75 C100,75 25,100 75,75';
  }

  .neural-web path:nth-child(5) {
    d: 'M100,25 C125,25 150,50 125,75';
  }

  .neural-web path:nth-child(6) {
    d: 'M25,75 C0,75 50,100 75,75';
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web" viewBox="0 0 100 100">
      <path />
      <path />
      <path />
      <path />
      <path />
      <path />
      <path />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
