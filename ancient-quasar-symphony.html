<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ancient Quasar Symphony</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes core-pulse {
    0% {
      transform: scale(1);
      opacity: 0.8;
    }
    50% {
      transform: scale(1.1);
      opacity: 0.1;
    }
    100% {
      transform: scale(1);
      opacity: 0.8;
    }
  }
  @keyframes particle-dance {
    0% {
      transform: translate(0, 20px) rotate(0deg);
    }
    50% {
      transform: translate(-20px, -20px) rotate(360deg);
    }
    100% {
      transform: translate(0, 20px) rotate(0deg);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: rotate(0deg);
    }
    50% {
      transform: rotate(180deg);
    }
    100% {
      transform: rotate(0deg);
    }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: linear-gradient(conic(circle at 50% 50%, #ff69b4, #33ccff, #ffff00));
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: linear-gradient(90deg, #ff69b4 0%, #33ccff 100%);
    box-shadow: 0 0 0 0 rgba(0, 0, 0, 0.1), 0 0 0 10px rgba(255, 102, 180, 0.2), 0 0 0 15px rgba(102, 204, 255, 0.3), 0 0 0 20px rgba(255, 255, 0, 0.4);
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(270deg, #33ccff, #ff69b4);
  }
  .neural-web {
    position: absolute;
    fill: #fff;
    stroke: #fff;
    stroke-width: 2;
    width: 100%;
    height: 100%;
    left: 0;
    top: 0;
    transform: rotate(180deg);
  }
  .neural-web path:nth-child(1) {
    d: "M 500 100 C 600 200 800 100 900 100";
  }
  .neural-web path:nth-child(2) {
    d: "M 100 100 C 200 300 900 300 1000 100";
  }
  .neural-web path:nth-child(3) {
    d: "M 100 900 C 300 700 900 700 1000 900";
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core" style="animation: core-pulse 2s infinite"></div>
    <svg class="neural-web" style="animation: neural-flicker 4s infinite">
      <path class="neural-web-path" style="animation: neural-flicker 4s infinite"></path>
      <path class="neural-web-path" style="animation: neural-flicker 4s infinite"></path>
      <path class="neural-web-path" style="animation: neural-flicker 4s infinite"></path>
    </svg>
    <div class="particle" style="animation: particle-dance 0.8s infinite; left: 10px; top: 10px;"></div>
    <div class="particle" style="animation: particle-dance 0.8s infinite; left: 20px; top: 20px;"></div>
    <div class="particle" style="animation: particle-dance 0.8s infinite; left: 30px; top: 30px;"></div>
    <div class="particle" style="animation: particle-dance 0.8s infinite; left: 40px; top: 40px;"></div>
    <div class="particle" style="animation: particle-dance 0.8s infinite; left: 50px; top: 50px;"></div>
    <div class="particle" style="animation: particle-dance 0.8s infinite; left: 60px; top: 60px;"></div>
    <div class="particle" style="animation: particle-dance 0.8s infinite; left: 70px; top: 70px;"></div>
  </div>
        </div>
        </body>
        </html>
