<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ancient Singularity Maelstrom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% { transform: rotate(0deg) translate(0px, 0px); }
    50% { transform: rotate(30deg) translate(2px, 2px); }
    100% { transform: rotate(0deg) translate(0px, 0px); }
  }
  @keyframes core-pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }
  @keyframes neural-flicker {
    0% { transform: rotate(0deg) translate(0px, 0px); }
    50% { transform: rotate(5deg) translate(1px, 1px); }
    100% { transform: rotate(0deg) translate(0px, 0px); }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    background: linear-gradient(90deg, #4c0082, #00ccff);
    clip-path: circle(50% at 50% 50%);
    animation: maelstrom 10s infinite;
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    background: linear-gradient(120deg, #ffff00, #ff00ff);
    box-shadow: 0 0 10px #ffff00, 0 0 20px #ff00ff, 0 0 30px #ffff00, 0 0 40px #ff00ff;
    box-shadow: 0 0 50px #ffff00, 0 0 60px #ff00ff, 0 0 70px #ffff00, 0 0 80px #ff00ff;
    border-radius: 50%;
    animation: core-pulse 2s infinite;
  }
  .particle {
    position: absolute;
    top: 0;
    left: 0;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: linear-gradient(120deg, #ffff00, #ff00ff);
    animation: particle-dance 3s infinite;
  }
  .particle:nth-child(1) {
    top: 10%;
    left: 10%;
  }
  .particle:nth-child(2) {
    top: 60%;
    left: 80%;
  }
  .particle:nth-child(3) {
    top: 90%;
    left: 30%;
  }
  .particle:nth-child(4) {
    top: 40%;
    left: 20%;
  }
  .particle:nth-child(5) {
    top: 70%;
    left: 60%;
  }
  .particle:nth-child(6) {
    top: 20%;
    left: 90%;
  }
  .particle:nth-child(7) {
    top: 80%;
    left: 10%;
  }
  .particle:nth-child(8) {
    top: 50%;
    left: 50%;
  }
  .particle:nth-child(9) {
    top: 10%;
    left: 80%;
  }
  .particle:nth-child(10) {
    top: 90%;
    left: 40%;
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
    stroke-width: 1px;
  }
  .neural-web path {
    stroke-dasharray: 100, 200;
    stroke-dashoffset: 0;
    animation: neural-flicker 5s infinite;
  }
  .neural-web path:nth-child(1) {
    stroke-dashoffset: 50;
  }
  .neural-web path:nth-child(2) {
    stroke-dashoffset: 0;
  }
  .neural-web path:nth-child(3) {
    stroke-dashoffset: 100;
  }
  @keyframes maelstrom {
    0% { clip-path: circle(50% at 50% 50%); }
    50% { clip-path: ellipse(70% 50% at 50% 50%); }
    100% { clip-path: circle(50% at 50% 50%); }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 25 75 C 50 75 75 50 75 25" />
      <path d="M 50 75 C 25 50 0 25 0 0" />
      <path d="M 25 25 C 50 0 75 -25 75 -50" />
      <path d="M 50 25 C 75 0 100 -25 100 -50" />
      <path d="M 75 25 C 100 0 125 -25 125 -50" />
      <path d="M 50 25 C 25 0 0 -25 0 -50" />
      <path d="M 25 25 C 0 0 -25 -25 -25 -50" />
      <path d="M 50 25 C 75 0 100 -25 100 -50" />
    </svg>
  </div>
        </div>
        </body>
        </html>
