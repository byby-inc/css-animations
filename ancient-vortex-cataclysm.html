<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ancient Vortex Cataclysm</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
      0% { transform: rotate(0deg) scale(0.5) translate(-50%, -50%) }
      50% { transform: rotate(180deg) scale(1) translate(-50%, -50%) }
      100% { transform: rotate(360deg) scale(0.5) translate(-50%, -50%) }
    }
    @keyframes core-pulse {
      0% { transform: scale(1) }
      50% { transform: scale(1.1) }
      100% { transform: scale(1) }
    }
    @keyframes neural-flicker {
      0% { transform: scale(1) }
      50% { transform: scale(1.05) translate(0%, -5%) }
      100% { transform: scale(1) }
    }
    .vortex-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      clip-path: circle(50% at 50% 50%);
    }
    .vortex-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, #0000ff, #ff00ff, #ff0000);
      mask: conic-gradient(#000, #fff);
      mask-position: center;
      mask-size: 150% 150%;
      animation: core-pulse 2s infinite;
    }
    .core {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 200px;
      border-radius: 50%;
      box-shadow: 0px 0px 10px 5px #00ff00, 0px 0px 15px 7px #0000ff, 0px 0px 20px 10px #ff00ff, 0px 0px 25px 12px #ff0000, 0px 0px 30px 15px #00ffff, 0px 0px 35px 18px #ffff00;
      background: linear-gradient(to right, #ff00ff, #00ff00);
    }
    .particle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: linear-gradient(to right, #ff00ff, #00ff00);
      animation: particle-dance 4s infinite;
    }
    .neural-web {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .neural-web path {
      stroke: #fff;
      stroke-width: 2;
      fill: none;
      animation: neural-flicker 1s infinite;
    }
    .neural-web path:nth-child(1) {
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation-duration: 2s;
      animation-timing-function: ease-out;
    }
    .neural-web path:nth-child(2) {
      stroke-dasharray: 200;
      stroke-dashoffset: 200;
      animation-duration: 4s;
      animation-timing-function: ease-in-out;
    }
    .neural-web path:nth-child(3) {
      stroke-dasharray: 300;
      stroke-dashoffset: 300;
      animation-duration: 6s;
      animation-timing-function: ease-in;
    }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core">
    </div>
    <svg class="neural-web">
      <path d="M 500 300 A 200 150 0 1 1 700 300" />
      <path d="M 300 500 A 150 200 0 0 1 700 300" />
      <path d="M 700 300 A 200 100 0 0 1 700 500" />
      <path d="M 700 500 A 200 150 0 1 1 700 300" />
      <path d="M 600 400 A 150 50 0 0 1 700 400" />
      <path d="M 600 600 A 150 50 0 0 1 700 600" />
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </svg>
  </div>
        </div>
        </body>
        </html>
