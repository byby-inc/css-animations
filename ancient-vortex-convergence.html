<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ancient Vortex Convergence</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: translate(0%, 0%) rotate(0deg);
    }
    25% {
      transform: translate(-10%, 10%) rotate(10deg);
    }
    50% {
      transform: translate(-15%, -10%) rotate(20deg);
    }
    75% {
      transform: translate(0%, 0%) rotate(0deg);
    }
    100% {
      transform: translate(10%, -10%) rotate(-10deg);
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.2);
    }
    100% {
      transform: scale(1);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: scale(1) rotate(0deg);
    }
    25% {
      transform: scale(1.1) rotate(5deg);
    }
    50% {
      transform: scale(1) rotate(10deg);
    }
    75% {
      transform: scale(1) rotate(0deg);
    }
    100% {
      transform: scale(1.1) rotate(-5deg);
    }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: linear-gradient(135deg, #2f2f2f, #343434);
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    height: 200px;
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.2),
        0 0 20px rgba(255, 255, 255, 0.4),
        0 0 30px rgba(255, 255, 255, 0.6),
        0 0 40px rgba(255, 255, 255, 0.8),
        0 0 50px rgba(255, 255, 255, 1);
    background: linear-gradient(135deg, #ffffff, #2f2f2f, #343434, #2f2f2f);
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    background: linear-gradient(135deg, #2f2f2f, #343434);
  }
  .particle:nth-child(1) {
    top: 20%;
    left: 20%;
    animation: particle-dance 2s infinite;
  }
  .particle:nth-child(2) {
    top: 40%;
    left: 60%;
    animation: particle-dance 2s infinite;
  }
  .particle:nth-child(3) {
    top: 80%;
    left: 20%;
    animation: particle-dance 2s infinite;
  }
  .particle:nth-child(4) {
    top: 20%;
    left: 80%;
    animation: particle-dance 2s infinite;
  }
  .particle:nth-child(5) {
    top: 60%;
    left: 20%;
    animation: particle-dance 3s infinite;
  }
  .particle:nth-child(6) {
    top: 40%;
    left: 80%;
    animation: particle-dance 4s infinite;
  }
  .particle:nth-child(7) {
    top: 80%;
    left: 60%;
    animation: particle-dance 2s infinite;
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
    stroke-width: 2;
  }
  .neural-web path:nth-child(1) {
    d: M 50 0 L 100 50 L 50 100 L 0 50;
    animation: neural-flicker 1s infinite;
  }
  .neural-web path:nth-child(2) {
    d: M 50 0 L 75 25 L 25 75 L 50 100;
    animation: neural-flicker 1.5s infinite;
  }
  .neural-web path:nth-child(3) {
    d: M 50 0 L 25 25 L 75 75 L 50 100;
    animation: neural-flicker 2s infinite;
  }
  .neural-web path:nth-child(4) {
    d: M 50 0 L 100 50 L 50 100 L 0 50;
    animation: neural-flicker 2.5s infinite;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core">
      <div class="particle"></div>
      <div class="particle"></div>
    </div>
    <svg class="neural-web">
      <path class="neural-path"></path>
      <path class="neural-path"></path>
      <path class="neural-path"></path>
      <path class="neural-path"></path>
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
