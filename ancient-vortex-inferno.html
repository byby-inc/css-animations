<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ancient Vortex Inferno</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance { 
    0% { transform: translate(-50%, -50%) rotate(0deg); }
    50% { transform: translate(-50%, -50%) rotate(360deg); }
    100% { transform: translate(-50%, -50%) rotate(0deg); }
  }
  
  @keyframes core-pulse { 
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  
  @keyframes neural-flicker { 
    0% { transform: translate(-50%, -50%) rotate(0deg); }
    25% { transform: translate(-50%, -50%) rotate(10deg); }
    50% { transform: translate(-50%, -50%) rotate(0deg); }
    75% { transform: translate(-50%, -50%) rotate(-10deg); }
    100% { transform: translate(-50%, -50%) rotate(0deg); }
  }
  
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: circle(50% at 50% 50%);
    background: radial-gradient(circle, #3b3f5c, #1b1c2e);
  }
  
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(to bottom, #f8e231, #f8c300);
    box-shadow:
      0 0 0 5px #d3e9fc,
      0 0 0 10px #d3e9fc,
      0 0 0 15px #d3e9fc,
      0 0 0 20px #d3e9fc,
      0 0 0 25px #d3e9fc,
      0 0 0 30px #d3e9fc;
    animation: core-pulse 2s infinite;
  }
  
  .particle {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: linear-gradient(to bottom, #f7df1f, #f7c700);
    animation: particle-dance 4s infinite;
  }
  
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
    stroke-width: 2px;
    animation: neural-flicker 10s infinite;
  }
  
  .neural-web path:nth-child(1) {
    d: M40 50 L 60 60 M 40 50 L 60 40 M 50 70 L 40 60 M 50 70 L 60 80;
  }
  
  .neural-web path:nth-child(2) {
    d: M40 30 L 60 20 M 40 30 L 60 40 M 50 10 L 40 20 M 50 10 L 60 0;
  }
  
  .neural-web path:nth-child(3) {
    d: M40 50 L 60 60 M 40 50 L 60 40 M 50 70 L 40 60 M 50 70 L 60 80;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web" viewBox="0 0 100 100">
      <path d="M40 50 L 60 60 M 40 50 L 60 40 M 50 70 L 40 60 M 50 70 L 60 80" />
      <path d="M40 30 L 60 20 M 40 30 L 60 40 M 50 10 L 40 20 M 50 10 L 60 0" />
      <path d="M40 50 L 60 60 M 40 50 L 60 40 M 50 70 L 40 60 M 50 70 L 60 80" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
