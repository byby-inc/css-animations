<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Aurora Quantum Ripple</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

            /* Code snippet container */
            .codigo {
            position: absolute;
            top: 15%;
            left: 40%;
            scale: 1.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background:url("/gold_snippet") no-repeat center center;
            color: white;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 45px;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.9);
            text-align: center;
            border-radius: 12px;
            line-height: 1.6;
            max-height: 25%;
            max-width: 75%;
            width: 75%;
            height: 25%;
            overflow-y: hidden;
            border: 6px solid;
            border-image: linear-gradient(
                135deg,
                #D4AF37 0%,
                #F9E79F 15%,
                #B8860B 30%,
                #CFB53B 45%,
                #E6C35C 60%,
                #B8860B 75%,
                #D4AF37 90%,
                #C9A961 100%
            ) 1;
            box-shadow: 
                inset 0 2px 4px rgba(212, 175, 55, 0.3),
                inset 0 -2px 4px rgba(139, 101, 8, 0.4),
                0 4px 12px rgba(184, 134, 11, 0.5),
                0 8px 25px rgba(0, 0, 0, 0.6);
            }

            /* Animation container */
            .animation-container {
           position: absolute;
            top: 90%;
            left: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: rotate(0deg) translateX(0);
    }
    100% {
      transform: rotate(360deg) translateX(100px);
    }
  }

  @keyframes core-pulse {
    0% {
      opacity: 0.5;
    }
    100% {
      opacity: 1;
    }
  }

  @keyframes neural-flicker {
    0% {
      stroke-width: 0.5;
    }
    100% {
      stroke-width: 2;
    }
  }

  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(45deg, #6A11CB, #8B5CF6);
    clip-path: polygon(50% 0%, 63% 39%, 100% 50%, 63% 61%, 50% 100%, 37% 61%, 0% 50%, 37% 39%);
    z-index: -1;
  }

  .particle {
    position: absolute;
    width: 20px;
    height: 20px;
    background: linear-gradient(45deg, #1E40AF, #3B82F6);
    border-radius: 50%;
    animation: particle-dance 5s infinite;
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    background: linear-gradient(45deg, #EA580C, #FFC107);
    border-radius: 50%;
    animation: core-pulse 2s infinite;
  }

  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }

  .neural-web path {
    stroke: #fff;
    stroke-width: 0.5;
    fill: none;
    animation: neural-flicker 2s infinite;
  }
        </style>
        </head>
        <body>
        <div class="codigo">
            <div>.vortex-container { z-index: -1; }</div>
        </div>
        <div class="animation-container">
            <div class="vortex-container">
    <svg class="neural-web" viewBox="0 0 100 100">
      <path d="M10,10 C20,20 40,40 50,50" />
      <path d="M50,10 C40,20 20,40 10,50" />
      <path d="M10,50 C20,60 40,70 50,80" />
      <path d="M50,50 C60,40 70,20 80,10" />
    </svg>
    <div class="core"></div>
    <div class="particle" style="top: 10%; left: 10%;"></div>
    <div class="particle" style="top: 20%; left: 30%;"></div>
    <div class="particle" style="top: 30%; left: 50%;"></div>
    <div class="particle" style="top: 40%; left: 70%;"></div>
    <div class="particle" style="top: 50%; left: 10%;"></div>
    <div class="particle" style="top: 60%; left: 30%;"></div>
    <div class="particle" style="top: 70%; left: 50%;"></div>
    <div class="particle" style="top: 80%; left: 70%;"></div>
    <div class="particle" style="top: 90%; left: 10%;"></div>
    <div class="particle" style="top: 10%; left: 80%;"></div>
    <div class="particle" style="top: 50%; left: 80%;"></div>
  </div>
        </div>
        </body>
        </html>
