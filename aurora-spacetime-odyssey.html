<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Aurora Spacetime Odyssey</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

            /* Code snippet container */
            .codigo {
            position: absolute;
            top:15%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background:url("/gold_snippet") no-repeat center center;
            color: white;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 45px;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.9);
            text-align: center;
            border-radius: 12px;
            line-height: 1.6;
            max-height: 25%;
            max-width: 75%;
            width: 75%;
            height: 25%;
            overflow-y: hidden;
            border: 6px solid;
            border-image: linear-gradient(
                135deg,
                #D4AF37 0%,
                #F9E79F 15%,
                #B8860B 30%,
                #CFB53B 45%,
                #E6C35C 60%,
                #B8860B 75%,
                #D4AF37 90%,
                #C9A961 100%
            ) 1;
            box-shadow: 
                inset 0 2px 4px rgba(212, 175, 55, 0.3),
                inset 0 -2px 4px rgba(139, 101, 8, 0.4),
                0 4px 12px rgba(184, 134, 11, 0.5),
                0 8px 25px rgba(0, 0, 0, 0.6);
            }

            /* Animation container */
            .animation-container {
            position: absolute;
            top:70%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: rotate(0deg) translate(0px, 0px);
    }
    50% {
      transform: rotate(180deg) translate(100px, 100px);
    }
    100% {
      transform: rotate(360deg) translate(0px, 0px);
    }
  }

  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.2);
    }
    100% {
      transform: scale(1);
    }
  }

  @keyframes neural-flicker {
    0% {
      transform: translate(0px, 0px) rotate(0deg);
    }
    50% {
      transform: translate(20px, 20px) rotate(90deg);
    }
    100% {
      transform: translate(0px, 0px) rotate(0deg);
    }
  }

  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: linear-gradient(to bottom right, #03055B, #5C0011);
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(to bottom right, #8B0A1A, #FF69B4);
    box-shadow: 0px 0px 20px #FFFFFF, 0px 0px 40px #FFFFFF, 0px 0px 60px #FFFFFF, 0px 0px 80px #FFFFFF, 0px 0px 100px #FFFFFF, 0px 0px 120px #FFFFFF;
    animation: core-pulse 5s infinite;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(to bottom right, #8B0A1A, #FF69B4);
    animation: particle-dance 10s infinite;
  }

  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #FFFFFF;
    animation: neural-flicker 7s infinite;
  }

  .particle:nth-child(1) {
    width: 10px;
    height: 10px;
    top: 10%;
    left: 10%;
  }

  .particle:nth-child(2) {
    width: 20px;
    height: 20px;
    top: 20%;
    left: 20%;
  }

  .particle:nth-child(3) {
    width: 30px;
    height: 30px;
    top: 30%;
    left: 30%;
  }

  .particle:nth-child(4) {
    width: 40px;
    height: 40px;
    top: 40%;
    left: 40%;
  }

  .particle:nth-child(5) {
    width: 50px;
    height: 50px;
    top: 50%;
    left: 50%;
  }

  .particle:nth-child(6) {
    width: 60px;
    height: 60px;
    top: 60%;
    left: 60%;
  }

  .particle:nth-child(7) {
    width: 70px;
    height: 70px;
    top: 70%;
    left: 70%;
  }

  .particle:nth-child(8) {
    width: 80px;
    height: 80px;
    top: 80%;
    left: 80%;
  }

  .particle:nth-child(9) {
    width: 90px;
    height: 90px;
    top: 90%;
    left: 90%;
  }

  .particle:nth-child(10) {
    width: 100px;
    height: 100px;
    top: 10%;
    left: 90%;
  }
        </style>
        </head>
        <body>
        <div class="codigo">
            <div>.vortex-container { clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%); }</div>
        </div>
        <div class="animation-container">
            <div class="vortex-container">
  <div class="core"></div>
  <svg class="neural-web" viewBox="0 0 100 100">
    <path d="M10,10 C20,20 40,20 50,10" stroke-width="2" />
    <path d="M50,10 C60,20 80,20 90,10" stroke-width="2" />
    <path d="M90,10 C100,20 100,50 90,60" stroke-width="2" />
  </svg>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
</div>
        </div>
        </body>
        </html>
