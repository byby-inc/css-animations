<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Ancient Horizon Rapture</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.2);
    }
    100% {
      transform: scale(1);
    }
  }
  @keyframes particle-dance {
    0% {
      transform: translateY(100px) rotate(0deg);
    }
    50% {
      transform: translateY(-100px) rotate(-180deg);
    }
    100% {
      transform: translateY(100px) rotate(0deg);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: scale(1) rotate(0deg);
    }
    50% {
      transform: scale(0.9) rotate(360deg);
    }
    100% {
      transform: scale(1) rotate(0deg);
    }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: linear-gradient(-90deg, #f7d2c4, #ff99cc);
    box-shadow:
          0 0 10px #fff,
          0 0 20px #fff,
          0 0 30px #fff,
          0 0 40px #fff,
          0 0 50px #fff,
          0 0 100px #fff;
    animation: core-pulse 1s infinite;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    background: linear-gradient(-90deg, #f7d2c4, #ff99cc);
  }
  .particle:nth-child(1) {
    top: 50%;
    left: 0;
    transform: translateY(-50%) rotate(0deg);
    animation: particle-dance 1.5s infinite;
  }
  .particle:nth-child(2) {
    top: 20%;
    left: 50%;
    transform: translateX(-50%) translateY(-20%);
    animation: particle-dance 2s infinite;
  }
  .particle:nth-child(3) {
    top: 30%;
    left: 70%;
    transform: translateX(-30%) translateY(0%);
    animation: particle-dance 1.5s infinite;
  }
  .particle:nth-child(4) {
    top: 60%;
    left: 20%;
    transform: translateX(-20%) translateY(-10%);
    animation: particle-dance 2s infinite;
  }
  .particle:nth-child(5) {
    top: 80%;
    left: 80%;
    transform: translateX(-30%) translateY(20%);
    animation: particle-dance 4s infinite;
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
    stroke-width: 5;
  }
  .neural-web path {
    stroke-dasharray: 500;
    animation: neural-flicker 2s infinite;
  }
  .neural-web path:nth-child(1) {
    stroke-dashoffset: 0;
    stroke-dasharray: 500;
  }
  .neural-web path:nth-child(2) {
    stroke-dashoffset: 200;
    stroke-dasharray: 500;
  }
  .neural-web path:nth-child(3) {
    stroke-dashoffset: 300;
    stroke-dasharray: 500;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M50 50 L 150 50 L 250 150"/>
      <path d="M100 10 L 50 150 L 10 50"/>
      <path d="M50 100 L 150 250 L 10 150"/>
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
