<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Ancient Maelstrom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: translate(-50%, 50px) rotate(0deg);
    }
    25% {
      transform: translate(-50%, -150px) rotate(90deg);
    }
    50% {
      transform: translate(150px, 50px) rotate(180deg);
    }
    75% {
      transform: translate(50px, 150px) rotate(270deg);
    }
    100% {
      transform: translate(-50%, 50px) rotate(360deg);
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.2);
    }
    100% {
      transform: scale(1);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: scale(1) rotate(0deg);
    }
    50% {
      transform: scale(1.1) rotate(10deg);
    }
    100% {
      transform: scale(1) rotate(0deg);
    }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    background: radial-gradient(circle at 50% 50%, #ff99a4, #33ccff, #cc33ff);
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(to bottom, #ff0000, #00ff00);
  }
  .particle:nth-child(1) {
    top: 50%;
    left: 20%;
    transform: rotate(20deg);
    animation: particle-dance 6s infinite;
  }
  .particle:nth-child(2) {
    top: 20%;
    left: 50%;
    transform: rotate(30deg);
    animation: particle-dance 4s infinite;
  }
  .particle:nth-child(3) {
    top: 70%;
    left: 30%;
    transform: rotate(40deg);
    animation: particle-dance 8s infinite;
  }
  .particle:nth-child(4) {
    top: 40%;
    left: 80%;
    transform: rotate(50deg);
    animation: particle-dance 2s infinite;
  }
  .particle:nth-child(5) {
    top: 10%;
    left: 10%;
    transform: rotate(60deg);
    animation: particle-dance 5s infinite;
  }
  .particle:nth-child(6) {
    top: 90%;
    left: 90%;
    transform: rotate(70deg);
    animation: particle-dance 3s infinite;
  }
  .particle:nth-child(7) {
    top: 30%;
    left: 40%;
    transform: rotate(80deg);
    animation: particle-dance 7s infinite;
  }
  .particle:nth-child(8) {
    top: 60%;
    left: 60%;
    transform: rotate(90deg);
    animation: particle-dance 9s infinite;
  }
  .particle:nth-child(9) {
    top: 20%;
    left: 80%;
    transform: rotate(100deg);
    animation: particle-dance 1s infinite;
  }
  .particle:nth-child(10) {
    top: 80%;
    left: 20%;
    transform: rotate(110deg);
    animation: particle-dance 10s infinite;
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle at 50% 50%, #33ccff, #cc33ff, #ff99a4);
    width: 200px;
    height: 200px;
    border-radius: 50%;
    box-shadow:
      0 0 0 10px #33ccff,
      0 0 0 20px #cc33ff,
      0 0 0 30px #ff99a4,
      0 0 0 40px #33ccff,
      0 0 0 50px #cc33ff,
      0 0 0 60px #ff99a4;
    animation: core-pulse 2.5s infinite;
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: #fff;
  }
  .neural-web path {
    stroke: #fff;
    stroke-width: 2px;
  }
  .neural-web path:nth-child(1) {
    stroke-dasharray: 200, 500;
    animation: neural-flicker 4.5s infinite;
  }
  .neural-web path:nth-child(2) {
    stroke-dasharray: 300, 300;
    animation: neural-flicker 3.5s infinite;
  }
  .neural-web path:nth-child(3) {
    stroke-dasharray: 400, 200;
    animation: neural-flicker 2.5s infinite;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="core"></div>
    <svg class="neural-web" viewBox="0 0 100 100" enable-background="new 0 0 100 100">
      <path d="M15,35v35" />
      <path d="M15,0v35" />
      <path d="M0,35v35" />
    </svg>
  </div>
        </div>
        </body>
        </html>
