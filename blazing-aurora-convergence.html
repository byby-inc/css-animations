<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Aurora Convergence</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: translate(0, 0) rotate(0deg);
    }
    50% {
      transform: translate(20px, 10px) rotate(30deg);
    }
    100% {
      transform: translate(-5px, -5px) rotate(0deg);
    }
  }

  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.2);
    }
    100% {
      transform: scale(1);
    }
  }

  @keyframes neural-flicker {
    0% {
      transform: translate(0, 0) rotate(0deg);
      opacity: 0.7;
    }
    50% {
      transform: translate(-5px, -5px) rotate(10deg);
      opacity: 0.5;
    }
    100% {
      transform: translate(0, 0) rotate(0deg);
      opacity: 0.7;
    }
  }

  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: linear-gradient(rgb(255, 0, 0), rgb(0, 0, 255));
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    background: linear-gradient(rgb(255, 255, 0), rgb(255, 0, 0));
    border-radius: 50%;
    box-shadow:
      0 0 20px rgb(255, 0, 0),
      0 0 30px rgb(0, 0, 255),
      0 0 40px rgb(255, 255, 0),
      0 0 50px rgb(0, 255, 0),
      0 0 60px rgb(255, 255, 255);
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(rgb(0, 0, 255), rgb(255, 0, 0));
  }

  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
    stroke-width: 2;
  }

  @keyframes neon {
    50% {
      transform: scale(1.2);
    }
    100% {
      transform: scale(1);
    }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core">
      <div class="core">
        <div class="core"></div>
      </div>
    </div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <svg class="neural-web">
      <path d="M0 0 L100 100"></path>
      <path d="M0 0 L-100 100"></path>
      <path d="M100 0 L0 100"></path>
    </svg>
  </div>
        </div>
        </body>
        </html>
