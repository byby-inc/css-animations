<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Aurora Inferno</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: translate(100px, -100px) rotate(0deg);
    }
    100% {
      transform: translate(-100px, 100px) rotate(360deg);
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.5);
    }
    100% {
      transform: scale(1);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: rotate(0deg);
    }
    50% {
      transform: rotate(180deg);
    }
    100% {
      transform: rotate(0deg);
    }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    background: radial-gradient(#fff, #ff9900);
    clip-path: circle(50% at 50% 50%);
  }
  .core {
    background: linear-gradient(to bottom, #fff, #ff9900);
    border-radius: 50%;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    height: 200px;
    box-shadow: 
      0 0 10px #ff9900,
      0 0 10px #ffcc00,
      0 0 10px #ffff66,
      0 0 10px #ccff00,
      0 0 10px #66ffff,
      0 0 10px #00ffff;
    animation: core-pulse 2s infinite;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(to bottom, #fff, #ff9900);
    width: 20px;
    height: 20px;
    animation: particle-dance 2s infinite;
  }
  .particle:nth-child(1) {
    top: 50%;
    left: 100px;
    animation-duration: 2.5s;
  }
  .particle:nth-child(2) {
    top: 100px;
    left: 150px;
    animation-duration: 1.5s;
  }
  .particle:nth-child(3) {
    top: 200px;
    left: 70px;
    animation-duration: 1.2s;
  }
  .particle:nth-child(4) {
    top: 100px;
    left: 20px;
    animation-duration: 2s;
  }
  .particle:nth-child(5) {
    top: 50%;
    left: 250px;
    animation-duration: 1.8s;
  }
  .particle:nth-child(6) {
    top: 200px;
    left: 180px;
    animation-duration: 1.6s;
  }
  .particle:nth-child(7) {
    top: 150px;
    left: 220px;
    animation-duration: 1.4s;
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: #fff;
  }
  .neural-web path {
    stroke: #fff;
  }
  .neural-web path:nth-child(1) {
    stroke-width: 10px;
  }
  .neural-web path:nth-child(2) {
    stroke-width: 5px;
  }
  .neural-web path:nth-child(3) {
    stroke-width: 3px;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M50 20 L100 80 L150 50 L100 30 L50 60 Z" />
      <path d="M50 80 L100 40 L150 20 L100 80 L50 50 Z" />
      <path d="M50 30 L100 90 L150 60 L100 60 L50 20 Z" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
