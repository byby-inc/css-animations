<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Aurora Singularity</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.2);
    }
    100% {
      transform: scale(1);
    }
  }
  @keyframes particle-dance {
    0% {
      transform: rotate(0deg) translateX(0%) translateY(0%);
    }
    100% {
      transform: rotate(360deg) translateX(100%) translateY(100%);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: translateX(-20%) translateY(-20%);
    }
    50% {
      transform: translateX(20%) translateY(20%);
    }
    100% {
      transform: translateX(-20%) translateY(-20%);
    }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: linear-gradient(to bottom, #f2c464, #f7dc6f);
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 150px;
    height: 150px;
    background: linear-gradient(to bottom right, #fff, #f7dc6f);
    border-radius: 50%;
    box-shadow: 
      0 0 20px #f7dc6f, 
      0 0 20px #f2c464, 
      0 0 20px #fff, 
      0 0 20px #fff, 
      0 0 20px #f7dc6f,
      0 0 20px #f2c464;
    animation: core-pulse 5s infinite;
  }
  .particle {
    position: absolute;
    width: 20px;
    height: 20px;
    background: linear-gradient(to bottom right, #fff, #f7dc6f);
    border-radius: 50%;
    animation: particle-dance 3s infinite forwards;
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
    stroke-width: 2px;
  }
  .neural-web path {
    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;
    animation: neural-flicker 1s infinite;
  }
  @keyframes neural-flicker {
    0% {
      stroke-dashoffset: 1000;
    }
    100% {
      stroke-dashoffset: 0;
    }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M50 0 C 70 20 10 50 50 80Z" />
      <path d="M50 0 C 30 50 70 90 50 100Z" />
      <path d="M50 0 C 20 20 80 50 50 80Z" />
    </svg>
    <div class="particle" style="top: 20px; left: 30%; animation-delay: 0.1s;"></div>
    <div class="particle" style="top: 70px; left: 40%; animation-delay: 0.2s;"></div>
    <div class="particle" style="top: 120px; left: 20%; animation-delay: 0.3s;"></div>
    <div class="particle" style="top: 110px; left: 60%; animation-delay: 0.4s;"></div>
    <div class="particle" style="top: 60px; left: 40%; animation-delay: 0.5s;"></div>
  </div>
        </div>
        </body>
        </html>
