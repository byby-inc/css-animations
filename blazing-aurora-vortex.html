<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Aurora Vortex</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    z-index: -1;
    clip-path: circle(50% at 50% 50%);
    background: linear-gradient(
      90deg,
      #ff9900,
      #ffcc00,
      #ffff00,
      #ccff00,
      #00ff00,
      #00ffff,
      #0000ff,
      #ff00ff
    );
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: linear-gradient(
      90deg,
      #ff9900,
      #ffcc00,
      #ffff00,
      #ccff00,
      #00ff00,
      #00ffff,
      #0000ff,
      #ff00ff
    );
    box-shadow: 0 0 10px #ff6600, 0 0 20px #ff9900, 0 0 30px #ffcc00, 0 0 40px #ffff00, 0 0 50px #ccff00, 0 0 60px #00ff00;
  }
  .core::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: linear-gradient(
      90deg,
      #ff9900,
      #ffcc00,
      #ffff00,
      #ccff00,
      #00ff00,
      #00ffff,
      #0000ff,
      #ff00ff
    );
    box-shadow: 0 0 10px #ff6600, 0 0 20px #ff9900, 0 0 30px #ffcc00, 0 0 40px #ffff00, 0 0 50px #ccff00, 0 0 60px #00ff00;
  }
  .particle {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: linear-gradient(
      90deg,
      #ff9900,
      #ffcc00,
      #ffff00,
      #ccff00,
      #00ff00,
      #00ffff,
      #0000ff,
      #ff00ff
    );
    animation: particle-dance 2s infinite;
  }
  @keyframes particle-dance {
    0% {
      transform: translate(-50%, -50%) rotate(0deg);
    }
    100% {
      transform: translate(-50%, -50%) rotate(360deg);
    }
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
    stroke-width: 2px;
  }
  .neural-web path {
    animation: neural-flicker 1s infinite;
  }
  @keyframes neural-flicker {
    0% {
      transform: scale(1) translate(-50%, -50%);
    }
    50% {
      transform: scale(1.2) translate(-50%, -50%);
    }
    100% {
      transform: scale(1) translate(-50%, -50%);
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    100% {
      transform: scale(1.2);
    }
  }
  .particle span {
    animation: particle-dance 2s infinite;
  }
  @keyframes neural-flicker {
    0% {
      transform: scale(1) translate(-50%, -50%);
    }
    50% {
      transform: scale(1.2) translate(-50%, -50%);
    }
    100% {
      transform: scale(1) translate(-50%, -50%);
    }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 50 50 L 100 100 L 50 150 Z" />
      <path d="M 50 50 L 150 100 L 50 150 Z" />
      <path d="M 50 50 L 100 100 L 150 50 Z" />
    </svg>
    <div class="particle">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>
        </div>
        </body>
        </html>
