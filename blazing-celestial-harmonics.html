<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Celestial Harmonics</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% { transform: translate(0, 200px) rotate(0deg); }
    25% { transform: translate(50px, -100px) rotate(30deg); }
    50% { transform: translate(-100px, 50px) rotate(60deg); }
    75% { transform: translate(200px, -150px) rotate(90deg); }
    100% { transform: translate(0, 200px) rotate(0deg); }
  }
  @keyframes core-pulse {
    0% { transform: scale(0.8); }
    50% { transform: scale(1); }
    100% { transform: scale(0.8); }
  }
  @keyframes neural-flicker {
    0% { transform: scale(1); }
    25% { transform: translate(-10px, -10px) scale(0.9); }
    50% { transform: translate(10px, 10px) scale(1); }
    75% { transform: translate(10px, -10px) scale(1.1); }
    100% { transform: scale(1); }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
  }
  .vortex-container::after {
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(to bottom, #ff9900, #ff0033);
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    height: 200px;
    background: radial-gradient(#fff, #f2c464);
    border-radius: 50%;
    box-shadow:
      0 0 0 100vmin #ffffff,
      0 0 0 120vmin #ffffff,
      0 0 0 140vmin #ffffff,
      0 0 0 160vmin #ffffff,
      0 0 0 180vmin #ffffff,
      0 0 0 200vmin #f2c464;
  }
  .core::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 250px;
    height: 250px;
    background: linear-gradient(to bottom, #ff9900, #ff0033);
    clip-path: circle(50% at 50% 50%);
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    background: radial-gradient(#fff, #f2c464);
    animation: particle-dance 10s infinite;
  }
  @keyframes particle-dance {
    0% { transform: translate(0, 200px) rotate(0deg); }
    25% { transform: translate(50px, -100px) rotate(30deg); }
    50% { transform: translate(-100px, 50px) rotate(60deg); }
    75% { transform: translate(200px, -150px) rotate(90deg); }
    100% { transform: translate(0, 200px) rotate(0deg); }
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
  }
  .neural-web path:nth-child(1) {
    transform: rotate(-10deg);
  }
  .neural-web path:nth-child(2) {
    transform: rotate(-20deg);
  }
  .neural-web path:nth-child(3) {
    transform: rotate(-30deg);
  }
  @keyframes neural-flicker {
    0% { transform: scale(1); }
    25% { transform: translate(-10px, -10px) scale(0.9); }
    50% { transform: translate(10px, 10px) scale(1); }
    75% { transform: translate(10px, -10px) scale(1.1); }
    100% { transform: scale(1); }
  }
  @keyframes core-pulse {
    0% { transform: scale(0.8); }
    50% { transform: scale(1); }
    100% { transform: scale(0.8); }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core" style="animation: core-pulse 5s infinite;"></div>
    <svg class="neural-web" style="animation: neural-flicker 2s infinite;">
      <path d="M 50 50 L 100 100 L 50 150 Z" />
      <path d="M 150 50 L 200 100 L 150 150 Z" />
      <path d="M 50 150 L 100 200 L 50 250 Z" />
    </svg>
    <div class="particle" style="top: 50%; left: 50%; transform: translate(-50%, -50%); animation: particle-dance 5s infinite;"></div>
    <div class="particle" style="top: 200px; left: 200px; animation: particle-dance 3s infinite;"></div>
    <div class="particle" style="top: 100px; left: 300px; animation: particle-dance 4s infinite;"></div>
    <div class="particle" style="top: 300px; left: 100px; animation: particle-dance 6s infinite;"></div>
  </div>
        </div>
        </body>
        </html>
