<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Cosmic Bloom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes core-pulse {
  0% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.1);
  }
  100% {
    transform: scale(1);
  }
}

@keyframes particle-dance {
  0% {
    transform: rotate(0deg) translate(0px, 0px);
  }
  10% {
    transform: rotate(10deg) translate(20px, 0px);
  }
  20% {
    transform: rotate(20deg) translate(0px, -20px);
  }
  30% {
    transform: rotate(30deg) translate(-20px, 0px);
  }
  40% {
    transform: rotate(40deg) translate(0px, 20px);
  }
  50% {
    transform: rotate(50deg) translate(20px, 0px);
  }
  100% {
    transform: rotate(0deg) translate(0px, 0px);
  }
}

@keyframes neural-flicker {
  0% {
    transform: translateY(0px);
  }
  20% {
    transform: translateY(-10px);
  }
  60% {
    transform: translateY(0px);
  }
  80% {
    transform: translateY(-5px);
  }
  100% {
    transform: translateY(0px);
  }
}

.vortex-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100vh;
  z-index: -1;
  clip-path: polygon(50% 0%, 100% 0%, 100% 50%, 50% 100%, 0% 50%);
  background: linear-gradient(135deg, #ff69b4, #6c5ce7);
}

.core {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 20vh;
  height: 20vh;
  background: linear-gradient(90deg, #ffff00, #66ffff);
  box-shadow: 0 0 0 0 #00ff00, 0 0 0 10px #ffff00, 0 0 0 20px #66ffff, 0 0 0 30px #00ff00;
  animation: core-pulse 5s infinite;
}

.particle {
  position: absolute;
  border-radius: 50%;
  background: linear-gradient(90deg, #ffff00, #66ffff);
  animation: particle-dance 2s infinite;
}

.particle:nth-child(1) {
  top: 20%;
  left: 20%;
  width: 3vh;
  height: 3vh;
  transform: rotate(0deg);
  animation-duration: 2s;
  animation-delay: 0s;
}

.particle:nth-child(2) {
  top: 10%;
  left: 10%;
  width: 4vh;
  height: 4vh;
  transform: rotate(10deg);
  animation-duration: 2s;
  animation-delay: 0.5s;
}

.particle:nth-child(3) {
  top: 50%;
  left: 50%;
  width: 5vh;
  height: 5vh;
  transform: rotate(20deg);
  animation-duration: 2s;
  animation-delay: 1s;
}

.particle:nth-child(4) {
  top: 30%;
  left: 70%;
  width: 6vh;
  height: 6vh;
  transform: rotate(30deg);
  animation-duration: 2s;
  animation-delay: 1.5s;
}

.particle:nth-child(5) {
  top: 20%;
  left: 30%;
  width: 7vh;
  height: 7vh;
  transform: rotate(40deg);
  animation-duration: 2s;
  animation-delay: 2s;
}

.particle:nth-child(6) {
  top: 80%;
  left: 80%;
  width: 8vh;
  height: 8vh;
  transform: rotate(50deg);
  animation-duration: 2s;
  animation-delay: 2.5s;
}

.particle:nth-child(7) {
  top: 40%;
  left: 40%;
  width: 9vh;
  height: 9vh;
  transform: rotate(60deg);
  animation-duration: 2s;
  animation-delay: 3s;
}

.particle:nth-child(8) {
  top: 60%;
  left: 10%;
  width: 10vh;
  height: 10vh;
  transform: rotate(70deg);
  animation-duration: 2s;
  animation-delay: 3.5s;
}

.particle:nth-child(9) {
  top: 10%;
  left: 60%;
  width: 11vh;
  height: 11vh;
  transform: rotate(80deg);
  animation-duration: 2s;
  animation-delay: 4s;
}

.neural-web {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  fill: none;
  stroke: #fff;
  stroke-width: 2;
  animation: neural-flicker 3s infinite;
}

.neural-web path {
  stroke-width: 2;
  stroke-linecap: round;
}

.neural-web path:nth-child(1) {
  stroke-dasharray: 200;
  stroke-dashoffset: 100;
  animation: neural-flicker-path 3s infinite;
}

.neural-web path:nth-child(2) {
  stroke-dasharray: 250;
  stroke-dashoffset: 125;
  animation: neural-flicker-path 3s infinite;
}

.neural-web path:nth-child(3) {
  stroke-dasharray: 300;
  stroke-dashoffset: 150;
  animation: neural-flicker-path 3s infinite;
}

@keyframes neural-flicker-path {
  0% {
    stroke-dashoffset: 100;
  }
  50% {
    stroke-dashoffset: 0;
  }
  100% {
    stroke-dashoffset: 100;
  }
}
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
  <div class="core"></div>
  <svg class="neural-web">
    <path d="M0 0L100 0 100 100 0 100" />
    <path d="M100 0L200 0 200 100 100 100" />
    <path d="M200 0L300 0 300 100 200 100" />
    <path d="M300 0L400 0 400 100 300 100" />
    <path d="M400 0L500 0 500 100 400 100" />
    <path d="M500 0L600 0 600 100 500 100" />
    <path d="M600 0L700 0 700 100 600 100" />
    <path d="M700 0L800 0 800 100 700 100" />
    <path d="M800 0L900 0 900 100 800 100" />
    <path d="M900 0L0 0 0 100 900 100" />
  </svg>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
</div>
        </div>
        </body>
        </html>
