<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Cosmic Dawn Symphony</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            /* Global Styles */
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    overflow: hidden;
  }

  /* Core Styles */
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background-image: linear-gradient(to bottom, #fff, #e9e9e9, #fff);
    transform: translate(-50%, -50%);
    animation: core-pulse 3s infinite;
  }

  .core::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background-image: linear-gradient(to bottom, #fff, #e9e9e9, #fff);
    transform: scale(0.1);
    animation: box-shadow-1 2s infinite;
  }

  .core::after {
    content: '';
    position: absolute;
    top: 10px;
    left: 10px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background-image: linear-gradient(to bottom, #fff, #e9e9e9, #fff);
    transform: scale(0.1);
    animation: box-shadow-2 3s infinite;
  }

  .core::before::after {
    content: '';
    position: absolute;
    top: 20px;
    left: 20px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background-image: linear-gradient(to bottom, #fff, #e9e9e9, #fff);
    transform: scale(0.1);
    animation: box-shadow-3 4s infinite;
  }

  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.2);
    }
    100% {
      transform: scale(1);
    }
  }

  @keyframes box-shadow-1 {
    0% {
      transform: scale(0.1);
    }
    50% {
      transform: scale(0.3);
    }
    100% {
      transform: scale(0.1);
    }
  }

  @keyframes box-shadow-2 {
    0% {
      transform: scale(0.1);
    }
    50% {
      transform: scale(0.5);
    }
    100% {
      transform: scale(0.1);
    }
  }

  @keyframes box-shadow-3 {
    0% {
      transform: scale(0.1);
    }
    50% {
      transform: scale(0.5);
    }
    100% {
      transform: scale(0.1);
    }
  }

  /* Particle Styles */
  .particle {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background-image: linear-gradient(to bottom, #fff, #e9e9e9, #fff);
    animation: particle-dance 5s infinite;
  }

  .particle:nth-child(1) {
    top: 0px;
    left: 50%;
    transform: translateX(-50%);
  }

  .particle:nth-child(2) {
    top: 20px;
    left: 60px;
    transform: translateX(-10px) rotate(45deg);
  }

  .particle:nth-child(3) {
    top: 40px;
    left: 120px;
    transform: translateX(-20px) rotate(90deg);
  }

  @keyframes particle-dance {
    0% {
      transform: translate(50px, 0) rotate(0deg);
    }
    50% {
      transform: translate(200px, -50px) rotate(180deg);
    }
    100% {
      transform: translate(400px, 100px) rotate(360deg);
    }
  }

  /* Neural Web Styles */
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
    stroke-width: 2px;
  }

  .neural-web path {
    stroke-dasharray: 1000;
    stroke-dashoffset: 0;
    animation: neural-flicker 1s infinite;
  }

  @keyframes neural-flicker {
    0% {
      stroke-dashoffset: 500;
    }
    50% {
      stroke-dashoffset: 1000;
    }
    100% {
      stroke-dashoffset: 500;
    }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M50 0 C25 50 75 50 50 100 Z" />
      <path d="M50 50 C25 75 75 75 50 100 Z" />
      <path d="M50 100 C25 125 75 125 50 150 Z" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
