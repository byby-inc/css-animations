<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Cosmic Inferno</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            /* Styles for the Vortex Container */
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    background-color: #1f1f1f;
    clip-path: polygon(25% 0%,75% 0%,100% 25%,50% 100%,0% 25%);
    animation: core-pulse infinite 2s forwards;
  }

  /* Styles for the Core */
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 60px;
    height: 60px;
    border-radius: 30px;
    background-image: linear-gradient(120deg, #FF8000, #FFB300);
    box-shadow: 0 0 10px #FF8000, 0 0 20px #FFC080, 0 0 30px #FFA500, 0 0 40px #FFD700, 0 0 50px #FFFF00;
  }
  .core::before {
    content: "";
    position: absolute;
    top: -15px;
    left: 0px;
    width: 100%;
    height: 100%;
    border-radius: 30px;
    background-image: linear-gradient(120deg, #FF8000, #FFB300);
    box-shadow: 0 0 10px #FF8000, 0 0 20px #FFC080, 0 0 30px #FFA500, 0 0 40px #FFD700, 0 0 50px #FFFF00;
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.1);
    }
    100% {
      transform: scale(1);
    }
  }

  /* Styles for the Particles */
  .particle {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 10px;
    height: 10px;
    border-radius: 5px;
    background-image: linear-gradient(120deg, #FF8000, #FFB300);
    animation: particle-dance infinite 5s ease-out forwards;
  }
  @keyframes particle-dance {
    0% {
      transform: translate(0px, 0px);
    }
    50% {
      transform: translate(-20px, 10px);
    }
    100% {
      transform: translate(0px, 0px);
    }
  }

  /* Styles for the Neural Web */
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: #fff;
  }
  .neural-web path {
    stroke: #fff;
  }
  @keyframes neural-flicker {
    0% {
      transform: rotate(0deg);
    }
    50% {
      transform: rotate(5deg);
    }
    100% {
      transform: rotate(0deg);
    }
  }
  .neural-web circle {
    animation: neural-flicker infinite 3s forwards;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web" viewBox="-100 -100 200 200">
      <circle cx="150" cy="0" r="100" fill="#333" />
      <path d="M 0 -50 C 50 -50 150 -50 75 -50 Z" />
      <path d="M 0 -50 C 50 -50 150 -50 75 50 Z" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
