<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Ephemeral Singularity</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: translate(-50%, -50%) rotate(0deg);
    }
    100% {
      transform: translate(-50%, -50%) rotate(360deg);
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    100% {
      transform: scale(1.2);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: translate(-50%, -50%) rotate(0deg);
    }
    100% {
      transform: translate(-50%, -50%) rotate(-10deg);
    }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: circle(50% at 50% 50%);
    background: radial-gradient(rgba(34, 50, 68, 1), rgba(25, 38, 52, 1));
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    background: linear-gradient(rgba(255, 215, 0, 1), rgba(238, 226, 18, 1));
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(255, 215, 0, 1), 0 0 10px rgba(255, 215, 0, 1), 0 0 5px rgba(255, 215, 0, 1), 0 0 5px rgba(255, 215, 0, 1), 0 0 5px rgba(255, 215, 0, 1), 0 0 5px rgba(255, 215, 0, 1);
    animation: core-pulse 2s infinite;
  }
  .particle {
    position: absolute;
    top: 50%;
    left: 50%;
    border-radius: 50%;
    animation: particle-dance 5s infinite;
    transform: translate(-50%, -50%);
  }
  .particle:nth-child(1) {
    background: linear-gradient(rgba(255, 165, 0, 1), rgba(238, 154, 12, 1));
    width: 20px;
    height: 20px;
    box-shadow: 0 0 5px rgba(255, 165, 0, 1), 0 0 5px rgba(255, 165, 0, 1), 0 0 5px rgba(255, 165, 0, 1), 0 0 5px rgba(255, 165, 0, 1), 0 0 5px rgba(255, 165, 0, 1), 0 0 5px rgba(255, 165, 0, 1);
  }
  .particle:nth-child(2) {
    background: linear-gradient(rgba(255, 69, 0, 1), rgba(238, 84, 0, 1));
    width: 30px;
    height: 30px;
    box-shadow: 0 0 5px rgba(255, 69, 0, 1), 0 0 5px rgba(255, 69, 0, 1), 0 0 5px rgba(255, 69, 0, 1), 0 0 5px rgba(255, 69, 0, 1), 0 0 5px rgba(255, 69, 0, 1), 0 0 5px rgba(255, 69, 0, 1);
  }
  .particle:nth-child(3) {
    background: linear-gradient(rgba(255, 215, 0, 1), rgba(238, 226, 18, 1));
    width: 40px;
    height: 40px;
    box-shadow: 0 0 5px rgba(255, 215, 0, 1), 0 0 5px rgba(255, 215, 0, 1), 0 0 5px rgba(255, 215, 0, 1), 0 0 5px rgba(255, 215, 0, 1), 0 0 5px rgba(255, 215, 0, 1), 0 0 5px rgba(255, 215, 0, 1);
  }
  .particle:nth-child(4) {
    background: linear-gradient(rgba(0, 0, 255, 1), rgba(0, 0, 128, 1));
    width: 40px;
    height: 40px;
    box-shadow: 0 0 5px rgba(0, 0, 255, 1), 0 0 5px rgba(0, 0, 255, 1), 0 0 5px rgba(0, 0, 255, 1), 0 0 5px rgba(0, 0, 255, 1), 0 0 5px rgba(0, 0, 255, 1), 0 0 5px rgba(0, 0, 255, 1);
  }
  .particle:nth-child(5) {
    background: linear-gradient(rgba(139, 0, 0, 1), rgba(104, 0, 0, 1));
    width: 40px;
    height: 40px;
    box-shadow: 0 0 5px rgba(139, 0, 0, 1), 0 0 5px rgba(139, 0, 0, 1), 0 0 5px rgba(139, 0, 0, 1), 0 0 5px rgba(139, 0, 0, 1), 0 0 5px rgba(139, 0, 0, 1), 0 0 5px rgba(139, 0, 0, 1);
  }
  .neural-web {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
    stroke-width: 2px;
  }
  .neural-web path {
    animation: neural-flicker 10s infinite;
  }
  .neural-web path:nth-child(1) {
    stroke-dasharray: 100, 200;
    stroke-dashoffset: 50;
  }
  .neural-web path:nth-child(2) {
    stroke-dasharray: 150, 250;
    stroke-dashoffset: 50;
  }
  .neural-web path:nth-child(3) {
    stroke-dasharray: 200, 300;
    stroke-dashoffset: 50;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 50,50 L 70,30 L 90,50 L 70,70 Z"></path>
      <path d="M 30,50 L 50,30 L 70,50 L 50,70 Z"></path>
      <path d="M 50,50 L 70,30 L 90,50 L 70,70 Z"></path>
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
