<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Eruption Symphony</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            .vortex-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    }
    .vortex-container::after {
      content: "";
      display: block;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, #f7dc6f, #f7dc6f);
    }
    .core {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: -webkit-gradient(linear, left top, right top, from(#f7dc6f), to(#f7dc6f));
      background: -webkit-linear-gradient(left, #f7dc6f, #f7dc6f);
      background: -moz-linear-gradient(left, #f7dc6f, #f7dc6f);
      background: -o-linear-gradient(left, #f7dc6f, #f7dc6f);
      box-shadow: 0 0 10px #f2c464, 0 0 20px #f7dc6f, 0 0 30px #f2c464, 0 0 40px #f7dc6f, 0 0 50px #f2c464, 0 0 60px #f7dc6f;
      animation: core-pulse 5s infinite;
    }
    .particle {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(to bottom, #f7dc6f, #f7dc6f);
    }
    .particle:first-child {
      top: 10%;
      left: 20%;
      animation: particle-dance 2s infinite;
    }
    .particle:last-child {
      top: 30%;
      left: 70%;
      animation: particle-dance 3s infinite;
    }
    @keyframes particle-dance {
      0% {
        transform: translate(0, 0) rotate(0deg);
      }
      100% {
        transform: translate(20px, 10px) rotate(360deg);
      }
    }
    @keyframes core-pulse {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.2);
      }
      100% {
        transform: scale(1);
      }
    }
    .neural-web {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .neural-web path {
      stroke: #fff;
      stroke-width: 2;
    }
    @keyframes neural-flicker {
      0% {
        transform: scale(1) translate(0, 0);
      }
      100% {
        transform: scale(1.1) translate(10px, 10px);
      }
    }
    .neural-web path:first-child {
      animation: neural-flicker 2s infinite;
    }
    .neural-web path:nth-child(2) {
      animation: neural-flicker 3s infinite;
    }
    .neural-web path:nth-child(3) {
      animation: neural-flicker 4s infinite;
    }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <svg class="neural-web">
      <path d="M 50 50 L 100 50 L 100 100 L 50 100" />
      <path d="M 100 50 L 150 50 L 150 100 L 100 100" />
      <path d="M 150 50 L 200 50 L 200 100 L 150 100" />
    </svg>
  </div>
        </div>
        </body>
        </html>
