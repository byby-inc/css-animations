<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Eternity Supernova</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: translate(0, 0) rotate(0deg);
    }
    50% {
      transform: translate(-20px, -10px) rotate(45deg);
    }
    100% {
      transform: translate(10px, 0px) rotate(0deg);
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.2);
    }
    100% {
      transform: scale(1);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: translate(0, 0);
    }
    50% {
      transform: translate(-5px, -5px);
    }
    100% {
      transform: translate(0, 0);
    }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: radial-gradient(circle at 50% 50%, #fff, #f0f0f0);
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    width: 10px;
    height: 10px;
    background: linear-gradient(45deg, #fff, #f0f0f0);
    animation: particle-dance 4s infinite;
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    background: linear-gradient(90deg, #ffffff, #f0f0f0);
    box-shadow: 0 0 10px 5px #ffffff, 5px 0 10px 10px #f0f0f0, 0 10px 10px 5px #ffffff, -5px 0 10px 10px #f0f0f0, 0 -10px 10px 5px #ffffff, 10px 0 10px 10px #f0f0f0;
    animation: core-pulse 2s infinite;
  }
  .neural-web {
    position: absolute;
    fill: none;
    stroke: #fff;
    stroke-width: 0.5;
  }
  .neural-web path {
    opacity: 0.5;
  }
  @keyframes particle-dance {
    0% {
      transform: translate(0, 0) rotate(0deg);
    }
    50% {
      transform: translate(-20px, -10px) rotate(45deg);
    }
    100% {
      transform: translate(10px, 0px) rotate(0deg);
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.2);
    }
    100% {
      transform: scale(1);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: translate(0, 0);
    }
    50% {
      transform: translate(-5px, -5px);
    }
    100% {
      transform: translate(0, 0);
    }
  }
  .particle:nth-child(1) {
    top: 10px;
    left: 10px;
  }
  .particle:nth-child(2) {
    top: 20px;
    left: 20px;
  }
  .particle:nth-child(3) {
    top: 30px;
    left: 30px;
  }
  .particle:nth-child(4) {
    top: 40px;
    left: 40px;
  }
  .particle:nth-child(5) {
    top: 50px;
    left: 50px;
  }
  .neural-web path:nth-child(1) {
    stroke-dasharray: 200 200;
    stroke-dashoffset: 0;
    animation: neural-flicker 1s infinite;
  }
  .neural-web path:nth-child(2) {
    stroke-dasharray: 200 200;
    stroke-dashoffset: 0;
    animation: neural-flicker 1.5s infinite;
  }
  .neural-web path:nth-child(3) {
    stroke-dasharray: 200 200;
    stroke-dashoffset: 0;
    animation: neural-flicker 2s infinite;
  }
  @keyframes neural-flicker {
    0% {
      transform: translate(0, 0);
    }
    50% {
      transform: translate(-5px, -5px);
    }
    100% {
      transform: translate(0, 0);
    }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 0,0  L 100,100  L 200,100  L 300,300  Z" />
      <path d="M 0,0  L 100,200  L 200,300  L 300,200  Z" />
      <path d="M 0,0  L 100,50  L 200,200  L 300,150  Z" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
