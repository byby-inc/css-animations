<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Ethereal Maelstrom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: translate(0px, 0px) rotate(0deg);
    }
    25% {
      transform: translate(20px, 20px) rotate(180deg);
    }
    50% {
      transform: translate(0px, 0px) rotate(360deg);
    }
    75% {
      transform: translate(-20px, -20px) rotate(0deg);
    }
    100% {
      transform: translate(0px, 0px) rotate(0deg);
    }
  }

  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.2);
    }
    100% {
      transform: scale(1);
    }
  }

  @keyframes neural-flicker {
    0% {
      transform: rotate(0deg);
    }
    20% {
      transform: rotate(5deg);
    }
    40% {
      transform: rotate(-5deg);
    }
    60% {
      transform: rotate(5deg);
    }
    80% {
      transform: rotate(-5deg);
    }
    100% {
      transform: rotate(0deg);
    }
  }

  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: linear-gradient(to bottom, #fff0d9, #fee2ca);
    box-shadow: 0px 0px 10px #fee2ca, -10px 0px 10px #fff0d9, 0px 0px 10px #fee2ca, 10px 0px 10px #fff0d9, -5px 5px 10px #fee2ca, 5px 5px 10px #fff0d9, 0px 0px 10px #fee2ca, -5px -5px 10px #fff0d9, 0px 0px 10px #fee2ca, 5px -5px 10px #fee2ca;
    animation: core-pulse 1s infinite;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(to bottom, #fee2ca, #fff0d9);
    animation: particle-dance 4s infinite;
  }

  .particle:nth-child(1) {
    top: 10%;
    left: 80%;
  }

  .particle:nth-child(2) {
    top: 20%;
    left: 60%;
  }

  .particle:nth-child(3) {
    top: 30%;
    left: 40%;
  }

  .particle:nth-child(4) {
    top: 40%;
    left: 20%;
  }

  .particle:nth-child(5) {
    top: 50%;
    left: 10%;
  }

  .particle:nth-child(6) {
    top: 60%;
    left: 20%;
  }

  .particle:nth-child(7) {
    top: 70%;
    left: 30%;
  }

  .particle:nth-child(8) {
    top: 80%;
    left: 40%;
  }

  .particle:nth-child(9) {
    top: 90%;
    left: 50%;
  }

  .particle:nth-child(10) {
    top: 100%;
    left: 60%;
  }

  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: #fff;
  }

  .neural-web path {
    stroke: #fff;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M100 100v-200h200v200h-200z" />
      <path d="M300 300v-200h200v200h-200z" />
      <path d="M500 500v-200h200v200h-200z" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
