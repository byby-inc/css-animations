<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Galactic Singularity</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% { transform: translate(0%,-50%) rotate(0deg); }
    100% { transform: translate(50%,50%) rotate(180deg); }
  }
  @keyframes core-pulse {
    0% { transform: scale(1); }
    100% { transform: scale(1.5); }
  }
  @keyframes neural-flicker {
    0% { transform: translateY(0); }
    100% { transform: translateY(-5px); }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%,75% 0%,100% 25%,50% 100%,0% 25%);
    background: linear-gradient(90deg, #ff99cc, #ff33cc);
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    background: linear-gradient(180deg, #fff, #f9c8ef);
    border-radius: 50%;
    width: 50px;
    height: 50px;
    box-shadow:
      0 0 10px #ff00ff,
      0 0 10px #ff00ff,
      0 0 10px #ff00ff,
      0 0 10px #ff00ff,
      0 0 10px #ff00ff,
      0 0 10px #ff00ff;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(180deg, #fff, #f2c5d8);
  }
  .neural-web {
    position: absolute;
    fill: #fff;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  .neural-web path {
    animation: neural-flicker 1s infinite;
  }
  @keyframes neural-flicker {
    0% { transform: translateY(0); }
    100% { transform: translateY(-5px); }
  }
  .particle {
    animation: particle-dance 2s infinite;
  }
  @keyframes particle-dance {
    0% { transform: translate(0%,-50%) rotate(0deg); }
    100% { transform: translate(50%,50%) rotate(180deg); }
  }
  .core {
    animation: core-pulse 3s infinite;
  }
  @keyframes core-pulse {
    0% { transform: scale(1); }
    100% { transform: scale(1.5); }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 50 50 L 100 100 L 200 200 L 200 400 L 100 500 L 50 400 L 0 400 L 0 200 L 50 100 Z" />
      <path d="M 100 50 L 150 150 L 250 250 L 250 450 L 150 500 L 100 450 L 50 450 L 50 250 L 100 100 Z" />
      <path d="M 200 50 L 300 100 L 300 300 L 200 400 L 100 400 L 50 300 L 50 100 L 100 50 Z" />
    </svg>
    <div class="particle" style="top: 200px; left: 200px;"></div>
    <div class="particle" style="top: 100px; left: 100px;"></div>
    <div class="particle" style="top: 50px; left: 300px;"></div>
  </div>
        </div>
        </body>
        </html>
