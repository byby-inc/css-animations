<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Horizon Awakening</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            .vortex-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  background: linear-gradient(to bottom, #ff9900, #ff0000);
}

.core {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: linear-gradient(to bottom, #ff6600, #ff9900);
  border-radius: 50%;
  box-shadow: 0 0 0 10px #ff3333;
  box-shadow: 0 0 0 20px #ff6666;
  box-shadow: 0 0 0 30px #ff9999;
  box-shadow: 0 0 0 40px #ffcccc;
  box-shadow: 0 0 0 50px #ffdddd;
  box-shadow: 0 0 0 60px #ffff99;
}

.core.pulse {
  animation: core-pulse 5s infinite;
}

.particle {
  position: absolute;
  border-radius: 50%;
  background: linear-gradient(to bottom, #ff9900, #ff0000);
  animation: particle-dance 3s infinite;
}

.neural-web {
  position: absolute;
  fill: #fff;
  width: 100%;
  height: 100%;
}

.neural-web path {
  stroke: #fff;
  stroke-width: 2;
}

@keyframes core-pulse {
  0% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.5);
  }
  100% {
    transform: scale(1);
  }
}

@keyframes particle-dance {
  0% {
    transform: translate(0, 0) rotate(0deg);
  }
  50% {
    transform: translate(-10px, -10px) rotate(360deg);
  }
  100% {
    transform: translate(0, 0) rotate(0deg);
  }
}

@keyframes neural-flicker {
  0% {
    transform: scale(1) rotate(0deg);
  }
  50% {
    transform: scale(1.2) rotate(360deg);
  }
  100% {
    transform: scale(1) rotate(0deg);
  }
}
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core pulse"></div>
    <svg class="neural-web">
      <path d="M 50 50 H 80 A 30 30 0 0 0 50 70 L 20 70 V 50 Z" />
      <path d="M 80 50 H 60 A 30 30 0 0 0 80 70 L 100 70 V 50 Z" />
      <path d="M 50 70 L 20 70 V 50 Z" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
