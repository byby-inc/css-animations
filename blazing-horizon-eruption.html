<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Horizon Eruption</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at center, #ff99cc, #ffffff, #ff99cc);
  }

  .core {
    border-radius: 100%;
    position: relative;
    background: linear-gradient(120deg, #ff99cc, #ff99cc, #ffffff, #ff99cc);
  }

  .core::before, .core::after {
    content: '';
    position: absolute;
    width: 100px;
    height: 100px;
    background-color: transparent;
    border-radius: 100%;
    box-shadow:
      0 0 20px #ff99cc, -20px 20px 10px #ff99cc8d, 20px 20px 10px #ff99cc8d,
      20px -20px 10px #ff99cc8d, -20px -20px 10px #ff99cc8d, 0 0 20px #ff99cc,
      20px 0 10px #ff99cc8d, -20px 0 10px #ff99cc8d, 0 20px 10px #ff99cc8d;
    transform: translate(-50%, -50%);
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(120deg, #ff99cc, #ff99cc, #ffffff, #ff99cc);
  }

  .neural-web {
    position: absolute;
    fill: #ffffff !important;
    z-index: 10;
  }

  .neural-web path {
    stroke: #ffffff !important;
    stroke-width: 1px;
  }

  @keyframes core-pulse {
    0% {
      transform: scale(1);
      opacity: 1;
    }
    50% {
      transform: scale(1.2);
      opacity: 0;
    }
    100% {
      transform: scale(1);
      opacity: 1;
    }
  }

  @keyframes particle-dance {
    0% {
      transform: translateX(0) rotate(0deg);
    }
    50% {
      transform: translateX(-20px) rotate(45deg);
    }
    100% {
      transform: translateX(0) rotate(0deg);
    }
  }

  @keyframes neural-flicker {
    0% {
      transform: translate(-20px, -20px) rotate(0deg);
    }
    50% {
      transform: translate(-10px, -10px) rotate(10deg);
    }
    100% {
      transform: translate(-20px, -20px) rotate(0deg);
    }
  }

  .core {
    animation: core-pulse 2s infinite;
  }

  .particle {
    animation: particle-dance 1.5s infinite;
  }

  .neural-web {
    animation: neural-flicker 1.2s infinite;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web" viewBox="0 0 100 100">
      <path d="M 50 0 L 0 100 L 100 100 Z" />
      <path d="M 50 100 L 0 0 L 100 0 Z" />
      <path d="M 0 50 L 0 0 L 100 50 Z" />
    </svg>
    <div class="particle" style="top: 20px; left: 20px;"></div>
    <div class="particle" style="top: 20px; left: 30px;"></div>
    <div class="particle" style="top: 20px; left: 40px;"></div>
    <div class="particle" style="top: 30px; left: 20px;"></div>
    <div class="particle" style="top: 30px; left: 30px;"></div>
    <div class="particle" style="top: 30px; left: 40px;"></div>
    <div class="particle" style="top: 40px; left: 20px;"></div>
    <div class="particle" style="top: 40px; left: 30px;"></div>
    <div class="particle" style="top: 40px; left: 40px;"></div>
    <svg class="neural-web" viewBox="0 0 100 100">
      <path d="M 50 0 L 10 100 L 90 100 Z" />
      <path d="M 50 100 L 10 0 L 90 0 Z" />
      <path d="M 0 50 L 10 0 L 20 10 Z" />
    </svg>
  </div>
        </div>
        </body>
        </html>
