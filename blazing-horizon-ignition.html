<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Horizon Ignition</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: translate(0, 0) rotate(0);
    }
    33.33% {
      transform: translate(15px, -15px) rotate(-20deg);
    }
    66.67% {
      transform: translate(-15px, 15px) rotate(20deg);
    }
    100% {
      transform: translate(0, 0) rotate(0);
    }
  }

  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    33.33% {
      transform: scale(1.1);
    }
    66.67% {
      transform: scale(0.9);
    }
    100% {
      transform: scale(1);
    }
  }

  @keyframes neural-flicker {
    0% {
      transform: rotate(-10deg) scale(1);
      opacity: 1;
    }
    33.33% {
      transform: rotate(10deg) scale(0.9);
      opacity: 0.9;
    }
    66.67% {
      transform: rotate(-10deg) scale(1.1);
      opacity: 1.1;
    }
    100% {
      transform: rotate(-10deg) scale(1);
      opacity: 1;
    }
  }

  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: radial-gradient(rgba(255, 0, 0, 0.2), rgba(255, 0, 0, 0.6));
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.1));
    border-radius: 50%;
    width: 100px;
    height: 100px;
    box-shadow:
    0 0 30px rgba(255, 255, 255, 0.2),
    0 0 40px rgba(255, 255, 255, 0.3),
    0 0 50px rgba(255, 255, 255, 0.4),
    0 0 60px rgba(255, 255, 255, 0.5),
    0 0 70px rgba(255, 255, 255, 0.6),
    0 0 80px rgba(255, 255, 255, 0.7);
    animation: core-pulse 5s infinite;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    background: linear-gradient(rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.1));
  }

  .particle:nth-child(1) {
    top: 20px;
    left: 20px;
    animation: particle-dance 2s infinite;
  }

  .particle:nth-child(2) {
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: particle-dance 3s infinite;
  }

  .particle:nth-child(3) {
    top: 80px;
    left: 80px;
    animation: particle-dance 4s infinite;
  }

  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
    stroke-width: 2;
  }

  .neural-web path {
    stroke-width: 2;
  }

  .neural-web path:nth-child(1) {
    d: M 10 10 Q 50 50 90 10;
    animation: neural-flicker 6s infinite;
  }

  .neural-web path:nth-child(2) {
    d: M 10 90 Q 50 50 90 90;
    animation: neural-flicker 7s infinite;
  }

  .neural-web path:nth-child(3) {
    d: M 90 10 Q 50 50 10 90;
    animation: neural-flicker 8s infinite;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core">
    </div>
    <svg class="neural-web">
      <path d="M 10 10 Q 50 50 90 10"></path>
      <path d="M 10 90 Q 50 50 90 90"></path>
      <path d="M 90 10 Q 50 50 10 90"></path>
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
