<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Horizon of Infinite Radiance</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            .vortex-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  clip-path: polygon(25% 0%,75% 0%,100% 25%,50% 100%,0% 25%);
  background: linear-gradient(90deg, #FFD700, #FF69B4);
}

.core {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background: linear-gradient(90deg, #66CCCC, #66CCCC, #33CCCC, #33CCCC);
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.5),
              0 0 20px rgba(0, 0, 0, 0.5),
              0 0 30px rgba(0, 0, 0, 0.5),
              0 0 40px rgba(0, 0, 0, 0.5),
              0 0 50px rgba(0, 0, 0, 0.5),
              0 0 60px rgba(0, 0, 0, 0.5);
}

@keyframes particle-dance {
  0%, 100% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
  25% { transform: translate(-50%, -50%) rotate(45deg) scale(1.2); }
  50% { transform: translate(-50%, -50%) rotate(90deg) scale(1.5); }
  75% { transform: translate(-50%, -50%) rotate(135deg) scale(1.8); }
}

.particle {
  position: absolute;
  border-radius: 50%;
  width: 20px;
  height: 20px;
  background: linear-gradient(90deg, #66CCCC, #66CCCC);
  animation: particle-dance 5s infinite;
  transform: translate(-50%, -50%) rotate(0deg) scale(1);
}

@keyframes core-pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.5); }
  100% { transform: scale(1); }
}

@keyframes neural-flicker {
  0% { transform: translate(0, 0); }
  25% { transform: translate(10%, 10%); }
  50% { transform: translate(5%, 5%); }
  75% { transform: translate(15%, 15%); }
  100% { transform: translate(0, 0); }
}

.neural-web {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  fill: none;
  stroke: #fff;
  stroke-width: 1;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.neural-web {
  path {
    stroke-dasharray: 100;
    animation: neural-flicker 10s infinite;
  }
}

.svg-line {
  stroke: #fff;
  transition: stroke-width 5s;
}
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M0,0 L50,50 M50,50 L100,0" />
      <path d="M0,0 L50,50 M50,50 L100,100" />
      <path d="M0,0 L100,100" />
    </svg>
    <div class="particle" style="top: 20%; left: 20%;"></div>
    <div class="particle" style="top: 40%; left: 40%;"></div>
    <div class="particle" style="top: 60%; left: 60%;"></div>
    <div class="particle" style="top: 10%; left: 30%;"></div>
    <div class="particle" style="top: 85%; left: 70%;"></div>
  </div>
        </div>
        </body>
        </html>
