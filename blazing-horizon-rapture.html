<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Horizon Rapture</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: linear-gradient(150deg, #FF9900 0%, #FF6600 100%);
  }
  
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(120deg, #FFFF00 0%, #FFC000 100%);
    box-shadow: 0 0 10px #FF0000, 0 0 10px #66FF00, 0 0 10px #0000FF, 0 0 10px #FFFF00, 0 0 10px #FF9900, 0 0 10px #CC6600;
    animation: core-pulse 3s infinite;
  }
  
  .core:hover {
    animation: core-pulse 1s infinite;
  }
  
  @keyframes core-pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  
  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(120deg, #FFCC00 0%, #FF9900 100%);
  }
  
  .particle.particle1 {
    top: 20%;
    left: 20%;
    animation: particle-dance 6s infinite;
  }
  
  .particle.particle2 {
    top: 80%;
    left: 80%;
    animation: particle-dance 4s infinite;
  }
  
  .particle.particle3 {
    top: 10%;
    left: 70%;
    animation: particle-dance 8s infinite;
  }
  
  .particle.particle4 {
    top: 90%;
    left: 30%;
    animation: particle-dance 2s infinite;
  }
  
  .particle.particle5 {
    top: 50%;
    left: 50%;
  }
  
  .particle.particle6 {
    top: 30%;
    left: 40%;
  }
  
  .particle.particle7 {
    top: 70%;
    left: 60%;
  }
  
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: #FFFFFF;
  }
  
  .neural-web path {
    stroke: #FFFFFF;
    stroke-width: 2;
  }
  
  @keyframes neural-flicker {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  
  .particle-dance {
    animation: particle-dance 2s infinite;
  }
  
  .particle-dance2 {
    animation: particle-dance 4s infinite;
  }
  
  .particle-dance3 {
    animation: particle-dance 6s infinite;
  }
  
  @keyframes particle-dance {
    0% { transform: translate(0, 0); }
    50% { transform: translate(5px, 5px); }
    100% { transform: translate(0, 0); }
  }
  
  .neural-flicker {
    animation: neural-flicker 3s infinite;
  }
  
  body {
    margin: 0;
    padding: 0;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
  <div class="core"></div>
  <svg class="neural-web">
    <path d="M 10 10 L 40 40 L 80 10 L 10 10 Z" />
    <path d="M 20 60 L 60 20 L 100 60 L 20 60 Z" />
    <path d="M 30 90 L 90 30 L 130 90 L 30 90 Z" />
  </svg>
  <div class="particle particle1"></div>
  <div class="particle particle2"></div>
  <div class="particle particle3"></div>
  <div class="particle particle4"></div>
  <div class="particle particle5"></div>
  <div class="particle particle6"></div>
  <div class="particle particle7"></div>
</div>
        </div>
        </body>
        </html>
