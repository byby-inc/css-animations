<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Horizon Singularity Eruption</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: rotate(0deg) translate(0, 0);
    }
    25% {
      transform: rotate(20deg) translate(10%, 10%);
    }
    50% {
      transform: rotate(40deg) translate(20%, 20%);
    }
    75% {
      transform: rotate(60deg) translate(30%, 30%);
    }
    100% {
      transform: rotate(80deg) translate(40%, 40%);
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.2);
    }
    100% {
      transform: scale(1);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: translate(-20%, -20%);
      stroke-dasharray: 1000;
    }
    50% {
      transform: translate(-19%, -19%);
      stroke-dasharray: 999;
    }
    100% {
      transform: translate(-20%, -20%);
      stroke-dasharray: 1000;
    }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    background: linear-gradient(to bottom, #4ec7f5, #2facff);
    box-shadow: 
    0 0 20px #2facff, 
    0 0 10px #2facff, 
    0 0 5px #2facff, 
    0 0 2px #2facff, 
    10px 20px 4px #2facff, 
    -20px 40px 4px #2facff;
    animation: core-pulse infinite 2s;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(to bottom, #5d9df6, #5d9df6);
  }
  .particle:nth-child(1) {
    top: 40%;
    left: 20%;
    animation: particle-dance infinite 30s;
  }
  .particle:nth-child(2) {
    top: 30%;
    left: 40%;
    animation: particle-dance infinite 25s;
  }
  .particle:nth-child(3) {
    top: 20%;
    left: 60%;
    animation: particle-dance infinite 20s;
  }
  .particle:nth-child(4) {
    top: 10%;
    left: 80%;
    animation: particle-dance infinite 35s;
  }
  .particle:nth-child(5) {
    top: 50%;
    left: 80%;
    animation: particle-dance infinite 15s;
  }
  .particle:nth-child(6) {
    top: 60%;
    left: 30%;
    animation: particle-dance infinite 38s;
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
  }
  .neural-web>path {
    stroke-dasharray: 1000;
  }
  .neural-web>path:nth-child(1) {
    animation: neural-flicker infinite 15s;
  }
  .neural-web>path:nth-child(2) {
    animation: neural-flicker infinite 20s;
  }
  .neural-web>path:nth-child(3) {
    animation: neural-flicker infinite 25s;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 50 50 L 50 90 L 90 90 L 90 50 L 50 50" />
      <path d="M 40 40 L 100 40 L 100 100 L 40 100 L 40 40" />
      <path d="M 30 30 L 120 30 L 120 120 L 30 120 L 30 30" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
