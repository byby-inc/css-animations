<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Horizon Singularity</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            /* Define keyframes */
  @keyframes particle-dance {
    0% {
      transform: translate(-50%, 0) rotate(0deg);
    }
    50% {
      transform: translate(-50%, 15px) rotate(30deg);
    }
    100% {
      transform: translate(-50%, 0) rotate(0deg);
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.1);
    }
    100% {
      transform: scale(1);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: translateY(0);
    }
    50% {
      transform: translateY(-10px);
    }
    100% {
      transform: translateY(0);
    }
  }
  /* Main styles */
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    clip-path: polygon(25% 0%,75% 0%,100% 25%,50% 100%,0% 25%);
    z-index: -1;
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background-image: linear-gradient(to bottom, #fff, #ff69b4);
    box-shadow:
      0 0 10px #fff,
      0 0 20px #fff,
      0 0 30px #fff,
      0 0 40px #fff,
      0 0 50px #fff;
    animation: core-pulse 5s infinite;
  }
  .particle {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background-image: linear-gradient(to bottom, #fff, #ff69b4);
  }
  .particle.p1 {
    top: 10%;
    left: 50%;
    transform: translate(-50%, 0);
    animation: particle-dance 10s infinite;
  }
  .particle.p2 {
    top: 30%;
    left: 20%;
    transform: translate(0, -20px) rotate(30deg);
    animation: particle-dance 3s infinite;
  }
  .particle.p3 {
    top: 50%;
    left: 70%;
    transform: translate(-50%, 15px) rotate(60deg);
    animation: particle-dance 5s infinite;
  }
  .particle.p4 {
    top: 20%;
    left: 80%;
    transform: translate(-50%, 0);
    animation: particle-dance 8s infinite;
  }
  .particle.p5 {
    top: 40%;
    left: 10%;
    transform: translate(0, -20px) rotate(90deg);
    animation: particle-dance 12s infinite;
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
    stroke-width: 2px;
  }
  .neural-web path {
    stroke: #fff;
    stroke-width: 2px;
    opacity: 0.5;
  }
  .neural-web path:nth-child(1) {
    transform: translateY(-10px);
    animation: neural-flicker 15s infinite;
  }
  .neural-web path:nth-child(2) {
    transform: translateY(10px);
    animation: neural-flicker 20s infinite;
  }
  .neural-web path:nth-child(3) {
    transform: translateY(-20px);
    animation: neural-flicker 25s infinite;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>
    <div class="particle p5"></div>
    <svg class="neural-web">
      <path d="M 50 100 L 100 150 L 150 100 L 100 50 L 50 100" />
      <path d="M 50 100 L 150 50 L 100 150 L 50 50 L 50 100" />
      <path d="M 50 100 L 250 150 L 150 50 L 50 50 L 50 100" />
    </svg>
  </div>
        </div>
        </body>
        </html>
