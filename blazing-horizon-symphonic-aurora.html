<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Horizon Symphonic Aurora</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% { transform: rotate(0deg) translate(0%, 0%) scale(1); }
    10% { transform: rotate(5deg) translate(-50%, -50%) scale(1); }
    20% { transform: rotate(10deg) translate(-50%, -20%) scale(1); }
    30% { transform: rotate(0deg) translate(0%, 0%) scale(0.8); }
    40% { transform: rotate(0deg) translate(0%, 0%) scale(1); }
    100% { transform: rotate(0deg) translate(0%, 0%) scale(1); }
  }

  @keyframes core-pulse {
    0% { transform: scale(1); }
    20% { transform: scale(1.2); }
    40% { transform: scale(1); }
    60% { transform: scale(0.8); }
    80% { transform: scale(1); }
    100% { transform: scale(1); }
  }

  @keyframes neural-flicker {
    0% { transform: translate(-50%, -50%) rotate(0deg); }
    10% { transform: translate(-50%, -50%) rotate(5deg); }
    20% { transform: translate(-50%, -30%) rotate(10deg); }
    30% { transform: translate(-50%, -50%) rotate(0deg); }
    100% { transform: translate(-50%, -50%) rotate(0deg); }
  }

  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: circle(50% at 50% 50%);
    background: linear-gradient(to bottom, #f9d2f4, #f9d2f4 50%, #d3b6c4 50%, #d3b6c4);
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(to right, #d7e9f9, #d7e9f9 40%, #99d4d3 40%, #99d4d3);
    animation: particle-dance 20s infinite;
  }

  .core {
    position: absolute;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: linear-gradient(to top, #ff99e4, #ff99e4 50%, #cc66ec 50%, #cc66ec);
    box-shadow: 0 0 10px #ff99e4, 0 0 10px #ff99e4, 0 0 10px #ff99e4, 0 0 10px #ff99e4, 0 0 10px #ff99e4, 0 0 10px #ff99e4;
    animation: core-pulse 5s infinite;
  }

  .neural-web {
    position: absolute;
    fill: #fff;
    transform: translate(-50%, -50%);
  }

  .neural-web path {
    stroke-width: 2px;
    stroke: #fff;
    animation: neural-flicker 10s infinite;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M50 50 L100 100" />
      <path d="M50 150 L0 200" />
      <path d="M150 150 L200 50" />
    </svg>
    <div class="particle" style="top: 20%; left: 20%;"></div>
    <div class="particle" style="top: 40%; left: 30%;"></div>
    <div class="particle" style="top: 60%; left: 40%;"></div>
    <div class="particle" style="top: 10%; left: 50%;"></div>
    <div class="particle" style="top: 80%; left: 60%;"></div>
    <div class="particle" style="top: 30%; left: 70%;"></div>
    <div class="particle" style="top: 50%; left: 10%;"></div>
    <div class="particle" style="top: 70%; left: 20%;"></div>
  </div>
        </div>
        </body>
        </html>
