<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Horizon Symphony</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: translate(0, 0);
    }
    25% {
      transform: translate(-20px, 20px);
    }
    50% {
      transform: translate(20px, -20px);
    }
    75% {
      transform: translate(-20px, 20px);
    }
    100% {
      transform: translate(0, 0);
    }
  }

  @keyframes core-pulse {
    0% {
      transform: scale(1);
      opacity: 1;
    }
    50% {
      transform: scale(1.1);
      opacity: 0.8;
    }
    100% {
      transform: scale(1);
      opacity: 1;
    }
  }

  @keyframes neural-flicker {
    0% {
      transform: translate(0, 0);
      stroke-width: 1px;
    }
    10% {
      transform: translate(0, -5px);
      stroke-width: 3px;
    }
    20% {
      transform: translate(0, 0);
      stroke-width: 1px;
    }
    30% {
      transform: translate(5px, 0);
      stroke-width: 3px;
    }
    40% {
      transform: translate(0, 0);
      stroke-width: 1px;
    }
    50% {
      transform: translate(0, -5px);
      stroke-width: 3px;
    }
  }

  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background-image: linear-gradient(to bottom, #f7f700, #ff9900);
  }

  .particles {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background-image: linear-gradient(to bottom, #f7f700, #ff9900);
    box-shadow: 0 0 0 0 rgba(255, 153, 0, 1),
      0 0 10px 2px rgba(255, 153, 0, 1),
      0 0 20px 5px rgba(255, 153, 0, 1),
      0 0 30px 10px rgba(255, 153, 0, 1),
      0 0 40px 20px rgba(255, 153, 0, 1),
      0 0 50px 30px rgba(255, 153, 0, 1);
    animation: core-pulse infinite 2s;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    background-image: linear-gradient(to bottom, #f7f700, #ff9900);
  }

  .particle:nth-child(1) {
    top: 40%;
    left: 10%;
    animation: particle-dance infinite 5s;
  }

  .particle:nth-child(2) {
    top: 20%;
    left: 20%;
    animation: particle-dance infinite 3.5s;
  }

  .particle:nth-child(3) {
    top: 10%;
    left: 10%;
    animation: particle-dance infinite 2s;
  }

  .particle:nth-child(4) {
    top: 40%;
    left: 60%;
    animation: particle-dance infinite 1.5s;
  }

  .particle:nth-child(5) {
    top: 20%;
    left: 80%;
    animation: particle-dance infinite 4s;
  }

  .particle:nth-child(6) {
    top: 10%;
    left: 40%;
    animation: particle-dance infinite 3s;
  }

  .particle:nth-child(7) {
    top: 60%;
    left: 60%;
    animation: particle-dance infinite 2.5s;
  }

  .particle:nth-child(8) {
    top: 40%;
    left: 40%;
    animation: particle-dance infinite 1s;
  }

  .particle:nth-child(9) {
    top: 10%;
    left: 80%;
    animation: particle-dance infinite 4.5s;
  }

  .particle:nth-child(10) {
    top: 60%;
    left: 20%;
    animation: particle-dance infinite 3.5s;
  }

  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: #fff;
  }

  .neural-web path {
    stroke: #fff;
    stroke-width: 3px;
  }

  .neural-web path:nth-child(1) {
    d: M100,100 L50,50 L200,200;
    animation: neural-flicker infinite 8s;
  }

  .neural-web path:nth-child(2) {
    d: M50,50 L100,0 L0,150;
    animation: neural-flicker infinite 10s;
  }

  .neural-web path:nth-child(3) {
    d: M0,0 L50,150 L200,0;
    animation: neural-flicker infinite 12s;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <div class="particles">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>
    <svg class="neural-web"></svg>
  </div>
        </div>
        </body>
        </html>
