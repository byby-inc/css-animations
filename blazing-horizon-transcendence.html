<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Horizon Transcendence</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: translate(0, 0) rotate(0deg);
    }
    50% {
      transform: translate(20px, -10px) rotate(30deg);
    }
    100% {
      transform: translate(-20px, 10px) rotate(0deg);
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(0.4);
    }
    50% {
      transform: scale(1);
    }
    100% {
      transform: scale(0.4);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: translate(0, 50%) scale(1);
    }
    50% {
      transform: translate(50px, 0) scale(1.2);
    }
    100% {
      transform: translate(0, -50%) scale(1);
    }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: circle(50% at 50% 50%);
  }
  .vortex-container::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: linear-gradient(to bottom, #ff69b4, #66b3ff, #ffff00);
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background-image: linear-gradient(to bottom, #fff, #ff0000);
    animation: core-pulse infinite 2s ease-in-out;
  }
  .core::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 50px;
    height: 50px;
    box-shadow: 0 0 0 0 #fff, 0 0 0 0 #ff0000, 0 0 0 0 #00ff00, 0 0 0 0 #0000ff, 0 0 0 0 #ffff00, 0 0 0 0 #ff69b4;
    animation: pulse 2s infinite ease-in-out;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    background-image: linear-gradient(to bottom, #ff69b4, #66b3ff, #ffff00);
    animation: particle-dance infinite 5s ease-in-out;
  }
  .particle::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 10px;
    height: 10px;
    background-image: linear-gradient(to bottom, #fff, #ff0000);
    animation: particle-dance 5s infinite ease-in-out;
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  .neural-web path {
    stroke: #fff;
    stroke-width: 1;
    fill: none;
  }
  @keyframes pulse {
    0% {
      box-shadow: 0 0 0 0 #fff, 0 0 0 0 #ff0000, 0 0 0 0 #00ff00, 0 0 0 0 #0000ff, 0 0 0 0 #ffff00, 0 0 0 0 #ff69b4;
    }
    50% {
      box-shadow: 0 0 0 10px #fff, 0 0 0 10px #ff0000, 0 0 0 10px #00ff00, 0 0 0 10px #0000ff, 0 0 0 10px #ffff00, 0 0 0 10px #ff69b4;
    }
    100% {
      box-shadow: 0 0 0 0 #fff, 0 0 0 0 #ff0000, 0 0 0 0 #00ff00, 0 0 0 0 #0000ff, 0 0 0 0 #ffff00, 0 0 0 0 #ff69b4;
    }
  }
  @keyframes particle-dance-2 {
    0% {
      transform: translate(20px, -10px) rotate(30deg);
    }
    50% {
      transform: translate(-20px, 10px) rotate(0deg);
    }
    100% {
      transform: translate(0, 0) rotate(0deg);
    }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 50 50 L 100 100" stroke="#fff" fill="none"/>
      <path d="M 100 50 L 50 100" stroke="#fff" fill="none"/>
      <path d="M 50 100 L 100 50" stroke="#fff" fill="none"/>
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
