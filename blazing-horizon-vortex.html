<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Horizon Vortex</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            /* Set the main container */
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: linear-gradient(to bottom, #c7f464, #ff9900);
  }

  /* Define the core */
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: linear-gradient(to bottom, #fee440, #ff8800);
    box-shadow:
      0 0 10px #ff9900,
      0 0 10px #ff9900,
      0 0 10px #ff9900,
      0 0 10px #ff9900,
      0 0 10px #ff9900,
      0 0 15px #ff8800;
  }

  /* Animate the core pulse */
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    20% {
      transform: scale(1.1);
    }
    40% {
      transform: scale(1);
    }
    45% {
      transform: scale(1.05);
    }
    65% {
      transform: scale(1);
    }
    75% {
      transform: scale(1.05);
    }
    95% {
      transform: scale(1);
    }
  }
  .core {
    animation: core-pulse 1200ms infinite ease-out;
  }

  /* Define the particles */
  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(to bottom, #c7f464, #ff9900);
  }

  /* Animate the particle dance */
  @keyframes particle-dance {
    0% {
      transform: translate(-20px, -10px) rotate(0deg);
    }
    20% {
      transform: translate(-10px, -20px) rotate(10deg);
    }
    40% {
      transform: translate(-20px, -10px) rotate(0deg);
    }
    60% {
      transform: translate(-10px, 20px) rotate(-10deg);
    }
    80% {
      transform: translate(-20px, -10px) rotate(0deg);
    }
    100% {
      transform: translate(-10px, -20px) rotate(10deg);
    }
  }

  /* Create free particles */
  .particle:nth-child(1) {
    top: 10px;
    left: 10px;
    width: 10px;
    height: 10px;
  }
  .particle:nth-child(2) {
    top: 50%;
    left: 70%;
    width: 20px;
    height: 20px;
  }
  .particle:nth-child(3) {
    top: 80px;
    left: 40px;
    width: 15px;
    height: 15px;
  }
  .particle:nth-child(4) {
    top: 30px;
    left: 60px;
    width: 25px;
    height: 25px;
  }
  .particle:nth-child(5) {
    top: 40px;
    left: 20px;
    width: 18px;
    height: 18px;
  }
  .particle:nth-child(6) {
    top: 60px;
    left: 50px;
    width: 22px;
    height: 22px;
  }
  .particle:nth-child(7) {
    top: 70px;
    left: 80px;
    width: 12px;
    height: 12px;
  }
  .particle:nth-child(8) {
    top: 90px;
    left: 30px;
    width: 20px;
    height: 20px;
  }
  .particle:nth-child(9) {
    top: 10px;
    left: 80px;
    width: 15px;
    height: 15px;
  }
  .particle:nth-child(10) {
    top: 20px;
    left: 40px;
    width: 25px;
    height: 25px;
  }
  .particle {
    animation: particle-dance 700ms infinite ease-out;
  }

  /* Define the neural web */
  .neural-web {
    position: absolute;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
    stroke-width: 0.2;
  }

  /* Animate the neural flicker */
  @keyframes neural-flicker {
    0% {
      transform: scale(1);
    }
    5% {
      transform: scale(1.1);
      stroke-width: 0.3;
    }
    15% {
      transform: scale(0.9);
      stroke-width: 0.2;
    }
    25% {
      transform: scale(1.1);
      stroke-width: 0.3;
    }
    35% {
      transform: scale(0.9);
      stroke-width: 0.2;
    }
    45% {
      transform: scale(1);
      stroke-width: 0.3;
    }
    50% {
      stroke-width: 0.2;
    }
    75% {
      transform: scale(0.95);
    }
    85% {
      transform: scale(1);
    }
  }
  .neural-web {
    animation: neural-flicker 1000ms infinite linear;
  }

  /* Create the neural paths */
  .neural-web path:nth-child(1) {
    d: "M 0 0 l 100 100";
  }
  .neural-web path:nth-child(2) {
    d: "M 0 100 l 150 -150";
  }
  .neural-web path:nth-child(3) {
    d: "M 100 0 l 50 150";
  }
  .neural-web path:nth-child(4) {
    d: "M 50 100 l -150 50";
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path class="neural-web path-1"></path>
      <path class="neural-web path-2"></path>
      <path class="neural-web path-3"></path>
      <path class="neural-web path-4"></path>
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
