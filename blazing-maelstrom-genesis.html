<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Maelstrom Genesis</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% { transform: translate(0, 0) rotate(0); }
    10% { transform: translate(10px, 10px) rotate(10deg); }
    20% { transform: translate(-10px, -10px) rotate(-20deg); }
    30% { transform: translate(20px, 20px) rotate(30deg); }
    100% { transform: translate(0, 0) rotate(0); }
  }
  
  @keyframes core-pulse {
    0% { transform: scale(1); }
    20% { transform: scale(1.5); }
    40% { transform: scale(1); }
    60% { transform: scale(1.2); }
    80% { transform: scale(1); }
    100% { transform: scale(1); }
  }
  
  @keyframes neural-flicker {
    0% { transform: rotate(0); }
    10% { transform: rotate(10deg); }
    30% { transform: rotate(5deg); }
    50% { transform: rotate(-10deg); }
    70% { transform: rotate(5deg); }
    100% { transform: rotate(0); }
  }
  
  /* .vortex-container */
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    background-image: radial-gradient(50px at 50% 50%, rgb(128, 64, 255), rgb(255, 127, 128));
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  }
  
  /* .core */
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: repeating-linear-gradient(90deg, #fff, #fff 2px, #000 2px, #000 4px), 
              repeating-linear-gradient(0deg, #ff0, #ff0 2px, #000 2px, #000 4px);
    box-shadow: 
    0 0 10px #ff0, 
    0 0 10px #000, 
    0 0 20px #00ff00, 
    0 0 20px #0000ff, 
    -10px 0 10px #ff00ff, 
    10px 0 10px #00ffff, 
    -10px 10px 10px #ff0000, 
    10px 10px 10px #00ff00;
    animation: core-pulse 3s infinite;
  }
  
  /* .particle */
  .particle {
    position: absolute;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    background: linear-gradient(to right, #ff0, #ff0 10px, #000 10px, #000 20px);
  }
  
  /* SVG */
  .neural-web {
    position: absolute;
    fill: none;
    stroke: #fff;
    stroke-width: 2px;
  }
  
  .neural-web path {
    stroke-dasharray: 100px, 100px;
    animation: neural-flicker 2s infinite;
  }
  
  /* CSS animation */
  @keyframes particle-dance {
    0% { transform: translate(0, 0) rotate(0); }
    10% { transform: translate(10px, 10px) rotate(10deg); }
    20% { transform: translate(-10px, -10px) rotate(-20deg); }
    30% { transform: translate(20px, 20px) rotate(30deg); }
    100% { transform: translate(0, 0) rotate(0); }
  }
  
  @keyframes core-pulse {
    0% { transform: scale(1); }
    20% { transform: scale(1.5); }
    40% { transform: scale(1); }
    60% { transform: scale(1.2); }
    80% { transform: scale(1); }
    100% { transform: scale(1); }
  }
  
  @keyframes neural-flicker {
    0% { transform: rotate(0); }
    10% { transform: rotate(10deg); }
    30% { transform: rotate(5deg); }
    50% { transform: rotate(-10deg); }
    70% { transform: rotate(5deg); }
    100% { transform: rotate(0); }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 100 100 L 200 200" />
      <path d="M 200 100 L 100 200" />
      <path d="M 300 300 L 400 400" />
    </svg>
    <div class="particle" style="top: 100px; left: 100px; animation-duration: 1s;"></div>
    <div class="particle" style="top: 150px; left: 150px;"></div>
    <div class="particle" style="top: 200px; left: 200px; animation-duration: 1s;"></div>
    <div class="particle" style="top: 250px; left: 250px;"></div>
    <div class="particle" style="top: 300px; left: 300px;"></div>
    <div class="particle" style="top: 350px; left: 350px;"></div>
    <div class="particle" style="top: 400px; left: 400px;"></div>
  </div>
        </div>
        </body>
        </html>
