<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Nova Symphony of Cosmic Light</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% { transform: rotate(0deg) translate(0, 0); }
    100% { transform: rotate(360deg) translate(50%, -50%); }
  }
  
  @keyframes core-pulse {
    0% { transform: scale(0.9); }
    50% { transform: scale(1.3); }
    100% { transform: scale(0.9); }
  }
  
  @keyframes neural-flicker {
    0% { transform: rotate(0deg) scale(1); }
    100% { transform: rotate(100deg) scale(1.2); }
  }
  
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  }
  
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    height: 200px;
    background-image: linear-gradient(to bottom right, #ff69b4 0%, #ff99cc 50%, #ffd5ec 100%);
    border-radius: 50%;
    box-shadow: 
      0 0 30px #ff99cc,
      0 0 60px #ff99cc,
      0 0 90px #ff99cc,
      0 0 120px #ff99cc,
      0 0 150px #ff99cc,
      0 0 180px #ff99cc;
    animation: core-pulse infinite 2s;
  }
  
  .particle {
    position: absolute;
    top: -100px;
    left: 20px;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    background-image: linear-gradient(to bottom right, #fffffe 0%, #b3ffff 50%, #fffeff 100%);
    animation: particle-dance infinite 4s;
  }
  
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
  }
  
  .neural-web path {
    stroke: #fff;
    stroke-width: 1;
    stroke-dasharray: 10, 10;
    animation: neural-flicker infinite 1s;
  }
  
  @keyframes particle-dance {
    0% { transform: rotate(0deg) translate(0, 0); }
    100% { transform: rotate(360deg) translate(50%, -50%); }
  }
  
  @keyframes neural-flicker {
    0% { transform: rotate(0deg) scale(1); }
    100% { transform: rotate(100deg) scale(1.2); }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 100 100 L 200 300 L 300 100 L 200 0 Z" />
      <path d="M 300 100 L 200 300 L 100 100 L 200 0 Z" />
      <path d="M 100 0 L 300 300 L 200 100 L 100 300 Z" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
