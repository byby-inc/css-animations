<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Primordial Horizon</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance { 
    0% { transform: translate(0, 0) rotate(0); }
    25% { transform: translate(20px, 10px) rotate(180deg); }
    50% { transform: translate(-15px, -5px) rotate(360deg); }
    75% { transform: translate(-30px, 15px) rotate(90deg); }
    100% { transform: translate(0, 0) rotate(0); }
  }
  @keyframes core-pulse { 
    0% { transform: scale(1.5); }
    50% { transform: scale(0.75); }
    100% { transform: scale(1.5); }
  }
  @keyframes neural-flicker { 
    0% { transform: rotate(0) translate(0, 0); }
    25% { transform: rotate(30deg) translate(0, 15px); }
    75% { transform: rotate(-30deg) translate(0, -15px); }
    100% { transform: rotate(0) translate(0, 0); }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: linear-gradient(-90deg, #3f51b5, #9c27b0);
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    box-shadow: 0 0 0 10px #fff, 0 0 0 20px #fff, 0 0 0 30px #fff, 0 0 0 40px #fff, 0 0 0 50px #fff, 0 0 0 60px #fff;
    background: linear-gradient(90deg, #ff99cc, #ff6699);
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    background: radial-gradient(circle at center, #fff, #3f51b5);
  }
  .particle:nth-child(1) {
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: particle-dance 3s infinite;
  }
  .particle:nth-child(2) {
    top: 20%;
    left: 80%;
    animation: particle-dance 2s infinite;
  }
  .particle:nth-child(3) {
    top: 80%;
    left: 20%;
    animation: particle-dance 4s infinite;
  }
  .particle:nth-child(4) {
    top: 10%;
    left: 60%;
    animation: particle-dance 1s infinite;
  }
  .particle:nth-child(5) {
    top: 70%;
    left: 40%;
    animation: particle-dance 3s infinite;
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    fill: #fff;
  }
  .neural-web path {
    stroke: #fff;
    stroke-width: 2;
  }
  .neural-web path:nth-child(1) {
    d: M 0 50 V 50 H 100;
  }
  .neural-web path:nth-child(2) {
    d: M 50 0 H 50 V 100;
  }
  .neural-web path:nth-child(3) {
    d: M 0 0 L 100 100;
  }
  .core {
    animation: core-pulse 1s infinite;
  }
  @keyframes particle-dance { 
    0% { transform: translate(0, 0) rotate(0); }
    25% { transform: translate(20px, 10px) rotate(180deg); }
    50% { transform: translate(-15px, -5px) rotate(360deg); }
    75% { transform: translate(-30px, 15px) rotate(90deg); }
    100% { transform: translate(0, 0) rotate(0); }
  }
  @keyframes core-pulse { 
    0% { transform: scale(1.5); }
    50% { transform: scale(0.75); }
    100% { transform: scale(1.5); }
  }
  @keyframes neural-flicker { 
    0% { transform: rotate(0) translate(0, 0); }
    25% { transform: rotate(30deg) translate(0, 15px); }
    75% { transform: rotate(-30deg) translate(0, -15px); }
    100% { transform: rotate(0) translate(0, 0); }
  }
  .neural-web {
    animation: neural-flicker 2s infinite;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 0 50 V 50 H 100"></path>
      <path d="M 50 0 H 50 V 100"></path>
      <path d="M 0 0 L 100 100"></path>
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
