<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Primordial Quantum Fusion</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% { transform: translateY(50px) rotate(0deg); }
    50% { transform: translateY(-50px) rotate(180deg); }
    100% { transform: translateY(50px) rotate(360deg); }
  }

  @keyframes core-pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.5); }
    100% { transform: scale(1); }
  }

  @keyframes neural-flicker {
    0% { transform: scale(1) skewX(0deg); }
    50% { transform: scale(1.2) skewX(10deg); }
    100% { transform: scale(1) skewX(0deg); }
  }

  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  }

  .core {
    width: 200px;
    height: 200px;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background-image: linear-gradient(to bottom, #FFC107, #FF9800);
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.5), 0 0 20px rgba(255, 255, 255, 0.5), 0 0 30px rgba(255, 255, 255, 0.5), 0 0 40px rgba(255, 255, 255, 0.5), 0 0 50px rgba(255, 255, 255, 0.5), 0 0 60px rgba(255, 255, 255, 0.5);
    animation: core-pulse infinite 2s;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    background-image: linear-gradient(to bottom, #F44336, #E91E63);
  }

  .particle:nth-child(1) {
    left: 0;
    top: 0;
    animation: particle-dance infinite 1.5s;
  }

  .particle:nth-child(2) {
    left: 10%;
    top: 10%;
    animation: particle-dance infinite 1.2s;
  }

  .particle:nth-child(3) {
    left: 20%;
    top: 20%;
    animation: particle-dance infinite 1s;
  }

  .particle:nth-child(4) {
    left: 30%;
    top: 30%;
    animation: particle-dance infinite 1.5s;
  }

  .particle:nth-child(5) {
    left: 40%;
    top: 40%;
    animation: particle-dance infinite 1.2s;
  }

  .particle:nth-child(6) {
    left: 50%;
    top: 50%;
    animation: particle-dance infinite 1s;
  }

  .neural-web {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    fill: none;
    stroke: #fff;
  }

  .neural-web path {
    stroke-width: 2px;
    stroke-linecap: round;
  }

  .neural-web path:nth-child(1) {
    stroke-dasharray: 100, 100;
    stroke-dashoffset: 0;
    animation: neural-flicker infinite 5s;
  }

  .neural-web path:nth-child(2) {
    stroke-dasharray: 100, 100;
    stroke-dashoffset: 0;
    animation: neural-flicker infinite 4.5s;
  }

  .neural-web path:nth-child(3) {
    stroke-dasharray: 100, 100;
    stroke-dashoffset: 0;
    animation: neural-flicker infinite 4s;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 100 150 A 50 50 0 1 1 50 250 A 50 50 0 1 1 100 150 Z" />
      <path d="M 150 100 A 25 25 0 1 1 75 200 A 25 25 0 1 1 150 100 Z" />
      <path d="M 200 150 A 50 50 0 1 1 150 250 A 50 50 0 1 1 200 150 Z" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
