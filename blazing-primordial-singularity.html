<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Primordial Singularity</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
   0% { transform: translate(-100px, -100px); }
   30% { transform: translate(100px, 100px); }
   70% { transform: translate(-100px, -100px); }
   100% { transform: translate(100px, 100px); }
}
  @keyframes core-pulse {
   0% { transform: scale(0.5); }
   40% { transform: scale(0.7); }
   80% { transform: scale(0.3); }
   100% { transform: scale(0.5); }
}
  @keyframes neural-flicker {
   0% { transform: rotate(0deg); }
   30% { transform: rotate(45deg); }
   70% { transform: rotate(0deg); }
   100% { transform: rotate(45deg); }
}
 
 .vortex-container {
   position: absolute;
   top: 0;
   left: 0;
   width: 100%;
   height: 100%;
   z-index: -1;
   clip-path: circle(50% at 50% 50%);
 }
 
 .core {
   position: absolute;
   top: 50%;
   left: 50%;
   transform: translate(-50%, -50%);
   width: 100px;
   height: 100px;
   background: linear-gradient(0deg, #ff6f69, #ff6f69 10px, transparent 10px);
   background-size: 200px 200px;
   box-shadow:
    0 0 0 0 #ff69b4,
    15px -15px 0 0 #ff69b4,
    -15px -15px 0 0 #ff69b4,
    15px 15px 0 0 #ff69b4,
    -15px 15px 0 0 #ff69b4;
   animation: core-pulse infinite 3s;
 }
 
 .particle {
   position: absolute;
   border-radius: 50%;
   width: 20px;
   height: 20px;
   background: linear-gradient(0deg, #ff93c7, #ffff00);
   background-size: 200px 200px;
   animation: particle-dance infinite 2s;
 }
 
  .neural-web {
   position: absolute;
   top: 50%;
   left: 50%;
   transform: translate(-50%, -50%);
   width: 100%;
   height: 100%;
   fill: #fff;
 }
 
.neural-web path {
   animation: neural-flicker infinite 1s;
 }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
   <div class="core">
     <div class="particle"></div>
     <div class="particle"></div>
     <div class="particle"></div>
     <div class="particle"></div>
     <div class="particle"></div>
     <div class="particle"></div>
     <div class="particle"></div>
     <div class="particle"></div>
     <div class="particle"></div>
     <div class="particle"></div>
   </div>
   <svg class="neural-web" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
     <path d="M 10 90 L 90 90 L 90 10z" />
     <path d="M 10 90 L 40 60 L 70 90z" />
     <path d="M 90 90 L 50 30 L 10 90z" />
   </svg>
 </div>
        </div>
        </body>
        </html>
