<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Primordial Vortex</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: translate(0%,0%) rotate(0deg);
    }
    100% {
      transform: translate(-50%, -50%) rotate(360deg);
    }
  }
  
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.1);
    }
    100% {
      transform: scale(1);
    }
  }
  
  @keyframes neural-flicker {
    0% {
      transform: rotate(0deg);
    }
    25% {
      transform: rotate(10deg);
    }
    50% {
      transform: rotate(0deg);
    }
    75% {
      transform: rotate(-10deg);
    }
    100% {
      transform: rotate(0deg);
    }
  }
  
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: linear-gradient(90deg, #ff9900, #ffcc00);
  }
  
  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(90deg, #99ff99, #ccffff);
    animation: particle-dance infinite 8s linear;
  }
  
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    background: linear-gradient(90deg, #ff6666, #cc3333);
    border-radius: 50%;
    box-shadow:
      0 0 10px rgba(255, 0, 0, 0.5),
      0 0 20px rgba(255, 0, 0, 0.7),
      0 0 30px rgba(255, 0, 0, 0.9),
      0 0 40px rgba(255, 0, 0, 1),
      0 0 50px rgba(255, 0, 0, 0.9),
      0 0 60px rgba(255, 0, 0, 0.7);
    animation: core-pulse 2s infinite;
  }
  
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: #fff;
    overflow: visible;
  }
  
  .neural-web path {
    animation: neural-flicker infinite 10s linear;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core;"></div>
    <svg class="neural-web">
      <path d="M50,0 L0,100 L100,100 Z"></path>
      <path d="M50,0 L0,50 L50,100 L100,50 Z"></path>
      <path d="M50,0 L100,0 L50,100"></path>
    </svg>
    <div class="particle" style="top: 10%; left: 10%;"></div>
    <div class="particle" style="top: 20%; left: 20%;"></div>
    <div class="particle" style="top: 30%; left: 30%;"></div>
    <div class="particle" style="top: 40%; left: 40%;"></div>
    <div class="particle" style="top: 50%; left: 50%;"></div>
    <div class="particle" style="top: 60%; left: 60%;"></div>
    <div class="particle" style="top: 70%; left: 70%;"></div>
    <div class="particle" style="top: 80%; left: 80%;"></div>
    <div class="particle" style="top: 90%; left: 90%;"></div>
  </div>
        </div>
        </body>
        </html>
