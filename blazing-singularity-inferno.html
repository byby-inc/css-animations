<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Singularity Inferno</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% { transform: translate(0, 0); }
    50% { transform: translate(20px, 30px); }
    100% { transform: translate(0, 0); }
  }
  @keyframes core-pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  @keyframes neural-flicker {
    0% { transform: rotate(0deg); }
    50% { transform: rotate(10deg); }
    100% { transform: rotate(0deg); }
  }
  
  .vortex-container {
    position: absolute; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    z-index: -1; 
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: linear-gradient(140deg, #3B5998, #F7DC6F);
  }
  
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: linear-gradient(140deg, #F7DC6F, #3B5998);
    box-shadow:
      0 0 0 0 rgba(0, 255, 255, .2),
      0 0 0 0 rgba(255, 255, 0, .2),
      0 0 0 0 rgba(255, 0, 0, .2),
      0 0 0 0 rgba(0, 0, 255, .2),
      0 0 0 0 rgba(255, 0, 255, .2),
      0 0 0 0 rgba(0, 255, 0, .2);
    animation: core-pulse infinite 2s;
  }
  
  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(140deg, #F7DC6F, #3B5998);
    animation: particle-dance infinite 1.5s;
  }
  
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
  }
  
  .neural-web path {
    stroke-width: 2;
  }
  
  .neural-web path:nth-child(1) {
    stroke-dasharray: 1000, 1000;
  }
  
  .neural-web path:nth-child(2) {
    stroke-dasharray: 500, 500;
  }
  
  .neural-web path:nth-child(3) {
    stroke-dasharray: 200, 200;
  }
  
  @keyframes particle-dance {
    0% { transform: translate(-50px, -50px); }
    50% { transform: translate(50px, 50px); }
    100% { transform: translate(-50px, -50px); }
  }
  
  @keyframes core-pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  
  @keyframes neural-flicker {
    0% { transform: rotate(0deg); }
    50% { transform: rotate(10deg); }
    100% { transform: rotate(0deg); }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 20 20 L 80 80" />
      <path d="M 20 80 L 20 20" />
      <path d="M 80 20 L 20 80" />
    </svg>
    <div class="particle" style="top: 100px; left: 100px;"></div>
    <div class="particle" style="top: 200px; left: 50px;"></div>
    <div class="particle" style="top: 50px; left: 200px;"></div>
    <div class="particle" style="top: 150px; left: 150px;"></div>
    <div class="particle" style="top: 20px; left: 20px;"></div>
  </div>
        </div>
        </body>
        </html>
