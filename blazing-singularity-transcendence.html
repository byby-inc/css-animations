<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Singularity Transcendence</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: translate(-50%, -50%) rotate(0deg);
    }
    50% {
      transform: translate(-50%, -50%) rotate(10deg);
    }
    100% {
      transform: translate(-50%, -50%) rotate(0deg);
    }
  }

  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.1);
    }
    100% {
      transform: scale(1);
    }
  }

  @keyframes neural-flicker {
    0% {
      transform: rotate(0deg) translateX(-50%);
    }
    50% {
      transform: rotate(2deg) translateX(-50%);
    }
    100% {
      transform: rotate(0deg) translateX(-50%);
    }
  }

  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    background-image: linear-gradient(to bottom, #ffff00, #ff0000);
    box-shadow: 0 0 10px #ffff00, 0 0 20px #ff0000, 0 0 30px #ffff00, 0 0 40px #ff0000, 0 0 50px #ffff00, 0 0 60px #ff0000;
    border-radius: 50%;
  }

  .particles {
    position: relative;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    background-image: linear-gradient(to bottom, #ffff00, #ff0000);
  }

  .particle:nth-child(1) {
    top: 20%;
    left: 20%;
    animation: particle-dance 5s infinite;
  }

  .particle:nth-child(2) {
    top: 30%;
    left: 30%;
    animation: particle-dance 4s infinite;
  }

  .particle:nth-child(3) {
    top: 40%;
    left: 40%;
    animation: particle-dance 3s infinite;
  }

  .particle:nth-child(4) {
    top: 50%;
    left: 50%;
    animation: particle-dance 2s infinite;
  }

  .particle:nth-child(5) {
    top: 60%;
    left: 60%;
    animation: particle-dance 7s infinite;
  }

  .particle:nth-child(6) {
    top: 70%;
    left: 70%;
    animation: particle-dance 6s infinite;
  }

  .particle:nth-child(7) {
    top: 80%;
    left: 80%;
    animation: particle-dance 1s infinite;
  }

  .neural-web {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    fill: #fff;
  }

  .neural-web path {
    stroke: #fff;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M-50,100 A 100,100 0 0,1 50,0 A 100,100 0 0,1 150,100" />
      <path d="M100,-50 A 100,100 0 0,1 -50,50 A 100,100 0 0,1 -150,-50" />
      <path d="M50,-150 A 100,100 0 0,1 -150,100 A 100,100 0 0,1 -50,-150" />
    </svg>
    <div class="particles">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>
  </div>
        </div>
        </body>
        </html>
