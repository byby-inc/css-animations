<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Supernova Aurora</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: translate(0, 0);
    }
    50% {
      transform: translate(-20px, 10px);
    }
    100% {
      transform: translate(20px, -10px);
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.2);
    }
    100% {
      transform: scale(1);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: translateY(0);
    }
    20% {
      transform: translateY(-10px);
    }
    50% {
      transform: translateY(10px);
    }
    100% {
      transform: translateY(0);
    }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background-image: linear-gradient(to bottom, #ff33cc, #cc33ff);
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background-image: linear-gradient(to top, #fff, #333);
    box-shadow: 0 0 10px #fff, 0 0 10px #fff, 0 0 10px #fff, 0 0 10px #fff, 0 0 10px #fff, 0 0 10px #fff;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    background-image: linear-gradient(to bottom, #333, #fff);
    animation: particle-dance 3s infinite;
  }
  .particle.p1 {
    top: 0;
    left: 40%;
    animation: particle-dance 2s infinite alternate;
  }
  .particle.p2 {
    top: 20px;
    left: 70%;
    animation: particle-dance 2s infinite alternate;
  }
  .particle.p3 {
    top: 0;
    left: 80%;
    animation: particle-dance 2s infinite alternate;
  }
  .particle.p4 {
    top: 40px;
    left: 20%;
    animation: particle-dance 2s infinite alternate;
  }
  .particle.p5 {
    top: 60px;
    left: 0%;
    animation: particle-dance 2s infinite alternate;
  }
  .particle.p6, .particle.p7, .particle.p8, .particle.p9, .particle.p10 {
    top: 10px;
    left: 30%, 50%, 60%, 70%, 80%;
    animation: particle-dance 3s infinite;
  }
  .particle.p6 {
    animation-delay: 0.5s;
    animation: particle-dance 2.5s infinite;
  }
  .particle.p7 {
    animation-delay: 1s;
    animation: particle-dance 2.5s infinite;
  }
  .particle.p8 {
    animation-delay: 1.5s;
    animation: particle-dance 2.5s infinite;
  }
  .particle.p9 {
    animation-delay: 2s;
    animation: particle-dance 2.5s infinite;
  }
  .particle.p10 {
    animation-delay: 2.5s;
    animation: particle-dance 2.5s infinite;
  }
  @keyframes neural-flicker-svg {
    0% {
      stroke: #fff;
    }
    20% {
      stroke-width: 5px;
    }
    50% {
      stroke-width: 2px;
      stroke: #000;
    }
    100% {
      stroke: #fff;
    }
  }
  .neural-web {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translate(-50%, 0);
    stroke-width: 5;
  }
  .neural-web path {
    stroke: #fff;
    stroke-linecap: round;
    stroke-linejoin: round;
    animation: neural-flicker-svg 2s infinite;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 10 50 A 20 20 0 0 0 50 10 Z" />
      <path d="M 30 70 A 10 10 0 0 0 40 60 Z" />
      <path d="M 60 80 A 20 20 0 0 0 80 90 Z" />
    </svg>
    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>
    <div class="particle p5"></div>
    <div class="particle p6"></div>
    <div class="particle p7"></div>
    <div class="particle p8"></div>
    <div class="particle p9"></div>
    <div class="particle p10"></div>
  </div>
        </div>
        </body>
        </html>
