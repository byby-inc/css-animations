<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Supernova Resonance</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% { transform: translate(0px, 0px) rotate(0deg); }
    50% { transform: translate(100px, 100px) rotate(90deg); }
    100% { transform: translate(0px, 0px) rotate(0deg); }
  }

  @keyframes core-pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.5); }
    100% { transform: scale(1); }
  }

  @keyframes neural-flicker {
    0% { transform: translateY(-50px) rotate(-360deg); }
    50% { transform: translateY(-100px) rotate(0deg); }
    100% { transform: translateY(-50px) rotate(-360deg); }
  }

  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: linear-gradient(to bottom right, #f7d2c4, #fff0f1);
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle at center, #ff99cc, #ff00e6);
    border-radius: 50%;
    box-shadow: 0 0 10px #fff, 0 0 10px #fff, 0 0 10px #fff, 0 0 10px #fff, 0 0 10px #fff, 0 0 10px #fff;
    width: 100px;
    height: 100px;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(to bottom right, #fff0f1, #f7d2c4);
  }

  .neural-web {
    position: absolute;
    fill: #fff;
    stroke: #fff;
  }

  .particle:nth-child(1) {
    animation: particle-dance 1s infinite;
    top: 20%;
    left: 20%;
    transform: translate(0px, 0px) rotate(0deg);
  }

  .particle:nth-child(2) {
    animation: particle-dance 1.5s infinite;
    top: 50%;
    left: 80%;
    transform: translate(100px, 100px) rotate(90deg);
  }

  .particle:nth-child(3) {
    animation: particle-dance 2s infinite;
    top: 80%;
    left: 50%;
    transform: translate(0px, 0px) rotate(0deg);
  }

  .particle:nth-child(4) {
    animation: particle-dance 2.5s infinite;
    top: 20%;
    left: 20%;
    transform: translate(100px, 100px) rotate(90deg);
  }

  .particle:nth-child(5) {
    animation: particle-dance 3s infinite;
    top: 50%;
    left: 80%;
    transform: translate(0px, 0px) rotate(0deg);
  }

  .particle:nth-child(6) {
    animation: particle-dance 3.5s infinite;
    top: 80%;
    left: 50%;
    transform: translate(100px, 100px) rotate(90deg);
  }

  .particle:nth-child(7) {
    animation: particle-dance 4s infinite;
    top: 20%;
    left: 20%;
    transform: translate(0px, 0px) rotate(0deg);
  }

  .particle:nth-child(8) {
    animation: particle-dance 4.5s infinite;
    top: 50%;
    left: 80%;
    transform: translate(100px, 100px) rotate(90deg);
  }

  .particle:nth-child(9) {
    animation: particle-dance 5s infinite;
    top: 80%;
    left: 50%;
    transform: translate(0px, 0px) rotate(0deg);
  }

  .particle:nth-child(10) {
    animation: particle-dance 5.5s infinite;
    top: 20%;
    left: 20%;
    transform: translate(100px, 100px) rotate(90deg);
  }

  .particle {
    animation: particle-dance 1s infinite;
    top: 20%;
    left: 20%;
    transform: translate(0px, 0px) rotate(0deg);
  }

  .core {
    animation: core-pulse 2s infinite;
  }

  .neural-web {
    animation: neural-flicker 4s infinite;
  }

  .neural-web path:nth-child(1) {
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
    animation: neural-flicker 4s infinite;
  }

  .neural-web path:nth-child(2) {
    stroke-dasharray: 100;
    stroke-dashoffset: 0;
    animation: neural-flicker 4s infinite;
  }

  .neural-web path:nth-child(3) {
    stroke-dasharray: 100;
    stroke-dashoffset: 50;
    animation: neural-flicker 4s infinite;
  }

  @keyframes core-pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.5); }
    100% { transform: scale(1); }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web" width="100%" height="100%">
      <path d="M50,50 L100,100 L25,150 Z" />
      <path d="M50,150 L100,100 L75,25 Z" />
      <path d="M100,50 L50,75 L75,125 Z" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
