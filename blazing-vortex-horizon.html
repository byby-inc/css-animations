<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Vortex Horizon</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            .vortex-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  background: linear-gradient(to bottom, #f7d2c4, #ff99cc);
}

.core {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: linear-gradient(to bottom, #ffff99, #ffcccc);
  width: 200px;
  height: 200px;
  border-radius: 50%;
  box-shadow:
    0 0 50px #ffff00,
    0 0 100px #ffff00,
    0 0 150px #ffff00,
    0 0 200px #ffcc00,
    0 0 250px #ffcc00,
    0 0 300px #ff6600;
  animation: core-pulse infinite;
}

@keyframes core-pulse {
  0% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.3);
  }
  100% {
    transform: scale(1);
  }
}

.particle {
  position: absolute;
  border-radius: 50%;
  width: 20px;
  height: 20px;
  background: linear-gradient(to bottom, #ffff00, #ff3300);
  animation: particle-dance infinite;
}

@keyframes particle-dance {
  0% {
    transform: translate(10%, 10%);
  }
  50% {
    transform: translate(50vw, 50vh) rotate(360deg);
  }
  100% {
    transform: translate(10%, 10%);
  }
}

.neural-web {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  fill: #fff;
  display: none;
  animation: neural-flicker infinite;
}

@keyframes neural-flicker {
  0% {
    transform: scale(1) translate(-20%, 0%);
  }
  50% {
    transform: scale(1.2) translate(-15%, 20%);
  }
  100% {
    transform: scale(1) translate(-20%, 0%);
  }
}

.path {
  stroke: #fff;
  stroke-width: 2;
}

.neural-web .path {
  fill: none;
}

.neural-web .path-1 {
  stroke-dasharray: 10, 5, 20, 10;
  stroke-dashoffset: 0;
}

.neural-web .path-2 {
  stroke-dasharray: 10, 5, 10, 5;
  stroke-dashoffset: 20;
}

.neural-web .path-3 {
  stroke-dasharray: 10, 5, 20, 10;
  stroke-dashoffset: 40;
}

div.particles {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

.particles {
  animation: particles-move infinite;
  transform: translate();
}

@keyframes particles-move {
  0% {
    transform: translate(-50%, 0vh);
  }
  100% {
    transform: translate(50%, 500vh);
  }
}

.vortex-container .particle {
  animation-delay: -0.5s;
}

.vortex-container .particle:nth-child(1) {
  top: 0vw;
  left: 5vw;
}

.vortex-container .particle:nth-child(2) {
  top: 40vh;
  left: 50vw;
}

.vortex-container .particle:nth-child(3) {
  top: 5vw;
  left: 70vw;
}

.vortex-container .particle:nth-child(4) {
  top: 30vh;
  left: 3vw;
}

.vortex-container .particle:nth-child(5) {
  top: 80vh;
  left: 50vw;
}

.vortex-container .particle:nth-child(6) {
  top: 80vh;
  left: 90vw;
}

.vortex-container .particle:nth-child(7) {
  top: 25vh;
  left: 35vw;
}

.vortex-container .particle:nth-child(8) {
  top: 20vh;
  left: 60vw;
}

.vortex-container .particle:nth-child(9) {
  top: 40vh;
  left: 40vw;
}

.vortex-container .particle:nth-child(10) {
  top: 50vh;
  left: 90vw;
}
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path class="path-1"/>
      <path class="path-2"/>
      <path class="path-3"/>
    </svg>
    <div class="particles">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>
  </div>
        </div>
        </body>
        </html>
