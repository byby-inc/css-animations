<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Blazing Vortex Symphony</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% { transform: translate(0, 0) rotate(0); }
    100% { transform: translate(-80px, -80px) rotate(720deg); }
  }
  @keyframes core-pulse {
    0% { transform: scale(1); box-shadow: 0px 0px 10px #ff9900; }
    50% { transform: scale(1.1); box-shadow: 0px 0px 20px #ffcc00; }
    100% { transform: scale(1); box-shadow: 0px 0px 10px #ff9900; }
  }
  @keyframes neural-flicker {
    0% { transform: translate(0, 0) rotate(0); }
    100% { transform: translate(-20px, -20px) rotate(360deg); }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(90deg, #1a1a1a 0%, #1a1a1a 50%, #3e3e3e 51%, #3e3e3e 100%);
  }
  .vortex-container::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(90deg, #ff9900 0%, #ffcc00 50%, #ffff00 51%, #ffff00 100%);
    box-shadow: 0px 0px 10px #ff9900, 0px 0px 20px #ffcc00, 0px 0px 30px #ffff00, 0px 0px 40px #ffff00, 0px 0px 50px #ffff00, 0px 0px 60px #ffff00;
    animation: core-pulse 2s infinite;
  }
  .particle {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: linear-gradient(90deg, #ff9900 0%, #ffcc00 50%, #ffff00 51%, #ffff00 100%);
    animation: particle-dance 5s infinite;
  }
  .particle:nth-child(1) { top: 10%; left: 50%; transform: translate(-50%, -50%); animation-delay: 0s; }
  .particle:nth-child(2) { top: 50%; left: 10%; transform: translate(-50%, -50%); animation-delay: 0.5s; }
  .particle:nth-child(3) { top: 90%; left: 50%; transform: translate(-50%, -50%); animation-delay: 1s; }
  .particle:nth-child(4) { top: 50%; left: 90%; transform: translate(-50%, -50%); animation-delay: 1.5s; }
  .particle:nth-child(5) { top: 20%; left: 20%; transform: translate(-50%, -50%); animation-delay: 2s; }
  .particle:nth-child(6) { top: 70%; left: 80%; transform: translate(-50%, -50%); animation-delay: 2.5s; }
  .particle:nth-child(7) { top: 30%; left: 70%; transform: translate(-50%, -50%); animation-delay: 3s; }
  .particle:nth-child(8) { top: 10%; left: 30%; transform: translate(-50%, -50%); animation-delay: 3.5s; }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
  }
  .neural-web path:nth-child(1) {
    d: "M 20 10 L 60 70";
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
    animation: neural-flicker 3s infinite;
  }
  .neural-web path:nth-child(2) {
    d: "M 60 70 L 20 10";
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
    animation: neural-flicker 3s infinite;
  }
  .neural-web path:nth-child(3) {
    d: "M 50 30 L 50 90";
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
    animation: neural-flicker 3s infinite;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 20 10 L 60 70"></path>
      <path d="M 60 70 L 20 10"></path>
      <path d="M 50 30 L 50 90"></path>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </svg>
  </div>
        </div>
        </body>
        </html>
