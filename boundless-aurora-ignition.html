<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Boundless Aurora Ignition</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            /* Global Styles */
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: circle(50% at 50% 50%);
    background: linear-gradient(90deg, #f0ffff 0%, #9acbff 50%, #f5f5f5 100%);
  }
  core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(90deg, #ffffff 0%, #ccffcc 50%, #ffffff 100%);
    box-shadow: 0 0 20px #f5f5f5, 0 0 30px #ffffff, 0 0 40px #ccffcc, 0 0 50px #ffffff, 0 0 60px #ccffcc, 0 0 70px #ffffff;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    background: linear-gradient(90deg, #ffffff 0%, #ccffcc 50%, #ffffff 100%);
  }
  .neural-web {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
  }
  path {
    stroke: #fff;
    stroke-width: 1;
  }
  
  /* Keyframes */
  @keyframes particle-dance {
    0% {
      transform: translate(0, -50%);
    }
    50% {
      transform: translate(20px, -40px);
    }
    100% {
      transform: translate(-20px, -50%);
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    100% {
      transform: scale(1.1);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: rotate(0deg);
    }
    50% {
      transform: rotate(180deg);
    }
    100% {
      transform: rotate(360deg);
    }
  }
  
  /* Animation */
  .particle {
    animation: particle-dance infinite 2s;
    animation-delay: calc((var(--index) * 0.1s));
  }
  .core {
    animation: core-pulse infinite 1s;
  }
  .neural-web {
    animation: neural-flicker infinite 0.5s;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 0 0 L 100 0 L 50 100 Z" />
      <path d="M 0 0 L 200 0 L 300 100 Z" />
      <path d="M 0 0 L 150 0 L 250 200 Z" />
    </svg>
    <div class="particle" style="top: 20%; left: 20%; --index: 1;"></div>
    <div class="particle" style="top: 30%; left: 30%; --index: 2;"></div>
    <div class="particle" style="top: 40%; left: 40%; --index: 3;"></div>
    <div class="particle" style="top: 50%; left: 50%; --index: 4;"></div>
    <div class="particle" style="top: 60%; left: 60%; --index: 5;"></div>
  </div>
        </div>
        </body>
        </html>
