<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Boundless Aurora Singularity</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% { transform: translate(0, 100px) rotate(0deg); }
    50% { transform: translate(-50px, -100px) rotate(180deg); }
    100% { transform: translate(0, 0) rotate(360deg); }
  }

  @keyframes core-pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.5); }
    100% { transform: scale(1); }
  }

  @keyframes neural-flicker {
    0% { transform: translate(0, 0); }
    50% { transform: translate(-20px, -10px); }
    100% { transform: translate(0, 0); }
  }

  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    background-image: linear-gradient(to bottom right, #66d9ef, #66c2d1, #66b0b3);
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background-image: linear-gradient(to bottom right, #33ccff, #66d9ef, #66c2d1);
    box-shadow: 0 0 20px 10px #66d9ef, 0 0 30px 20px #66c2d1, 0 0 40px 30px #66b0b3;
    animation: core-pulse 2s infinite;
  }

  .particle {
    position: absolute;
    background-image: linear-gradient(to bottom right, #33ccff, #66d9ef, #66c2d1);
    width: 10px;
    height: 10px;
    border-radius: 50%;
    animation: particle-dance 5s infinite;
  }

  .particle::before {
    content: "";
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background-image: linear-gradient(to bottom right, #33ccff, #66d9ef, #66c2d1);
    animation: particle-dance 5s infinite;
  }

  .particle::after {
    content: "";
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background-image: linear-gradient(to bottom right, #33ccff, #66d9ef, #66c2d1);
    animation: particle-dance 5s infinite;
  }

  .neural-web {
    position: absolute;
    fill: #fff;
  }

  .neural-web path:nth-child(1) {
    stroke: #fff;
    stroke-width: 2px;
    animation: neural-flicker 4s infinite;
  }

  .neural-web path:nth-child(2) {
    stroke: #fff;
    stroke-width: 3px;
    animation: neural-flicker 6s infinite;
  }

  .neural-web path:nth-child(3) {
    stroke: #fff;
    stroke-width: 4px;
    animation: neural-flicker 8s infinite;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web" viewBox="0 0 100 100">
      <path d="M 50 50 L 90 50 L 90 90 L 50 90 L 10 90 L 10 50 L 50 50" />
      <path d="M 50 50 L 10 50 L 10 90 L 50 90" />
      <path d="M 50 50 L 50 10 L 90 10 L 90 50 L 50 50" />
    </svg>
    <div class="particle" style="top: 20vh; left: 40vw;"></div>
    <div class="particle" style="top: 40vh; left: 60vw;"></div>
    <div class="particle" style="top: 60vh; left: 20vw;"></div>
    <div class="particle" style="top: 80vh; left: 80vw;"></div>
    <div class="particle" style="top: 20vh; left: 10vw;"></div>
  </div>
        </div>
        </body>
        </html>
