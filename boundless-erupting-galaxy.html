<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Boundless Erupting Galaxy</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            .vortex-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  background: linear-gradient(90deg, #333, #444);
}

.core {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  width: 60px;
  height: 60px;
  background: linear-gradient(90deg, #666, #777);
  box-shadow:
    0 0 10px rgba(0, 0, 0, 0.3),
    0 0 20px rgba(0, 0, 0, 0.5),
    0 0 30px rgba(0, 0, 0, 0.7),
    0 0 40px rgba(0, 0, 0, 0.9),
    0 0 50px rgba(0, 0, 0, 1),
    0 0 60px rgba(0, 0, 0, 0.8);
  animation: core-pulse infinite 2s;
}

.core::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  width: 40px;
  height: 40px;
  background: linear-gradient(90deg, #888, #999);
  animation: core-pulse infinite 2s;
  animation-delay: -1s;
}

@keyframes core-pulse {
  0% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.1);
  }
  100% {
    transform: scale(1);
  }
}

.particle {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  width: 20px;
  height: 20px;
  background: linear-gradient(90deg, #333, #444);
  animation: particle-dance infinite 5s;
}

.particle:nth-child(1) {
  top: 40%;
  left: 40%;
  background: linear-gradient(90deg, #555, #666);
  animation-delay: 1s;
}

.particle:nth-child(2) {
  top: 60%;
  left: 20%;
  background: linear-gradient(90deg, #444, #555);
  animation-delay: 2s;
}

.particle:nth-child(3) {
  top: 80%;
  left: 60%;
  background: linear-gradient(90deg, #444, #555);
  animation-delay: 3s;
}

.particle:nth-child(4) {
  top: 20%;
  left: 40%;
  background: linear-gradient(90deg, #666, #777);
  animation-delay: 4s;
}

.particle:nth-child(5) {
  top: 80%;
  left: 20%;
  background: linear-gradient(90deg, #777, #888);
  animation-delay: 5s;
}

.particle:nth-child(6) {
  top: 40%;
  left: 60%;
  background: linear-gradient(90deg, #666, #777);
  animation-delay: 6s;
}

.particle:nth-child(7) {
  top: 60%;
  left: 80%;
  background: linear-gradient(90deg, #555, #666);
  animation-delay: 7s;
}

.particle:nth-child(8) {
  top: 20%;
  left: 20%;
  background: linear-gradient(90deg, #444, #555);
  animation-delay: 8s;
}

@keyframes particle-dance {
  0% {
    transform: translate(-10px, -10px) rotate(0deg);
  }
  50% {
    transform: translate(10px, 10px) rotate(360deg);
  }
  100% {
    transform: translate(-10px, -10px) rotate(0deg);
  }
}

.neural-web {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  fill: none;
  stroke: #fff;
  stroke-width: 1;
  stroke-linecap: round;
  animation: neural-flicker infinite 10s;
}

.path1 {
  stroke-dasharray: 1000;
  stroke-dashoffset: 1000;
  animation: dash infinite 20s;
}

.path2 {
  stroke-dasharray: 1500;
  stroke-dashoffset: 1500;
  animation: dash infinite 30s;
}

.path3 {
  stroke-dasharray: 2000;
  stroke-dashoffset: 2000;
  animation: dash infinite 40s;
}

@keyframes dash {
  0% {
    stroke-dashoffset: 1000;
  }
  50% {
    stroke-dashoffset: -1000;
  }
  100% {
    stroke-dashoffset: 1000;
  }
}

@keyframes neural-flicker {
  0% {
    transform: translate(-5px, -5px);
  }
  50% {
    transform: translate(5px, 5px);
  }
  100% {
    transform: translate(-5px, -5px);
  }
}
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
  <div class="core"></div>
  <svg class="neural-web">
    <path class="path1" d="M 100,100 L 200,100 L 150,150 Z" />
    <path class="path2" d="M 250,50 L 350,150 L 200,200 Z" />
    <path class="path3" d="M 400,200 L 500,50 L 450,100 Z" />
  </svg>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
</div>
        </div>
        </body>
        </html>
