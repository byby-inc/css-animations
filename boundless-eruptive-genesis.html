<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Boundless Eruptive Genesis</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            /* keyframes */
  @keyframes particle-dance {
    0% {
      transform: translateX(0) translateY(0) rotate(0deg);
    }
    50% {
      transform: translateX(20%) translateY(0) rotate(10deg);
    }
    100% {
      transform: translateX(0) translateY(0) rotate(0deg);
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.1);
    }
    100% {
      transform: scale(1);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: rotate(0);
    }
    50% {
      transform: rotate(10deg);
    }
    100% {
      transform: rotate(0);
    }
  }
  /* .vortex-container */
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  }
  /* .core */
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    background-image: linear-gradient(to bottom, #ffff00, #ff0000);
    box-shadow: 0 0 10px #ffff00;
    transition: all 2s ease;
    animation: core-pulse 2s infinite;
  }
  .core::after {
    content: "";
    position: absolute;
    top: -20px;
    left: -20px;
    width: 100px;
    height: 100px;
    background-image: linear-gradient(to bottom, #ffff00, #ff0000);
    box-shadow: 0 0 10px #ffff00;
    animation: core-pulse 2s infinite;
  }
  .core::before {
    content: "";
    position: absolute;
    bottom: -20px;
    right: -20px;
    width: 100px;
    height: 100px;
    background-image: linear-gradient(to bottom, #ffff00, #ff0000);
    box-shadow: 0 0 10px #ffff00;
    animation: core-pulse 2s infinite;
  }
  .core::before::before {
    content: "";
    position: absolute;
    bottom: -40px;
    right: -40px;
    width: 100px;
    height: 100px;
    background-image: linear-gradient(to bottom, #ffff00, #ff0000);
    box-shadow: 0 0 10px #ffff00;
    animation: core-pulse 2s infinite;
  }
  .core::before::before::before {
    content: "";
    position: absolute;
    bottom: -60px;
    right: -60px;
    width: 100px;
    height: 100px;
    background-image: linear-gradient(to bottom, #ffff00, #ff0000);
    box-shadow: 0 0 10px #ffff00;
    animation: core-pulse 2s infinite;
  }
  .core::before::before::before::before {
    content: "";
    position: absolute;
    bottom: -80px;
    right: -80px;
    width: 100px;
    height: 100px;
    background-image: linear-gradient(to bottom, #ffff00, #ff0000);
    box-shadow: 0 0 10px #ffff00;
    animation: core-pulse 2s infinite;
  }
  /* .particle */
  .particle {
    position: absolute;
    border-radius: 50%;
    animation: particle-dance 5s infinite;
  }
  .particle1 {
    top: 20%;
    left: 20%;
    background-image: linear-gradient(to bottom, #ffff00, #ff0000);
  }
  .particle2 {
    top: 10%;
    left: 70%;
    background-image: linear-gradient(to bottom, #ffff00, #ff0000);
  }
  /* .neural-web */
  .neural-web {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    height: 100%;
    fill: #fff;
  }
  .neural-web path {
    stroke: #fff;
    stroke-width: 2;
    stroke-linecap: round;
    animation: neural-flicker 3s infinite;
  }
  .neural-web path:nth-child(1) {
    transform: rotate(0);
    animation-duration: 3s;
  }
  .neural-web path:nth-child(2) {
    transform: rotate(10deg);
    animation-duration: 2.5s;
  }
  .neural-web path:nth-child(3) {
    transform: rotate(20deg);
    animation-duration: 2s;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M300 100 L400 200" />
      <path d="M400 100 L500 200" />
      <path d="M500 100 L600 200" />
    </svg>
    <div class="particle particle1"></div>
    <div class="particle particle2"></div>
    <div class="particle particle3"></div>
    <div class="particle particle4"></div>
    <div class="particle particle5"></div>
    <div class="particle particle6"></div>
    <div class="particle particle7"></div>
  </div>
        </div>
        </body>
        </html>
