<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Boundless Eruptive Quantum Dawn</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: circle(50% at 50% 50%);
    background: linear-gradient(90deg, #2B2B2B, #454545);
  }
  
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(180deg, #8B9467, #3E8E41);
    box-shadow: 
      0 0 20px #8B9467,
      0 0 40px #3E8E41,
      0 0 60px #8B9467,
      0 0 80px #3E8E41,
      0 0 100px #8B9467,
      0 0 120px #3E8E41;
  }
  
  .particle {
    position: absolute;
    border-radius: 50%;
    animation: particle-dance 6s infinite;
  }
  
  .particle.particle-1 {
    top: 30%;
    left: 20%;
    width: 30px;
    height: 30px;
    background: linear-gradient(180deg, #3E8E41, #8B9467);
  }
  
  .particle.particle-2 {
    top: 50%;
    left: 70%;
    width: 20px;
    height: 20px;
    background: linear-gradient(180deg, #8B9467, #3E8E41);
  }
  
  .particle.particle-3 {
    top: 70%;
    left: 50%;
    width: 40px;
    height: 40px;
    background: linear-gradient(180deg, #3E8E41, #8B9467);
  }
  
  .particle.particle-4 {
    top: 20%;
    left: 50%;
    width: 60px;
    height: 60px;
    background: linear-gradient(180deg, #8B9467, #3E8E41);
  }
  
  .particle.particle-5 {
    top: 10%;
    left: 30%;
    width: 10px;
    height: 10px;
    background: linear-gradient(180deg, #3E8E41, #8B9467);
  }
  
  @keyframes particle-dance {
    0% {
      transform: translate(0, 0);
    }
    25% {
      transform: translate(-50px, -50px);
    }
    50% {
      transform: translate(50px, 50px);
    }
    75% {
      transform: translate(-50px, 50px);
    }
    100% {
      transform: translate(50px, -50px);
    }
  }
  
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    20% {
      transform: scale(1.2);
    }
    40% {
      transform: scale(1);
    }
    60% {
      transform: scale(1.2);
    }
    80% {
      transform: scale(1);
    }
    100% {
      transform: scale(1);
    }
  }
  
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: #fff;
    animation: neural-flicker 10s infinite;
  }
  
  .neural-web path {
    stroke: #fff;
  }
  
  .neural-web path:nth-child(1) {
    animation: neural-line-flicker 3s infinite;
  }
  
  .neural-web path:nth-child(2) {
    animation: neural-circle-flicker 5s infinite;
  }
  
  @keyframes neural-flicker {
    0% {
      transform: scale(1) rotate(0deg);
    }
    10% {
      transform: scale(1.1) rotate(10deg);
    }
    20% {
      transform: scale(1) rotate(0deg);
    }
    30% {
      transform: scale(1.1) rotate(10deg);
    }
    40% {
      transform: scale(1) rotate(0deg);
    }
    50% {
      transform: scale(1.1) rotate(10deg);
    }
    60% {
      transform: scale(1) rotate(0deg);
    }
    70% {
      transform: scale(1.1) rotate(10deg);
    }
    80% {
      transform: scale(1) rotate(0deg);
    }
    90% {
      transform: scale(1.1) rotate(10deg);
    }
    100% {
      transform: scale(1) rotate(0deg);
    }
  }
  
  .neural-web path:nth-child(1) {
    animation: neural-line-flicker 3s infinite;
  }
  
  @keyframes neural-line-flicker {
    0% {
      transform: translateX(0%);
    }
    10% {
      transform: translateX(5%);
    }
    20% {
      transform: translateX(0%);
    }
    30% {
      transform: translateX(5%);
    }
    40% {
      transform: translateX(0%);
    }
    50% {
      transform: translateX(5%);
    }
    60% {
      transform: translateX(0%);
    }
    70% {
      transform: translateX(5%);
    }
    80% {
      transform: translateX(0%);
    }
    100% {
      transform: translateX(5%);
    }
  }
  
  .neural-web path:nth-child(2) {
    animation: neural-circle-flicker 5s infinite;
  }
  
  @keyframes neural-circle-flicker {
    0% {
      transform: translateX(0%) translateY(0%);
    }
    10% {
      transform: translateX(5%) translateY(5%);
    }
    20% {
      transform: translateX(0%) translateY(0%);
    }
    30% {
      transform: translateX(5%) translateY(5%);
    }
    40% {
      transform: translateX(0%) translateY(0%);
    }
    50% {
      transform: translateX(5%) translateY(5%);
    }
    60% {
      transform: translateX(0%) translateY(0%);
    }
    70% {
      transform: translateX(5%) translateY(5%);
    }
    80% {
      transform: translateX(0%) translateY(0%);
    }
    90% {
      transform: translateX(5%) translateY(5%);
    }
    100% {
      transform: translateX(0%) translateY(0%);
    }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core">
      <div class="particle particle-1"></div>
      <div class="particle particle-2"></div>
      <div class="particle particle-3"></div>
      <div class="particle particle-4"></div>
      <div class="particle particle-5"></div>
    </div>
    <svg class="neural-web">
      <path d="M 150 150 L 150 0 L 300 150 Z" />
      <path d="M 150 150 L 300 150 L 150 300 Z" />
      <path d="M 150 150 L 0 150 L 150 300 Z" />
    </svg>
  </div>
        </div>
        </body>
        </html>
