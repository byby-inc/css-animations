<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Boundless Plasma Symphony</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% { transform: translate(-50%, -50%) rotate(0deg); }
    25% { transform: translate(-50%, -50%) rotate(180deg); }
    50% { transform: translate(-50%, -50%) rotate(360deg); }
    100% { transform: translate(-50%, -50%) rotate(720deg); }
  }
  @keyframes core-pulse {
    0% { transform: scale(1, 1); }
    50% { transform: scale(1.2, 1.2); }
    100% { transform: scale(1, 1); }
  }
  @keyframes neural-flicker {
    0% { transform: translate(0, 0) rotate(0deg); }
    10% { transform: translate(5%, 5%) rotate(5deg); }
    20% { transform: translate(-5%, -5%) rotate(-5deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }
  
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  }
  
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 20vw;
    height: 20vw;
    background: linear-gradient(to bottom left, #FF69B4, #33CC33);
    box-shadow: 
      10px 10px 20px #FF69B4,
      20px 20px 40px #33CC33,
      -10px -10px 20px #33CC33,
      -20px -20px 40px #33CC33,
      10px -10px 20px #FF69B4,
      20px 10px 40px #FF69B4,
      -30px 10px 60px #33CC33,
      -10px 30px 40px #FF69B4;
    animation: core-pulse infinite 2s;
  }
  
  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(to bottom right, #33CC33, #FF69B4);
    animation: particle-dance infinite 4s;
  }
  
  .particle1 {
    top: 30%;
    left: 40%;
    width: 5vw;
    height: 5vw;
    animation-delay: -1s;
  }
  
  .particle2 {
    top: 20%;
    left: 60%;
    width: 6vw;
    height: 6vw;
  }
  
  .particle3 {
    top: 10%;
    left: 80%;
    width: 7vw;
    height: 7vw;
  }
  
  .neural-web {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    fill: none;
    stroke: #fff;
    stroke-width: 2;
  }
  
  .neural-web path {
    stroke-linecap: round;
  }
  
  .neural-web path:nth-child(1) {
    stroke-width: 3;
    animation: neural-flicker infinite 3s;
  }
  
  .neural-web path:nth-child(2) {
    stroke-width: 2;
    animation: neural-flicker infinite 2s;
  }
  
  .neural-web path:nth-child(3) {
    stroke-width: 1;
    animation: neural-flicker infinite 1s;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 0 0 S 50 50 M 0 50 S 50 0 M 0 100 S 50 150">
      </path>
      <path d="M 0 100 S 150 50 M 100 0 S 150 100">
      </path>
      <path d="M 0 0 S 50 150 M 0 50 S 50 0 M 0 100 S 150 50">
      </path>
    </svg>
    <div class="particle1"></div>
    <div class="particle2"></div>
    <div class="particle3"></div>
    <div class="particle4"></div>
    <div class="particle5"></div>
  </div>
        </div>
        </body>
        </html>
