<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Boundless Primordial Bloom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes core-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }
  @keyframes particle-dance {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(20px, -20px); }
  }
  @keyframes neural-flicker {
    0%', 100% { transform: rotate(0deg); }
    50% { transform: rotate(10deg); }
  }
  .vortex-container {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    clip-path: polygon(25% 0%,75% 0%,100% 25%,50% 100%,0% 25%);
    background: linear-gradient(to bottom, #ff99cc, #ff99cc), 
                radial-gradient(circle at 50% 50%, #ffffc2, #ffffc2);
  }
  .core {
    position: relative;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 50px; height: 50px;
    background: linear-gradient(to bottom, #9999ff, #9999ff);
    box-shadow: 
                 0 0 20px rgba(0, 0, 0, 0.5),
                 0 0 40px rgba(0, 0, 0, 0.7),
                 0 0 60px rgba(0, 0, 0, 0.9),
                 0 0 80px rgba(0, 0, 0, 0.95),
                 0 0 100px rgba(0, 0, 0, 0.99),
                 0 0 120px rgba(0, 0, 0, 0.99);
    animation: core-pulse 1.5s infinite;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
  }
  .particle:nth-child(1) {
    top: 20%; left: 20%;
    width: 20px; height: 20px;
    background: radial-gradient(circle at 50% 50%, #66cccc, #33cc33);
    animation: particle-dance 1.2s infinite;
  }
  .particle:nth-child(2) {
    top: 50%; left: 30%;
    width: 30px; height: 30px;
    background: linear-gradient(to bottom, #ff00ff, #cc00cc);
    animation: particle-dance 1.4s infinite;
  }
  .particle:nth-child(3) {
    top: 20%; left: 50%;
    width: 25px; height: 25px;
    background: radial-gradient(circle at 50% 50%, #66cccc, #33cc33);
    animation: particle-dance 1.5s infinite;
  }
  .particle:nth-child(4) {
    top: 30%; left: 20%;
    width: 18px; height: 18px;
    background: linear-gradient(to bottom, #ff00ff, #cc00cc);
    animation: particle-dance 1.8s infinite;
  }
  .particle:nth-child(5) {
    top: 50%; left: 60%;
    width: 22px; height: 22px;
    background: radial-gradient(circle at 50% 50%, #66cccc, #33cc33);
    animation: particle-dance 1.6s infinite;
  }
  .particle:nth-child(6) {
    top: 70%; left: 80%;
    width: 25px; height: 25px;
    background: linear-gradient(to bottom, #ff00ff, #cc00cc);
    animation: particle-dance 1.9s infinite;
  }
  .particle:nth-child(7) {
    top: 30%; left: 70%;
    width: 30px; height: 30px;
    background: radial-gradient(circle at 50% 50%, #66cccc, #33cc33);
    animation: particle-dance 1.7s infinite;
  }
  .neural-web {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 200px; height: 200px;
    fill: none;
    stroke: #fff;
    animation: neural-flicker 0.5s infinite;
  }
  .neural-web path:nth-child(1) {
    d: M50 50 L100 150 L50 200 L0 150 Z;
  }
  .neural-web path:nth-child(2) {
    d: M75 50 L150 150 L75 200 L25 150 Z;
  }
  .neural-web path:nth-child(3) {
    d: M100 50 L200 150 L100 200 L0 150 Z;
  }
  @keyframes neural-flicker {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(10deg); }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path class="neural-web path" d="M50 50 L100 150 L50 200 L0 150 Z"></path>
      <path class="neural-web path" d="M75 50 L150 150 L75 200 L25 150 Z"></path>
      <path class="neural-web path" d="M100 50 L200 150 L100 200 L0 150 Z"></path>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </svg>
  </div>
        </div>
        </body>
        </html>
