<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Boundless Primordial Genesis</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: translate(0, 100px) rotate(0deg);
    }
    50% {
      transform: translate(-50px, -50px) rotate(180deg);
    }
    100% {
      transform: translate(50px, 0) rotate(0deg);
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.1);
    }
    100% {
      transform: scale(1);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: skew(0deg);
    }
    50% {
      transform: skew(-10deg);
    }
    100% {
      transform: skew(0deg);
    }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: linear-gradient(to bottom, #333, #444);
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    width: 300px;
    height: 300px;
    background: linear-gradient(90deg, #ff99cc, #ff0099);
    box-shadow: 0 0 20px #ff6600, 0 0 20px #ff6600, 0 0 30px #ff0066, 0 0 30px #ff0066, 0 0 10px #ff0099, 0 0 10px #ff0099;
    animation: core-pulse infinite 3s;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(90deg, #ff99cc, #ff0099);
    animation: particle-dance infinite 2s;
  }
  .particle:nth-child(1) {
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(0deg);
    width: 150px;
    height: 150px;
  }
  .particle:nth-child(2) {
    top: 70%;
    left: 30%;
    transform: translate(-50%, -50%) rotate(90deg);
    width: 120px;
    height: 120px;
  }
  .particle:nth-child(3) {
    top: 90%;
    left: 70%;
    transform: translate(-50%, -50%) rotate(180deg);
    width: 90px;
    height: 90px;
  }
  .particle:nth-child(4) {
    top: 50%;
    left: 70%;
    transform: translate(-50%, -50%) rotate(270deg);
    width: 60px;
    height: 60px;
  }
  .particle:nth-child(5) {
    top: 30%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(0deg);
    width: 40px;
    height: 40px;
  }
  .particle:nth-child(6) {
    top: 10%;
    left: 20%;
    transform: translate(-50%, -50%) rotate(45deg);
    width: 30px;
    height: 30px;
  }
  .neural-web {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    height: 100%;
  }
  .neural-web path {
    stroke: #fff;
  }
  .neural-web path:nth-child(1) {
    stroke-dasharray: 200;
    stroke-dashoffset: 0;
  }
  .neural-web path:nth-child(2) {
    stroke-dasharray: 150;
    stroke-dashoffset: 0;
  }
  .neural-web path:nth-child(3) {
    stroke-dasharray: 100;
    stroke-dashoffset: 0;
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.1);
    }
    100% {
      transform: scale(1);
    }
  }
  @keyframes particle-dance {
    0% {
      transform: translate(0, 100px) rotate(0deg);
    }
    50% {
      transform: translate(-50px, -50px) rotate(180deg);
    }
    100% {
      transform: translate(50px, 0) rotate(0deg);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: skew(0deg);
    }
    50% {
      transform: skew(-10deg);
    }
    100% {
      transform: skew(0deg);
    }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 100 100 L 200 100" stroke-dasharray="200" stroke-dashoffset="0"/>
      <path d="M 100 200 L 100 300" stroke-dasharray="150" stroke-dashoffset="0"/>
      <path d="M 200 100 L 300 300" stroke-dasharray="100" stroke-dashoffset="0"/>
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
