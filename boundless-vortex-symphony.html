<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Boundless Vortex Symphony</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: translate(0, 0) rotate(0deg);
    }
    50% {
      transform: translate(10%, 10%) rotate(10deg);
    }
    100% {
      transform: translate(0, 0) rotate(0deg);
    }
  }
  
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.2);
    }
    100% {
      transform: scale(1);
    }
  }
  
  @keyframes neural-flicker {
    0% {
      transform: translate(0, 0) rotate(0deg);
    }
    50% {
      transform: translate(5%, 5%) rotate(5deg);
    }
    100% {
      transform: translate(0, 0) rotate(0deg);
    }
  }
  
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: circle(50% at 50% 50%);
    background-image: linear-gradient(to bottom, #3498db, #1abc9c);
  }
  
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    background-image: linear-gradient(to bottom, #9b59b6, #8e44ad);
    border-radius: 50%;
    box-shadow: 
      0 0 0 2px #2ecc71,
      0 0 10px 5px #2ecc71,
      0 0 20px 5px #2ecc71,
      0 0 30px 5px #2ecc71,
      0 0 40px 5px #2ecc71,
      0 0 40px 10px #16a085;
    animation: core-pulse 3s infinite;
  }
  
  .particle {
    position: absolute;
    border-radius: 50%;
    width: 10px;
    height: 10px;
    background-image: linear-gradient(to bottom, #f1c40f, #f39c12);
    animation: particle-dance 2s infinite;
  }
  
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  
  .neural-web path {
    stroke: #fff;
    stroke-width: 2px;
  }
  
  .neural-web path:nth-child(1) {
    animation: neural-flicker 5s infinite;
  }
  
  .neural-web path:nth-child(2) {
    animation: neural-flicker 2s infinite;
  }
  
  .neural-web path:nth-child(3) {
    animation: neural-flicker 1s infinite;
  }
  
  @keyframes particle-dance {
    0% {
      transform: translate(-50px, -50px) rotate(0deg);
    }
    50% {
      transform: translate(-30px, -30px) rotate(10deg);
    }
    100% {
      transform: translate(-50px, -50px) rotate(0deg);
    }
  }
  
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.5);
    }
    100% {
      transform: scale(1);
    }
  }
  
  @keyframes neural-flicker {
    0% {
      transform: translate(0, 0) rotate(0deg);
    }
    50% {
      transform: translate(15%, 15%) rotate(5deg);
    }
    100% {
      transform: translate(0, 0) rotate(0deg);
    }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 0 0 L 100 100 L 200 0 Z"></path>
      <path d="M 0 100 L 100 0 L 200 100 Z"></path>
      <path d="M 100 0 L 200 100 L 0 200 Z"></path>
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
