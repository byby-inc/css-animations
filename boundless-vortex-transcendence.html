<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Boundless Vortex Transcendence</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: linear-gradient(90deg, #34A8FF 0%, #8B9467 100%);
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    box-shadow:
      0 0 20px #66CCCC,
      0 0 30px #33CCFF,
      0 0 40px #00FFFF,
      0 0 50px #66CCCC,
      0 0 60px #33CCFF,
      0 0 70px #00FFFF;
    animation: core-pulse 5s infinite;
  }

  @keyframes core-pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.5); }
    100% { transform: scale(1); }
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    background: linear-gradient(90deg, #8B9467 0%, #34A8FF 100%);
    animation: particle-dance 2s infinite;
  }

  @keyframes particle-dance {
    0% { transform: translate(0, 0) rotate(0deg); }
    20% { transform: translate(-20px, 0) rotate(45deg); }
    50% { transform: translate(20px, 0) rotate(90deg); }
    80% { transform: translate(0, 20px) rotate(135deg); }
    100% { transform: translate(0, 0) rotate(180deg); }
  }

  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: #fff;
  }

  .neural-web path {
    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;
    animation: neural-flicker 4s infinite;
  }

  @keyframes neural-flicker {
    0% { stroke-dashoffset: 1000; }
    50% { stroke-dashoffset: 500; }
    100% { stroke-dashoffset: 1000; }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core">
      <svg class="neural-web">
        <path d="M 50 50 L 100 150 L 150 50 Z" />
        <path d="M 50 50 L 120 150 L 190 50 Z" />
        <path d="M 50 50 L 170 150 L 230 50 Z" />
        <circle cx="50" cy="50" r="20" />
        <circle cx="100" cy="100" r="15" />
        <circle cx="150" cy="150" r="10" />
      </svg>
      <div class="particle" style="top: 10px; left: 10px"></div>
      <div class="particle" style="top: 50px; left: 50px"></div>
      <div class="particle" style="top: 90px; left: 90px"></div>
      <div class="particle" style="top: 20px; left: 120px"></div>
      <div class="particle" style="top: 70px; left: 130px"></div>
      <div class="particle" style="top: 40px; left: 140px"></div>
    </div>
  </div>
        </div>
        </body>
        </html>
