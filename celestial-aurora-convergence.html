<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Celestial Aurora Convergence</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            /* define all 3 keyframes */
  @keyframes particle-dance {
    0% {
      transform: rotateZ(0) translateX(0) translateY(0);
    }
    50% {
      transform: rotateZ(360deg) translateX(50%) translateY(-50%);
    }
    100% {
      transform: rotateZ(0) translateX(0) translateY(0);
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.1);
    }
    100% {
      transform: scale(1);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: scale(1) translateX(0);
    }
    50% {
      transform: scale(0.9) translateX(-20px);
    }
    100% {
      transform: scale(1) translateX(0);
    }
  }
  /* .vortex-container styles */
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  }
  /* .core styles */
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    background-image: linear-gradient(to bottom, #33ccff, #66ffff);
    background-image: linear-gradient(to top, #ff99cc, #ffccff);
    box-shadow: 0 0 10px 0 #333, 0 0 20px 0 #333, 0 0 30px 0 #333, 0 0 40px 0 #333, 0 0 50px 0 #333, 0 0 60px 0 #333;
    border-radius: 50%;
    animation: core-pulse 2s infinite;
  }
  /* .particle styles */
  .particle {
    position: absolute;
    border-radius: 50%;
    background-image: linear-gradient(to bottom, #33ccff, #66ffff);
    animation: particle-dance 3s infinite;
  }
  /* .neural-web styles */
  .neural-web {
    position: absolute;
    fill: none;
    stroke-width: 2px;
    stroke: #fff;
  }
  /* .neural-web path styles */
  .neural-web path {
    opacity: 0.5;
    animation: neural-flicker 4s infinite;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web" viewBox="0 0 100 100">
      <path d="M 50 10 C 35 5 20 45 100 95 S 90 55 50 30 Z" />
      <path d="M 75 90 C 60 65 50 90 40 10 S 60 20 90 0 Z" />
      <path d="M 30 40 C 55 80 90 30 60 60 S 70 30 40 50 Z" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
