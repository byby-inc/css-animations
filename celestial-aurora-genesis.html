<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Celestial Aurora Genesis</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: translate(0, 0) rotate(0deg);
    }
    25% {
      transform: translate(-20px, -15px) rotate(20deg);
    }
    50% {
      transform: translate(15px, -10px) rotate(45deg);
    }
    75% {
      transform: translate(-12px, -18px) rotate(60deg);
    }
    100% {
      transform: translate(20px, -22px) rotate(90deg);
    }
  }

  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.1);
    }
    100% {
      transform: scale(1);
    }
  }

  @keyframes neural-flicker {
    0% {
      transform: rotate(0deg);
    }
    25% {
      transform: rotate(10deg);
    }
    50% {
      transform: rotate(0deg);
    }
    75% {
      transform: rotate(-10deg);
    }
    100% {
      transform: rotate(0deg);
    }
  }

  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  }

  .vortex-container::before {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(-45deg, #fff 25%, #000 50%, #fff 75%);
    content: '';
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    box-shadow: 0 0 10px 0 #fff, 0 0 20px 0 #fff, 0 0 30px 0 #fff, 0 0 40px 0 #fff, 0 0 50px 0 #fff, 0 0 60px 0 #fff;
    background: linear-gradient(90deg, #fff 25%, #000 50%, #fff 75%), linear-gradient(360deg, #fff 25%, #000 50%, #fff 75%);
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(120deg, #fff 25%, #000 50%, #fff 75%);
  }

  .particle:nth-child(1) {
    top: 10%;
    left: 10%;
    width: 50px;
    height: 50px;
    animation: particle-dance 2s infinite;
  }

  .particle:nth-child(2) {
    top: 20%;
    left: 60%;
    width: 40px;
    height: 40px;
    animation: particle-dance 3s infinite;
  }

  .particle:nth-child(3) {
    top: 40%;
    left: 40%;
    width: 60px;
    height: 60px;
    animation: particle-dance 4s infinite;
  }

  .particle:nth-child(4) {
    top: 50%;
    left: 20%;
    width: 70px;
    height: 70px;
    animation: particle-dance 5s infinite;
  }

  .particle:nth-child(5) {
    top: 60%;
    left: 30%;
    width: 80px;
    height: 80px;
    animation: particle-dance 6s infinite;
  }

  .particle:nth-child(6) {
    top: 70%;
    left: 40%;
    width: 90px;
    height: 90px;
    animation: particle-dance 7s infinite;
  }

  .particle:nth-child(7) {
    top: 10%;
    left: 50%;
    width: 20px;
    height: 20px;
    animation: particle-dance 8s infinite;
  }

  .particle:nth-child(8) {
    top: 50%;
    left: 70%;
    width: 30px;
    height: 30px;
    animation: particle-dance 9s infinite;
  }

  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }

  .neural-web path {
    stroke: #fff;
    stroke-width: 2px;
  }

  .neural-web path:nth-child(1) {
    d: M 25, 40 L 75, 0 L 50, 50;
  }

  .neural-web path:nth-child(2) {
    d: M 20, 60 L 80, 60 L 75, 90;
  }

  .neural-web path:nth-child(3) {
    d: M 15, 70 L 85, 70 L 75, 110;
  }

  .neural-web path:nth-child(4) {
    d: M 5, 80 L 95, 80 L 75, 120;
  }

  .core {
    animation: core-pulse 3s infinite;
  }

  .particle {
    animation-duration: 2s, 3s, 4s, 5s, 6s, 7s, 8s, 9s;
  }

  .neural-web {
    animation: neural-flicker 10s infinite;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path class="neural-node"></path>
      <path class="neural-node"></path>
      <path class="neural-node"></path>
      <path class="neural-node"></path>
      <path class="neural-node"></path>
      <path class="neural-node"></path>
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
