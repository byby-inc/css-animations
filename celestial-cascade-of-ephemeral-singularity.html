<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Celestial Cascade of Ephemeral Singularity</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes core-pulse { 
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  @keyframes particle-dance { 
    0% { transform: translate(0, 0) rotate(0deg); }
    100% { transform: translate(50px, 50px) rotate(360deg); }
  }
  @keyframes neural-flicker { 
    0% { transform: translate(0, 0); }
    50% { transform: translate(10px, -10px); }
    100% { transform: translate(0, 0); }
  }
  @keyframes particle-dance-2 { /* secondary particles dance */
    0% { transform: translate(0, 0) rotate(0deg); }
    100% { transform: translate(-50px, -50px) rotate(-360deg); }
  }
  @keyframes particle-dance-3 { /* tertiary particles dance */
    0% { transform: translate(0, 0) rotate(0deg); }
    100% { transform: translate(70px, 70px) rotate(720deg); }
  }

  /* Core styles */
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(45deg, #ff69b4, #ff99cc);
    box-shadow: 0 0 0 0px rgba(255, 105, 180, 0.5);
    box-shadow: 0 0 10px 5px #ff69b4;
    box-shadow: 0 0 20px 15px rgba(255, 105, 180, 0.5);
    box-shadow: 0 0 30px 25px #ff99cc;
    box-shadow: 0 0 40px 35px rgba(255, 149, 204, 0.5);
    animation: core-pulse 5s infinite;
  }

  /* Particle styles */
  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(135deg, #33ccff, #66ffff);
    transform: translate(-50%, -50%);
    animation: particle-dance 7s infinite;
  }
  .particle:hover {
    animation: particle-dance-2 7s infinite;
  }
  .particle:active {
    animation: particle-dance-3 7s infinite;
  }

  /* Neural web styles */
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
    stroke-width: 2;
  }
  .neural-web path {
    animation: neural-flicker 3s infinite;
  }

  /* Vortex container styles */
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  }
  @media (max-width: 768px) {
    .vortex-container {
      clip-path: circle(50% at 50% 50%);
    }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 0 50 C 25 25, 75 25, 100 50" />
      <path d="M 0 50 C 25 75, 75 75, 100 50" />
      <path d="M 50 0 C 25 25, 75 25, 50 50" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
