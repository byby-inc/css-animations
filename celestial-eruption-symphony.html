<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Celestial Eruption Symphony</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {transform: translate(0px, 0px) rotate(0deg);}
    50% {transform: translate(-50px, 50px) rotate(180deg);}
    100% {transform: translate(-100px, -100px) rotate(360deg);}
  }
  
  @keyframes core-pulse {
    0% {transform: scale(1);}
    50% {transform: scale(2);}
    100% {transform: scale(1);}
  }
  
  @keyframes neural-flicker {
    0% {transform: translate(-50px, -50px);}
    50% {transform: translate(-100px, -100px) rotate(45deg);}
    100% {transform: translate(50px, 50px) rotate(90deg);}
  }
  
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background-image: linear-gradient(180deg, #f7d2c4, #c9c4b4);
  }
  
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    height: 200px;
    background-image: linear-gradient(#f7d2c4, #c9c4b4),
      linear-gradient(45deg, #ff99cc, #cc33ff);
    box-shadow: 0 0 10px #ffffff, 0 0 15px #ffffff, 0 0 20px #ffffff, 0 0 25px #ffffff,
      0 0 30px #ffffff, 0 0 35px #ffffff;
    animation: core-pulse infinite 10s ease-in-out;
  }
  
  .particle {
    position: absolute;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    background-image: linear-gradient(#ff99cc, #cc33ff);
    animation: particle-dance infinite 5s ease-in-out;
  }
  
  .particle:nth-child(1) {top: 50%; left: 50%; transform: translate(-50%, -50%);}
  .particle:nth-child(2) {top: 20%; left: 20%; animation-duration: 8s;}
  .particle:nth-child(3) {top: 80%; left: 80%; animation-duration: 6s;}
  .particle:nth-child(4) {top: 10%; left: 90%; animation-duration: 9s;}
  .particle:nth-child(5) {top: 30%; left: 10%; animation-duration: 7s;}
  .particle:nth-child(6) {top: 70%; left: 60%; animation-duration: 4s;}
  .particle:nth-child(7) {top: 90%; left: 20%; animation-duration: 12s;}
  .particle:nth-child(8) {top: 60%; left: 80%; animation-duration: 11s;}
  .particle:nth-child(9) {top: 40%; left: 40%; animation-duration: 10s;}
  .particle:nth-child(10) {top: 25%; left: 25%; animation-duration: 14s;}
  
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #ffffff;
    stroke-width: 5;
  }
  
  .neural-web path {
    animation: neural-flicker infinite 2s ease-in-out;
  }
  
  .neural-web path:nth-child(1) {d: M 0 0 L 20 20;}
  .neural-web path:nth-child(2) {d: M 20 20 L 0 40;}
  .neural-web path:nth-child(3) {d: M 20 20 L 40 0;}
  .neural-web path:nth-child(4) {d: M 20 40 L 60 20;}
  .neural-web path:nth-child(5) {d: M 40 40 L 80 60;}
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 0 0 L 20 20"></path>
      <path d="M 20 20 L 0 40"></path>
      <path d="M 20 20 L 40 0"></path>
      <path d="M 20 40 L 60 20"></path>
      <path d="M 40 40 L 80 60"></path>
      <path d="M 60 20 L 0 60"></path>
      <path d="M 20 60 L 40 80"></path>
      <path d="M 40 80 L 60 40"></path>
      <path d="M 60 80 L 20 20"></path>
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
