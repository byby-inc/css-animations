<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Celestial Harmonic Maelstrom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes core-pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }

  @keyframes particle-dance {
    0% { transform: rotate(0deg) translate(0, 0); }
    50% { transform: rotate(360deg) translate(50px, 100px); }
    100% { transform: rotate(0deg) translate(0, 0); }
  }

  @keyframes neural-flicker {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }

  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: linear-gradient(to bottom, #6495ed, #3b5998);
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(to bottom, #6495ed, #3b5998);
    box-shadow:
      0px 0px 100px #6495ed,
      0px 0px 150px #6495ed,
      0px 0px 200px #6495ed,
      0px 0px 250px #6495ed,
      0px 0px 300px #6495ed,
      0px 0px 350px #6495ed;
    animation: core-pulse infinite 5s;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(to bottom, #6495ed, #3b5998);
    animation: particle-dance infinite 10s;
  }

  .particle:nth-child(1) {
    top: 20%;
    left: 20%;
    width: 40px;
    height: 40px;
  }

  .particle:nth-child(2) {
    top: 80%;
    left: 80%;
    width: 30px;
    height: 30px;
  }

  .particle:nth-child(3) {
    top: 40%;
    left: 60%;
    width: 50px;
    height: 50px;
  }

  .particle:nth-child(4) {
    top: 10%;
    left: 90%;
    width: 20px;
    height: 20px;
  }

  .particle:nth-child(5) {
    top: 70%;
    left: 10%;
    width: 60px;
    height: 60px;
  }

  .particle:nth-child(6) {
    top: 30%;
    left: 50%;
    width: 80px;
    height: 80px;
  }

  .particle:nth-child(7) {
    top: 90%;
    left: 70%;
    width: 40px;
    height: 40px;
  }

  .particle:nth-child(8) {
    top: 50%;
    left: 20%;
    width: 70px;
    height: 70px;
  }

  .particle:nth-child(9) {
    top: 60%;
    left: 80%;
    width: 90px;
    height: 90px;
  }

  .particle:nth-child(10) {
    top: 80%;
    left: 40%;
    width: 110px;
    height: 110px;
  }

  .neural-web {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    height: 90%;
    fill: none;
    stroke: #fff;
    stroke-width: 2;
    animation: neural-flicker infinite 7s;
  }

  .neural-web path {
    stroke: #fff;
  }

  .neural-web path:nth-child(1) {
    d: M 40% 40%, C 60%, 60% 20%, 80% 80%, 40% 40%;
  }

  .neural-web path:nth-child(2) {
    d: M 60% 70%, C 40%, 60% 90%, 20% 40%, 60% 70%;
  }

  .neural-web path:nth-child(3) {
    d: M 80% 50%, C 20%, 60% 10%, 40% 80%, 80% 50%;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 40% 40%, C 60%, 60% 20%, 80% 40% 40%"/>
      <path d="M 60% 70%, C 40%, 60% 90% 20%, 60% 70%"/>
      <path d="M 80% 50%, C 20%, 60% 10% 40%, 80% 50%"/>
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
