<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Celestial Harmony Pulse</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

            /* Code snippet container */
            .codigo {
            position: absolute;
            top: 15%;
            left: 40%;
            scale: 1.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background:url("/gold_snippet") no-repeat center center;
            color: white;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 45px;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.9);
            text-align: center;
            border-radius: 12px;
            line-height: 1.6;
            max-height: 25%;
            max-width: 75%;
            width: 75%;
            height: 25%;
            overflow-y: hidden;
            border: 6px solid;
            border-image: linear-gradient(
                135deg,
                #D4AF37 0%,
                #F9E79F 15%,
                #B8860B 30%,
                #CFB53B 45%,
                #E6C35C 60%,
                #B8860B 75%,
                #D4AF37 90%,
                #C9A961 100%
            ) 1;
            box-shadow: 
                inset 0 2px 4px rgba(212, 175, 55, 0.3),
                inset 0 -2px 4px rgba(139, 101, 8, 0.4),
                0 4px 12px rgba(184, 134, 11, 0.5),
                0 8px 25px rgba(0, 0, 0, 0.6);
            }

            /* Animation container */
            .animation-container {
           position: absolute;
            top: 90%;
            left: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            .vortex-container {
  position: absolute;
  width: 100%;
  height: 100%;
  clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  background: linear-gradient(to bottom right, #ff69b4, #33ccff);
}

.core {
  position: absolute;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: linear-gradient(to bottom right, #ff9900, #ffff00);
  animation: core-pulse 2s infinite;
}

.particle {
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: linear-gradient(to bottom right, #ff69b4, #33ccff);
  animation: particle-dance 5s infinite;
}

.neural-web {
  position: absolute;
  width: 100%;
  height: 100%;
}

@keyframes particle-dance {
  0% {
    transform: translate(0, 0);
  }
  50% {
    transform: translate(100px, 100px);
  }
  100% {
    transform: translate(0, 0);
  }
}

@keyframes core-pulse {
  0% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.2);
  }
  100% {
    transform: scale(1);
  }
}

@keyframes neural-flicker {
  0% {
    opacity: 1;
  }
  50% {
    opacity: 0.5;
  }
  100% {
    opacity: 1;
  }
}
        </style>
        </head>
        <body>
        <div class="codigo">
            <div>.core { background: linear-gradient(to bottom right, #ff9900, #ffff00); }</div>
        </div>
        <div class="animation-container">
            <div class="vortex-container">
  <div class="core"></div>
  <div class="particle" style="top: 10%; left: 10%; animation-delay: 0.2s;"></div>
  <div class="particle" style="top: 20%; left: 20%; animation-delay: 0.4s;"></div>
  <div class="particle" style="top: 30%; left: 30%; animation-delay: 0.6s;"></div>
  <div class="particle" style="top: 40%; left: 40%; animation-delay: 0.8s;"></div>
  <div class="particle" style="top: 50%; left: 50%; animation-delay: 1s;"></div>
  <div class="particle" style="top: 60%; left: 60%; animation-delay: 1.2s;"></div>
  <div class="particle" style="top: 70%; left: 70%; animation-delay: 1.4s;"></div>
  <div class="particle" style="top: 80%; left: 80%; animation-delay: 1.6s;"></div>
  <div class="particle" style="top: 90%; left: 90%; animation-delay: 1.8s;"></div>
  <svg class="neural-web">
    <path d="M 10 10 C 20 20, 40 20, 50 10" stroke="white" stroke-width="2" fill="none" stroke-dasharray="10 10" animation="neural-flicker 2s infinite">
  </svg>
</div>
        </div>
        </body>
        </html>
