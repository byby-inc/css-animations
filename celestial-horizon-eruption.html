<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Celestial Horizon Eruption</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: linear-gradient(to bottom, #3e3e3e, #f0f0f0);
    animation: vortex-fade infinite;
  }
  @keyframes vortex-fade {
    0% {opacity: 1;}
    20% {opacity: 0.2;}
    40% {opacity: 1;}
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(#fff, #aaa, #666, #333);
    width: 200px;
    height: 200px;
    border-radius: 50%;
    box-shadow:
      0 0 10px #333,
      0 0 20px #333,
      0 0 30px #333,
      0 0 40px #333,
      0 0 50px #333,
      0 0 60px #333;
    animation: core-pulse 10s infinite;
  }
  @keyframes core-pulse {
    0% {transform: scale(1);}
    25% {transform: scale(1.1);}
    50% {transform: scale(1);}
    75% {transform: scale(1.1);}
    100% {transform: scale(1);}
  }
  .particle {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -75%);
    background: linear-gradient(to bottom, #fff, #aaa);
    border-radius: 50%;
    width: 50px;
    height: 50px;
    animation: particle-dance 2s infinite;
  }
  @keyframes particle-dance {
    0% {transform: translate(-25%, -75%) rotate(0deg);}
    20% {transform: translate(-25%, -75%) rotate(45deg);}
    40% {transform: translate(-25%, -75%) rotate(0deg);}
    60% {transform: translate(-25%, -85%) rotate(10deg);}
    80% {transform: translate(-25%, -75%) rotate(0deg);}
    100% {transform: translate(-25%, -75%) rotate(0deg);}
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  .neural-web path {
    stroke: #fff;
    stroke-width: 0.5;
  }
  .neural-web path:nth-child(1) {
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
  }
  .neural-web path:nth-child(2) {
    stroke-dasharray: 150;
    stroke-dashoffset: 150;
  }
  @keyframes neural-flicker {
    0% {transform: scale(1);}
    5% {transform: scale(1.1);}
    10% {transform: scale(1);}
    15% {transform: scale(1.05);}
    50% {transform: scale(0.9);}
    55% {transform: scale(1);
      animation-play-state: paused;
    }
    60% {transform: scale(1.1);}
    100% {transform: scale(1);}
  }
  .neural-web path:nth-child(1) {
    animation: neural-flicker 5s infinite;
  }
  .neural-web path:nth-child(2) {
    animation: neural-flicker 3s infinite;
  }
  .neural-web path:nth-child(3) {
    animation: neural-flicker 2s infinite;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 50 50 L 100 100 L 50 150 Z" />
      <path d="M 100 50 L 150 100 L 100 150 L 50 100 Z" />
      <path d="M 150 50 L 100 150 L 200 100 Z" />
      <path d="M 200 50 L 100 150 L 150 100 Z" />
      <path d="M 50 150 L 100 200 L 50 250 Z" />
      <path d="M 100 150 L 150 250 L 150 200 Z" />
      <path d="M 50 250 L 100 300 L 50 350 Z" />
      <path d="M 100 250 L 150 350 L 150 300 Z" />
      <path d="M 50 50 L 100 100 L 50 150 L 25 100 Z" />
      <path d="M 100 150 L 150 250 L 150 100 Z" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
