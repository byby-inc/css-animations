<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Celestial Inferno Genesis</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% { transform: scale(1) translate(0px, 0px); }
    50% { transform: scale(1.1) translate(-10px, 10px); }
    100% { transform: scale(1) translate(0px, 0px); }
  }
  
  @keyframes core-pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  
  @keyframes neural-flicker {
    0% { transform: translate(0px, 0px); }
    25% { transform: translate(5px, -5px); }
    50% { transform: translate(0px, 0px); }
    75% { transform: translate(-5px, 5px); }
    100% { transform: translate(0px, 0px); }
  }

  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%,75% 0%,100% 25%,50% 100%,0% 25%);
    background: radial-gradient(#ff69b4, #333);
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: linear-gradient(to bottom, #fff, #fff),
                linear-gradient(to right, #fff, #fff);
    box-shadow: 
      0 0 10px #ff69b4,
      0 0 20px #ff69b4,
      0 0 30px #ff69b4,
      0 0 40px #ff69b4,
      0 0 50px #ff69b4,
      0 0 60px #ff69b4;
    animation: core-pulse 2s infinite;
  }

  .particle {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: linear-gradient(to bottom, #ff69b4, #ff69b4);
    animation: particle-dance 1.5s infinite;
  }

  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
  }
  
  .neural-web path {
    stroke-width: 2;
  }
  
  .neural-web path:nth-child(1) {
    stroke-dasharray: 100, 100;
    stroke-dashoffset: 100;
    animation: neural-flicker 3s infinite;
  }
  
  .neural-web path:nth-child(2) {
    stroke-dasharray: 100, 100;
    stroke-dashoffset: 0;
    animation: neural-flicker 3s infinite;
  }
  
  .neural-web path:nth-child(3) {
    stroke-dasharray: 100, 100;
    stroke-dashoffset: 200;
    animation: neural-flicker 3s infinite;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 0, 0 L 50, 50 L 0, 50 L 0, 0" />
      <path d="M 0, 0 L 20, 20 L 0, 20 L 0, 0" />
      <path d="M 0, 0 L 40, 40 L 0, 40 L 0, 0" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
