<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Celestial Maelstrom Symphony</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            /* keyframes */
  @keyframes particle-dance {
    0% { transform: rotate(0deg) translate(50%, 50%); }
    100% { transform: rotate(360deg) translate(50%, 50%); }
  }

  @keyframes core-pulse {
    0% { transform: scale(1); }
    100% { transform: scale(1.5); }
  }

  @keyframes neural-flicker {
    0% { transform: translate(-5%, -5%); }
    100% { transform: translate(5%, 5%); }
  }

  /* container styles */
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: linear-gradient(90deg, #3f0f4e, #f0f0f0);
  }

  /* core styles */
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    background: linear-gradient(90deg, #4f7fcd, #cd2d7c);
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
    box-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
    box-shadow: 0 0 40px rgba(255, 255, 255, 0.5);
    box-shadow: 0 0 50px rgba(255, 255, 255, 0.5);
    box-shadow: 0 0 60px rgba(255, 255, 255, 0.5);
    box-shadow: 0 0 70px rgba(255, 255, 255, 0.5);
    animation: core-pulse infinite 2s;
  }

  /* particle styles */
  .particle {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: linear-gradient(90deg, #f0f0f0, #3f0f4e);
    animation: particle-dance infinite 3s;
  }

  /* neural-web styles */
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
  }

  .neural-web path {
    stroke-width: 2px;
  }

  /* animations */
  .particle {
    animation-delay: -1s;
  }

  .particle:nth-child(1) {
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .particle:nth-child(2) {
    top: 40%;
    left: 60%;
  }

  .particle:nth-child(3) {
    top: 60%;
    left: 40%;
  }

  .particle:nth-child(4) {
    top: 30%;
    left: 70%;
  }

  .particle:nth-child(5) {
    top: 80%;
    left: 30%;
  }

  .particle:nth-child(6) {
    top: 10%;
    left: 20%;
  }

  .particle:nth-child(7) {
    top: 20%;
    left: 80%;
  }

  .particle:nth-child(8) {
    top: 70%;
    left: 10%;
  }

  .particle:nth-child(9) {
    top: 90%;
    left: 50%;
  }

  .neural-web {
    animation: neural-flicker infinite 5s;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M50 50 L100 50 L100 100 L50 100 L50 50 Z"/>
      <path d="M75 75 L120 75 L120 150 L75 150 L75 75 Z"/>
      <path d="M30 30 L80 30 L80 60 L30 60 L30 30 Z"/>
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
