<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Celestial Plasma Maelstrom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            .vortex-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  clip-path: circle(50% at 50% 50%);
  background: linear-gradient(135deg, #3f0f9e, #0f8bf9, #0f8bf9);
  background-size: 300% 300%;
  animation: vortex-rotate 25s linear infinite;
}

.core {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background: linear-gradient(90deg, #f7d2c4, #fff0f9);
  box-shadow:
    0 0 10px #ff00ff,
    0 0 20px #ff00ff,
    0 0 30px #ff00ff,
    0 0 40px #ff00ff,
    0 0 50px #ff00ff,
    0 0 60px #ff00ff;
  animation: core-pulse 2s ease-in-out infinite;
}

.particle {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: linear-gradient(90deg, #f7d2c4, #fff0f9);
  box-shadow:
    0 0 5px #ff00ff,
    0 0 10px #ff00ff,
    0 0 15px #ff00ff;
  animation: particle-dance 5s linear infinite;
}

.neural-web {
  position: absolute;
  width: 100%;
  height: 100%;
  fill: none;
  stroke: #fff;
  stroke-width: 2px;
}

.neural-web path {
  stroke-dasharray: 100;
  stroke-dashoffset: 100;
  animation: neural-flicker 10s ease-in-out infinite;
}

@keyframes particle-dance {
  0% {
    transform: translate(-50%, -50%) rotate(0deg);
  }
  50% {
    transform: translate(-50%, -50%) rotate(360deg);
  }
  100% {
    transform: translate(-50%, -50%) rotate(720deg);
  }
}

@keyframes core-pulse {
  0% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.2);
  }
  100% {
    transform: scale(1);
  }
}

@keyframes neural-flicker {
  0% {
    stroke-dashoffset: 100;
  }
  50% {
    stroke-dashoffset: 50;
  }
  100% {
    stroke-dashoffset: 100;
  }
}

@keyframes vortex-rotate {
  0% {
    background-position: 0% 0%;
  }
  100% {
    background-position: 300% 300%;
  }
}
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web" viewBox="0 0 100 100">
      <path d="M50,0 A50,50 0 1, 1 100,0 L100,100"></path>
      <path d="M 75,25 A25,25 0 0, 0 90,25"></path>
      <path d="M 25,25 A25,25 0 1, 0 0,25"></path>
    </svg>
    <div class="particle" style="top: 10%; left: 30%;"></div>
    <div class="particle" style="top: 35%; left: 40%;"></div>
    <div class="particle" style="top: 50%; left: 20%;"></div>
    <div class="particle" style="top: 60%; left: 45%;"></div>
    <div class="particle" style="top: 70%; left: 25%;"></div>
    <div class="particle" style="top: 85%; left: 50%;"></div>
  </div>
        </div>
        </body>
        </html>
