<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Celestial Quantum Maelstrom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            .vortex-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  clip-path: polygon(25% 0%,75% 0%,100% 25%,50% 100%,0% 25%);
  background: linear-gradient(45deg, #14163c, #0a0816);
}

.core {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: linear-gradient(45deg, #45a0e6, #2a53be);
  box-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #fff, 0 0 40px #fff, 0 0 50px #fff, 0 0 60px #fff;
  animation: core-pulse infinite 5s;
}

.particle {
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: linear-gradient(45deg, #a2d2ff, #56b3fa);
  animation: particle-dance infinite 3s;
}

.neural-web {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  animation: neural-flicker infinite 7s;
}

.neural-web path {
  stroke: #fff;
  stroke-width: 2;
}

@keyframes particle-dance {
  0% {
    transform: translate(0, 0) rotate(0deg);
  }
  50% {
    transform: translate(100px, 100px) rotate(180deg);
  }
  100% {
    transform: translate(0, 0) rotate(360deg);
  }
}

@keyframes core-pulse {
  0% {
    transform: translate(-50%, -50%) scale(1);
  }
  50% {
    transform: translate(-50%, -50%) scale(1.2);
  }
  100% {
    transform: translate(-50%, -50%) scale(1);
  }
}

@keyframes neural-flicker {
  0% {
    transform: scale(1) rotate(0deg);
  }
  50% {
    transform: scale(1.1) rotate(180deg);
  }
  100% {
    transform: scale(1) rotate(360deg);
  }
}
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
  <div class="core"></div>
  <svg class="neural-web">
    <path d="M100,200 C150,300 250,300 300,200" />
    <path d="M200,100 C250,200 350,200 400,100" />
    <path d="M50,300 C150,200 250,200 300,300" />
  </svg>
  <div class="particle" style="top: 10%; left: 10%;"></div>
  <div class="particle" style="top: 20%; left: 20%;"></div>
  <div class="particle" style="top: 30%; left: 30%;"></div>
  <div class="particle" style="top: 40%; left: 40%;"></div>
  <div class="particle" style="top: 50%; left: 50%;"></div>
  <div class="particle" style="top: 60%; left: 60%;"></div>
  <div class="particle" style="top: 70%; left: 70%;"></div>
  <div class="particle" style="top: 80%; left: 80%;"></div>
  <div class="particle" style="top: 90%; left: 90%;"></div>
</div>
        </div>
        </body>
        </html>
