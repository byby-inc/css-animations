<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Celestial Singularity Convergence</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            /* Keyframes */
  @keyframes particle-dance {
    0% {
      transform: translate(-150px, -150px) rotate(0deg);
    }
    50% {
      transform: translate(0px, 0px) rotate(360deg);
    }
    100% {
      transform: translate(150px, 150px) rotate(0deg);
    }
  }

  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    100% {
      transform: scale(1.2);
    }
  }

  @keyframes neural-flicker {
    0% {
      transform: rotate(0deg) translate(-20px, -20px);
    }
    50% {
      transform: rotate(360deg) translate(20px, 20px);
    }
    100% {
      transform: rotate(0deg) translate(-20px, -20px);
    }
  }

  /* Styles */
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: linear-gradient(90deg, #330066, #6600cc);
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    background: linear-gradient(90deg, #ff99cc, #ffcccc);
    box-shadow:
      0 0 10px #ff99cc,
      0 0 10px #ff99cc,
      0 0 10px #ff99cc,
      0 0 10px #ff99cc,
      0 0 10px #ff99cc,
      0 0 10px #ff99cc;
    animation: core-pulse 3s infinite;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    background: linear-gradient(90deg, #ffff00, #cccc00);
    animation: particle-dance 2s infinite;
  }

  .neural-web {
    position: absolute;
    fill: none;
    stroke: #fff;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .neural-web path {
    stroke-dasharray: 600;
    animation: neural-flicker 5s infinite;
  }

  .vortex-container .particle {
    animation-delay: 1s;
  }

  .vortex-container .particle:nth-child(2) {
    animation-delay: 2s;
  }

  .vortex-container .particle:nth-child(3) {
    animation-delay: 3s;
  }

  .vortex-container .particle:nth-child(4) {
    animation-delay: 4s;
  }

  .vortex-container .particle:nth-child(5) {
    animation-delay: 5s;
  }

  .vortex-container .particle:nth-child(6) {
    animation-delay: 6s;
  }

  .vortex-container .particle:nth-child(7) {
    animation-delay: 7s;
  }

  .vortex-container .particle:nth-child(8) {
    animation-delay: 8s;
  }

  .vortex-container .particle:nth-child(9) {
    animation-delay: 9s;
  }

  .vortex-container .particle:nth-child(10) {
    animation-delay: 10s;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web" viewBox="0 0 100 100">
      <path d="M50 0 L0 0 L25 25 Z" />
      <path d="M50 0 L0 0 L50 50 Z" />
      <path d="M50 50 L50 25 L50 0 Z" />
      <path d="M0 0 L50 0 L0 50 Z" />
      <path d="M50 0 L100 0 L50 50 Z" />
      <path d="M0 50 L50 50 L0 0 Z" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
