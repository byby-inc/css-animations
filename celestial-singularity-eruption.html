<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Celestial Singularity Eruption</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: translate(0px, 0px) rotate(0deg);
      opacity: 1;
    }
    20% {
      transform: translate(20px, -20px) rotate(45deg);
      opacity: 0.8;
    }
    40% {
      transform: translate(-20px, 20px) rotate(90deg);
      opacity: 0.6;
    }
    60% {
      transform: translate(20px, 20px) rotate(135deg);
      opacity: 0.4;
    }
    80% {
      transform: translate(-20px, -20px) rotate(180deg);
      opacity: 0.2;
    }
    100% {
      transform: translate(0px, 0px) rotate(0deg);
      opacity: 1;
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    20% {
      transform: scale(1.1);
    }
    40% {
      transform: scale(1);
    }
    60% {
      transform: scale(1.05);
    }
    80% {
      transform: scale(1);
    }
    100% {
      transform: scale(1);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: translate(0px, 0px) scale(1);
    }
    20% {
      transform: translate(10px, 0px) scale(1.2);
    }
    40% {
      transform: translate(-10px, 0px) scale(1);
    }
    60% {
      transform: translate(10px, 0px) scale(1.1);
    }
    80% {
      transform: translate(-10px, 0px) scale(1);
    }
    100% {
      transform: translate(0px, 0px) scale(1);
    }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: linear-gradient(180deg, #0ff 30%, #0f0 60%, #ff0 90%);
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    background: linear-gradient(0deg, #ff0 0%, #0f0 100%);
    box-shadow: 0 0 10px #0f0, 0 0 20px #0ff, 0 0 30px #00f;
    box-shadow: 0 0 10px #00f, 0 0 20px #0f0, 0 0 30px #ff0;
    box-shadow: 0 0 10px #0ff, 0 0 20px #ff0, 0 0 30px #00f;
    box-shadow: 0 0 10px #ff0, 0 0 20px #00f, 0 0 30px #0ff;
    box-shadow: 0 0 10px #00f, 0 0 20px #0ff, 0 0 30px #ff0;
    animation: core-pulse infinite 2s;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(0deg, #ff0 0%, #0f0 100%);
    animation: particle-dance infinite 4s;
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    20% {
      transform: scale(1.1);
    }
    40% {
      transform: scale(1);
    }
    60% {
      transform: scale(1.05);
    }
    80% {
      transform: scale(1);
    }
    100% {
      transform: scale(1);
    }
  }
  @keyframes particle-dance {
    0% {
      transform: translate(0px, 0px) rotate(0deg);
      opacity: 1;
    }
    20% {
      transform: translate(20px, -20px) rotate(45deg);
      opacity: 0.8;
    }
    40% {
      transform: translate(-20px, 20px) rotate(90deg);
      opacity: 0.6;
    }
    60% {
      transform: translate(20px, 20px) rotate(135deg);
      opacity: 0.4;
    }
    80% {
      transform: translate(-20px, -20px) rotate(180deg);
      opacity: 0.2;
    }
    100% {
      transform: translate(0px, 0px) rotate(0deg);
      opacity: 1;
    }
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
  }
  .neural-web path {
    stroke-width: 5;
    stroke-linecap: round;
  }
  @keyframes neural-flicker {
    0% {
      transform: translate(0px, 0px) scale(1);
    }
    20% {
      transform: translate(10px, 0px) scale(1.2);
    }
    40% {
      transform: translate(-10px, 0px) scale(1);
    }
    60% {
      transform: translate(10px, 0px) scale(1.1);
    }
    80% {
      transform: translate(-10px, 0px) scale(1);
    }
    100% {
      transform: translate(0px, 0px) scale(1);
    }
  }
  #path1 {
    animation: neural-flicker infinite 3s;
  }
  #path2 {
    animation: neural-flicker infinite 4s;
  }
  #path3 {
    animation: neural-flicker infinite 5s;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path id="path1" d="M 100 100 L 400 100 L 450 300 L 150 300 L 100 100" />
      <path id="path2" d="M 200 200 L 600 200 L 650 400 L 250 400 L 200 200" />
      <path id="path3" d="M 300 300 L 700 300 L 750 500 L 350 500 L 300 300" />
    </svg>
    <div class="particle" style="top: 50px; left: 50px;"></div>
    <div class="particle" style="top: 200px; left: 200px;"></div>
    <div class="particle" style="top: 350px; left: 350px;"></div>
    <div class="particle" style="top: 50px; left: 400px;"></div>
    <div class="particle" style="top: 200px; left: 500px;"></div>
  </div>
        </div>
        </body>
        </html>
