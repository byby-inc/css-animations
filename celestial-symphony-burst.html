<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Celestial Symphony Burst</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            body {
    margin: 0;
    background-color: #000;
  }
  
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: linear-gradient(to bottom, #fff, #f7dc6f, #f7dc6f);
  }
  
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(to bottom, #fff, #f7dc6f, #f7dc6f);
    box-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #fff, 0 0 40px #fff, 0 0 50px #fff, 0 0 60px #fff;
  }
  
  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(to bottom, #fff, #f7dc6f, #f7dc6f);
  }
  
  .particle:nth-child(1) {
    width: 20px;
    height: 20px;
    top: 30%;
    left: 20%;
    animation: particle-dance 10s infinite;
  }
  
  .particle:nth-child(2) {
    width: 25px;
    height: 25px;
    top: 20%;
    left: 40%;
    animation: particle-dance 8s infinite;
  }
  
  .particle:nth-child(3) {
    width: 30px;
    height: 30px;
    top: 10%;
    left: 30%;
    animation: particle-dance 6s infinite;
  }
  
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    100% {
      transform: scale(1.2);
    }
  }
  
  @keyframes particle-dance {
    0% {
      transform: translate(-20px, 0) rotate(0deg);
    }
    50% {
      transform: translate(20px, 20px) rotate(360deg);
    }
    100% {
      transform: translate(-20px, 0) rotate(0deg);
    }
  }
  
  @keyframes neural-flicker {
    0% {
      transform: translateX(0px) rotate(0deg);
    }
    50% {
      transform: translateX(50px) rotate(180deg);
    }
    100% {
      transform: translateX(0px) rotate(0deg);
    }
  }
  
  .neural-web {
    position: absolute;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
    stroke-width: 2px;
  }
  
  .neural-web path {
    stroke: #fff;
  }
  
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    100% {
      transform: scale(1.2);
    }
  }
  
  @keyframes particle-dance {
    0% {
      transform: translate(-20px, 0) rotate(0deg);
    }
    50% {
      transform: translate(20px, 20px) rotate(360deg);
    }
    100% {
      transform: translate(-20px, 0) rotate(0deg);
    }
  }
  
  @keyframes neural-flicker {
    0% {
      transform: translateX(0px) rotate(0deg);
    }
    50% {
      transform: translateX(50px) rotate(180deg);
    }
    100% {
      transform: translateX(0px) rotate(0deg);
    }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core">
      <div class="particle">
        <svg class="neural-web">
          <path d="M20,10A10,10 0 1,0 10,20A10,10 0 1,0 20,10Z M20,30A10,10 0 1,0 10,40A10,10 0 1,0 20,30Z M20,50A10,10 0 1,0 10,60A10,10 0 1,0 20,50Z"
          </path>
          <path d="M 50, 10 A 10, 10 0 1 0 40, 20 A 10, 10 0 1 0 50, 10Z M 50, 30 A 10, 10 0 1 0 40, 40 A 10, 10 0 1 0 50, 30Z M50,60 A 10, 10 0 1 0 40, 70 A 10, 10 0 1 0 50, 60Z"
          </path>
          <path d="M 80, 10 A 10, 10 0 1 0 70, 20 A 10, 10 0 1 0 80, 10Z M 80, 30 A 10, 10 0 1 0 70, 40 A 10, 10 0 1 0 80, 30Z M80, 50 A 10, 10 0 1 0 70, 60 A 10, 10 0 1 0 80, 50Z"
          </path>
        </svg>
        <div class="particle">
          <div class="particle">
            <div class="particle"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
        </div>
        </body>
        </html>
