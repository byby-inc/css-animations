<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Celestial Symphony Genesis</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            /* Keyframes for animations */
  @keyframes core-pulse {
    0% { transform: scale(1); }
    20% { transform: scale(1.1); }
    40% { transform: scale(0.9); }
    60% { transform: scale(1.1); }
    80% { transform: scale(0.9); }
    100% { transform: scale(1); }
  }

  @keyframes particle-dance {
    0% { transform: rotate(0deg) translateX(100px); }
    20% { transform: rotate(20deg) translateX(120px); }
    40% { transform: rotate(40deg) translateX(80px); }
    60% { transform: rotate(60deg) translateX(100px); }
    80% { transform: rotate(80deg) translateX(80px); }
    100% { transform: rotate(0deg) translateX(100px); }
  }

  @keyframes neural-flicker {
    0% { transform: scale(1) rotate(0deg); }
    20% { transform: scale(1.1) rotate(10deg); }
    40% { transform: scale(1) rotate(0deg); }
    60% { transform: scale(0.9) rotate(-10deg); }
    80% { transform: scale(1.1) rotate(10deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  /* Global styles */
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    background-image: linear-gradient(to bottom, #3B82F6, #6D84CB);
    clip-path: circle(50% at 50% 50%);
  }

  /* Core styles */
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    background-image: linear-gradient(to bottom, #F7D2C4, #FF99CC);
    border-radius: 50%;
    box-shadow:
      0 0 10px rgba(255, 255, 255, 0.5),
      0 0 20px rgba(255, 255, 255, 0.3),
      0 0 30px rgba(255, 255, 255, 0.2),
      0 0 40px rgba(255, 255, 255, 0.1),
      0 0 50px rgba(255, 255, 255, 0.05),
      0 0 60px rgba(255, 255, 255, 0.015);
    animation: core-pulse 3s infinite;
  }

  /* Particle styles */
  .particle {
    position: absolute;
    border-radius: 50%;
    animation: particle-dance 2s infinite;
  }

  /* SVG styles */
  .neural-web {
    position: absolute;
    fill: none;
    stroke: #fff;
    stroke-width: 2px;
  }

  .neural-web path {
    strokeOpacity: 0.5;
  }

  /* Animation styles */
  .particle {
    animation: particle-dance 2s infinite;
  }
  .neural-web path {
    animation: neural-flicker 4s infinite;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core">
      <svg class="neural-web">
        <path d="M 50 50 L 120 120 L 240 240 Z" />
        <path d="M 80 160 L 60 100 L 120 180 Z" />
        <path d="M 200 200 L 180 220 L 140 240 Z" />
      </svg>
    </div>
    <div class="particle" style="top: 100px; left: 200px;"></div>
    <div class="particle" style="top: 200px; left: 300px;"></div>
    <div class="particle" style="top: 100px; left: 400px;"></div>
  </div>
        </div>
        </body>
        </html>
