<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Celestial Vortex Odyssey</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
        0% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(50px, 50px) rotate(180deg); }
        100% { transform: translate(0, 0) rotate(0deg); }
    }

    @keyframes core-pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.2); }
        100% { transform: scale(1); }
    }

    @keyframes neural-flicker {
        0% { transform: skewX(0deg); }
        25% { transform: skewX(10deg); }
        50% { transform: skewX(0deg); }
        75% { transform: skewX(-10deg); }
        100% { transform: skewX(0deg); }
    }

    body {
        margin: 0;
        overflow: hidden;
    }

    .vortex-container {
        absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
        background: linear-gradient(180deg, #1f2a35 0, #000 100%);
    }

    .core {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: linear-gradient(180deg, #2e4053 0, #14192b 100%);
        width: 200px;
        height: 200px;
        box-shadow:
        0 0 100px rgba(255, 255, 255, 0.1),
        0 0 150px rgba(255, 255, 255, 0.2),
        0 0 100px rgba(255, 255, 255, 0.3),
        0 0 75px rgba(255, 255, 255, 0.4),
        0 0 50px rgba(255, 255, 255, 0.5);
    }

    .particle {
        absolute;
        border-radius: 50%;
        background: linear-gradient(180deg, #1f2a35 0, #000 100%);
        width: 50px;
        height: 50px;
    }

    .neural-web {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        fill: none;
        stroke: #fff;
    }

    .neural-web path {
        stroke-width: 50px;
        fill-rule: evenodd;
    }

    .particle.particle-1 { top: 0px; left: 0px; animation: particle-dance 5s infinite; }
    .particle.particle-2 { top: 100px; left: 50px; animation: particle-dance 8s infinite; }
    .particle.particle-3 { top: 70px; left: 30px; animation: particle-dance 7s infinite; }
    @for $i from 1 to 10 {
        .particle.particle-#{$i+4} { top: random(100px); left: random(100px); animation: particle-dance #{$i*2}s infinite; }
    }

    .core {
        animation: core-pulse 3s infinite;
    }

    .neural-web {
        animation: neural-flicker 1s infinite;
    }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
        <div class="core"></div>
        <svg class="neural-web">
        <path d="M 0 0 Q 50 50 100 0" fill="none" stroke="#fff"/>
        <path d="M 0 100 Q 50 0 100 100" fill="none" stroke="#fff" />
        <path d="M 50 0 Q 0 100 50 100" fill="none" stroke="#fff" />
    </svg>
    <div class="particle particle-1"></div>
    <div class="particle particle-2"></div>
    <div class="particle particle-3"></div>
    @for $i from 5 to 1 {
        <div class="particle particle-#{$i+4}"></div>
    }
        </div>
        </body>
        </html>
