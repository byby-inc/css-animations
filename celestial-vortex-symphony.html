<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Celestial Vortex Symphony</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%,75% 0%,100% 25%,50% 100%,0% 25%);
    background-image: linear-gradient(90deg, #2E4053 0%, #455A64 100%);
    animation: core-pulse infinite 10s;
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background-image: linear-gradient(180deg, #66CCCC 0%, #55AAAA 100%);
    box-shadow: 0 0 0 5px #66CCCC;
    box-shadow: 0 0 0 10px #55AAAA;
    box-shadow: 0 0 0 15px #66CCCC;
    box-shadow: 0 0 0 20px #55AAAA;
    box-shadow: 0 0 0 25px #66CCCC;
    box-shadow: 0 0 0 30px #55AAAA;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    animation: particle-dance infinite 8s;
  }
  @keyframes particle-dance {
    0% {
      transform: translate(-50%, -50%) rotate(0deg);
    }
    100% {
      transform: translate(-50%, -50%) rotate(360deg);
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.1);
    }
    100% {
      transform: scale(1);
    }
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
    stroke-width: 2px;
  }
  @keyframes neural-flicker {
    0% {
      transform: scale(1) rotate(0deg);
    }
    50% {
      transform: scale(1.05) rotate(5deg);
    }
    100% {
      transform: scale(1) rotate(0deg);
    }
  }
  .neural-web path {
    transition: stroke-dashoffset 2s infinite;
  }
  .neural-web path:nth-child(1) {
    stroke-dasharray: 200, 200;
    stroke-dashoffset: 200;
  }
  .neural-web path:nth-child(2) {
    stroke-dasharray: 300, 300;
    stroke-dashoffset: 300;
  }
  .neural-web path:nth-child(3) {
    stroke-dasharray: 400, 400;
    stroke-dashoffset: 400;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <path d="M 40, 30 A 20 20 0 0 1 0, 50 L 30, 60" />
      <path d="M 30, 0 A 15 15 0 0 1 0, 20 L 10, 40" />
      <path d="M 70, 60 A 15 15 0 0 1 80, 50 L 90, 10" />
    </svg>
    <div class="particle" style="top: 20%; left: 10%; border-radius: 20px;"></div>
    <div class="particle" style="top: 10%; left: 50%; border-radius: 40px;"></div>
    <div class="particle" style="top: 50%; left: 90%; border-radius: 60px;"></div>
    <div class="particle" style="top: 80%; left: 10%; border-radius: 80px;"></div>
    <div class="particle" style="top: 90%; left: 50%; border-radius: 100px;"></div>
  </div>
        </div>
        </body>
        </html>
