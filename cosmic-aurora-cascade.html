<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Cosmic Aurora Cascade</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

            /* Code snippet container */
            .codigo {
            position: absolute;
            top:15%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background:url("/gold_snippet") no-repeat center center;
            color: white;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 45px;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.9);
            text-align: center;
            border-radius: 12px;
            line-height: 1.6;
            max-height: 25%;
            max-width: 75%;
            width: 75%;
            height: 25%;
            overflow-y: hidden;
            border: 6px solid;
            border-image: linear-gradient(
                135deg,
                #D4AF37 0%,
                #F9E79F 15%,
                #B8860B 30%,
                #CFB53B 45%,
                #E6C35C 60%,
                #B8860B 75%,
                #D4AF37 90%,
                #C9A961 100%
            ) 1;
            box-shadow: 
                inset 0 2px 4px rgba(212, 175, 55, 0.3),
                inset 0 -2px 4px rgba(139, 101, 8, 0.4),
                0 4px 12px rgba(184, 134, 11, 0.5),
                0 8px 25px rgba(0, 0, 0, 0.6);
            }

            /* Animation container */
            .animation-container {
            position: absolute;
            top:70%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            .vortex-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  clip-path: circle(50% at 50% 50%);
  background: linear-gradient(to bottom right, #03055B, #4B0148);
}

.core {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: linear-gradient(to bottom right, #4B0148, #7A288A);
  box-shadow: 0 0 10px #7A288A, 0 0 20px #7A288A, 0 0 30px #7A288A, 0 0 40px #7A288A, 0 0 50px #7A288A, 0 0 60px #7A288A;
  animation: core-pulse infinite 5s;
}

.particle {
  position: absolute;
  border-radius: 50%;
  background: linear-gradient(to bottom right, #7A288A, #03055B);
  animation: particle-dance infinite;
}

.neural-web {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  animation: neural-flicker infinite 10s;
}

.neural-web path {
  stroke: #fff;
  stroke-width: 2;
}

@keyframes core-pulse {
  0% {
    transform: translate(-50%, -50%) scale(1);
  }
  50% {
    transform: translate(-50%, -50%) scale(1.2);
  }
  100% {
    transform: translate(-50%, -50%) scale(1);
  }
}

@keyframes particle-dance {
  0% {
    transform: translate(0, 0) rotate(0deg);
  }
  50% {
    transform: translate(100px, 100px) rotate(180deg);
  }
  100% {
    transform: translate(0, 0) rotate(360deg);
  }
}

@keyframes neural-flicker {
  0% {
    transform: scale(1) rotate(0deg);
  }
  50% {
    transform: scale(1.1) rotate(180deg);
  }
  100% {
    transform: scale(1) rotate(360deg);
  }
}
        </style>
        </head>
        <body>
        <div class="codigo">
            <div>.vortex-container { clip-path: circle(50% at 50% 50%); }</div>
        </div>
        <div class="animation-container">
            <div class="vortex-container">
  <div class="core"></div>
  <svg class="neural-web">
    <path d="M100,200 C200,300 300,200 400,300" />
    <path d="M400,100 C300,200 200,100 100,200" />
    <path d="M200,300 C300,400 400,300 500,400" />
  </svg>
  <div class="particle" style="width: 20px; height: 20px; top: 10%; left: 10%; animation-duration: 3s;"></div>
  <div class="particle" style="width: 30px; height: 30px; top: 20%; left: 20%; animation-duration: 6s;"></div>
  <div class="particle" style="width: 40px; height: 40px; top: 30%; left: 30%; animation-duration: 9s;"></div>
  <div class="particle" style="width: 50px; height: 50px; top: 40%; left: 40%; animation-duration: 12s;"></div>
  <div class="particle" style="width: 60px; height: 60px; top: 50%; left: 50%; animation-duration: 15s;"></div>
  <div class="particle" style="width: 70px; height: 70px; top: 60%; left: 60%; animation-duration: 18s;"></div>
  <div class="particle" style="width: 80px; height: 80px; top: 70%; left: 70%; animation-duration: 21s;"></div>
  <div class="particle" style="width: 90px; height: 90px; top: 80%; left: 80%; animation-duration: 24s;"></div>
  <div class="particle" style="width: 100px; height: 100px; top: 90%; left: 90%; animation-duration: 27s;"></div>
</div>
        </div>
        </body>
        </html>
