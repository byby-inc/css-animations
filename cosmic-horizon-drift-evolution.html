<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Cosmic Horizon Drift Evolution</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

            /* Code snippet container */
            .codigo {
            position: absolute;
            top:15%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background:url("/gold_snippet") no-repeat center center;
            color: white;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 45px;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.9);
            text-align: center;
            border-radius: 12px;
            line-height: 1.6;
            max-height: 25%;
            max-width: 75%;
            width: 75%;
            height: 25%;
            overflow-y: hidden;
            border: 6px solid;
            border-image: linear-gradient(
                135deg,
                #D4AF37 0%,
                #F9E79F 15%,
                #B8860B 30%,
                #CFB53B 45%,
                #E6C35C 60%,
                #B8860B 75%,
                #D4AF37 90%,
                #C9A961 100%
            ) 1;
            box-shadow: 
                inset 0 2px 4px rgba(212, 175, 55, 0.3),
                inset 0 -2px 4px rgba(139, 101, 8, 0.4),
                0 4px 12px rgba(184, 134, 11, 0.5),
                0 8px 25px rgba(0, 0, 0, 0.6);
            }

            /* Animation container */
            .animation-container {
            position: absolute;
            top:70%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: rotate(0deg) translateX(0);
    }
    50% {
      transform: rotate(180deg) translateX(20px);
    }
    100% {
      transform: rotate(360deg) translateX(0);
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.2);
    }
    100% {
      transform: scale(1);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: rotate(0deg) scale(1);
    }
    50% {
      transform: rotate(90deg) scale(1.1);
    }
    100% {
      transform: rotate(0deg) scale(1);
    }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%,75% 0%,100% 25%,50% 100%,0% 25%);
    background: linear-gradient(to bottom, #1a1d23, #0e1318);
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(to bottom, #39c3ff, #178acc);
    box-shadow: 
      0 0 10px #39c3ff,
      0 0 20px #178acc,
      0 0 30px #135bae,
      0 0 40px #0e5bae,
      0 0 50px #0a4c97,
      0 0 60px #05448f;
    animation: core-pulse 4s infinite;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(to bottom, #66ccff, #3399ff);
    animation: particle-dance 3s infinite;
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
    animation: neural-flicker 5s infinite;
  }
  .particle:nth-child(1) {
    top: 10%;
    left: 20%;
    width: 20px;
    height: 20px;
    animation-duration: 3s;
  }
  .particle:nth-child(2) {
    top: 30%;
    left: 50%;
    width: 30px;
    height: 30px;
    animation-duration: 4s;
  }
  .particle:nth-child(3) {
    top: 50%;
    left: 30%;
    width: 15px;
    height: 15px;
    animation-duration: 2s;
  }
  .particle:nth-child(4) {
    top: 70%;
    left: 40%;
    width: 25px;
    height: 25px;
    animation-duration: 6s;
  }
  .particle:nth-child(5) {
    top: 20%;
    left: 60%;
    width: 10px;
    height: 10px;
    animation-duration: 5s;
  }
        </style>
        </head>
        <body>
        <div class="codigo">
            <div>.vortex-container { clip-path: polygon(25% 0%,75% 0%,100% 25%,50% 100%,0% 25%); }</div>
        </div>
        <div class="animation-container">
            <div class="vortex-container">
  <div class="core"></div>
  <svg class="neural-web" viewBox="0 0 100 100">
    <path d="M10,10 L90,90" stroke-width="2"></path>
    <path d="M90,10 L10,90" stroke-width="2"></path>
    <path d="M50,10 L50,90" stroke-width="2"></path>
  </svg>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
</div>
        </div>
        </body>
        </html>
