<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Cosmic Horizon Symmetry</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

            /* Code snippet container */
            .codigo {
            position: absolute;
            top: 15%;
            left: 40%;
            scale: 1.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background:url("/gold_snippet") no-repeat center center;
            color: white;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 45px;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.9);
            text-align: center;
            border-radius: 12px;
            line-height: 1.6;
            max-height: 25%;
            max-width: 75%;
            width: 75%;
            height: 25%;
            overflow-y: hidden;
            border: 6px solid;
            border-image: linear-gradient(
                135deg,
                #D4AF37 0%,
                #F9E79F 15%,
                #B8860B 30%,
                #CFB53B 45%,
                #E6C35C 60%,
                #B8860B 75%,
                #D4AF37 90%,
                #C9A961 100%
            ) 1;
            box-shadow: 
                inset 0 2px 4px rgba(212, 175, 55, 0.3),
                inset 0 -2px 4px rgba(139, 101, 8, 0.4),
                0 4px 12px rgba(184, 134, 11, 0.5),
                0 8px 25px rgba(0, 0, 0, 0.6);
            }

            /* Animation container */
            .animation-container {
           position: absolute;
            top: 90%;
            left: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: rotate(0deg);
    }
    100% {
      transform: rotate(360deg);
    }
  }
  @keyframes core-pulse {
    0% {
      opacity: 0.5;
    }
    50% {
      opacity: 1;
    }
    100% {
      opacity: 0.5;
    }
  }
  @keyframes neural-flicker {
    0% {
      stroke-opacity: 0.5;
    }
    50% {
      stroke-opacity: 1;
    }
    100% {
      stroke-opacity: 0.5;
    }
  }
  .vortex-container {
    position: absolute;
    width: 100%;
    height: 100%;
    clip-path: polygon(50% 0%,80% 20%,95% 50%,80% 80%,50% 100%,20% 80%,5% 50%,20% 20%);
    background: linear-gradient(45deg, #ff69b4, #ffe66d, #8bc34a);
  }
  .core {
    position: absolute;
    width: 50px;
    height: 50px;
    background: linear-gradient(45deg, #ff9900, #ff3300);
    border-radius: 50%;
    animation: core-pulse 2s infinite;
  }
  .particle {
    position: absolute;
    width: 10px;
    height: 10px;
    background: linear-gradient(45deg, #33ccff, #66ffff);
    border-radius: 50%;
    animation: particle-dance 5s infinite;
  }
        </style>
        </head>
        <body>
        <div class="codigo">
            <div>.vortex-container { clip-path: circle(50% at 50% 50%); }</div>
        </div>
        <div class="animation-container">
            <div class="vortex-container">
    <svg width="100%" height="100%">
      <path d="M 50 50 L 100 50" stroke="#fff" stroke-width="2" stroke-dasharray="10 10" stroke-dashoffset="0" animation="neural-flicker 2s infinite"/>
      <path d="M 50 50 L 50 100" stroke="#fff" stroke-width="2" stroke-dasharray="10 10" stroke-dashoffset="0" animation="neural-flicker 2s infinite"/>
      <path d="M 50 50 L 0 50" stroke="#fff" stroke-width="2" stroke-dasharray="10 10" stroke-dashoffset="0" animation="neural-flicker 2s infinite"/>
      <path d="M 50 50 L 50 0" stroke="#fff" stroke-width="2" stroke-dasharray="10 10" stroke-dashoffset="0" animation="neural-flicker 2s infinite"/>
    </svg>
    <div class="core" style="top: 50%; left: 50%; transform: translate(-50%, -50%);"></div>
    <div class="particle" style="top: 20%; left: 20%;"></div>
    <div class="particle" style="top: 40%; left: 60%;"></div>
    <div class="particle" style="top: 60%; left: 40%;"></div>
    <div class="particle" style="top: 80%; left: 20%;"></div>
    <div class="particle" style="top: 20%; left: 80%;"></div>
    <div class="particle" style="top: 40%; left: 20%;"></div>
    <div class="particle" style="top: 60%; left: 60%;"></div>
    <div class="particle" style="top: 80%; left: 80%;"></div>
    <svg class="neural-web" width="100%" height="100%">
      <path d="M 50 50 L 100 50" stroke="#fff" stroke-width="2" stroke-dasharray="10 10" stroke-dashoffset="0" animation="neural-flicker 2s infinite"/>
    </svg>
  </div>
        </div>
        </body>
        </html>
