<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Cosmic Inferno Bloom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: translate(50%, 50%) rotate(0deg);
    }
    50% {
      transform: translate(50%, 50%) rotate(100deg);
    }
    100% {
      transform: translate(50%, 50%) rotate(0deg);
    }
  }

  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.2);
    }
    100% {
      transform: scale(1);
    }
  }

  @keyframes neural-flicker {
    0% {
      transform: translateY(0) rotateY(0deg);
    }
    50% {
      transform: translateY(-10%) rotateY(5deg);
    }
    100% {
      transform: translateY(0) rotateY(0deg);
    }
  }

  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: linear-gradient(90deg, #ff99cc, #ff0066);
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    background: linear-gradient(0deg, #ff3333, #ff9900);
    border-radius: 50%;
    box-shadow: 
      0 0 50px #ff3333,
      0 0 50px #ff6666,
      0 0 50px #ff9999,
      0 0 50px #ffcccc,
      0 0 50px #ffff66,
      0 0 50px #66ffff;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    background: linear-gradient(90deg, #ffff00, #ccff00);
    animation: particle-dance 3s infinite;
  }

  .particle:nth-child(1) {
    top: 10%;
     left: 10%;
     animation-delay: 0s;
  }

  .particle:nth-child(2) {
    top: 20%;
     left: 70%;
     animation-delay: 0.5s;
  }

  .particle:nth-child(3) {
    top: 80%;
     left: 30%;
     animation-delay: 1s;
  }

  .particle:nth-child(4) {
    top: 40%;
     left: 25%;
     animation-delay: 1.5s;
  }

  .particle:nth-child(5) {
    top: 60%;
     left: 80%;
     animation-delay: 2s;
  }

  .particle:nth-child(6) {
    top: 90%;
     left: 40%;
     animation-delay: 2.5s;
  }

  .particle:nth-child(7) {
    top: 30%;
     left: 60%;
     animation-delay: 2.5s;
  }

  .particle:nth-child(8) {
    top: 10%;
     left: 80%;
     animation-delay: 2.2s;
  }

  .particle:nth-child(9) {
    top: 50%;
     left: 50%;
     animation-delay: 2.8s;
  }

  .particle:nth-child(10) {
    top: 80%;
     left: 20%;
     animation-delay: 3.2s;
  }

  .neural-web {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .neural-web path {
    stroke: #fff;
    stroke-width: 2px;
    fill: none;
    opacity: 0.6;
  }

  .neural-web path:nth-child(1) {
    transform: rotate(0deg);
  }

  .neural-web path:nth-child(2) {
    transform: rotate(30deg);
  }

  .neural-web path:nth-child(3) {
    transform: rotate(60deg);
  }

  .neural-web path:nth-child(4) {
    transform: rotate(90deg);
  }

  .neural-web path:nth-child(5) {
    transform: rotate(120deg);
  }

  .neural-web path:nth-child(6) {
    transform: rotate(150deg);
  }

  .neural-web path:nth-child(7) {
    transform: rotate(180deg);
  }

  .neural-web path:nth-child(8) {
    transform: rotate(210deg);
  }

  .neural-web path:nth-child(9) {
    transform: rotate(240deg);
  }

  .neural-web path:nth-child(10) {
    transform: rotate(270deg);
  }

  .neural-web path:nth-child(11) {
    transform: rotate(300deg);
  }

  .neural-web path:nth-child(12) {
    transform: rotate(330deg);
  }

  .neural-web path {
    animation: neural-flicker 2s infinite;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>
    <svg class="neural-web">
      <path d="M -50 0 L 50 0 60 50 0 50" />
      <path d="M 0 -50 L -60 50 0 60" />
      <path d="M -50 0 L 50 0 -60 30" />
      <path d="M -50 -50 L 50 50 30 50" />
      <path d="M 0 -50 L 60 -50 60 -30" />
      <path d="M -50 -50 L 50 0 60 40" />
    </svg>
  </div>
        </div>
        </body>
        </html>
