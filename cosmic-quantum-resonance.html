<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Cosmic Quantum Resonance</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            /* 
  Positioning .vortex-container absolutely at the top-left corner
  of the viewport.
*/
.vortex-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  clip-path: circle(50% at 50% 50%);
  z-index: -1;
  background: radial-gradient( farthest-side at 1% 100%,
    #232323, #232323),
    radial-gradient( farthest-side at 95% 10%,
    #232323, #232323) 100% 100% / 90% 90%;
}

/* 
  Keyframes for .core pulsing animation.
  The pulsation occurs infinitely and scales the core.
*/
@keyframes core-pulse {
  from {
    transform: scale(0.8);
  }
  to {
    transform: scale(1.2);
  }
}

/* 
  Styles for .core absolute positioning, pulsation, background
  and box-shadows.
*/
.core {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 10vmax;
  height: 10vmax;
  border-radius: 50%;
  background: linear-gradient(to bottom right,
    #66CCCC, #33CCFF);
  box-shadow: 0 5px 10px #0000ff, -5px 0 10px #0000ff, 
    0 -5px 10px #0000ff, 5px 0 10px #0000ff, 
    0 5px 20px #0000ff, -5px 0 20px #0000ff, 
    0 -5px 20px #0000ff, 5px 0 20px #0000ff;
  animation: core-pulse infinite 2s;
}

/* 
  Keyframes for .particle dance animation.
  The particles rotate infinitely around their center.
*/
@keyframes particle-dance {
  from {
    transform: rotate(0deg) translate(0px 0px);
  }
  to {
    transform: rotate(360deg) translate(-20px -20px);
  }
}

/* 
  Keyframes for .neural-web flicker animation.
  The paths in .neural-web change opacity infinitely.
*/
@keyframes neural-flicker {
  from {
    opacity: 1;
  }
  to {
    opacity: 0.5;
  }
}

/* 
  Styles for .neural-web SVG absolutely positioning,
  three paths with different colors.
*/
.neural-web {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  stroke: #fff;
}
.neural-web path:first-of-type {
  fill: #33CCFF;
  stroke-dasharray: 100, 50;
  stroke-dashoffset: 50;
  animation: neural-flicker infinite 5s;
}
.neural-web path:nth-of-type(2) {
  fill: #66CCCC;
  stroke-dasharray: 150, 75;
  stroke-dashoffset: 75;
  animation: neural-flicker infinite 6s;
}
.neural-web path:last-of-type {
  fill: #0000ff;
  stroke-dasharray: 200, 100;
  stroke-dashoffset: 100;
  animation: neural-flicker infinite 7s;
}

/* 
  Styles for .particle absolute positioning, background,
  border-radius, and animation.
*/
.particle {
  position: absolute;
  background: #33CCFF;
  border-radius: 50%;
  width: 5vmax;
  height: 5vmax;
}
.particle:nth-of-type(1) {
  top: 40%;
  left: 20%;
  animation: particle-dance infinite 3s;
}
.particle:nth-of-type(2) {
  top: 70%;
  left: 50%;
  animation: particle-dance infinite 4s;
}
.particle:nth-of-type(3) {
  top: 30%;
  left: 30%;
  animation: particle-dance infinite 1s;
}
.particle:nth-of-type(4) {
  top: 40%;
  left: 60%;
  animation: particle-dance infinite 2s;
}
.particle:nth-of-type(5) {
  top: 20%;
  left: 40%;
  animation: particle-dance infinite 5s;
}
.particle:nth-of-type(6) {
  top: 70%;
  left: 70%;
  animation: particle-dance infinite 3s;
}
.particle:nth-of-type(7) {
  top: 10%;
  left: 50%;
  animation: particle-dance infinite 2s;
}
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
  <div class="core"></div>
  <svg class="neural-web">
    <path d="M 10 10 100 10 100 300 10 300 10 10 Z" />
    <path d="M 20 20 120 20 120 320 20 320 20 20 Z" />
    <path d="M 30 30 130 30 130 330 30 330 30 30 Z" />
  </svg>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
</div>
        </div>
        </body>
        </html>
