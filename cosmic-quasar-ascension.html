<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Cosmic Quasar Ascension</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: translate(0, 0) rotate(0deg);
    }
    50% {
      transform: translate(10%, -10%) rotate(20deg);
    }
    100% {
      transform: translate(-10%, 10%) rotate(0deg);
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
      opacity: 1;
    }
    50% {
      transform: scale(1.2);
      opacity: 0.5;
    }
    100% {
      transform: scale(1);
      opacity: 1;
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: rotate(0deg);
    }
    50% {
      transform: rotate(10deg);
    }
    100% {
      transform: rotate(0deg);
    }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    z-index: -1;
    clip-path: circle(50% at 50% 50%);
    background-image: linear-gradient(60deg, #34ABEC, #AED8F7);
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background-image: linear-gradient(120deg, #F9D5C6, #F7DC6F);
    box-shadow:
      0 0 10px rgba(255, 255, 255, 0.2),
      0 0 20px rgba(255, 255, 255, 0.4),
      0 0 30px rgba(255, 255, 255, 0.6),
      0 0 40px rgba(255, 255, 255, 0.8),
      0 0 50px rgba(255, 255, 255, 1);
    animation: core-pulse infinite 2s;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    background-image: linear-gradient(120deg, #34ABEC, #AED8F7);
    animation: particle-dance infinite 4s;
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
      opacity: 1;
    }
    50% {
      transform: scale(1.2);
      opacity: 0.5;
    }
    100% {
      transform: scale(1);
      opacity: 1;
    }
  }
  .particle:nth-child(1) {
    top: 20%;
    left: 20%;
    animation-delay: 0s;
  }
  .particle:nth-child(2) {
    top: 20%;
    left: 70%;
    animation-delay: 0.5s;
  }
  .particle:nth-child(3) {
    top: 70%;
    left: 20%;
    animation-delay: 1s;
  }
  .particle:nth-child(4) {
    top: 70%;
    left: 70%;
    animation-delay: 1.5s;
  }
  .particle:nth-child(5) {
    top: 30%;
    left: 50%;
    animation-delay: 2s;
  }
  .particle:nth-child(6) {
    top: 10%;
    left: 30%;
    animation-delay: 2.5s;
  }
  .particle:nth-child(7) {
    top: 90%;
    left: 90%;
    animation-delay: 3s;
  }
  .particle:nth-child(8) {
    top: 40%;
    left: 40%;
    animation-delay: 3.5s;
  }
  .particle:nth-child(9) {
    top: 60%;
    left: 10%;
    animation-delay: 4s;
  }
  .particle:nth-child(10) {
    top: 80%;
    left: 80%;
    animation-delay: 4.5s;
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
  }
  .neural-web path {
    stroke: #fff;
    stroke-width: 2;
    fill: none;
  }
  @keyframes neural-flicker {
    0% {
      transform: rotate(0deg);
    }
    50% {
      transform: rotate(10deg);
    }
    100% {
      transform: rotate(0deg);
    }
  }
  .neural-web path {
    animation: neural-flicker infinite 6s;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 50 50 L 100 50"></path>
      <path d="M 50 100 L 100 100"></path>
      <path d="M 50 150 L 100 150"></path>
      <path d="M 200 50 L 250 50"></path>
      <path d="M 200 100 L 250 100"></path>
      <path d="M 200 150 L 250 150"></path>
    </svg>
    <div class="particle" style="top:20%; left:20%;"></div>
    <div class="particle" style="top:20%; left:70%;"></div>
    <div class="particle" style="top:70%; left:20%;"></div>
    <div class="particle" style="top:70%; left:70%;"></div>
    <div class="particle" style="top:30%; left:50%;"></div>
    <div class="particle" style="top:10%; left:30%;"></div>
    <div class="particle" style="top:90%; left:90%;"></div>
    <div class="particle" style="top:40%; left:40%;"></div>
    <div class="particle" style="top:60%; left:10%;"></div>
    <div class="particle" style="top:80%; left:80%;"></div>
  </div>
        </div>
        </body>
        </html>
