<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Cosmic Quasar Ignition</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% { transform: translate(0, 0) rotate(0deg); }
    50% { transform: translate(20px, 20px) rotate(360deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }
  
  @keyframes core-pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  
  @keyframes neural-flicker {
    0% { transform: rotate(0deg); }
    50% { transform: rotate(180deg); }
    100% { transform: rotate(0deg); }
  }
  
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%,75% 0%,100% 25%,50% 100%,0% 25%);
    background: radial-gradient(#ff99cc, #ffffcc, #9999ff);
  }
  
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: linear-gradient(to bottom, #ffff00, #ccffff);
    box-shadow: 
      0 0 0 1px white, 
      0 0 10px 10px #ff0000, 
      0 0 20px 20px #00ff00, 
      0 0 30px 30px #ffff00, 
      0 0 40px 40px #0000ff, 
      0 0 50px 50px #ffcc00;
    animation: core-pulse 2s infinite;
  }
  
  .particle {
    position: absolute;
    border-radius: 50%;
    width: 10px;
    height: 10px;
    background: linear-gradient(to right, #ffff00, #ccffff);
    animation: particle-dance 1s infinite;
  }
  
  .neural-web {
    position: absolute;
    fill: #fff;
  }
  
  .neural-web path {
    stroke: #fff;
    stroke-width: 2px;
  }
  
  @keyframes particle-dance {
    0% { transform: translate(0, 0) rotate(0deg); }
    50% { transform: translate(20px, 20px) rotate(360deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }
  
  @keyframes core-pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  
  @keyframes neural-flicker {
    0% { transform: rotate(0deg); }
    50% { transform: rotate(180deg); }
    100% { transform: rotate(0deg); }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
   <div class="core"></div>
    <svg class="neural-web" viewBox="0 0 200 200" preserveAspectRatio="xMidYMidmeet">
      <path d="M100,100 L150,200 L200,150 Z" />
      <path d="M100,100 L50,200 L0,150 Z" />
      <path d="M100,150 L150,100 L200,50 Z" />
    </svg>
    <div class="particle"></div>
    <div class="particle" style="top: 50px; left: 50px;"></div>
    <div class="particle" style="top: 100px; left: 100px;"></div>
    <div class="particle" style="top: 150px; left: 150px;"></div>
    <div class="particle" style="top: 200px; left: 200px;"></div>
  </div>
        </div>
        </body>
        </html>
