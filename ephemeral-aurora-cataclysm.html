<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ephemeral Aurora Cataclysm</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% { transform: translate(-50%, -50%) rotate(0deg) scale(1) }
    100% { transform: translate(-50%, -50%) rotate(360deg) scale(1.5) }
  }
  @keyframes core-pulse {
    0% { transform: scale(1) }
    100% { transform: scale(2) }
  }
  @keyframes neural-flicker {
    0% { transform: rotate(0deg) scale(1) }
    50% { transform: rotate(180deg) scale(1.2) }
    100% { transform: rotate(360deg) scale(1) }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh; /* Changed to 100vh */
    background-image: linear-gradient(45deg, #333, #555);
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    z-index: -1;
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background-image: linear-gradient(90deg, #ff99cc, #ccffff);
    width: 200px;
    height: 200px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
    box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.5);
    box-shadow: 0 0 70px rgba(0, 0, 0, 0.5);
    animation: core-pulse 2s infinite;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    background-image: linear-gradient(90deg, #999, #999);
    width: 50px;
    height: 50px;
    animation: particle-dance 6s infinite;
  }
  .particle:nth-child(1) {
    top: 10%;
    left: 10%;
    transform: translate(-50%, -50%) rotate(-45deg);
  }
  .particle:nth-child(2) {
    top: 20%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(45deg);
  }
  .particle:nth-child(3) {
    top: 30%;
    left: 80%;
    transform: translate(-50%, -50%) rotate(45deg);
  }
  .particle:nth-child(4) {
    top: 40%;
    left: 10%;
    transform: translate(-50%, -50%) rotate(90deg);
  }
  .particle:nth-child(5) {
    top: 50%;
    left: 30%;
    transform: translate(-50%, -50%) rotate(-90deg);
  }
  .particle:nth-child(6) {
    top: 60%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(0deg);
  }
  .particle:nth-child(7) {
    top: 70%;
    left: 60%;
    transform: translate(-50%, -50%) rotate(-45deg);
  }
  .neural-web {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
  }
  .neural-web path {
    stroke: #fff;
  }
  .neural-web path:nth-child(1) {
    d: M 10 10 v 90 H 100;
    animation: neural-flicker 10s infinite;
  }
  .neural-web path:nth-child(2) {
    d: M 90 10 v 90 h 10;
    animation: neural-flicker 15s infinite;
  }
  .neural-web path:nth-child(3) {
    d: M 10 90 v 20 H 100;
    animation: neural-flicker 12s infinite;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path></path>
      <path></path>
      <path></path>
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
