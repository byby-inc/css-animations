<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ephemeral Aurora Convergence</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: translate(-25%, -25%) rotate(0deg);
    }
    100% {
      transform: translate(-25%, -25%) rotate(360deg);
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    100% {
      transform: scale(2) scale(1);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: rotate(0deg) scale(1);
    }
    50% {
      transform: rotate(-10deg) scale(1.05);
    }
    100% {
      transform: rotate(0deg) scale(1);
    }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    z-index: -1;
    clip-path: circle(50% at 50% 50%);
    background-image: radial-gradient(ellipse at center, #141414, #2f2f2f, #383838);
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 20vw;
    height: 20vw;
    border-radius: 50%;
    background-image: linear-gradient(90deg, #ff69b4, #33ccff);
    box-shadow:
      0 0 0 1px #fff,
      0 0 10px #fff,
      0 0 20px #fff,
      0 0 30px #fff,
      0 0 40px #fff,
      0 0 50px #fff;
    animation: core-pulse 3s infinite;
  }
  .particle {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background-image: linear-gradient(90deg, #ff69b4, #33ccff);
    animation: particle-dance 6s infinite;
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
    stroke-width: 2px;
  }
  .neural-web path {
    stroke-dasharray: 100, 100;
    animation: neural-flicker 1s infinite;
  }
  @media only screen and (max-width: 768px) {
    .core {
      width: 30vw;
      height: 30vw;
    }
    .particle {
      width: 5px;
      height: 5px;
    }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 50 100 L 150 250 L 50 350 Z" />
      <path d="M 150 50 L 250 100 L 150 150 Z" />
      <path d="M 50 300 L 100 400 L 200 250 Z" />
    </svg>
    <div class="particle" style="top: 20vh; left: 30vw;"></div>
    <div class="particle" style="top: 15vh; left: 25vw;"></div>
    <div class="particle" style="top: 10vh; left: 20vw;"></div>
    <div class="particle" style="top: 25vh; left: 35vw;"></div>
    <div class="particle" style="top: 5vh; left: 15vw;"></div>
    <div class="particle" style="top: 30vh; left: 40vw;"></div>
  </div>
        </div>
        </body>
        </html>
