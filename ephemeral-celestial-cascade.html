<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ephemeral Celestial Cascade</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% { transform: translate(0, 0) rotate(0deg); }
    20% { transform: translate(20px, 0) rotate(10deg); }
    40% { transform: translate(-10px, 10px) rotate(-20deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }

  @keyframes core-pulse {
    0% { transform: scale(1); }
    20% { transform: scale(1.1); }
    40% { transform: scale(1); }
    100% { transform: scale(1); }
  }

  @keyframes neural-flicker {
    0% { transform: translate(0, 0); }
    50% { transform: translate(20px, 0); }
    100% { transform: translate(0, 0); }
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
  }

  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%,75% 0%,100% 25%,50% 100%,0% 25%);
    background: linear-gradient(90deg, #8ec5fc, #8ec5fc), radial-gradient(#8ec5fc, #8ec5fc);
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(90deg, #fff, #fff), radial-gradient(#fff, #fff);
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1), 0 0 10px rgba(0, 0, 0, 0.1), 0 0 10px rgba(0, 0, 0, 0.1), 0 0 10px rgba(0, 0, 0, 0.1), 0 0 10px rgba(0, 0, 0, 0.1), 0 0 10px rgba(0, 0, 0, 0.1);
  }

  .core.pulse {
    animation: core-pulse 2s infinite;
  }

  .particle {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: linear-gradient(90deg, #fff, #fff), radial-gradient(#fff, #fff);
  }

  .particle.dance {
    animation: particle-dance 1.5s infinite;
  }

  @media (min-resolution: 2dppx) {
    .particle {
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
  }

  .neural-web {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    height: 100%;
    stroke: #fff;
  }

  .neural-web path {
    stroke-width: 1;
  }

  .neural-web path:nth-child(1) {
    animation: neural-flicker 1.2s infinite;
  }

  .neural-web path:nth-child(2) {
    animation: neural-flicker 1.3s infinite;
  }

  .neural-web path:nth-child(3) {
    animation: neural-flicker 1.4s infinite;
  }

  .neural-web path:nth-child(4) {
    animation: neural-flicker 1.5s infinite;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core pulse"></div>
    <svg class="neural-web" viewBox="0 0 100 100">
      <path d="M25,25 L25,75 A50,50 0 1 1 75,25" />
      <path d="M50,25 L25,50 A50,50 0 1 1 75,75" />
      <path d="M50,75 L75,50 A50,50 0 1 1 25,25" />
    </svg>
    <div class="particle dance" style="top: 10px; left: 10px; background: radial-gradient(#fff, #fff);"></div>
    <div class="particle dance" style="top: 20px; left: 20px; background: radial-gradient(#fff, #fff);"></div>
    <div class="particle dance" style="top: 30px; left: 30px; background: radial-gradient(#fff, #fff);"></div>
    <div class="particle dance" style="top: 40px; left: 40px; background: radial-gradient(#fff, #fff);"></div>
    <div class="particle dance" style="top: 50px; left: 50px; background: radial-gradient(#fff, #fff);"></div>
  </div>
        </div>
        </body>
        </html>
