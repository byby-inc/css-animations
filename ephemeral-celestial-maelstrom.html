<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ephemeral Celestial Maelstrom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            .vortex-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100vh;
  z-index: -1;
  clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  background: linear-gradient(0deg, #00000099, #00000000);
  display: flex;
  justify-content: center;
  align-items: center;
}

.core {
  position: absolute;
  transform: translate(-50%, -50%);
  height: 200px;
  width: 200px;
  border-radius: 50%;
  background: linear-gradient(0deg, #ff69b4, #33ccff);
  box-shadow: 0 0 0 2px #ffffff99;
  box-shadow: 0 0 20px 5px #ffffff99;
  box-shadow: 0 0 40px 10px #ffffff99;
  box-shadow: 0 0 60px 15px #ffffff99;
  box-shadow: 0 0 80px 20px #ffffff99;
  box-shadow: 0 0 100px 25px #ffffff99;
}

.core::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 150px;
  height: 150px;
}

.core::after {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: linear-gradient(0deg, #00ffff, #ff0000);
}

.particle {
  position: absolute;
  border-radius: 50%;
  width: 20px;
  height: 20px;
  background: linear-gradient(0deg, #66ccff, #ff99ff);
}

.neural-web {
  position: absolute;
  width: 100%;
  height: 100%;
}

.neural-web path {
  stroke: #ffffff;
  stroke-width: 1;
}

@keyframes particle-dance {
  0% {
    transform: translate(0, 0) rotate(0deg);
  }
  25% {
    transform: translate(10px, -10px) rotate(180deg);
  }
  50% {
    transform: translate(-20px, 20px) rotate(360deg);
  }
  75% {
    transform: translate(15px, -15px) rotate(720deg);
  }
  100% {
    transform: translate(0, 0) rotate(360deg);
  }
}

@keyframes core-pulse {
  0% {
    transform: scale(1);
  }
  25% {
    transform: scale(1.15);
  }
  50% {
    transform: scale(1);
  }
  75% {
    transform: scale(0.95);
  }
  100% {
    transform: scale(1);
  }
}

@keyframes neural-flicker {
  0% {
    transform: scale(1);
  }
  25% {
    transform: scale(1.05);
  }
  50% {
    transform: scale(0.95);
  }
  75% {
    transform: scale(1.1);
  }
  100% {
    transform: scale(1);
  }
}

.vortex-container .particle {
  animation: particle-dance 4s infinite linear;
  animation-fill-mode: forwards;
}

.vortex-container .core {
  animation: core-pulse 4s infinite ease-in-out;
  animation-fill-mode: forwards;
}

.neural-web {
  animation: neural-flicker 2s infinite alternate ease-in-out;
  animation-fill-mode: forwards;
}
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 0 0 L 100 100 L 0 100" />
      <path d="M 100 0 L 0 100 L 100 100" />
      <path d="M 50 0 L 150 100 L 50 100 L 50 0" />
    </svg>
    <div class="particle" style="top: 10px; left: 10px;"></div>
    <div class="particle" style="top: 20px; left: 20px;"></div>
    <div class="particle" style="top: 30px; left: 30px;"></div>
    <div class="particle" style="top: 40px; left: 40px;"></div>
    <div class="particle" style="top: 50px; left: 50px;"></div>
  </div>
        </div>
        </body>
        </html>
