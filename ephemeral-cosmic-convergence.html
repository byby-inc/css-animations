<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ephemeral Cosmic Convergence</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: translate(100px, 0) rotate(0deg);
    }
    50% {
      transform: translate(-100px, -100px) rotate(180deg);
    }
    100% {
      transform: translate(0, 200px) rotate(360deg);
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1) translate(-50%, -50%);
    }
    50% {
      transform: scale(1.1) translate(-50%, -50%);
    }
    100% {
      transform: scale(1) translate(-50%, -50%);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: scale(1) rotate(0deg);
    }
    25% {
      transform: scale(0.9) rotate(45deg);
    }
    50% {
      transform: scale(1) rotate(90deg);
    }
    75% {
      transform: scale(1.05) rotate(135deg);
    }
    100% {
      transform: scale(1) rotate(180deg);
    }
  }
  
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: linear-gradient(to right, #3498db, #2ecc71);
  }
  
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: radial-gradient(#f1c40f, #f7dc6f);
    box-shadow: 0 0 10px #f1c40f,
                 0 0 10px #f7dc6f,
                 0 40px 20px #f7dc6f,
                 0 80px 40px #f1c40f,
                 0 120px 60px #f7dc6f;
    animation: core-pulse 1s infinite;
  }
  
  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(to top, #2ecc71, #3498db);
    animation: particle-dance 2s infinite;
  }
  
  .particle:nth-child(1) {
    top: 10%;
    left: 10%;
    transform: translate(-40px, -20px) rotate(0deg);
    width: 80px;
    height: 80px;
  }
  .particle:nth-child(2) {
    top: 50%;
    left: 80%;
    transform: translate(-30px, 30px) rotate(180deg);
    width: 60px;
    height: 60px;
  }
  .particle:nth-child(3) {
    top: 90%;
    left: 10%;
    transform: translate(-50px, -50px) rotate(90deg);
    width: 40px;
    height: 40px;
  }
  .particle:nth-child(4) {
    top: 80%;
    left: 80%;
    transform: translate(-30px, 20px) rotate(45deg);
    width: 70px;
    height: 70px;
  }
  .particle:nth-child(5) {
    top: 20%;
    left: 90%;
    transform: translate(-40px, -30px) rotate(0deg);
    width: 90px;
    height: 90px;
  }
  
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
  }
  
  .neural-web path {
    stroke-width: 2;
    stroke-miterlimit: 10;
    stroke-opacity: 0.5;
  }
  
  .neural-web path:first-child {
    stroke-dasharray: 100, 200;
    animation: neural-flicker 4s infinite;
  }
  
  .neural-web path:nth-child(2) {
    stroke-dasharray: 150, 300;
    animation: neural-flicker 5s infinite;
  }
  
  .neural-web path:nth-child(3) {
    stroke-dasharray: 200, 400;
    animation: neural-flicker 6s infinite;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
  <div class="core"></div>
  <svg class="neural-web">
    <path d="M 50 50 L 150 50 L 200 150 L 50 150 Z" id="path-1" transform="translate(100, 100)" />
    <path d="M 150 50 L 250 50 L 300 150 L 150 150 Z" id="path-2" transform="translate(200, 200)" />
    <path d="M 50 150 L 100 250 L 150 50 Z" id="path-3" transform="translate(50, 150)" />
  </svg>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
</div>
        </div>
        </body>
        </html>
