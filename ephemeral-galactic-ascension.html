<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ephemeral Galactic Ascension</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% { transform: translate(-20px, -20px) rotate(0deg); }
    20% { transform: translate(0px, 0px) rotate(10deg); }
    30% { transform: translate(20px, 20px) rotate(0deg); }
    50% { transform: translate(-20px, 20px) rotate(10deg); }
    70% { transform: translate(0px, -20px) rotate(0deg); }
    100% { transform: translate(-20px, -20px) rotate(10deg); }
  }
  
  @keyframes core-pulse {
    0% { transform: scale(1); }
    30% { transform: scale(1.2); }
    50% { transform: scale(1); }
    80% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }
  
  @keyframes neural-flicker {
    0% { transform: translate(0px, 0px) rotate(0deg); }
    20% { transform: translate(20px, 0px) rotate(-10deg); }
    30% { transform: translate(-20px, 20px) rotate(10deg); }
    50% { transform: translate(20px, 0px) rotate(0deg); }
    60% { transform: translate(0px, -20px) rotate(10deg); }
    80% { transform: translate(20px, 20px) rotate(0deg); }
    100% { transform: translate(0px, 0px) rotate(-10deg); }
  }
  
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    z-index: -1;
    background: linear-gradient(90deg, #2E4053, #455A64);
    clip-path: circle(50% at 50% 50%);
  }
  
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    background: linear-gradient(90deg, #F7D2C4, #FFC67D);
    border-radius: 50%;
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
    box-shadow: 0 0 50px rgba(255, 255, 255, 0.2);
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
  }
  
  .particle {
    position: absolute;
    top: 0;
    left: 0;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: linear-gradient(90deg, #F7D2C4, #FFC67D);
    animation: particle-dance 2s infinite;
  }
  
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
    stroke-width: 1;
  }
  
  .neural-web path {
    animation: neural-flicker 1.5s infinite;
  }
  
  @media (max-width: 768px) {
    .particle {
      animation: particle-dance 1.5s infinite;
    }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core">
      <div class="neural-web">
        <path d="M 0 0 L 100 0 L 150 100 L 50 100z" />
        <path d="M 20 20 L 120 20 L 180 80 L 40 80z" />
        <path d="M 60 40 L 160 40 L 220 20 L 40 20z" />
      </div>
      <div class="particle" style="top: 150px; left: 200px;"> </div>
      <div class="particle" style="top: 120px; left: 50px;"> </div>
      <div class="particle" style="top: 180px; left: 60px;"> </div>
      <div class="particle" style="top: 220px; left: 180px;"> </div>
      <div class="particle" style="top: 40px; left: 40px;"> </div>
      <div class="particle" style="top: 80px; left: 120px;"> </div>
      <div class="particle" style="top: 100px; left: 90px;"> </div>
      <div class="particle" style="top: 240px; left: 210px;"> </div>
      <div class="particle" style="top: 20px; left: 80px;"> </div>
    </div>
  </div>
        </div>
        </body>
        </html>
