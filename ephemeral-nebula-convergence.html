<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ephemeral Nebula Convergence</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: translate(-50%, -50%) rotate(0deg);
    }
    50% {
      transform: translate(-50%, -60%) rotate(30deg);
    }
    100% {
      transform: translate(-50%, -50%) rotate(0deg);
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1) rotate(0deg);
    }
    50% {
      transform: scale(1.1) rotate(0deg);
    }
    100% {
      transform: scale(1) rotate(0deg);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: rotate(0deg) translate(0px, 0px);
    }
    20% {
      transform: rotate(5deg) translate(-10px, -5px);
    }
    40% {
      transform: rotate(-5deg) translate(-15px, 0px);
    }
    60% {
      transform: rotate(5deg) translate(-5px, 5px);
    }
    80% {
      transform: rotate(-5deg) translate(0px, 0px);
    }
    100% {
      transform: rotate(0deg) translate(0px, 0px);
    }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    background-image: linear-gradient(to top, #17181d, #333340);
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    height: 200px;
    background-image: linear-gradient(to bottom, #ff9900, #ff6600);
    border-radius: 50%;
    box-shadow:
      0 0 10px #000,
      0 0 20px #fff,
      0 0 30px #000,
      0 0 40px #fff,
      0 0 50px #000,
      0 0 60px #fff;
    animation: core-pulse 5s infinite;
    animation-duration: 5s;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    background-image: linear-gradient(to bottom, #33ccff, #66ffff);
    animation: particle-dance 3s infinite;
    animation-duration: 3s;
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    fill: none;
    stroke: #fff;
    stroke-width: 3;
  }
  .neural-web path {
    stroke-dasharray: 100, 100;
  }
  @keyframes neural-flicker {
    0% {
      transform: rotate(0deg) translate(0px, 0px);
    }
    20% {
      transform: rotate(5deg) translate(-10px, -5px);
    }
    40% {
      transform: rotate(-5deg) translate(-15px, 0px);
    }
    60% {
      transform: rotate(5deg) translate(-5px, 5px);
    }
    80% {
      transform: rotate(-5deg) translate(0px, 0px);
    }
    100% {
      transform: rotate(0deg) translate(0px, 0px);
    }
  }
  .vortex-container:after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    height: 200px;
    background-image: linear-gradient(to bottom, #ff9900, #ff6600);
    border-radius: 50%;
    opacity: 0.5;
    animation: core-pulse 5s infinite;
    animation-duration: 5s;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M50 50 L 200 50 L 200 150 L 50 150 Z" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="50, 50" />
      <path d="M50 150 L 200 150 L 200 200 L 50 200 Z" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="50, 50" />
      <path d="M200 200 L 200 50 L 150 50 L 150 200 L 100 200 L 100 50 L 50 50 L 50 250 L 200 250 Z" fill="none" stroke="#fff" stroke-width="3" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
