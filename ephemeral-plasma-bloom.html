<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ephemeral Plasma Bloom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: radial-gradient(ellipse at top, #0f0cf0, #e67e73);
  }

  @keyframes particle-dance {
    0% {
      transform: translate(0, 0) rotate(0deg);
    }
    100% {
      transform: translate(-150%, -150%) rotate(720deg);
    }
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(120deg, #ff99cc, #00ccff);
    animation: particle-dance 2s infinite;
    transform: translate(0, 0) rotate(0deg);
  }

  .particle:nth-child(1) {
    top: 10%;
    left: 10%;
  }

  .particle:nth-child(2) {
    top: 50%;
    left: 50%;
  }

  .particle:nth-child(3) {
    top: 30%;
    left: 80%;
  }

  .particle:nth-child(4) {
    top: 20%;
    left: 60%;
  }

  .particle:nth-child(5) {
    top: 70%;
    left: 40%;
  }

  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.1);
    }
    100% {
      transform: scale(1);
    }
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    background: linear-gradient(60deg, #33ccff, #ff99cc);
    border-radius: 50%;
    animation: core-pulse 3s infinite;
  }

  .core::before {
    box-sizing: border-box;
  }

  .core::before {
    content: "";
    position: absolute;
    top: 20px;
    left: 20px;
    width: 40px;
    height: 40px;
    background: linear-gradient(60deg, #33ccff, #ff99cc);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 0 20px #333, 0 0 0 40px #000;
  }

  .core::after {
    content: "";
    position: absolute;
    top: 60px;
    left: 60px;
    width: 20px;
    height: 20px;
    background: linear-gradient(60deg, #33ccff, #ff99cc);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 0 5px #333, 0 0 0 10px #000;
  }

  .core::before {
    animation: core-pulse 5s infinite;
  }

  @keyframes neural-flicker {
    0% {
      transform: rotate(0deg) scale(1) translate(0, 0);
    }
    100% {
      transform: rotate(360deg) scale(2) translate(100%, 100%);
    }
  }

  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: #fff;
    animation: neural-flicker 4s infinite;
  }

  .neural-web path {
    stroke: #fff;
  }

  @keyframes neural-flicker {
    0% {
      transform: rotate(0deg) scale(1) translate(0, 0);
    }
    100% {
      transform: rotate(360deg) scale(2) translate(100%, 100%);
    }
  }

  .neural-web path:nth-child(1) {
    stroke-dasharray: 100, 100;
    stroke-dashoffset: 100;
    animation: dash 10s infinite linear;
  }

  .neural-web path:nth-child(2) {
    stroke-dasharray: 500, 500;
    stroke-dashoffset: 500;
    animation: dash 5s infinite linear;
  }

  .neural-web path:nth-child(3) {
    stroke-dasharray: 200, 200;
    stroke-dashoffset: 200;
    animation: dash 8s infinite linear;
  }

  @keyframes dash {
    100% {
      stroke-dashoffset: -500;
    }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 100 100 L 200 200 L 100 200 Z" />
      <path d="M 300 100 L 400 400 L 300 400 Z" />
      <path d="M 200 200 L 400 100 L 200 100 Z" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
