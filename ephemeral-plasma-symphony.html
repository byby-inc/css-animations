<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ephemeral Plasma Symphony</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% { transform: translate(0, 0) rotate(0deg); }
    50% { transform: translate(-20px, -20px) rotate(5deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }
  @keyframes core-pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }
  @keyframes neural-flicker {
    0% { transform: rotate(0deg); }
    50% { transform: rotate(5deg); }
    100% { transform: rotate(0deg); }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    clip-path: circle(50% at 50% 50%);
    background:
      linear-gradient(to bottom right, #3498db, #2ecc71);
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background:
      linear-gradient(to bottom, #f1c40f, #f7dc6f),
      linear-gradient(to bottom right, #3498db, #2ecc71);
    box-shadow:
      0 0 10px rgba(255, 255, 255, 0.5),
      0 0 20px rgba(255, 255, 255, 0.7),
      0 0 30px rgba(255, 255, 255, 0.9),
      0 0 40px rgba(255, 255, 255, 1);
    animation: core-pulse 2s infinite;
  }
  .particle {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background:
      linear-gradient(to bottom right, #3498db, #2ecc71);
    animation: particle-dance 2s infinite;
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: #fff;
    stroke: #fff;
    stroke-width: 1px;
  }
  .neural-web path {
    animation: neural-flicker 3s infinite;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 10 10 l 50 50 c 0 15 -10 15 0 0 z" />
      <path d="M 40 40 c 0 -20 0 -10 0 0 z" />
      <path d="M 20 20 l 40 -40 z" />
    </svg>
    <div class="particle" style="top: 20px; left: 20px;"></div>
    <div class="particle" style="top: 60px; left: 20px;"></div>
    <div class="particle" style="top: 40px; left: 40px;"></div>
    <div class="particle" style="top: 80px; left: 40px;"></div>
    <div class="particle" style="top: 60px; left: 100px;"></div>
    <div class="particle" style="top: 40px; left: 120px;"></div>
  </div>
        </div>
        </body>
        </html>
