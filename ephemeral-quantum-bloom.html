<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ephemeral Quantum Bloom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            /* Main Vortex Container */
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: radial-gradient(ellipse at 50% 0%, #0f0f0f, #0f0f0f, #202021);
    background: -webkit-radial-gradient(ellipse at 50% 0%, #0f0f0f, #0f0f0f, #202021);
  }
  /* Core */
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(180deg, #ffffff, #eeeeee);
    box-shadow:
      0 0 20px #ffffff,
      0 0 40px #eeeeee,
      0 0 60px #dddddd,
      0 0 80px #cccccc,
      0 0 100px #bbbbbb,
      0 0 120px #aaaaaa;
    animation: core-pulse 5s infinite;
  }
  /* Particles */
  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(180deg, #ffffff, #eeeeee);
    width: 10px;
    height: 10px;
    animation: particle-dance 6s infinite;
  }
  @keyframes particle-dance {
    0% { transform: translate(0, 0); }
    15% { transform: translate(20px, -20px); }
    30% { transform: translate(-20px, 20px); }
    45% { transform: translate(20px, 20px); }
    60% { transform: translate(-20px, -20px); }
    100% { transform: translate(0, 0); }
  }
  /* SVG Neural Web */
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  .neural-web path {
    stroke: #ffffff;
    stroke-width: 2;
    fill: none;
  }
  @keyframes neural-flicker {
    0% { transform: scale(1) rotate(0deg); }
    25% { transform: scale(1.05) rotate(10deg); }
    50% { transform: scale(1) rotate(0deg); }
    75% { transform: scale(0.95) rotate(-10deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  /* Animation */
  .neural-web path:nth-child(1) {
    animation: neural-flicker 1s infinite;
  }
  .neural-web path:nth-child(2) {
    animation: neural-flicker 2s infinite;
  }
  .neural-web path:nth-child(3) {
    animation: neural-flicker 3s infinite;
  }
  .particle:nth-child(1) {
    top: 20%;
    left: 20%;
    animation-delay: 0s;
  }
  .particle:nth-child(2) {
    top: 40%;
    left: 50%;
    animation-delay: 0.5s;
  }
  .particle:nth-child(3) {
    top: 20%;
    left: 80%;
    animation-delay: 1s;
  }
  .particle:nth-child(4) {
    top: 80%;
    left: 50%;
    animation-delay: 1.5s;
  }
  .particle:nth-child(5) {
    top: 20%;
    left: 20%;
    animation-delay: 2s;
  }
  .vortex-container .particle:nth-child(1) {
    background: radial-gradient(ellipse at 50% 0%, #ffffff, #eeeeee);
  }
  .vortex-container .particle:nth-child(2) {
    background: linear-gradient(180deg, #0f0f0f, #0f0f0f, #202021);
  }
  .vortex-container .particle:nth-child(3) {
    background: radial-gradient(ellipse at 50% 0%, #0f0f0f, #0f0f0f, #202021);
  }
  .vortex-container .particle:nth-child(4) {
    background: linear-gradient(180deg, #0f0f0f, #0f0f0f, #202021);
  }
  .vortex-container .particle:nth-child(5) {
    background: radial-gradient(ellipse at 50% 0%, #0f0f0f, #0f0f0f, #202021);
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"> </div>
    <svg class="neural-web">
      <path d="M 50 100 L 150 150 L 250 100 z" />
      <path d="M 150 100 L 250 150 L 150 100 z" />
      <path d="M 250 100 L 150 150 L 250 100 z" />
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </svg>
  </div>
        </div>
        </body>
        </html>
