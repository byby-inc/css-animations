<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ephemeral Quasar Eruption</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% { transform: translate(0, 0) rotate(0deg); }
    50% { transform: translate(10vw, 10vh) rotate(20deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }
  @keyframes core-pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }
  @keyframes neural-flicker {
    0% { transform: translate(0, 0) rotate(0deg); }
    50% { transform: translate(5vw, -5vh) rotate(-10deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: radial-gradient(circle at 50% 50%, #ff33cc, #33ccff);
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50vh;
    height: 50vh;
    background: linear-gradient(to bottom, #ff99cc, #66cccc);
    border-radius: 50%;
    box-shadow:
      0 0 0 1vh #ff66cc,
      0 0 0 2vh #ff33cc,
      0 0 0 3vh #66cccc,
      0 0 0 4vh #3333ff,
      0 0 0 5vh #cc66ff,
      0 0 0 6vh #33ccff;
    animation: core-pulse 5s infinite;
  }
  .particle {
    position: absolute;
    width: 5vh;
    height: 5vh;
    border-radius: 50%;
    background: linear-gradient(to bottom, #ff66cc, #33ccff);
    animation: particle-dance 2s infinite;
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    fill: none;
    stroke: #fff;
  }
  .neural-web path {
    stroke-width: 0.5vh;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  @keyframes particle-dance {
    0% { transform: translate(0, 0) rotate(0deg); }
    50% { transform: translate(10vw, 10vh) rotate(20deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }
  @keyframes core-pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }
  @keyframes neural-flicker {
    0% { transform: translate(0, 0) rotate(0deg); }
    50% { transform: translate(5vw, -5vh) rotate(-10deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <div class="particle" style="top: 20vh; left: 20vw;"></div>
    <div class="particle" style="top: 30vh; left: 30vw;"></div>
    <div class="particle" style="top: 40vh; left: 40vw;"></div>
    <div class="particle" style="top: 50vh; left: 50vw;"></div>
    <div class="particle" style="top: 60vh; left: 60vw;"></div>
    <div class="particle" style="top: 70vh; left: 70vw;"></div>
    <svg class="neural-web">
      <path d="M 10 10 L 90 10 L 90 90 L 10 90 Z" />
      <path d="M 10 90 L 90 90 L 90 10 L 10 10 Z" />
      <path d="M 50 50 L 50 90 L 90 90 L 90 50 L 50 50 Z" />
    </svg>
  </div>
        </div>
        </body>
        </html>
