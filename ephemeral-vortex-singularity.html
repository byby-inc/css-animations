<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ephemeral Vortex Singularity</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            /* Clip Path */
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  }

  /* Core */
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 30vw;
    height: 30vw;
    border-radius: 50%;
    background: linear-gradient(to bottom, #ff00ff, #ff99ff);
    box-shadow: 
      0 0 20px #ff00ff,
      0 0 40px #ff99ff,
      0 0 60px #ff33cc,
      0 0 80px #ff66cc,
      0 0 100px #ff99ff,
      0 0 120px #ff00ff;
    animation: core-pulse 10s infinite;
    }

  /* Particles */
  .particle {
    position: absolute;
    border-radius: 50%;
    width: 5vw;
    height: 5vw;
    background: linear-gradient(to bottom, #00ff00, #33ff33);
    animation: particle-dance 8s infinite;
  }

  /* Neural Web */
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
  }

  @keyframes particle-dance {
    0% {
      transform: translate(10vw, 10vw) rotate(0deg);
    }
    30% {
      transform: translate(10vw, 10vw) rotate(30deg);
    }
    50% {
      transform: translate(15vw, 15vw) rotate(90deg);
    }
    70% {
      transform: translate(10vw, 10vw) rotate(120deg);
    }
    100% {
      transform: translate(0, 0) rotate(180deg);
    }
  }

  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    40% {
      transform: scale(1.2);
    }
    60% {
      transform: scale(0.8);
    }
    100% {
      transform: scale(1);
    }
  }

  @keyframes neural-flicker {
    0% {
      transform: rotate(0deg) scale(1);
    }
    20% {
      transform: rotate(10deg) scale(1.1);
    }
    40% {
      transform: rotate(20deg) scale(1);
    }
    60% {
      transform: rotate(10deg) scale(0.9);
    }
    80% {
      transform: rotate(0deg) scale(1);
    }
    100% {
      transform: rotate(0deg) scale(1);
    }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M50 50 l0 100" stroke-width="2" />
      <path d="M50 50 l100 -100" stroke-width="2" />
      <path d="M50 50 l-100 -100" stroke-width="2" />
    </svg>
    <div class="particle" style="top: 20%; left: 20%;"></div>
    <div class="particle" style="top: 30%; left: 30%;"></div>
    <div class="particle" style="top: 40%; left: 40%;"></div>
    <div class="particle" style="top: 50%; left: 50%;"></div>
    <div class="particle" style="top: 60%; left: 60%;"></div>
    <div class="particle" style="top: 70%; left: 70%;"></div>
    <div class="particle" style="top: 80%; left: 80%;"></div>
    <div class="particle" style="top: 90%; left: 90%;"></div>
  </div>
        </div>
        </body>
        </html>
