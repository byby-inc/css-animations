<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>ETERNAL ASCENSION SYMPHONY</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: translate(0, 0) rotate(0deg);
    }
    50% {
      transform: translate(-20px, -20px) rotate(10deg);
    }
    100% {
      transform: translate(0, 0) rotate(0deg);
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.2);
    }
    100% {
      transform: scale(1);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: rotate(0deg);
    }
    20% {
      transform: rotate(10deg);
    }
    30% {
      transform: rotate(0deg);
    }
    80% {
      transform: rotate(5deg);
    }
    100% {
      transform: rotate(0deg);
    }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: linear-gradient(145deg, #34a8ff, #ff69b4, #34a8ff);
    background-size: 300% 300%;
    animation: neon-glow 10s infinite;
  }
  @keyframes neon-glow {
    0% {
      background-position: 0% 0%;
    }
    100% {
      background-position: -150% 0%;
    }
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: linear-gradient(90deg, #ffd700, #66b3ff);
    box-shadow:
      0 0 10px #ffd700,
      0 0 20px #ffd700,
      0 0 30px #ffd700,
      0 0 40px #ffd700,
      0 0 50px #ffd700,
      0 0 60px #ffd700;
    background-size: 200% 200%;
    animation: core-pulse 2s infinite;
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.2);
    }
    100% {
      transform: scale(1);
    }
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(90deg, #34a8ff, #ff69b4);
    animation: particle-dance 3s infinite;
  }
  @keyframes particle-dance {
    0% {
      transform: translate(0, 0) rotate(0deg);
    }
    50% {
      transform: translate(-20px, -20px) rotate(10deg);
    }
    100% {
      transform: translate(0, 0) rotate(0deg);
    }
  }
  .neural-web {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 500px;
    height: 500px;
    fill: none;
    stroke: #fff;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .neural-web path {
    opacity: 0.5;
  }
  @keyframes neural-flicker {
    0% {
      transform: rotate(0deg);
    }
    20% {
      transform: rotate(10deg);
    }
    30% {
      transform: rotate(0deg);
    }
    80% {
      transform: rotate(5deg);
    }
    100% {
      transform: rotate(0deg);
    }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web" viewBox="0 0 100 100">
      <path d="M 50 0 A 50 50 0 0 0 100 50 M 50 0 A 50 50 0 0 0 0 50" />
      <path d="M 30 30 A 30 30 0 0 0 70 30 M 30 30 A 30 30 0 0 0 30 70" />
      <path d="M 70 70 A 30 30 0 0 0 10 70 M 70 70 A 30 30 0 0 0 70 10" />
    </svg>
    <div class="particle" style="top: 100px; left: 200px;"></div>
    <div class="particle" style="top: 300px; left: 30px;"></div>
    <div class="particle" style="top: 50px; left: 100px;"></div>
    <div class="particle" style="top: 400px; left: 20px;"></div>
    <div class="particle" style="top: 200px; left: 80px;"></div>
  </div>
        </div>
        </body>
        </html>
