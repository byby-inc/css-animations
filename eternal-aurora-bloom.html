<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Eternal Aurora Bloom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% { transform: translate(0px, 0px) scale(1); }
    50% { transform: translate(20px, -10px) scale(1.2); }
    100% { transform: translate(0px, 0px) scale(1); }
  }
  @keyframes core-pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }
  @keyframes neural-flicker {
    0% { transform: translate(0px, 0px) rotate(0deg); }
    50% { transform: translate(0px, 0px) rotate(10deg); }
    100% { transform: translate(0px, 0px) rotate(0deg); }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%,75% 0%,100% 25%,50% 100%,0% 25%);
    background-image: linear-gradient(180deg, #333, #444);
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(1);
    background-image: linear-gradient(0deg, #fff, #ccc);
    border-radius: 50%;
    box-shadow: 0 0 0 10px #fff inset, 0 0 0 20px #ccc inset, 0 0 0 30px #fff inset, 0 0 0 40px #ccc inset, 0 0 0 50px #fff inset, 0 0 0 60px #ccc inset;
    animation: core-pulse infinite 2s;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    background-image: linear-gradient(0deg, #fff, #ccc);
    animation: particle-dance infinite 3s;
  }
  .particle:nth-child(1) {
    top: 20%;
    left: 20%;
    transform: translate(-20px, -20px) scale(1);
  }
  .particle:nth-child(2) {
    top: 50%;
    left: 50%;
    transform: translate(-50px, -50px) scale(1);
  }
  .particle:nth-child(3) {
    top: 80%;
    left: 20%;
    transform: translate(-30px, -30px) scale(1);
  }
  .particle:nth-child(4) {
    top: 10%;
    left: 70%;
    transform: translate(-40px, -40px) scale(1);
  }
  .particle:nth-child(5) {
    top: 60%;
    left: 80%;
    transform: translate(-50px, -50px) scale(1);
  }
  .particle:nth-child(6) {
    top: 30%;
    left: 90%;
    transform: translate(-20px, -20px) scale(1);
  }
  .particle:nth-child(7) {
    top: 90%;
    left: 40%;
    transform: translate(-30px, -30px) scale(1);
  }
  .particle:nth-child(8) {
    top: 40%;
    left: 30%;
    transform: translate(-20px, -20px) scale(1);
  }
  .particle:nth-child(9) {
    top: 20%;
    left: 10%;
    transform: translate(-20px, -20px) scale(1);
  }
  .particle:nth-child(10) {
    top: 80%;
    left: 60%;
    transform: translate(-30px, -30px) scale(1);
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
  }
  .neural-web path {
    stroke-width: 2;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M50 50 L 0 50 L 25 25 L 50 50 Z" />
      <path d="M75 50 L 100 50 L 75 25 L 50 50 Z" />
      <path d="M25 0 L 0 50 L 25 75 L 50 50 Z" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
