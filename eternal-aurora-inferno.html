<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>ETERNAL AURORA INFERNO</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            /* Define colors palette */
  :root {
    --primary-color: #FF8C00;
    --secondary-color: #FFFFFF;
    --neutral-color: #333333;
    --gradient-start: #FFD700;
    --gradient-end: #FFA07A;
  }

  /* Define keyframes */
  @keyframes particle-dance {
    0% {
      transform: translate(0, 0) rotate(0deg);
    }
    100% {
      transform: translate(80px, -80px) rotate(360deg);
    }
  }

  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.1);
    }
    100% {
      transform: scale(1);
    }
  }

  @keyframes neural-flicker {
    0% {
      transform: translate(0, 0) rotate(0deg);
    }
    50% {
      transform: translate(10px, -10px) rotate(180deg);
    }
    100% {
      transform: translate(0, 0) rotate(0deg);
    }
  }

  /* Style vortex container */
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background-color: var(--neutral-color);
    background-image: linear-gradient(to bottom, var(--gradient-start), var(--gradient-end));
  }

  /* Style core */
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background-image: linear-gradient(to bottom, var(--primary-color), var(--secondary-color));
    background-color: var(--primary-color);
  }

  .core::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background-image: linear-gradient(to bottom, var(--primary-color), var(--secondary-color));
    background-color: var(--primary-color);
    box-shadow: 0 0 10px var(--primary-color);
    box-shadow: 0 0 10px var(--primary-color) 5px;
    box-shadow: 0 0 10px var(--primary-color) 10px;
    box-shadow: 0 0 10px var(--primary-color) 15px;
    box-shadow: 0 0 10px var(--primary-color) 20px;
  }

  .core {
    animation: core-pulse 2s infinite;
  }

  /* Style particles */
  .particle {
    position: absolute;
    border-radius: 50%;
    width: 10px;
    height: 10px;
    background-image: linear-gradient(to bottom, var(--primary-color), var(--secondary-color));
  }

  /* Style neural web */
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: var(--secondary-color);
  }

  .neural-web path {
    stroke-width: 2px;
  }

  .neural-web path:nth-child(1) {
    stroke-dasharray: 50, 100;
  }

  .neural-web path:nth-child(2) {
    stroke-dasharray: 100, 50;
  }

  .neural-web path:nth-child(3) {
    stroke-dasharray: 200, 50;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 100 100 L 300 300 L 100 300 Z" />
      <path d="M 100 100 L 200 200 L 300 100 Z" />
      <path d="M 300 300 L 400 200 L 300 100 Z" />
    </svg>
    <div class="particle" style="left: 0; top: 0; animation-delay: 0s;"></div>
    <div class="particle" style="left: 100px; top: 0; animation-delay: .5s;"></div>
    <div class="particle" style="left: 200px; top: 0; animation-delay: 1s;"></div>
    <div class="particle" style="left: 100px; top: 100px; animation-delay: .25s;"></div>
    <div class="particle" style="left: 200px; top: 100px; animation-delay: .75s;"></div>
    <div class="particle" style="left: 0; top: 200px; animation-delay: 1.5s;"></div>
    <div class="particle" style="right: 0; top: 0; animation-delay: 0s;"></div>
  </div>
        </div>
        </body>
        </html>
