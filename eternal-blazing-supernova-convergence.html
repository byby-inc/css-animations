<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>ETERNAL BLAZING SUPERNOVA CONVERGENCE</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% { transform: translate(-10px, 10px) rotate(10deg); }
    30% { transform: translate(10px, -10px) rotate(-10deg); }
    60% { transform: translate(10px, 10px) rotate(10deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }

  @keyframes core-pulse {
    0% { transform: scale(1); }
    60% { transform: scale(1.2); }
    80% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }

  @keyframes neural-flicker {
    0% { transform: scale(1) translate(0, 0); }
    40% { transform: scale(1.1) translate(5px, -5px); }
    70% { transform: scale(1) translate(0, 0); }
    100% { transform: scale(1) translate(0, 0); }
  }

  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background-image: linear-gradient(to bottom, #333, #666);
  }
  .vortex-container::after {
    content: "";
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: radial-gradient(circle at center, #fff, #000);
    opacity: 0.5;
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    background-image: linear-gradient(to bottom, #ccc, #aaa);
    border-radius: 50%;
    box-shadow: 0px 0px 10px rgba(255, 255, 255, 0.5);
    box-shadow: 0px 0px 20px rgba(150, 150, 150, 0.8);
    box-shadow: 0px 0px 30px rgba(100, 100, 100, 0.9);
    box-shadow: 0px 0px 40px rgba(50, 50, 50, 0.1);
    box-shadow: 0px 0px 50px rgba(0, 0, 0, 0.05);
    box-shadow: 0px 0px 60px rgba(0, 0, 0, 0.015);
    animation: core-pulse 2s infinite;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    width: 10px;
    height: 10px;
    background-image: linear-gradient(to bottom, #777, #888);
  }
  .particle:nth-child(1) { top: 10%; left: 10%; animation: particle-dance 3s infinite; }
  .particle:nth-child(2) { top: 20%; left: 20%; animation: particle-dance 4s infinite; }
  .particle:nth-child(3) { top: 30%; left: 30%; animation: particle-dance 5s infinite; }
  .particle:nth-child(4) { top: 40%; left: 40%; animation: particle-dance 6s infinite; }
  .particle:nth-child(5) { top: 50%; left: 50%; animation: particle-dance 7s infinite; }

  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
  }
  .neural-web path:nth-child(1) { d="M 50 50 L 100 0 50 50"; stroke-dasharray: 100; stroke-dashoffset: 0; animation: neural-flicker 4s infinite; }
  .neural-web path:nth-child(2) { d="M 50 50 L 0 100 50 50"; stroke-dasharray: 150; stroke-dashoffset: 0; animation: neural-flicker 3s infinite; }
  .neural-web path:nth-child(3) { d="M 50 50 L 150 100 50 50"; stroke-dasharray: 100; stroke-dashoffset: 0; animation: neural-flicker 5s infinite; }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 50 50 C 75 100 25 100 50 50" stroke-width="5" />
      <path d="M 50 50 C 100 150 75 150 50 50" stroke-width="3" />
      <path d="M 50 50 C 150 100 125 50 50 50" stroke-width="2" />
    </svg>
    <div class="particle:nth-child(1)"></div>
    <div class="particle:nth-child(2)"></div>
    <div class="particle:nth-child(3)"></div>
    <div class="particle:nth-child(4)"></div>
    <div class="particle:nth-child(5)"></div>
  </div>
        </div>
        </body>
        </html>
