<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Eternal Blazing Supernova Genesis</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background-image: linear-gradient(to bottom, #ff3737, #ff9a8b);
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background-image: linear-gradient(to bottom, #ff7b52, #ff99ac);
    box-shadow:
      0 0 50px #ff99ac,
      0 0 100px #ff99ac,
      0 0 150px #ff99ac,
      0 0 200px #ff99ac,
      0 0 250px #ff99ac,
      0 0 300px #ff99ac;
    animation: core-pulse 1.5s infinite;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    animation: particle-dance 3.5s infinite;
  }

  #p1 {
    top: 20%;
    left: 20%;
    background-image: linear-gradient(to bottom, #ff9a8b, #ff3737);
  }

  #p2 {
    top: 20%;
    left: 80%;
    background-image: linear-gradient(to bottom, #ff9a8b, #ff3737);
  }

  #p3 {
    top: 60%;
    left: 20%;
    background-image: linear-gradient(to bottom, #ff9a8b, #ff3737);
  }

  #p4 {
    top: 60%;
    left: 80%;
    background-image: linear-gradient(to bottom, #ff9a8b, #ff3737);
  }

  #p5 {
    top: 20%;
    left: 50%;
    background-image: linear-gradient(to bottom, #ff9a8b, #ff3737);
  }

  #p6 {
    top: 80%;
    left: 20%;
    background-image: linear-gradient(to bottom, #ff9a8b, #ff3737);
  }

  #p7 {
    top: 80%;
    left: 80%;
    background-image: linear-gradient(to bottom, #ff9a8b, #ff3737);
  }

  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.2);
    }
    100% {
      transform: scale(1);
    }
  }

  @keyframes particle-dance {
    0% {
      transform: translate(0, 0) rotate(0deg);
    }
    20% {
      transform: translate(20px, -30px) rotate(30deg);
    }
    40% {
      transform: translate(-20px, 10px) rotate(90deg);
    }
    60% {
      transform: translate(10px, 20px) rotate(150deg);
    }
    80% {
      transform: translate(-30px, -20px) rotate(210deg);
    }
    100% {
      transform: translate(0, 0) rotate(0deg);
    }
  }

  @keyframes neural-flicker {
    0% {
      transform: scale(1);
    }
    5% {
      transform: scale(1.05);
    }
    15% {
      transform: scale(0.9);
    }
    25% {
      transform: scale(1.05);
    }
    35% {
      transform: scale(0.9);
    }
    45% {
      transform: scale(1.05);
    }
    55% {
      transform: scale(0.9);
    }
    65% {
      transform: scale(1.05);
    }
    75% {
      transform: scale(0.9);
    }
    85% {
      transform: scale(1.05);
    }
    95% {
      transform: scale(0.9);
    }
    100% {
      transform: scale(1);
    }
  }

  .neural-web {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    height: 100%;
  }

  .neural-web path {
    stroke: #fff;
    fill: none;
    stroke-width: 2;
  }

  #n1 {
    transform: rotate(0deg);
  }

  #n2 {
    transform: rotate(45deg);
  }

  #n3 {
    transform: rotate(90deg);
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <div class="particle" id="p1"></div>
    <div class="particle" id="p2"></div>
    <div class="particle" id="p3"></div>
    <div class="particle" id="p4"></div>
    <div class="particle" id="p5"></div>
    <div class="particle" id="p6"></div>
    <div class="particle" id="p7"></div>
    <svg class="neural-web">
      <path id="n1" d="M 50 50 L 150 150" />
      <path id="n2" d="M 50 50 L 150 150" />
      <path id="n3" d="M 50 50 L 150 150" />
    </svg>
  </div>
        </div>
        </body>
        </html>
