<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Eternal Celestial Horizon</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% { transform: translateY(0px) rotate(0deg) scale(1); }
    50% { transform: translateY(-20px) rotate(30deg) scale(1.5); }
    100% { transform: translateY(0px) rotate(0deg) scale(1); }
  }
  @keyframes core-pulse {
    0% { transform: scale(0); }
    50% { transform: scale(1.2); }
    100% { transform: scale(0); }
  }
  @keyframes neural-flicker {
    0% { transform: translate(0, 0); }
    50% { transform: translate(10px, 10px); }
    100% { transform: translate(0, 0); }
  }
  .vortex-container {
    position: absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:-1;
    clip-path: polygon(25% 0%,75% 0%,100% 25%,50% 100%,0% 25%);
    background-image: radial-gradient(rgba(255,255,255,0.1), rgba(0,0,0,0.5));
  }
  .core {
    position: absolute;
    top:50%;
    left:50%;
    transform: translate(-50%, -50%);
    background: conic-gradient(rgba(255,255,255,0.5), rgb(135,206,235), rgb(0,0,255));
    border-radius: 50%;
    width: 100px;
    height: 100px;
    box-shadow:
      0 0 10px rgba(255,255,255,0.8),
      10px 10px 20px rgba(255,0,0,0.3),
      -10px -10px 20px rgba(255,255,0,0.3),
      10px -10px 20px rgba(0,255,0,0.3),
      -10px 10px 20px rgba(0,0,255,0.3);
    animation: core-pulse 2s infinite;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(rgba(255,255,255,0.1), rgba(0,0,0,0.5));
    animation: particle-dance 1.5s infinite;
  }
  .neural-web {
    position: absolute;
    fill: #fff;
    stroke: #fff;
    z-index:1;
  }
  @keyframes particle-dance {
    0% { transform: translateY(0px) rotate(0deg) scale(1); }
    50% { transform: translateY(-20px) rotate(30deg) scale(1.5); }
    100% { transform: translateY(0px) rotate(0deg) scale(1); }
  }
  @keyframes core-pulse {
    0% { transform: scale(0); }
    50% { transform: scale(1.2); }
    100% { transform: scale(0); }
  }
  @keyframes neural-flicker {
    0% { transform: translate(0, 0); }
    50% { transform: translate(10px, 10px); }
    100% { transform: translate(0, 0); }
  }
  .neural-web path {
    fill: none;
    stroke-width: 2px;
  }
  .neural-web #neural-layer1 {
    stroke: radial-gradient(rgba(255,255,255,0.5), rgba(0,0,0,0.5));
  }
  .neural-web #neural-layer2 {
    stroke: conic-gradient(rgba(255,255,255,0.5), rgb(135,206,235), rgb(0,0,255));
  }
  .neural-web #neural-layer3 {
    stroke: linear-gradient(rgba(255,255,255,0.5), rgba(0,0,0,0.5));
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web" viewBox="0 0 1920 1080">
      <path id="neural-layer1" d="M 0 0 L 1920 1080" />
      <path id="neural-layer2" d="M 0 0 L 1920 1080" />
      <path id="neural-layer3" d="M 0 0 L 1920 1080" />
    </svg>
    <div class="particle" style="top: 200px; left: 400px;"></div>
    <div class="particle" style="top: 100px; left: 800px;"></div>
    <div class="particle" style="top: 300px; left: 500px;"></div>
    <div class="particle" style="top: 400px; left: 200px;"></div>
    <div class="particle" style="top: 500px; left: 600px;"></div>
  </div>
        </div>
        </body>
        </html>
