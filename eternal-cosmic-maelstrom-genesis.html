<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Eternal Cosmic Maelstrom Genesis</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: rotate(0deg) translate(0px, 0px);
    }
    50% {
      transform: rotate(180deg) translate(100px, 100px);
    }
    100% {
      transform: rotate(360deg) translate(0px, 0px);
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.5);
    }
    100% {
      transform: scale(1);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: translate(0px, 0px) scale(1);
    }
    50% {
      transform: translate(50px, 50px) scale(1.2);
    }
    100% {
      transform: translate(0px, 0px) scale(1);
    }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%,75% 0%,100% 25%,50% 100%,0% 25%);
    background: linear-gradient(to bottom right, #03055B, #5DE2FF);
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    background: linear-gradient(to bottom right, #FFC107, #8E24AA);
    border-radius: 50%;
    box-shadow: 
      0 0 10px #FFFFFF,
      0 0 20px #FFFFFF,
      0 0 30px #FFFFFF,
      0 0 40px #FFFFFF,
      0 0 50px #FFFFFF,
      0 0 60px #FFFFFF;
    animation: core-pulse 3s infinite;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(to bottom right, #8BC34A, #4CAF50);
    animation: particle-dance 5s infinite;
  }
  .particle:nth-child(1) {
    top: 10%;
    left: 10%;
    width: 20px;
    height: 20px;
  }
  .particle:nth-child(2) {
    top: 20%;
    left: 20%;
    width: 30px;
    height: 30px;
  }
  .particle:nth-child(3) {
    top: 30%;
    left: 30%;
    width: 40px;
    height: 40px;
  }
  .particle:nth-child(4) {
    top: 40%;
    left: 40%;
    width: 50px;
    height: 50px;
  }
  .particle:nth-child(5) {
    top: 50%;
    left: 50%;
    width: 60px;
    height: 60px;
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    animation: neural-flicker 2s infinite;
  }
  .neural-web path {
    stroke: #FFFFFF;
    stroke-width: 2;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M100,100 L200,200" />
      <path d="M200,100 L300,200" />
      <path d="M300,100 L400,200" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
