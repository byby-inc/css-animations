<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Eternal Cosmic Symphony</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            .vortex-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  background: linear-gradient(90deg, #ff0000, #ff9900);
}

.particle {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(#33ccff, #99ff99);
}

.particle:nth-child(1) {
  top: 20%;
  left: 20%;
  animation: particle-dance 2s infinite;
}

.particle:nth-child(2) {
  top: 30%;
  left: 40%;
  animation: particle-dance 2.5s infinite;
}

.particle:nth-child(3) {
  top: 10%;
  left: 60%;
  animation: particle-dance 3s infinite;
}

.particle:nth-child(4) {
  top: 40%;
  left: 80%;
  animation: particle-dance 3.5s infinite;
}

.core {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: linear-gradient(90deg, #ff0000, #ff9900);
  box-shadow: 0 0 10px rgba(255, 0, 0, 0.5), 0 0 20px rgba(255, 165, 0, 0.7), 0 0 30px rgba(255, 0, 0, 0.9), 0 0 40px rgba(255, 165, 0, 1), 0 0 50px rgba(255, 0, 0, 1);
  animation: core-pulse 4s infinite;
}

.neural-web {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  fill: #fff;
}

.neural-web path {
  stroke: #fff;
}

.neural-web path:nth-child(1) {
  stroke-width: 1;
}

.neural-web path:nth-child(2) {
  stroke-width: 2;
}

.neural-web path:nth-child(3) {
  stroke-width: 3;
}

@keyframes particle-dance {
  0% {
    transform: rotate(0) translate(0, 0);
  }
  25% {
    transform: rotate(45deg) translate(10px, -10px);
  }
  50% {
    transform: rotate(90deg) translate(-10px, 10px);
  }
  75% {
    transform: rotate(135deg) translate(10px, 10px);
  }
  100% {
    transform: rotate(180deg) translate(0, 0);
  }
}

@keyframes core-pulse {
  0% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.2);
  }
  100% {
    transform: scale(1);
  }
}

@keyframes neural-flicker {
  0% {
    transform: rotate(0) scale(1);
  }
  25% {
    transform: rotate(10deg) scale(1.1);
  }
  50% {
    transform: rotate(0) scale(1);
  }
  75% {
    transform: rotate(-10deg) scale(1.1);
  }
  100% {
    transform: rotate(0) scale(1);
  }
}

@keyframes core-scale {
  0% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.5);
  }
  100% {
    transform: scale(1);
  }
}
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 50 50 L 150 150 L 50 250 Z" />
      <path d="M 150 150 L 150 250 L 250 150 Z" />
      <path d="M 250 150 L 150 250 L 50 150 Z" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
