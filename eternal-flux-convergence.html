<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>ETERNAL FLUX CONVERGENCE</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes core-pulse {
    0% {transform: scale(1);}
    50% {transform: scale(1.1);}
    100% {transform: scale(1);}
  }
  @keyframes particle-dance {
    0% {transform: translate(-50%, -50%) rotate(0);}
    100% {transform: translate(-50%, -50%) rotate(360deg);}
  }
  @keyframes neural-flicker {
    0% {opacity: 1;}
    50% {opacity: 0.5;}
    100% {opacity: 1;}
  }
  .vortex-container {
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    position: absolute;
  }
  .core {
    position: relative;
    transform: translate(-50%, -50%) scale(1);
    border-radius: 50%;
  }
  .core-shadow {
    box-shadow: 0 0 0 0 #03a9f4, 0 0 0 10px #03a9f4, 0 0 0 20px #03a9f4, 0 0 0 30px #03a9f4, 0 0 0 40px #03a9f4, 0 0 0 50px #03a9f4;
    position: absolute;
    top: -100px;
    left: -100px;
    width: 200px;
    height: 200px;
  }
  .neural-web {
    fill: none;
    stroke: #fff;
    stroke-width: 2;
  }
  .particle {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(0);
    animation: particle-dance 10s infinite linear;
    border-radius: 50%;
    background: linear-gradient(to bottom, #03a9f4, #03a9f4);
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container" style="position:absolute;top:0;left:0;width:100%;height:100%;z-index:-1;">
    <div class="core">
      <div class="core-shadow" style="background:linear-gradient(to bottom, #03a9f4, #03a9f4); box-shadow: 0 0 0 0 #03a9f4, 0 0 0 10px #03a9f4, 0 0 0 20px #03a9f4, 0 0 0 30px #03a9f4, 0 0 0 40px #03a9f4, 0 0 0 50px #03a9f4;">
        <div class="core-shadow" style="box-shadow: 0 0 0 0 #03a9f4, 0 0 0 10px #03a9f4, 0 0 0 20px #03a9f4, 0 0 0 30px #03a9f4, 0 0 0 40px #03a9f4, 0 0 0 50px #03a9f4;"></div>
        <div class="core-shadow" style="box-shadow: 0 0 0 0 #03a9f4, 0 0 0 10px #03a9f4, 0 0 0 20px #03a9f4, 0 0 0 30px #03a9f4, 0 0 0 40px #03a9f4, 0 0 0 50px #03a9f4;"></div>
        <div class="core-shadow" style="box-shadow: 0 0 0 0 #03a9f4, 0 0 0 10px #03a9f4, 0 0 0 20px #03a9f4, 0 0 0 30px #03a9f4, 0 0 0 40px #03a9f4, 0 0 0 50px #03a9f4;"></div>
        <div class="core-shadow" style="box-shadow: 0 0 0 0 #03a9f4, 0 0 0 10px #03a9f4, 0 0 0 20px #03a9f4, 0 0 0 30px #03a9f4, 0 0 0 40px #03a9f4, 0 0 0 50px #03a9f4;"></div>
        <div class="core-shadow" style="box-shadow: 0 0 0 0 #03a9f4, 0 0 0 10px #03a9f4, 0 0 0 20px #03a9f4, 0 0 0 30px #03a9f4, 0 0 0 40px #03a9f4, 0 0 0 50px #03a9f4;"></div>
        <div class="core-shadow" style="box-shadow: 0 0 0 0 #03a9f4, 0 0 0 10px #03a9f4, 0 0 0 20px #03a9f4, 0 0 0 30px #03a9f4, 0 0 0 40px #03a9f4, 0 0 0 50px #03a9f4;"></div>
      </div>
      <div class="core" style="background:linear-gradient(to bottom, #03a9f4, #03a9f4); width: 0; height: 0; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(1); position: relative; border-radius: 50%;"></div>
    </div>
    <svg class="neural-web" x="0" y="0" width="100%" height="100%" viewBox="0 0 100 100">
      <path d="M 50 0 C 20 40 40 50 80 0" stroke="#fff" stroke-width="2" opacity="0.2"/>
      <path d="M 65 0 C 35 50 55 40 90 0" stroke="#fff" stroke-width="2" opacity="0.5"/>
      <path d="M 70 0 C 25 35 45 20 75 50" stroke="#fff" stroke-width="2" opacity="0.3"/>
      <rect x="0" y="0" width="100" height="100" fill="none" stroke="#fff" stroke-width="2"/>
    </svg>
    <div class="particle" style="position: absolute; border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(0); animation: particle-dance 10s infinite linear;"></div>
    <div class="particle" style="position: absolute; border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(0); animation: particle-dance 20s infinite ease-in-out;"></div>
    <div class="particle" style="position: absolute; border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(0); animation: particle-dance 10s infinite ease-out;"></div>
  </div>
        </div>
        </body>
        </html>
