<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Eternal Horizon Singularity</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: rotate(0deg) translate(0px, 0px);
    }
    50% {
      transform: rotate(360deg) translate(-10px, 10px);
    }
    100% {
      transform: rotate(0deg) translate(10px, -10px);
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    100% {
      transform: scale(1.2);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: rotate(0deg);
    }
    20% {
      transform: rotate(10deg);
    }
    40% {
      transform: rotate(0deg) scale(1.1);
    }
    60% {
      transform: rotate(0deg) scale(1);
    }
    100% {
      transform: rotate(0deg);
    }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: linear-gradient(90deg, #1A3C68, #212121);
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    border-radius: 50px;
    background: linear-gradient(90deg, #FF69B4, #FF69B4);
  }
  .core::before, .core::after {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    content: '';
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #FF69B4;
  }
  .core::before {
    top: 20px;
  }
  .core::before, .core::after {
    animation: core-pulse 1s infinite;
  }
  .particle {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: linear-gradient(90deg, #1A3C68, #212121);
    animation: particle-dance 10s infinite;
  }
  @keyframes particle-dance {
    0% {
      transform: rotate(0deg) translate(0px, 0px);
    }
    50% {
      transform: rotate(360deg) translate(-10px, 10px);
    }
    100% {
      transform: rotate(0deg) translate(10px, -10px);
    }
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
    stroke-width: 2px;
  }
  .neural-web path {
    transform: rotate(45deg);
  }
  @keyframes neural-flicker {
    0% {
      transform: rotate(0deg);
    }
    20% {
      transform: rotate(10deg);
    }
    40% {
      transform: rotate(0deg) scale(1.1);
    }
    60% {
      transform: rotate(0deg) scale(1);
    }
    100% {
      transform: rotate(0deg);
    }
  }
  .core {
    box-shadow: 0 0 10px #FF69B4, 0 0 20px #FF69B4, 0 0 30px #FF69B4, 0 0 40px #FF69B4, 0 0 50px #FF69B4, 0 0 60px #FF69B4;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 50 50 L 70 70 M 70 70 L 90 90 M 90 90 L 110 110 M 110 110 L 130 130" />
      <path d="M 50 50 L 30 70 M 30 70 L 10 90 M 10 90 L -10 110 M -10 110 L -30 130" />
      <path d="M 130 130 L 150 150 M 150 150 L 170 170 M 170 170 L 190 190 M 190 190 L 210 210" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
