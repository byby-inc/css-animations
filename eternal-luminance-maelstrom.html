<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Eternal Luminance Maelstrom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    100% {
      transform: scale(1.5);
    }
  }
  @keyframes particle-dance {
    0% {
      transform: translate(0, 0) rotate(0deg);
    }
    100% {
      transform: translate(20px, -20px) rotate(360deg);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: rotate(0deg);
    }
    100% {
      transform: rotate(360deg);
    }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    z-index: -1;
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    background: linear-gradient(to bottom, #fff 0%, #f7d2c4 100%);
    box-shadow: 0 0 0 0 #fff, 0 0 0 0 #fff, 0 0 0 0 #fff, 0 0 0 0 #fff, 0 0 0 0 #fff, 0 0 0 0 #fff;
  }
  .core::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(farthest-side, #fff 0%, #f0f0f0 20%, #f7d2c4 100%);
  }
  .core::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(45deg, #fff 20%, #f0f0f0 40%, #f7d2c4 20%, #fff 60%, #f0f0f0 80%, #f7d2c4 100%);
  }
  .particle {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, #fff 0%, #f0f0f0 20%, #f7d2c4 40%, #fff 60%, #f0f0f0 80%, #f7d2c4 100%);
    animation: particle-dance 4s infinite;
  }
  .particle:nth-child(1) {
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
  .particle:nth-child(2) {
    top: 40%;
    left: 30%;
  }
  .particle:nth-child(3) {
    top: 30%;
    left: 20%;
  }
  .neural-web {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
    stroke-width: 10;
    animation: neural-flicker 2s infinite;
  }
  .neural-web path:nth-child(1) {
    d: "M 50 50 L 30 100";
  }
  .neural-web path:nth-child(2) {
    d: "M 50 50 L 20 120";
  }
  .neural-web path:nth-child(3) {
    d: "M 50 50 L 30 80";
  }
  .neural-web path:nth-child(4) {
    d: "M 50 50 L 40 100";
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core">
      <div class="core::before"></div>
      <div class="core::after"></div>
    </div>
    <svg class="neural-web">
      <path class="neural-web path"></path>
      <path class="neural-web path"></path>
      <path class="neural-web path"></path>
      <path class="neural-web path"></path>
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
