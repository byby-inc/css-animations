<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>ETERNAL Magma Horizon</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: rotate(0deg) translate(0, 0);
    }
    100% {
      transform: rotate(360deg) translate(10px, 10px);
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    100% {
      transform: scale(1.2);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: translate(0, 0);
    }
    100% {
      transform: translate(-5px, 0) rotate(10deg);
    }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%,75% 0%,100% 25%,50% 100%,0% 25%);
    background: linear-gradient(to right, #FF9900, #FFA07A);
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 20px;
    height: 20px;
    background: radial-gradient(#F7DC6F, #F7DC6F, #FFA07A);
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.2), 0 0 20px rgba(0, 0, 0, 0.4), 0 0 30px rgba(0, 0, 0, 0.6), 0 0 40px rgba(0, 0, 0, 0.8), 0 0 50px rgba(0, 0, 0, 1);
    border-radius: 50%;
  }
  .particle {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(0, -50%);
    border-radius: 50%;
    width: 10px;
    height: 10px;
    background: linear-gradient(to right, #FFA07A, #FF9900);
  }
  .particle-dance {
    animation: particle-dance 2s infinite;
  }
  .core-pulse {
    animation: core-pulse 1s infinite;
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: #fff;
  }
  .stroke {
    stroke: #fff;
    stroke-width: 1;
  }
  .neural-flicker {
    animation: neural-flicker 3s infinite;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core core-pulse"></div>
    <svg class="neural-web">
      <path class="stroke" d="M 50 50 L 100 100 L 150 50 L 100 0 Z" />
      <path class="stroke" d="M 100 100 L 250 250 L 300 100 L 250 50 Z" />
      <path class="stroke" d="M 150 50 L 350 350 L 400 50 L 350 0 Z" />
    </svg>
    <div class="particle particle-dance" style="top: 20%"></div>
    <div class="particle particle-dance" style="top: 30%"></div>
    <div class="particle particle-dance" style="top: 40%"></div>
    <div class="particle particle-dance" style="top: 50%"></div>
    <div class="particle particle-dance" style="top: 60%"></div>
    <div class="particle particle-dance" style="top: 70%"></div>
    <div class="particle particle-dance" style="top: 80%"></div>
    <div class="particle particle-dance" style="top: 90%"></div>
  </div>
        </div>
        </body>
        </html>
