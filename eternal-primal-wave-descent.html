<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>ETERNAL PRIMAL WAVE DESCENT</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% { transform: translate(0, 0) rotate(0); }
    50% { transform: translate(10px, -10px) rotate(180deg); }
    100% { transform: translate(0, 0) rotate(0); }
  }
  @keyframes core-pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }
  @keyframes neural-flicker {
    0% { transform: translate(0, 0) rotate(0deg); }
    50% { transform: translate(5px, -5px) rotate(30deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }
  
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: linear-gradient(45deg, #7b4eff, #3f0f5c, #7b4eff);
  }
  
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(90deg, #c5116d, #7b4eff);
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.5), 
                 0 0 20px rgba(255, 255, 255, 0.5), 
                 0 0 30px rgba(255, 255, 255, 0.5), 
                 0 0 40px rgba(255, 255, 255, 0.5), 
                 0 0 50px rgba(255, 255, 255, 0.5), 
                 0 0 60px rgba(255, 255, 255, 0.5);
    animation: core-pulse 5s infinite;
  }
  
  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(90deg, #7b4eff, #3f0f5c, #7b4eff);
  }
  .particle:nth-child(1) {
    top: 20%;
    left: 20%;
    width: 20px;
    height: 20px;
    animation: particle-dance 2s infinite;
  }
  .particle:nth-child(2) {
    top: 70%;
    left: 50%;
    width: 30px;
    height: 30px;
    animation: particle-dance 3s infinite;
  }
  .particle:nth-child(3) {
    top: 80%;
    left: 10%;
    width: 25px;
    height: 25px;
    animation: particle-dance 4s infinite;
  }
  .particle:nth-child(4) {
    top: 20%;
    left: 80%;
    width: 35px;
    height: 35px;
    animation: particle-dance 2s infinite;
  }
  .particle:nth-child(5) {
    top: 10%;
    left: 40%;
    width: 45px;
    height: 45px;
    animation: particle-dance 5s infinite;
  }
  .particle:nth-child(6) {
    top: 40%;
    left: 30%;
    width: 50px;
    height: 50px;
    animation: particle-dance 4s infinite;
  }
  .particle:nth-child(7) {
    top: 60%;
    left: 20%;
    width: 55px;
    height: 55px;
    animation: particle-dance 6s infinite;
  }
  .particle:nth-child(8) {
    top: 30%;
    left: 50%;
    width: 60px;
    height: 60px;
    animation: particle-dance 3s infinite;
  }
  .particle:nth-child(9) {
    top: 50%;
    left: 70%;
    width: 70px;
    height: 70px;
    animation: particle-dance 2s infinite;
  }
  .particle:nth-child(10) {
    top: 80%;
    left: 60%;
    width: 80px;
    height: 80px;
    animation: particle-dance 5s infinite;
  }
  
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: #fff;
  }
  .neural-web path {
    stroke: #fff;
    transform: translate(20px, 10px);
  }
  .neural-web path:nth-child(1) {
    transform: translate(20px, 10px) rotate(0deg);
    animation: neural-flicker 4s infinite;
  }
  .neural-web path:nth-child(2) {
    transform: translate(40px, 20px) rotate(40deg);
    animation: neural-flicker 6s infinite;
  }
  .neural-web path:nth-child(3) {
    transform: translate(60px, 30px) rotate(80deg);
    animation: neural-flicker 8s infinite;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 50 50 H 10" />
      <path d="M 50 50 L 60 60" />
      <path d="M 50 50 C 80 30, 60 40, 100 60" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
