<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Eternal Primordial Quasar Fusion</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            /* CSS Styles */
  * { box-sizing: border-box; }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background-image: linear-gradient(to bottom, #e4c5f5, #c594ec);
    background-size: 300% 300%;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1), 0 0 20px rgba(0, 0, 0, 0.2), 0 0 30px rgba(0, 0, 0, 0.3), 0 0 40px rgba(0, 0, 0, 0.4), 0 0 50px rgba(0, 0, 0, 0.5), 0 0 60px rgba(0, 0, 0, 0.6);
  }

  .core:hover {
    background-size: 400% 400%;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    background-image: linear-gradient(to bottom, #f9b3ff, #c4a3d3);
    animation: particle-dance infinite 0.5s;
    animation-fill-mode: both;
  }

  @keyframes particle-dance {
    0% {
      transform: translate(-50%, -50%) scale(1);
    }
    50% {
      transform: translate(-50%, -50%) scale(1.1);
    }
    100% {
      transform: translate(-50%, -50%) scale(1);
    }
  }

  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
  }

  .neural-web path {
    stroke: #fff;
    stroke-width: 2;
    stroke-linecap: round;
  }

  @keyframes neural-flicker {
    0% {
      transform: translateY(0);
    }
    50% {
      transform: translateY(-10px);
    }
    100% {
      transform: translateY(0);
    }
  }

  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.1);
    }
    100% {
      transform: scale(1);
    }
  }

  ::-webkit-scrollbar {
    display: none;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 50 50 L 70 20"/>
      <path d="M 70 70 L 50 40"/>
      <path d="M 90 50 L 70 30"/>
      <path d="M 50 90 L 40 60"/>
      <path d="M 30 50 L 50 30"/>
    </svg>
    <div class="particle" style="top: 10px; left: 20px;"></div>
    <div class="particle" style="top: 50px; left: 70px;"></div>
    <div class="particle" style="top: 90px; left: 30px;"></div>
    <div class="particle" style="top: 20px; left: 90px;"></div>
    <div class="particle" style="top: 70px; left: 50px;"></div>
  </div>
        </div>
        </body>
        </html>
