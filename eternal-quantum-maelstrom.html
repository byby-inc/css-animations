<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Eternal Quantum Maelstrom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: rotate(0deg) translate(0px, 0px);
    }
    50% {
      transform: rotate(180deg) translate(50px, 50px);
    }
    100% {
      transform: rotate(360deg) translate(0px, 0px);
    }
  }

  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.2);
    }
    100% {
      transform: scale(1);
    }
  }

  @keyframes neural-flicker {
    0% {
      transform: translate(0px, 0px) rotate(0deg);
    }
    50% {
      transform: translate(10px, 10px) rotate(90deg);
    }
    100% {
      transform: translate(0px, 0px) rotate(0deg);
    }
  }

  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: circle(50% at 50% 50%);
    background: linear-gradient(to bottom, #0f2040, #110a6d);
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: linear-gradient(to bottom, #ffd700, #ffd123);
    box-shadow: 
      0px 0px 10px #fff,
      0px 0px 20px #fff,
      0px 0px 30px #fff,
      0px 0px 40px #fff,
      0px 0px 50px #fff,
      0px 0px 60px #fff;
    animation: core-pulse 3s infinite;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(to bottom, #c9e4ca, #87ceeb);
    animation: particle-dance 5s infinite;
  }

  .particle:nth-child(1) {
    top: 10%;
    left: 10%;
    width: 10px;
    height: 10px;
    animation-delay: 0s;
  }

  .particle:nth-child(2) {
    top: 20%;
    left: 20%;
    width: 15px;
    height: 15px;
    animation-delay: 1s;
  }

  .particle:nth-child(3) {
    top: 30%;
    left: 30%;
    width: 20px;
    height: 20px;
    animation-delay: 2s;
  }

  .particle:nth-child(4) {
    top: 40%;
    left: 40%;
    width: 12px;
    height: 12px;
    animation-delay: 3s;
  }

  .particle:nth-child(5) {
    top: 50%;
    left: 50%;
    width: 18px;
    height: 18px;
    animation-delay: 4s;
  }

  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    animation: neural-flicker 2s infinite;
  }

  .neural-web path {
    stroke: #fff;
    stroke-width: 2;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M100,200 C200,300 300,200 400,300" />
      <path d="M200,100 C300,200 400,100 500,200" />
      <path d="M300,50 C400,150 500,50 600,150" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
