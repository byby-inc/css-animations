<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Eternal Radiant Maelstrom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: rotate(0deg) translateX(0px);
    }
    50% {
      transform: rotate(180deg) translateX(100px);
    }
    100% {
      transform: rotate(360deg) translateX(0px);
    }
  }

  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.2);
    }
    100% {
      transform: scale(1);
    }
  }

  @keyframes neural-flicker {
    0% {
      transform: translateY(0px);
    }
    50% {
      transform: translateY(10px);
    }
    100% {
      transform: translateY(0px);
    }
  }

  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: circle(50% at 50% 50%);
    background: linear-gradient(45deg, #ff0000, #00ff00, #0000ff);
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(45deg, #ff0000, #00ff00, #0000ff);
    box-shadow: 
      0px 0px 10px #fff,
      0px 0px 20px #fff,
      0px 0px 30px #fff,
      0px 0px 40px #fff,
      0px 0px 50px #fff,
      0px 0px 60px #fff;
    animation: core-pulse 5s infinite;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(45deg, #ff0000, #00ff00, #0000ff);
    animation: particle-dance 10s infinite;
  }

  .particle:nth-child(1) {
    top: 10%;
    left: 10%;
    width: 20px;
    height: 20px;
  }

  .particle:nth-child(2) {
    top: 20%;
    left: 20%;
    width: 30px;
    height: 30px;
  }

  .particle:nth-child(3) {
    top: 30%;
    left: 30%;
    width: 40px;
    height: 40px;
  }

  .particle:nth-child(4) {
    top: 40%;
    left: 40%;
    width: 50px;
    height: 50px;
  }

  .particle:nth-child(5) {
    top: 50%;
    left: 50%;
    width: 60px;
    height: 60px;
  }

  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    animation: neural-flicker 15s infinite;
  }

  .neural-web path {
    stroke: #fff;
    stroke-width: 2;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M100,100 L200,200" />
      <path d="M200,100 L300,200" />
      <path d="M300,100 L400,200" />
      <path d="M400,100 L500,200" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
