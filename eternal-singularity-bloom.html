<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>ETERNAL Singularity Bloom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% { transform: translate(0, 0); }
    50% { transform: translate(20px, -10px); }
    100% { transform: translate(0, 0); }
  }
  @keyframes core-pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }
  @keyframes neural-flicker {
    0% { transform: rotate(0); }
    50% { transform: rotate(10deg); }
    100% { transform: rotate(0); }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%,75% 0%,100% 25%,50% 100%,0% 25%);
    background-image: linear-gradient(to right, #3F5E8C, #7D8C98);
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    width: 150px;
    height: 150px;
    background-image: linear-gradient(to right, #3F5E8C, #7D8C98);
    box-shadow: 0 0 0 10px rgba(255, 255, 255, 0.3), 0 0 0 15px rgba(255, 255, 255, 0.1);
    animation: core-pulse infinite 3s;
  }
  .core::before, .core::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    width: 100px;
    height: 100px;
    background-image: linear-gradient(to right, #3F5E8C, #7D8C98);
    box-shadow: inset 0 0 0 10px rgba(255, 255, 255, 0.3), inset 0 0 0 15px rgba(255, 255, 255, 0.1);
  }
  .core::before {
    animation: core-pulse infinite 3s;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    background-image: linear-gradient(to right, #3F5E8C, #7D8C98);
    animation: particle-dance infinite 2s;
  }
  .neural-web {
    position: absolute;
    width: 100%;
    height: 100%;
    fill: #fff;
    animation: neural-flicker infinite 2s;
  }
  .neural-web path:nth-child(1) {
    d: M 50 50 L 20 60 L 80 60;
  }
  .neural-web path:nth-child(2) {
    d: M 50 50 L 80 60 L 20 60;
  }
  .neural-web path:nth-child(3) {
    d: M 50 50 L 20 80 L 80 80;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 50 50 L 20 60 L 80 60"/>
      <path d="M 50 50 L 80 60 L 20 60"/>
      <path d="M 50 50 L 20 80 L 80 80"/>
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
