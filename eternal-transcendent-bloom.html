<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Eternal Transcendent Bloom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: rotate(0deg) translate(0, 0);
    }
    50% {
      transform: rotate(180deg) translate(20px, 20px);
    }
    100% {
      transform: rotate(360deg) translate(0, 0);
    }
  }

  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.2);
    }
    100% {
      transform: scale(1);
    }
  }

  @keyframes neural-flicker {
    0% {
      transform: scale(1) rotate(0deg);
    }
    50% {
      transform: scale(1.1) rotate(10deg);
    }
    100% {
      transform: scale(1) rotate(0deg);
    }
  }

  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: linear-gradient(45deg, #ff69b4, #ffe6cc);
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(45deg, #ff69b4, #ffe6cc);
    box-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #fff, 0 0 40px #fff, 0 0 50px #fff, 0 0 60px #fff;
    animation: core-pulse 3s infinite;
  }

  .particle {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: linear-gradient(45deg, #ffe6cc, #ff69b4);
    animation: particle-dance 2s infinite;
  }

  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    animation: neural-flicker 4s infinite;
  }

  .neural-web path {
    stroke: #fff;
    stroke-width: 2;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M100,200 C200,200 300,300 400,200" />
      <path d="M400,200 C300,300 200,400 100,200" />
      <path d="M200,100 C300,200 400,300 200,400" />
    </svg>
    <div class="particle" style="top: 10%; left: 10%"></div>
    <div class="particle" style="top: 20%; left: 30%"></div>
    <div class="particle" style="top: 30%; left: 50%"></div>
    <div class="particle" style="top: 40%; left: 70%"></div>
    <div class="particle" style="top: 50%; left: 90%"></div>
    <div class="particle" style="top: 60%; left: 10%"></div>
    <div class="particle" style="top: 70%; left: 30%"></div>
    <div class="particle" style="top: 80%; left: 50%"></div>
    <div class="particle" style="top: 90%; left: 70%"></div>
  </div>
        </div>
        </body>
        </html>
