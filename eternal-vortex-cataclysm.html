<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Eternal Vortex Cataclysm</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            /* Vortex Container */
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    z-index: -1;
    background: linear-gradient(90deg, #FF9900, #FF0000, #FF6600);
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  }

  /* Core */
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    background: linear-gradient(0deg, #FFC400, #FFA07A);
    box-shadow: 
      0 0 10px #FFC400,
      0 0 10px #FFC400,
      0 0 20px #FFC400,
      0 0 30px #FFC400,
      0 0 40px #FFC400,
      0 0 50px #FFC400;
    animation: core-pulse 2s infinite;
  }

  /* Particles */
  .particle {
    position: absolute;
    border-radius: 50%;
    width: 10px;
    height: 10px;
    background: linear-gradient(0deg, #FF9900, #FF6600);
    animation: particle-dance 5s infinite;
  }
  .particle:nth-child(1) {
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.5);
  }
  .particle:nth-child(2) {
    top: 50%;
    left: 10%;
    transform: translate(-10%, -50%) rotate(45deg);
  }
  .particle:nth-child(3) {
    top: 10%;
    left: 50%;
    transform: translate(-50%, -10%) scale(1);
  }
  .particle:nth-child(4) {
    top: 50%;
    left: 90%;
    transform: translate(-10%, -50%) rotate(-45deg);
  }
  .particle:nth-child(5) {
    top: 90%;
    left: 50%;
    transform: translate(-50%, 10%) scale(0.5);
  }
  .particle:nth-child(6) {
    top: 40%;
    left: 20%;
    transform: translate(-10%, -40%) rotate(135deg);
  }
  .particle:nth-child(7) {
    top: 70%;
    left: 80%;
    transform: translate(-10%, -70%) rotate(-135deg);
  }
  .particle:nth-child(8) {
    top: 30%;
    left: 60%;
    transform: translate(-60%, -30%) scale(1);
  }
  .particle:nth-child(9) {
    top: 80%;
    left: 20%;
    transform: translate(-20%, -80%) scale(0.5);
  }
  .particle:nth-child(10) {
    top: 20%;
    left: 40%;
    transform: translate(-40%, -20%) rotate(90deg);
  }

  /* Neural Web */
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: #fff;
  }
  .neural-web path {
    stroke: #fff;
    stroke-width: 2;
  }

  /* Keyframes */
  @keyframes particle-dance {
    0% {
      transform: translate(-10%, -50%) rotate(0deg);
    }
    50% {
      transform: translate(-10%, -50%) rotate(360deg);
    }
    100% {
      transform: translate(-10%, -50%) rotate(0deg);
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    25% {
      transform: scale(1.1);
    }
    50% {
      transform: scale(1);
    }
    75% {
      transform: scale(1.1);
    }
    100% {
      transform: scale(1);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: scale(1);
    }
    5% {
      transform: scale(1.05);
    }
    10% {
      transform: scale(1);
    }
    95% {
      transform: scale(1.05);
    }
    100% {
      transform: scale(1);
    }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 50 50 Q 80 100 100 80" />
      <path d="M 50 50 Q 70 120 100 140" />
      <path d="M 50 50 Q 30 10 60 30" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
