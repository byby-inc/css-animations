<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Eternal Vortex Eruption</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            /* Clip-Path */
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%,75% 0%,100% 25%,50% 100%,0% 25%);
  }

  /* Core */
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background-image: linear-gradient(to top, #fff, #333);
    background-size: 300% 300%;
    border-radius: 50%;
    width: 200px;
    height: 200px;
    box-shadow:
      0 0 10px #fff,
      10px 10px 20px #000,
      -10px 10px 20px #000,
      10px -10px 20px #000,
      -10px -10px 20px #000,
      0 0 10px #fff;
  }

  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.2);
    }
    100% {
      transform: scale(1);
    }
  }
  .core:hover {
    animation: core-pulse 2s infinite;
  }

  /* Particles */
  .particle {
    position: absolute;
    border-radius: 50%;
    background-image: linear-gradient(to top, #333, #fff);
  }

  @keyframes particle-dance {
    0% {
      transform: translate(150%, 150%) rotate(0deg);
    }
    50% {
      transform: translate(0, 0) rotate(360deg);
    }
    100% {
      transform: translate(150%, 150%) rotate(720deg);
    }
  }
  .particle:hover {
    animation: particle-dance 4s infinite;
  }

  /* Neural Web */
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
  }
  .neural-web path {
    stroke-dasharray: 100px;
    stroke-dashoffset: 400px;
    animation: neural-flicker 6s infinite;
  }

  @keyframes neural-flicker {
    0% {
      stroke-dashoffset: 400px;
    }
    50% {
      stroke-dashoffset: 100px;
    }
    100% {
      stroke-dashoffset: 400px;
    }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 100 300 L 300 400 L 600 200 L 400 200 L 200 400 L 100 300 Z" stroke-dasharray="100" stroke-dashoffset="200" />
      <path d="M 300 400 L 600 200 L 400 200 L 200 400 L 100 300 L 400 500 L 600 300 L 200 100 L 300 100 Z" stroke-dasharray="150" stroke-dashoffset="300" />
      <path d="M 200 100 L 400 200 L 600 300 L 400 500 L 100 300 L 100 400 L 200 300 L 400 600 L 600 400 Z" stroke-dasharray="120" stroke-dashoffset="250" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
