<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Eternally Blazing Supernova Dawn</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: rotate(0deg) translateX(0px);
    }
    50% {
      transform: rotate(360deg) translateX(200px);
    }
    100% {
      transform: rotate(0deg) translateX(0px);
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.2);
    }
    100% {
      transform: scale(1);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: rotate(0deg) translateX(0px);
    }
    50% {
      transform: rotate(30deg) translateX(50px);
    }
    100% {
      transform: rotate(0deg) translateX(0px);
    }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: circle(50% at 50% 50%);
    background: linear-gradient(to top, #3498db, #e74c3c);
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    width: 10px;
    height: 10px;
    background: linear-gradient(to bottom, #f1c40f, #2ecc71);
    animation: particle-dance 3s infinite;
    transform: rotate(0deg);
  }
  .particle:nth-child(1) {
    top: 50%;
    left: 50%;
    animation-duration: 4s;
  }
  .particle:nth-child(2) {
    top: 25%;
    left: 25%;
    animation-duration: 2s;
  }
  .particle:nth-child(3) {
    top: 75%;
    left: 25%;
    animation-duration: 5s;
  }
  .particle:nth-child(4) {
    top: 25%;
    left: 75%;
    animation-duration: 3s;
  }
  .particle:nth-child(5) {
    top: 75%;
    left: 75%;
    animation-duration: 6s;
  }
  .particle:nth-child(6) {
    top: 50%;
    left: 25%;
    animation-duration: 1s;
  }
  .particle:nth-child(7) {
    top: 25%;
    left: 50%;
    animation-duration: 2.5s;
  }
  .particle:nth-child(8) {
    top: 75%;
    left: 50%;
    animation-duration: 4.5s;
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(to bottom, #2ecc71, #e74c3c);
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 0, 0, 0.9), 0 0 40px rgba(0, 0, 0, 1), 0 0 50px rgba(0, 0, 0, 0.7), 0 0 60px rgba(0, 0, 0, 0.5);
    animation: core-pulse 1s infinite;
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
    stroke-width: 2px;
  }
  .neural-web path {
    animation: neural-flicker 2s infinite;
  }
  .neural-web path:nth-child(1) {
    d: "M 25,25 C 50,25 50,50 25,50 M 125,75 C 125,100 75,100 75,75";
  }
  .neural-web path:nth-child(2) {
    d: "M 75,125 C 100,125 100,150 75,150 M 125,25 C 125,50 150,50 150,125";
  }
  .neural-web path:nth-child(3) {
    d: "M 25,75 C 50,75 50,100 25,100 M 150,75 C 150,100 50,100 50,75";
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 25,25 C 50,25 50,50 25,50 M 125,75 C 125,100 75,100 75,75"></path>
      <path d="M 75,125 C 100,125 100,150 75,150 M 125,25 C 125,50 150,50 150,125"></path>
      <path d="M 25,75 C 50,75 50,100 25,100 M 150,75 C 150,100 50,100 50,75"></path>
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
