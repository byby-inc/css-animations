<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ethereal Cascade Horizon</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            .vortex-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  background: radial-gradient(ellipse at center, #3b5998 0%, #6495ed 100%);
}

.vortex-container .core {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 100px;
  height: 100px;
  border-radius: 50px;
  background: linear-gradient(to bottom, #6495ed 0%, #4682b4 100%);
  box-shadow: 0 0 10px #6495ed, 0 0 10px #4682b4, 0 0 10px #3b5998, 0 0 10px #6495ed, 0 0 10px #4682b4, 0 0 10px #3b5998;
  animation: core-pulse 5s infinite;
}

.particle {
  position: absolute;
  top: 50%;
  left: 50%;
  border-radius: 50%;
  width: 20px;
  height: 20px;
  background: linear-gradient(to bottom, #6495ed 0%, #4682b4 100%);
  animation: particle-dance 3s infinite;
}

.neural-web {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  fill: none;
  stroke: #fff;
  stroke-width: 2;
  animation: neural-flicker 2s infinite;
}

.neural-web path {
  stroke-dasharray: 100 100;
  stroke-dashoffset: 100;
}

@keyframes particle-dance {
  0% {
    transform: translate(-50%, -50%) rotate(0deg);
  }
  50% {
    transform: translate(-50%, -50%) rotate(360deg);
  }
  100% {
    transform: translate(-50%, -50%) rotate(0deg);
  }
}

@keyframes core-pulse {
  0% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.1);
  }
  100% {
    transform: scale(1);
  }
}

@keyframes neural-flicker {
  0% {
    transform: rotate(0deg);
  }
  25% {
    transform: rotate(360deg);
  }
  50% {
    transform: rotate(0deg);
    stroke-dashoffset: 100;
  }
  75% {
    stroke-dashoffset: -100;
  }
  100% {
    stroke-dashoffset: -100;
  }
}
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 50 50 H 75 v-25 h-25 v25 h25 v-25" />
      <path d="M 25 75 h25 v-25 h-25 v25 h25 v-25" />
      <path d="M 50 25 v25 H 25 v-25 h25 v25 H 50" />
    </svg>
    <div class="particle" style="top: -100px; left: 50%;"></div>
    <div class="particle" style="top: 150px; left: 75%;"></div>
    <div class="particle" style="top: 200px; left: 25%;"></div>
    <div class="particle" style="top: -50px; left: 50%;"></div>
    <div class="particle" style="top: -50px; left: 25%;"></div>
    <div class="particle" style="top: 50px; left: 100%;"></div>
    <div class="particle" style="top: -150px; left: 50%;"></div>
  </div>
        </div>
        </body>
        </html>
