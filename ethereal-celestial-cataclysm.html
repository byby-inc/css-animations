<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ethereal Celestial Cataclysm</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            body,
html {
  margin: 0;
  padding: 0;
  overflow: hidden;
}

.vortex-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  clip-path: circle(50% at 50% 50%);
  z-index: -1;
  background: radial-gradient(ellipse at center, #232323, #121212);
}

.core {
  position: absolute;
  width: 50px;
  height: 50px;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: linear-gradient(90deg, #333, #666);
  border-radius: 50%;
  box-shadow:
    0 0 50px rgba(255, 255, 255, 0.1),
    0 0 100px rgba(255, 255, 255, 0.2),
    0 0 150px rgba(255, 255, 255, 0.3),
    0 0 200px rgba(255, 255, 255, 0.4),
    0 0 250px rgba(255, 255, 255, 0.5),
    0 0 300px rgba(255, 255, 255, 0.6);
  animation: core-pulse 2s infinite;
}

.core::after {
  content: '';
  position: absolute;
  width: inherit;
  height: inherit;
  border-radius: inherit;
  background: linear-gradient(90deg, #333, #666);
}

@keyframes core-pulse {
  0% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.2);
  }
  100% {
    transform: scale(1);
  }
}

.particle {
  position: absolute;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: linear-gradient(90deg, #777, #888);
  animation: particle-dance 1s infinite;
}

.particle:nth-child(1) {
  top: calc(10% - 10px);
  left: calc(50% - 10px);
  animation-duration: 1.5s;
  animation-fill-mode: both;
}

.particle:nth-child(2) {
  top: calc(20% - 10px);
  left: calc(20% - 10px);
  animation-duration: 2s;
  animation-delay: 0.5s;
  animation-fill-mode: both;
}

.particle:nth-child(3) {
  top: calc(30% - 10px);
  left: calc(70% - 10px);
  animation-duration: 1.2s;
  animation-delay: 1s;
  animation-fill-mode: both;
}

.particle:nth-child(4) {
  top: calc(40% - 10px);
  left: calc(30% - 10px);
  animation-duration: 1.5s;
  animation-delay: 1.5s;
  animation-fill-mode: both;
}

.particle:nth-child(5) {
  top: calc(50% - 10px);
  left: calc(50% - 10px);
  animation-duration: 2s;
  animation-delay: 2s;
  animation-fill-mode: both;
}

@keyframes particle-dance {
  0% {
    transform: rotate(0deg) translateX(0px) translateY(0px);
  }
  25% {
    transform: rotate(-10deg) translateX(10px) translateY(-5px);
  }
  50% {
    transform: rotate(-20deg) translateX(20px) translateY(-10px);
  }
  75% {
    transform: rotate(-30deg) translateX(30px) translateY(-15px);
  }
  100% {
    transform: rotate(-40deg) translateX(40px) translateY(-20px);
  }
}

.neural-web {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  stroke-width: 1;
  stroke: #fff;
}

.neural-web .path-1 {
  stroke-dasharray: 100;
  stroke-dashoffset: 100;
  animation: neural-flicker 3s infinite;
}

.neural-web .path-2 {
  stroke-dasharray: 150;
  stroke-dashoffset: 150;
  animation: neural-flicker 4s infinite;
  animation-delay: 2s;
}

.neural-web .path-3 {
  stroke-dasharray: 200;
  stroke-dashoffset: 200;
  animation: neural-flicker 5s infinite;
  animation-delay: 4s;
}

@keyframes neural-flicker {
  0% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.1);
  }
  100% {
    transform: scale(1);
  }
}

.neural-web path {
  stroke: #fff;
}

svg {
  width: 100%;
  height: 100%;
  fill: none;
}
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <g>
        <path class="path-1" d="M 500 500 L 500 200 L 800 200 L 800 500 L 500 500 Z" />
        <path class="path-2" d="M 600 600 L 600 100 L 900 100 L 900 600 L 600 600 Z" />
        <path class="path-3" d="M 700 700 L 700 200 L 1000 200 L 1000 700 L 700 700 Z" />
      </g>
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
