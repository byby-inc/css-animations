<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ethereal Cosmic Blossom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            .vortex-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  clip-path: circle(50% at 50% 50%);
  background: linear-gradient(45deg, #ff69b4, #ffe6cc, #ffff99);
}

.core {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: linear-gradient(45deg, #ffff99, #ffe6cc, #ff69b4);
  box-shadow: 
    0 0 10px #fff,
    0 0 20px #fff,
    0 0 30px #fff,
    0 0 40px #fff,
    0 0 50px #fff,
    0 0 60px #fff;
  animation: core-pulse infinite 5s;
}

.particle {
  position: absolute;
  border-radius: 50%;
  background: linear-gradient(45deg, #ffe6cc, #ffff99, #ff69b4);
  animation: particle-dance infinite 3s;
}

.neural-web {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  animation: neural-flicker infinite 7s;
}

.neural-web path {
  stroke: #fff;
  stroke-width: 2;
}

@keyframes particle-dance {
  0% {
    transform: translate(0, 0) rotate(0deg);
  }
  50% {
    transform: translate(100px, 100px) rotate(180deg);
  }
  100% {
    transform: translate(0, 0) rotate(360deg);
  }
}

@keyframes core-pulse {
  0% {
    transform: translate(-50%, -50%) scale(1);
  }
  50% {
    transform: translate(-50%, -50%) scale(1.2);
  }
  100% {
    transform: translate(-50%, -50%) scale(1);
  }
}

@keyframes neural-flicker {
  0% {
    transform: scale(1) rotate(0deg);
  }
  50% {
    transform: scale(1.1) rotate(180deg);
  }
  100% {
    transform: scale(1) rotate(360deg);
  }
}
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
  <div class="core"></div>
  <svg class="neural-web">
    <path d="M100,100 C200,200 300,100 400,200" />
    <path d="M200,300 C300,200 400,300 500,200" />
    <path d="M300,100 C400,200 500,100 600,200" />
  </svg>
  <div class="particle" style="width: 20px; height: 20px; top: 10%; left: 10%;"></div>
  <div class="particle" style="width: 30px; height: 30px; top: 20%; left: 30%;"></div>
  <div class="particle" style="width: 40px; height: 40px; top: 30%; left: 50%;"></div>
  <div class="particle" style="width: 50px; height: 50px; top: 40%; left: 70%;"></div>
  <div class="particle" style="width: 60px; height: 60px; top: 50%; left: 90%;"></div>
</div>
        </div>
        </body>
        </html>
