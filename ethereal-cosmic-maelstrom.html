<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ethereal Cosmic Maelstrom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: rotate(0deg) translateX(0);
    }
    50% {
      transform: rotate(180deg) translateX(20px);
    }
    100% {
      transform: rotate(360deg) translateX(0);
    }
  }

  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.2);
    }
    100% {
      transform: scale(1);
    }
  }

  @keyframes neural-flicker {
    0% {
      transform: scale(1) rotate(0deg);
    }
    50% {
      transform: scale(1.1) rotate(10deg);
    }
    100% {
      transform: scale(1) rotate(0deg);
    }
  }

  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%,75% 0%,100% 25%,50% 100%,0% 25%);
    background: linear-gradient(#3a86ff, #ff006e);
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(#ff69b4, #ffe6cc);
    box-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #ff69b4, 0 0 40px #ffe6cc, 0 0 50px #ff69b4, 0 0 60px #ffe6cc;
    animation: core-pulse 5s infinite;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    background: linear-gradient(#ffe6cc, #ff69b4);
    animation: particle-dance 3s infinite;
  }

  .particle:nth-child(1) {
    top: 10%;
    left: 10%;
    animation-delay: 0s;
  }

  .particle:nth-child(2) {
    top: 20%;
    left: 30%;
    animation-delay: 1s;
  }

  .particle:nth-child(3) {
    top: 30%;
    left: 50%;
    animation-delay: 2s;
  }

  .particle:nth-child(4) {
    top: 40%;
    left: 70%;
    animation-delay: 3s;
  }

  .particle:nth-child(5) {
    top: 50%;
    left: 90%;
    animation-delay: 4s;
  }

  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
    animation: neural-flicker 7s infinite;
  }

  .neural-web path {
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M100,200 C150,300 250,300 300,200" />
      <path d="M200,100 C250,200 350,200 400,100" />
      <path d="M300,300 C350,400 450,400 500,300" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
