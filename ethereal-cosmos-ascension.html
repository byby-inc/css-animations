<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ethereal Cosmos Ascension</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% { transform: rotate(0deg) translate(0, 0); }
    50% { transform: rotate(180deg) translate(20px, 20px); }
    100% { transform: rotate(360deg) translate(0, 0); }
  }
  @keyframes core-pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  @keyframes neural-flicker {
    0% { transform: translate(0, 0) rotate(0deg); }
    50% { transform: translate(10px, 10px) rotate(90deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: circle(50% at 50% 50%);
    background: linear-gradient(to bottom right, #111, #333);
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(to bottom right, #fff, #ccc);
    box-shadow: 
      0 0 10px #fff,
      0 0 20px #ccc,
      0 0 30px #aaa,
      0 0 40px #888,
      0 0 50px #666,
      0 0 60px #444;
    animation: core-pulse 5s infinite;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    background: linear-gradient(to bottom right, #fff, #ccc);
    animation: particle-dance 3s infinite;
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    animation: neural-flicker 7s infinite;
  }
  .neural-web path {
    stroke: #fff;
    stroke-width: 2;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 0 0 L 100 100" />
      <path d="M 100 0 L 0 100" />
      <path d="M 50 0 L 50 100" />
    </svg>
    <div class="particle" style="top: 10%; left: 10%;"></div>
    <div class="particle" style="top: 20%; left: 20%;"></div>
    <div class="particle" style="top: 30%; left: 30%;"></div>
    <div class="particle" style="top: 40%; left: 40%;"></div>
    <div class="particle" style="top: 50%; left: 50%;"></div>
    <div class="particle" style="top: 60%; left: 60%;"></div>
    <div class="particle" style="top: 70%; left: 70%;"></div>
    <div class="particle" style="top: 80%; left: 80%;"></div>
    <div class="particle" style="top: 90%; left: 90%;"></div>
  </div>
        </div>
        </body>
        </html>
