<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ethereal Galactic Maelstrom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            /* Keyframes: */
@keyframes particle-dance {
  0% {
    transform: translate(-50%, -50%) rotate(0deg);
  }
  50% {
    transform: translate(-50%, -50%) rotate(10deg);
  }
  100% {
    transform: translate(-50%, -50%) rotate(0deg);
  }
}

@keyframes core-pulse {
  0% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.1);
  }
  100% {
    transform: scale(1);
  }
}

@keyframes neural-flicker {
  0% {
    transform: scale(1) rotate(0deg);
  }
  50% {
    transform: scale(1.05) rotate(5deg);
  }
  100% {
    transform: scale(1) rotate(0deg);
  }
}

/* Styles: */
.vortex-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  background: radial-gradient(circle at 50% 50%, #fff, #ccc);
  animation: neural-flicker 3s infinite;
}

.core {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  border-radius: 50%;
  width: 150px;
  height: 150px;
  background: linear-gradient(to bottom, #666, #222);
  animation: core-pulse 2s infinite;
}

.particle {
  position: absolute;
  border-radius: 50%;
  width: 50px;
  height: 50px;
  background: linear-gradient(to bottom, #666, #222);
  box-shadow: 0 0 10px #aaa;
  animation: particle-dance 4s infinite;
}

.particle:nth-child(1) {
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: linear-gradient(to bottom, #666, #222);
  box-shadow: 0 0 10px #ccc;
}

.particle:nth-child(2) {
  top: 20%;
  left: 30%;
  transform: translate(-30%, -20%) rotate(10deg);
  background: linear-gradient(to bottom, #777, #333);
  box-shadow: 0 0 10px #aaa;
}

.particle:nth-child(3) {
  top: 40%;
  left: 70%;
  transform: translate(-70%, -40%) rotate(-15deg);
  background: linear-gradient(to bottom, #888, #444);
  box-shadow: 0 0 10px #ccc;
}

.particle:nth-child(4) {
  top: 10%;
  left: 40%;
  transform: translate(-40%, -10%) rotate(7deg);
  background: linear-gradient(to bottom, #999, #555);
  box-shadow: 0 0 10px #aaa;
}

.particle:nth-child(5) {
  top: 60%;
  left: 20%;
  transform: translate(-20%, -60%) rotate(-5deg);
  background: linear-gradient(to bottom, #aaa, #777);
  box-shadow: 0 0 10px #ccc;
}

.particle:nth-child(6) {
  top: 80%;
  left: 80%;
  transform: translate(-80%, -80%) rotate(10deg);
  background: linear-gradient(to bottom, #ccc, #999);
  box-shadow: 0 0 10px #aaa;
}

.particle:nth-child(7) {
  top: 40%;
  left: 50%;
  transform: translate(-50%, -40%) rotate(7deg);
  background: linear-gradient(to bottom, #666, #222);
  box-shadow: 0 0 10px #ccc;
}

.particle:nth-child(8) {
  top: 20%;
  left: 20%;
  transform: translate(-20%, -20%) rotate(10deg);
  background: linear-gradient(to bottom, #777, #333);
  box-shadow: 0 0 10px #aaa;
}

.neural-web {
  position: absolute;
  fill: #fff;
  stroke: #fff;
  stroke-width: 2px;
  animation: neural-flicker 3s infinite;
}

.neural-web path:nth-child(1) {
  d: M 50 50 L 90 70 L 30 60;
}

.neural-web path:nth-child(2) {
  d: M 70 40 L 60 70 L 20 60;
}

.neural-web path:nth-child(3) {
  d: M 80 60 L 90 40 L 40 70;
}

.neural-web path:nth-child(4) {
  d: M 30 90 L 50 70 L 80 60;
}

.neural-web path:nth-child(5) {
  d: M 60 20 L 40 30 L 80 50;
}

.neural-web path:nth-child(6) {
  d: M 10 40 L 50 50 L 70 20;
}

.core {
  box-shadow: 
    0 0 10px #aaa,
    0 0 15px #ccc,
    0 0 20px #666,
    0 0 25px #999,
    0 0 30px #aaa,
    0 0 35px #666;
}
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path />
      <path />
      <path />
      <path />
      <path />
      <path />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
