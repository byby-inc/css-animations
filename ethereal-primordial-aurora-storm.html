<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ethereal Primordial Aurora Storm</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    background: radial-gradient(50% 100% at 50% 100%, #fff, #ccc);
    clip-path: circle(50% at 50% 50%);
    animation: neural-flicker 10s infinite;
  }

  @keyframes neural-flicker {
    0% {
      transform: rotate(0deg) scale(1);
    }
    50% {
      transform: rotate(10deg) scale(1);
    }
    100% {
      transform: rotate(0deg) scale(1);
    }
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(to bottom, #fff, #ccc);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    box-shadow: 0 0 10px #fff;
    box-shadow: 0 0 20px #ccc;
    box-shadow: 0 0 30px #aaa;
    box-shadow: 0 0 40px #999;
    box-shadow: 0 0 50px #888;
    box-shadow: 0 0 60px #777;
    animation: core-pulse 2s infinite;
  }

  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.1);
    }
    100% {
      transform: scale(1);
    }
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(to bottom, #fff, #ccc);
    animation: particle-dance 8s infinite;
  }

  @keyframes particle-dance {
    0% {
      transform: translateX(-100px) rotate(0deg);
    }
    50% {
      transform: translateX(100px) rotate(360deg);
    }
    100% {
      transform: translateX(-100px) rotate(0deg);
    }
  }

  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    fill: none;
    stroke: #fff;
    stroke-width: 10;
  }

  .neural-web path {
    fill: none;
    stroke: #fff;
    stroke-width: 10;
    stroke-linejoin: round;
    animation: particle-dance 5s infinite;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M250 30 L 350 40" />
      <path d="M300 50 L 450 60" />
      <path d="M350 70 L 500 80" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
