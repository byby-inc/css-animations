<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ethereal Quantum Flux</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

            /* Code snippet container */
            .codigo {
            position: absolute;
            top: 15%;
            left: 40%;
            scale: 1.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background:url("/gold_snippet") no-repeat center center;
            color: white;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 45px;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.9);
            text-align: center;
            border-radius: 12px;
            line-height: 1.6;
            max-height: 25%;
            max-width: 75%;
            width: 75%;
            height: 25%;
            overflow-y: hidden;
            border: 6px solid;
            border-image: linear-gradient(
                135deg,
                #D4AF37 0%,
                #F9E79F 15%,
                #B8860B 30%,
                #CFB53B 45%,
                #E6C35C 60%,
                #B8860B 75%,
                #D4AF37 90%,
                #C9A961 100%
            ) 1;
            box-shadow: 
                inset 0 2px 4px rgba(212, 175, 55, 0.3),
                inset 0 -2px 4px rgba(139, 101, 8, 0.4),
                0 4px 12px rgba(184, 134, 11, 0.5),
                0 8px 25px rgba(0, 0, 0, 0.6);
            }

            /* Animation container */
            .animation-container {
           position: absolute;
            top: 90%;
            left: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            scale:3;
            }

            .vortex-container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translateX(-50%) translateY(-50%);
  clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
}

.particle {
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: linear-gradient(45deg, #EA580C, #6A11CB);
}

.core {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translateX(-50%) translateY(-50%);
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: linear-gradient(45deg, #1E40AF, #3B82F6);
  animation: core-pulse 2s infinite;
}

@keyframes core-pulse {
  0% {
    transform: translateX(-50%) translateY(-50%) scale(1);
  }
  50% {
    transform: translateX(-50%) translateY(-50%) scale(1.2);
  }
  100% {
    transform: translateX(-50%) translateY(-50%) scale(1);
  }
}

.neural-web {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

@keyframes spiral-birth {
  0% {
    stroke-dashoffset: 1000;
  }
  100% {
    stroke-dashoffset: 0;
  }
}

@keyframes vortex-spin {
  0% {
    transform: rotate(0deg);
  }
  100% {
    transform: rotate(720deg);
  }
}

@keyframes particle-dance {
  0% {
    transform: translateX(-50%) translateY(-50%) rotate(0deg);
  }
  50% {
    transform: translateX(-50%) translateY(-50%) rotate(180deg);
  }
  100% {
    transform: translateX(-50%) translateY(-50%) rotate(360deg);
  }
}

@keyframes energy-stream {
  0% {
    stroke-dashoffset: 1000;
    opacity: 0;
  }
  50% {
    opacity: 1;
  }
  100% {
    stroke-dashoffset: 0;
    opacity: 0;
  }
}

@keyframes neural-flicker {
  0% {
    opacity: 0.5;
  }
  50% {
    opacity: 1;
  }
  100% {
    opacity: 0.5;
  }
}
        </style>
        </head>
        <body>
        <div class="codigo">
            <div>.vortex-container { transform: translateX(-50%) translateY(-50%) rotate(45deg); }</div>
        </div>
        <div class="animation-container">
            <svg width="0" height="0">
  <defs>
    <linearGradient id="gradients-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6A11CB" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="gradients-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="gradients-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>
</svg>
<div class="vortex-container">
  <svg class="energy-paths" width="100%" height="100%">
    <path d="M 50 0 L 100 50 L 50 100 L 0 50 Z" stroke="#6A11CB" stroke-width="2" fill="none" stroke-dasharray="1000" stroke-dashoffset="1000" animation="spiral-birth 2s infinite">
    </path>
    <path d="M 50 0 L 100 50 L 50 100 L 0 50 Z" stroke="#EA580C" stroke-width="2" fill="none" stroke-dasharray="1000" stroke-dashoffset="1000" animation="energy-stream 2s infinite">
    </path>
  </svg>
  <svg class="spiral-paths" width="100%" height="100%">
    <path d="M 50 0 L 100 50 L 50 100 L 0 50 Z" stroke="#1E40AF" stroke-width="2" fill="none" stroke-dasharray="1000" stroke-dashoffset="1000" animation="vortex-spin 2s infinite">
    </path>
    <path d="M 50 0 L 100 50 L 50 100 L 0 50 Z" stroke="#3B82F6" stroke-width="2" fill="none" stroke-dasharray="1000" stroke-dashoffset="1000" animation="spiral-birth 2s infinite">
    </path>
  </svg>
  <div class="particle" style="top: 20%; left: 30%; animation: particle-dance 2s infinite;"></div>
  <div class="particle" style="top: 50%; left: 20%; animation: particle-dance 2s 0.5s infinite;"></div>
  <div class="particle" style="top: 30%; left: 50%; animation: particle-dance 2s 1s infinite;"></div>
  <div class="particle" style="top: 40%; left: 40%; animation: particle-dance 2s 1.5s infinite;"></div>
  <div class="particle" style="top: 60%; left: 30%; animation: particle-dance 2s 2s infinite;"></div>
  <div class="particle" style="top: 20%; left: 60%; animation: particle-dance 2s 2.5s infinite;"></div>
  <div class="particle" style="top: 50%; left: 60%; animation: particle-dance 2s 3s infinite;"></div>
  <div class="particle" style="top: 30%; left: 10%; animation: particle-dance 2s 3.5s infinite;"></div>
  <div class="particle" style="top: 40%; left: 70%; animation: particle-dance 2s 4s infinite;"></div>
  <div class="core"></div>
  <svg class="neural-web" width="100%" height="100%">
    <path d="M 50 0 L 100 50 L 50 100 L 0 50 Z" stroke="#8B5CF6" stroke-width="1" fill="none" animation="neural-flicker 2s infinite">
    </path>
  </svg>
</div>
        </div>
        </body>
        </html>
