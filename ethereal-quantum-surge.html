<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ethereal Quantum Surge</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

            /* Code snippet container */
            .codigo {
            position: absolute;
            top: 15%;
            left: 40%;
            scale: 1.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background:url("/gold_snippet") no-repeat center center;
            color: white;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 45px;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.9);
            text-align: center;
            border-radius: 12px;
            line-height: 1.6;
            max-height: 25%;
            max-width: 75%;
            width: 75%;
            height: 25%;
            overflow-y: hidden;
            border: 6px solid;
            border-image: linear-gradient(
                135deg,
                #D4AF37 0%,
                #F9E79F 15%,
                #B8860B 30%,
                #CFB53B 45%,
                #E6C35C 60%,
                #B8860B 75%,
                #D4AF37 90%,
                #C9A961 100%
            ) 1;
            box-shadow: 
                inset 0 2px 4px rgba(212, 175, 55, 0.3),
                inset 0 -2px 4px rgba(139, 101, 8, 0.4),
                0 4px 12px rgba(184, 134, 11, 0.5),
                0 8px 25px rgba(0, 0, 0, 0.6);
            }

            /* Animation container */
            .animation-container {
           position: absolute;
            top: 90%;
            left: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            .vortex-container {
    position: absolute;
    width: 100%;
    height: 100%;
    clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    background: linear-gradient(45deg, #6A11CB, #8B5CF6);
    z-index: -1;
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 20px;
    height: 20px;
    background: linear-gradient(45deg, #1E40AF, #3B82F6);
    border-radius: 50%;
    animation: core-pulse 2s infinite;
  }

  .particle {
    position: absolute;
    width: 10px;
    height: 10px;
    background: linear-gradient(45deg, #EA580C, #FFC107);
    border-radius: 50%;
    animation: particle-dance 5s infinite;
  }

  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }

  @keyframes core-pulse {
    0% {
      transform: translate(-50%, -50%) scale(1);
    }
    50% {
      transform: translate(-50%, -50%) scale(1.2);
    }
    100% {
      transform: translate(-50%, -50%) scale(1);
    }
  }

  @keyframes particle-dance {
    0% {
      transform: translate(0, 0);
    }
    50% {
      transform: translate(10px, 10px);
    }
    100% {
      transform: translate(0, 0);
    }
  }

  @keyframes neural-flicker {
    0% {
      stroke-width: 1px;
    }
    50% {
      stroke-width: 3px;
    }
    100% {
      stroke-width: 1px;
    }
  }
        </style>
        </head>
        <body>
        <div class="codigo">
            <div>.vortex-container { z-index: -1; }</div>
        </div>
        <div class="animation-container">
            <div class="vortex-container">
    <svg class="neural-web">
      <path d="M 0 0 L 100 100" stroke="#1E40AF" stroke-width="1" fill="none" animation="neural-flicker 2s infinite"/>
      <path d="M 100 0 L 0 100" stroke="#1E40AF" stroke-width="1" fill="none" animation="neural-flicker 2s infinite"/>
    </svg>
    <div class="core"></div>
    <div class="particle" style="top: 10%; left: 20%; animation-delay: 0.5s;"></div>
    <div class="particle" style="top: 20%; left: 40%; animation-delay: 1s;"></div>
    <div class="particle" style="top: 30%; left: 60%; animation-delay: 1.5s;"></div>
    <div class="particle" style="top: 40%; left: 80%; animation-delay: 2s;"></div>
    <div class="particle" style="top: 50%; left: 20%; animation-delay: 2.5s;"></div>
    <div class="particle" style="top: 60%; left: 40%; animation-delay: 3s;"></div>
    <div class="particle" style="top: 70%; left: 60%; animation-delay: 3.5s;"></div>
    <div class="particle" style="top: 80%; left: 80%; animation-delay: 4s;"></div>
    <div class="particle" style="top: 90%; left: 20%; animation-delay: 4.5s;"></div>
    <div class="particle" style="top: 10%; left: 80%; animation-delay: 5s;"></div>
  </div>
        </div>
        </body>
        </html>
