<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ethereal Quasar Bloom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            .vortex-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  background: radial-gradient(#2f2f2f, #121212);
}
 
.core {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: linear-gradient(to bottom, #ff69b4, #ff69b4);
  border-radius: 50%;
  width: 50px;
  height: 50px;
  box-shadow: 0 0 10px #e5e5e5, 0 0 20px #b8b8b8, 0 0 30px #a4a4a4, 0 0 40px #808080, 0 0 50px #333, 0 0 60px #111;
  animation: core-pulse 8s infinite;
}
 
.particle {
  position: absolute;
  border-radius: 50%;
  background: linear-gradient(to bottom, #03a9f4, #03a9f4);
}
 
@keyframes particle-dance {
  0% {
    transform: translate(0, 0) rotate(0deg);
  }
  70% {
    transform: translate(20px, 15px) rotate(180deg);
  }
  100% {
    transform: translate(30px, 20px) rotate(360deg);
  }
}
 
.particle:nth-child(1) {
  animation: particle-dance 3s infinite;
  top: 10%;
  left: 10%;
}
 
.particle:nth-child(2) {
  animation: particle-dance 5s infinite;
  top: 50%;
  left: 50%;
}
 
.neural-web {
  position: absolute;
  width: 100%;
  height: 100%;
  fill: #fff;
}
 
.neural-web path {
  stroke: #fff;
}
 
@keyframes neural-flicker {
  0% {
    transform: scale(1);
  }
  70% {
    transform: scale(1.5);
  }
  100% {
    transform: scale(1);
  }
}
 
.neural-web path:nth-child(1) {
  animation: neural-flicker 2s infinite;
}
 
.neural-web path:nth-child(2) {
  animation: neural-flicker 4s infinite;
}
 
.neural-web path:nth-child(3) {
  animation: neural-flicker 6s infinite;
}
 
@keyframes core-pulse {
  0% {
    transform: scale(1);
  }
  70% {
    transform: scale(1.2);
  }
  100% {
    transform: scale(1);
  }
}
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
 
  <div class="core">
 
  </div>
 
  <div class="particle" style="top:10%;left:40%;animation:particle-dance 2s infinite;"></div>
  <div class="particle" style="top:10%;left:70%;animation:particle-dance 4s infinite;"></div>
  <div class="particle" style="top:40%;left:20%;animation:particle-dance 1s infinite;"></div>
  <div class="particle" style="top:80%;left:30%;animation:particle-dance 5s infinite;"></div>
  <div class="particle" style="top:60%;left:80%;animation:particle-dance 6s infinite;"></div>
 
  <svg class="neural-web">
    <path d="M 0 0 L 100 100 L 0 100 Z" style="stroke:#fff;"></path>
    <path d="M 0 100 L 100 0 L 0 0 Z" style="stroke:#fff;"></path>
    <path d="M 0 50 L 100 50 L 50 100 Z" style="stroke:#fff;"></path>
  </svg>
 
</div>
        </div>
        </body>
        </html>
