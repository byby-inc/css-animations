<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ethereal Superposition Bloom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: translate(0, 0) rotate(0);
    }
    50% {
      transform: translate(-10%, -10%) rotate(10deg);
    }
    100% {
      transform: translate(0, 0) rotate(0);
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.2);
    }
    100% {
      transform: scale(1);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: translate(0, 0) scale(1);
    }
    50% {
      transform: translate(-5%, -5%) scale(1.1);
    }
    100% {
      transform: translate(0, 0) scale(1);
    }
  }
  
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    z-index: -1;
    background: linear-gradient(135deg, #33CCFF, #FF99CC);
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  }
  
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(255,255,255,0.5);
  }
  
  .core::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: radial-gradient(rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0));
    animation: core-pulse 3s infinite;
  }
  
  .core::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: radial-gradient(rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0));
    animation: core-pulse 4s infinite;
  }
  
  .core::before::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 170px;
    height: 170px;
    border-radius: 50%;
    background: radial-gradient(rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0));
    animation: core-pulse 5s infinite;
  }
  
  .core::before::before::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 190px;
    height: 190px;
    border-radius: 50%;
    background: radial-gradient(rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0));
    animation: core-pulse 6s infinite;
  }
  
  .core::before::before::before::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 210px;
    height: 210px;
    border-radius: 50%;
    background: radial-gradient(rgba(255, 255, 255, 0.01), rgba(255, 255, 255, 0));
    animation: core-pulse 7s infinite;
  }
  
  .core::before::before::before::before::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 230px;
    height: 230px;
    border-radius: 50%;
    background: radial-gradient(rgba(255, 255, 255, 0.005), rgba(255, 255, 255, 0));
    animation: core-pulse 8s infinite;
  }
  
  .particle {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, #99CCFF, #FF66CC);
    animation: particle-dance 2s infinite;
    transform: translate(0, 0) rotate(0);
  }
  
  .particle:nth-child(2) {
    transform: translate(-5%, 5%);
  }
  
  .particle:nth-child(3) {
    transform: translate(5%, -5%);
  }
  
  .particle:nth-child(4) {
    transform: translate(0, 5%);
  }
  
  .particle:nth-child(5) {
    transform: translate(5%, 0);
  }
  
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 100;
  }
  
  .neural-web path {
    stroke: #fff;
    stroke-width: 3;
    fill: none;
  }
  
  .neural-web path:nth-child(1) {
    transform: rotate(20deg);
  }
  
  .neural-web path:nth-child(2) {
    transform: rotate(30deg);
  }
  
  .neural-web path:nth-child(3) {
    transform: rotate(40deg);
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M50 0 L 75 50 L 50 100 L 25 50" />
      <path d="M75 100 L 100 50 L 75 0 L 50 50" />
      <path d="M25 50 L 0 75 L 25 100 L 50 50" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
