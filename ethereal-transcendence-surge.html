<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ethereal Transcendence Surge</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: rotate(0deg) translate(0px, 0px);
    }
    50% {
      transform: rotate(180deg) translate(100px, 100px);
    }
    100% {
      transform: rotate(360deg) translate(0px, 0px);
    }
  }

  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.2);
    }
    100% {
      transform: scale(1);
    }
  }

  @keyframes neural-flicker {
    0% {
      transform: scale(1) rotate(0deg);
    }
    50% {
      transform: scale(1.1) rotate(180deg);
    }
    100% {
      transform: scale(1) rotate(360deg);
    }
  }

  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%,75% 0%,100% 25%,50% 100%,0% 25%);
    background: linear-gradient(to bottom right, #3a86ff, #ff006e);
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(to bottom right, #ffff00, #ffa07a);
    box-shadow: 
      0px 0px 10px #ffffff,
      0px 0px 20px #ffffff,
      0px 0px 30px #ffffff,
      0px 0px 40px #ffffff,
      0px 0px 50px #ffffff,
      0px 0px 60px #ffffff;
    animation: core-pulse infinite 5s;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    background: linear-gradient(to bottom right, #ff69b4, #ffe6cc);
    animation: particle-dance infinite 3s;
  }

  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    animation: neural-flicker infinite 7s;
  }

  .neural-web path {
    stroke: #fff;
    stroke-width: 2;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M100,200 C200,300 300,200 400,300" />
      <path d="M400,100 C300,200 200,100 100,200" />
      <path d="M200,400 C300,300 400,400 300,200" />
    </svg>
    <div class="particle" style="top: 10%; left: 10%;"></div>
    <div class="particle" style="top: 20%; left: 20%; animation-delay: 1s;"></div>
    <div class="particle" style="top: 30%; left: 30%; animation-delay: 2s;"></div>
    <div class="particle" style="top: 40%; left: 40%; animation-delay: 3s;"></div>
    <div class="particle" style="top: 50%; left: 50%; animation-delay: 4s;"></div>
    <div class="particle" style="top: 60%; left: 60%; animation-delay: 5s;"></div>
    <div class="particle" style="top: 70%; left: 70%; animation-delay: 6s;"></div>
    <div class="particle" style="top: 80%; left: 80%; animation-delay: 7s;"></div>
    <div class="particle" style="top: 90%; left: 90%; animation-delay: 8s;"></div>
  </div>
        </div>
        </body>
        </html>
