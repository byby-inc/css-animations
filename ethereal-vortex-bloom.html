<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ethereal Vortex Bloom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
        0% {
            transform: translate(0, 0);
        }
        100% {
            transform: translate(50px, -50px);
        }
    }

    @keyframes core-pulse {
        0% {
            transform: scale(1);
        }
        100% {
            transform: scale(1.2);
        }
    }

    @keyframes neural-flicker {
        0% {
            transform: translate(0, 0);
        }
        100% {
            transform: translate(10px, 10px);
        }
    }

    .vortex-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background-image: linear-gradient(to bottom, #33ccff, #6699cc);
        clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    }

    .core {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 200px;
        height: 200px;
        background-image: linear-gradient(to bottom, #ffff66, #ccff00);
        border-radius: 50%;
        box-shadow: 0 0 10px #ffffff, 0 0 20px #ffffff, 0 0 30px #ffffff, 0 0 40px #ffffff, 0 0 50px #ffffff, 0 0 60px #ffffff;
        animation: core-pulse 2s infinite;
    }

    .particle {
        position: absolute;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        background-image: linear-gradient(to bottom, #ff0000, #ff0066);
        box-shadow: 0 0 10px #ffffff;
        animation: particle-dance 5s infinite;
    }

    .particle:nth-child(1) {
        top: 20px;
        left: 20px;
        animation-duration: 3s;
        background-image: linear-gradient(to bottom, #0000ff, #000066);
    }

    .particle:nth-child(2) {
        top: 40px;
        left: 40px;
        animation-duration: 4s;
        background-image: linear-gradient(to bottom, #00ff00, #00cc00);
    }

    .particle:nth-child(3) {
        top: 60px;
        left: 60px;
        animation-duration: 5s;
        background-image: linear-gradient(to bottom, #cc0000, #660000);
    }

    .particle:nth-child(4) {
        top: 20px;
        right: 20px;
        animation-duration: 3s;
        background-image: linear-gradient(to bottom, #ffff00, #ffff66);
    }

    .particle:nth-child(5) {
        top: 40px;
        right: 40px;
        animation-duration: 4s;
        background-image: linear-gradient(to bottom, #0000cc, #000066);
    }

    .neural-web {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        fill: #ffffff;
        stroke: #ffffff;
        animation: neural-flicker 10s infinite;
    }

    .neural-web path:nth-child(1) {
        d: M 50, 50 C 50, 100 100, 50 150, 50;
    }

    .neural-web path:nth-child(2) {
        d: M 150, 50 C 100, 100 50, 50 50, 100;
    }

    .neural-web path:nth-child(3) {
        d: M 50, 150 C 50, 200 100, 150 150, 150;
    }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
        <div class="core"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <svg class="neural-web">
            <path d="M 50, 50 C 50, 100 100, 50 150, 50"></path>
            <path d="M 150, 50 C 100, 100 50, 50 50, 100"></path>
            <path d="M 50, 150 C 50, 200 100, 150 150, 150"></path>
        </svg>
    </div>
        </div>
        </body>
        </html>
