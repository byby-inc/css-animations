<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Ethereal Vortex Resonance</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            /* KEYFRAMES */
  @keyframes particle-dance {
    0% {
      transform: translate(100%, 100%) rotate(0deg);
    }
    100% {
      transform: translate(-100%, -100%) rotate(360deg);
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.1);
    }
    100% {
      transform: scale(1);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: rotate(0deg);
    }
    25% {
      transform: rotate(10deg);
    }
    50% {
      transform: rotate(0deg);
    }
    75% {
      transform: rotate(-10deg);
    }
    100% {
      transform: rotate(0deg);
    }
  }

  /* STYLE */
  body {
    margin: 0;
    padding: 0;
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    clip-path: circle(50% at 50% 50%);
    z-index: -1;
    background-image: linear-gradient(to bottom right, #2e4053, #3498db);
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    background-image: linear-gradient(to bottom left, #3498db, #2e4053);
    border-radius: 50%;
    box-shadow: 
      0 0 10px #3498db,
      0 0 15px #2e4053,
      0 0 20px #3498db,
      0 0 25px #2e4053,
      0 0 30px #3498db,
      0 0 35px #2e4053;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    background-image: linear-gradient(to bottom right, #2e4053, #3498db);
    animation: particle-dance 3s infinite;
  }
  .neural-web {
    position: absolute;
    fill: none;
    stroke: #fff;
    stroke-width: 1;
  }

  /* PULSATING CORE */
  .core.pulse {
    animation: core-pulse 5s infinite;
  }
  
  /* DANCING PARTICLES */
  .particle.dance {
    animation-duration: 3s;
  }
  @media (min-width: 768px) {
    .particle.dance {
      animation-duration: 4s;
    }
  }
  @media (min-width: 1024px) {
    .particle.dance {
      animation-duration: 5s;
    }
  }

  /* FICKERING NEURALWEB */
  .neural-web.flicker {
    animation: neural-flicker 2s infinite;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core pulse"></div>
    <div class="particle dance"></div>
    <div class="particle dance" style="top: 50px; left: 200px;"></div>
    <div class="particle dance" style="top: 100px; left: 150px;"></div>
    <div class="particle dance" style="top: 50px; left: 100px;"></div>
    <div class="particle dance" style="top: 200px; left: 50px;"></div>
    <div class="particle dance" style="top: 150px; left: 200px;"></div>
    <div class="particle dance" style="top: 100px; left: 250px;"></div>
    <svg class="neural-web">
      <path d="M50 50 l100 0" class="flicker"></path>
      <path d="M150 50 l-100 0" class="flicker"></path>
      <path d="M50 150 l0 -100" class="flicker"></path>
    </svg>
  </div>
        </div>
        </body>
        </html>
