<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Haunting Nebula Bloom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: translate(20px, 20px) rotate(0deg);
    }
    50% {
      transform: translate(-20px, -20px) rotate(180deg);
    }
    100% {
      transform: translate(0px, 0px) rotate(360deg);
    }
  }
  
  @keyframes core-pulse {
    0% {
      transform: scale(1.2);
    }
    100% {
      transform: scale(1);
    }
  }
  
  @keyframes neural-flicker {
    0% {
      transform: rotate(0deg) translate(0px, 0px);
    }
    50% {
      transform: rotate(10deg) translate(10px, 10px);
    }
    100% {
      transform: rotate(0deg) translate(0px, 0px);
    }
  }
  
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background-image: linear-gradient(to bottom, #141414, #2a2d42, #2f343a, #35393c, #4b4c4f, #6b6f77, #7d8080);
  }
  
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50%;
    height: 50%;
    background-image: linear-gradient(to bottom, #141414, #2a2d42, #2f343a, #35393c, #4b4c4f, #6b6f77, #7d8080);
    border-radius: 50%;
    border: 1px solid #fff;
    box-sizing: border-box;
    box-shadow:
      -30px 0 0 #000,
      -15px 0 0 #141414,
      0 0 0 #2a2d42,
      15px 0 0 #2f343a,
      30px 0 0 #35393c,
      4px 8px 6px rgba(0, 0, 0, 0.2);
    animation: core-pulse 0.5s infinite;
  }
  
  .particle {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background-image: linear-gradient(to bottom, #141414, #2a2d42, #2f343a, #35393c, #4b4c4f, #6b6f77, #7d8080);
    animation: particle-dance 1.5s infinite;
  }
  
  .neural-web {
    position: absolute;
    top: 25%;
    left: 25%;
    width: 50%;
    height: 50%;
    fill: none;
    stroke: #fff;
    stroke-width: 2px;
  }
  
  .neural-web path:nth-child(1) {
    stroke-dasharray: 100px;
    stroke-dashoffset: 100px;
    animation: neural-flicker 1s infinite;
  }
  
  .neural-web path:nth-child(2) {
    stroke-dasharray: 150px;
    stroke-dashoffset: 150px;
    animation: neural-flicker 1.5s infinite;
  }
  
  .neural-web path:nth-child(3) {
    stroke-dasharray: 200px;
    stroke-dashoffset: 200px;
    animation: neural-flicker 2s infinite;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 50 50 L 200 200" />
      <path d="M 50 50 L 150 50" />
      <path d="M 150 150 L 50 100" />
      <path d="M 150 150 L 100 200" />
    </svg>
    <div class="particle" style="top: 20%; left: 30%; animation-duration: 1.2s;"></div>
    <div class="particle" style="top: 60%; left: 40%;"></div>
    <div class="particle" style="top: 80%; left: 70%;"></div>
    <div class="particle" style="top: 80%; left: 10%;"></div>
    <div class="particle" style="top: 20%; left: 50%;"></div>
    <div class="particle" style="top: 10%; left: 30%;"></div>
    <div class="particle" style="top: 90%; left: 80%;"></div>
  </div>
        </div>
        </body>
        </html>
