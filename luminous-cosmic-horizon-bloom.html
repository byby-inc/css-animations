<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Luminous Cosmic Horizon Bloom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: translate(0, 0) rotate(0deg);
    }
    50% {
      transform: translate(20px, 20px) rotate(180deg);
    }
    100% {
      transform: translate(0, 0) rotate(360deg);
    }
  }

  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.2);
    }
    100% {
      transform: scale(1);
    }
  }

  @keyframes neural-flicker {
    0% {
      transform: translate(0, 0) rotate(0deg) scale(1);
    }
    20% {
      transform: translate(10px, 10px) rotate(90deg) scale(1.1);
    }
    40% {
      transform: translate(-10px, -10px) rotate(180deg) scale(0.9);
    }
    60% {
      transform: translate(5px, 5px) rotate(270deg) scale(1.05);
    }
    80% {
      transform: translate(-5px, -5px) rotate(360deg) scale(0.95);
    }
    100% {
      transform: translate(0, 0) rotate(0deg) scale(1);
    }
  }

  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: linear-gradient(to top, #14143f, #3b3c6e);
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(to top, #8d81ff, #4f46e5);
    box-shadow: 0 0 10px #8d81ff, 0 0 20px #4f46e5, 0 0 30px #2a24a3, 0 0 40px #1a136a, 0 0 50px #0d0745, 0 0 60px #05032a;
    animation: core-pulse 5s infinite;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(to top, #8d81ff, #4f46e5);
    animation: particle-dance 3s infinite;
  }

  .particle:nth-child(1) {
    top: 10%;
    left: 20%;
    width: 20px;
    height: 20px;
  }

  .particle:nth-child(2) {
    top: 30%;
    left: 40%;
    width: 30px;
    height: 30px;
  }

  .particle:nth-child(3) {
    top: 50%;
    left: 60%;
    width: 40px;
    height: 40px;
  }

  .particle:nth-child(4) {
    top: 70%;
    left: 30%;
    width: 20px;
    height: 20px;
  }

  .particle:nth-child(5) {
    top: 20%;
    left: 50%;
    width: 30px;
    height: 30px;
  }

  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    animation: neural-flicker 7s infinite;
  }

  .neural-web path {
    stroke: #fff;
    stroke-width: 2;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <path d="M10 10 L 90 10" />
      <path d="M10 50 L 90 50" />
      <path d="M10 90 L 90 90" />
      <path d="M50 10 L 50 90" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
