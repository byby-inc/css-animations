<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Majestic Vortex Maelstrom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: rotate(0deg) translateX(0%) translateY(0%);
    }
    50% {
      transform: rotate(90deg) translateX(50%) translateY(50%);
    }
    100% {
      transform: rotate(0deg) translateX(0%) translateY(0%);
    }
  }
  
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.1);
    }
    100% {
      transform: scale(1);
    }
  }
  
  @keyframes neural-flicker {
    0% {
      transform: translateX(0%) translateY(0%);
    }
    50% {
      transform: translateX(10%) translateY(10%);
    }
    100% {
      transform: translateX(0%) translateY(0%);
    }
  }
  
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background-image: linear-gradient(to bottom, #121212, #333, #121212);
  }
  
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background-image: linear-gradient(to bottom, #ffffff, #cccccc, #ffffff);
    box-shadow:
      0 0 20px #ffffff,
      0 0 10px #cccccc,
      10px 0 10px #ffffff,
      -10px 0 10px #ffffff,
      20px 0 20px #ffffff,
      0 10px 10px #ffffff,
      0 -10px 10px #ffffff,
      -10px 0 10px #cccccc,
      20px 0 20px #cccccc;
    animation: core-pulse infinite 3s;
  }
  
  .particle {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background-image: linear-gradient(to bottom, #ffffff, #cccccc, #ffffff);
    animation: particle-dance infinite 5s;
  }
  
  .neural-web {
    position: absolute;
    top: 20%;
    left: 20%;
    width: 60%;
    height: 60%;
    fill: #ffffff;
  }
  
  .neural-web path {
    stroke-width: 2px;
    stroke: #ffffff;
    animation: neural-flicker infinite 1s;
  }
  
  .neural-web path:nth-child(1) {
    transform: rotate(0deg);
  }
  
  .neural-web path:nth-child(2) {
    transform: rotate(45deg);
  }
  
  .neural-web path:nth-child(3) {
    transform: rotate(90deg);
  }
  
  .neural-web path:nth-child(4) {
    transform: rotate(135deg);
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M50,25L150,150L250,25Z"/>
      <path d="M50,250L150,25L250,250Z"/>
      <path d="M150,25L250,150L150,250Z"/>
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
