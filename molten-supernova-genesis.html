<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Molten Supernova Genesis</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            /* Clip-path */
    .vortex-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
      background: 
        linear-gradient(90deg, #ff9900 0, #ff9900 50%, #cc3300 100%) padding-box, 
        radial-gradient(white, #fff 50%, transparent 100%) border-box;
    }

    /* Core */
    .core {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      width: 20vw;
      height: 20vw;
      background:
        conic-gradient(#ff9900 0deg, #ff9900 10deg, #ff9900 45deg, #cc3300 46deg, #3300cc 91deg, #9999ff 92deg, #6600cc 135deg, #000000 180deg, #cc00cc 181deg, #ff00cc 270deg) padding-box, 
        linear-gradient(white, #fff 100%);
    }
    .core::before {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      content: '';
      width: 40px;
      height: 40px;
      border-radius: 50%;
      filter: blur(3px);
      box-shadow: 
        0 0 15px #ff9900, 
        0 0 10px #ff9900, 
        0 0 5px #ff9900, 
        0 0 2px #ff9900, 
        0 0 10px #cc3300, 
        0 0 5px #cc3300;
      animation: core-pulse infinite 1s;
    }

    /* Particles */
    .particle {
      position: absolute;
      border-radius: 50%;
      width: 2vw;
      height: 2vw;
      background: 
        linear-gradient(90deg, #ff9900 calc(50% + 2px), #ff9900 50%, #cc3300 calc(50% - 2px)) padding-box, 
        radial-gradient(white, #fff 50%, transparent 100%) border-box;
    }
    .particle:nth-child(1) {
      top: 10vw;
      left: 10vw;
      animation: particle-dance infinite 6s;
    }
    .particle:nth-child(2) {
      top: 10vw;
      left: 60vw;
      animation: particle-dance infinite 4s;
    }
    .particle:nth-child(3) {
      top: 20vw;
      left: 20vw;
      animation: particle-dance infinite 3s;
    }
    .particle:nth-child(4) {
      top: 40vw;
      left: 10vw;
      animation: particle-dance infinite 2s;
    }
    .particle:nth-child(5) {
      top: 40vw;
      left: 70vw;
      animation: particle-dance infinite 5s;
    }
    .particle:nth-child(6) {
      top: 50vw;
      left: 20vw;
      animation: particle-dance infinite 7s;
    }

    /* Neural Web */
    .neural-web {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      fill: #fff;
    }
    .neural-web path {
      stroke-linecap: round;
      stroke: #fff;
    }
    .neural-web path:nth-child(1) {
      stroke-width: 5px;
      transform: translate(20px, 20px);
    }
    .neural-web path:nth-child(2) {
      stroke-width: 3px;
      transform: translate(30px, 30px);
    }
    .neural-web path:nth-child(3) {
      stroke-width: 2px;
      transform: translate(40px, 20px);
    }

    /* Animations */
    @keyframes particle-dance {
      0% {
        transform: translate(10vw, 10vw) rotate(0deg);
      }
      50% {
        transform: translate(10vw, 60vw) rotate(30deg);
      }
      100% {
        transform: translate(80vw, 10vw) rotate(90deg);
      }
    }
    @keyframes core-pulse {
      0% {
        transform: scale(1);
        box-shadow: 0 0 15px #ff9900, 0 0 10px #ff9900, 0 0 5px #ff9900, 0 0 2px #ff9900, 0 0 10px #cc3300, 0 0 5px #cc3300;
      }
      25% {
        box-shadow: 0 0 20px #ff9900, 0 0 15px #ff9900, 0 0 10px #ff9900, 0 0 5px #ff9900, 0 0 15px #cc3300, 0 0 10px #cc3300;
      }
      50% {
        box-shadow: 0 0 25px #ff9900, 0 0 20px #ff9900, 0 0 15px #ff9900, 0 0 10px #ff9900, 0 0 20px #cc3300, 0 0 15px #cc3300;
      }
      75% {
        box-shadow: 0 0 30px #ff9900, 0 0 25px #ff9900, 0 0 20px #ff9900, 0 0 15px #ff9900, 0 0 25px #cc3300, 0 0 20px #cc3300;
      }
      100% {
        transform: scale(0);
        box-shadow: 0 0 5px #ff9900, 0 0 5px #ff9900, 0 0 5px #ff9900, 0 0 5px #ff9900, 0 0 10px #cc3300, 0 0 5px #cc3300;
      }
    }
    @keyframes neural-flicker {
      0% {
        stroke: #cc3300;
      }
      50% {
        stroke: #ff9900;
      }
      100% {
        stroke: #666;
      }
    }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
      <div class="core"></div>
      <svg class="neural-web">
        <path d="M 30 30 L 60 30 L 60 100 L 0 100 L 0 30 Z"></path>
        <path d="M 90 90 L 110 90 L 110 160 L 50 160 L 50 90 Z"></path>
        <path d="M 150 150 L 170 150 L 170 220 L 100 220 L 100 150 Z"></path>
      </svg>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>
        </div>
        </body>
        </html>
