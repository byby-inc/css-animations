<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Mysterious Eternal Horizon Bloom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
        0% { transform: translate(0, 0) rotate(0deg); }
        25% { transform: translate(10px, 10px) rotate(45deg); }
        50% { transform: translate(-10px, -10px) rotate(90deg); }
        75% { transform: translate(5px, 5px) rotate(135deg); }
        100% { transform: translate(0, 0) rotate(180deg); }
    }
    @keyframes core-pulse {
        0% { transform: scale(1); }
        25% { transform: scale(1.1); }
        50% { transform: scale(1); }
        75% { transform: scale(0.9); }
        100% { transform: scale(1); }
    }
    @keyframes neural-flicker {
        0% { transform: translate(0, 0) rotate(0deg); }
        25% { transform: translate(-10px, -10px) rotate(10deg); }
        50% { transform: translate(10px, 10px) rotate(-5deg); }
        75% { transform: translate(0, 0) rotate(0deg); }
        100% { transform: translate(0, 0) rotate(0deg); }
    }
    .vortex-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        clip-path: circle(50% at 50% 50%);
    }
    .core {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: linear-gradient(to bottom, #87CEEB, #6495ED);
        box-shadow: 0 0 10px #6495ED, 0 0 10px #6495ED, 0 0 10px #6495ED, 0 0 10px #6495ED, 0 0 10px #6495ED, 0 0 10px #6495ED;
        animation: core-pulse infinite 2s;
    }
    .particle {
        position: absolute;
        border-radius: 50%;
        background: linear-gradient(to bottom, #ADD8E6, #87CEEB);
        animation: particle-dance infinite 5s;
    }
    .neural-web {
        position: absolute;
        fill: #fff;
    }
    .particle:nth-child(1) {
        top: 20%;
        left: 5%;
        animation-duration: 5s;
    }
    .particle:nth-child(2) {
        top: 10%;
        left: 80%;
        animation-duration: 3s;
        transform: translateX(10px);
    }
    .particle:nth-child(3) {
        top: 40%;
        left: 20%;
        animation-duration: 4s;
        transform: translateY(-10px);
    }
    .particle:nth-child(4) {
        top: 60%;
        left: 70%;
        animation-duration: 6s;
        transform: translateX(-10px);
    }
    .particle:nth-child(5) {
        top: 25%;
        left: 50%;
        animation-duration: 7s;
        transform: translateY(10px);
    }
    .particle:nth-child(6) {
        top: 80%;
        left: 40%;
        animation-duration: 1s;
        transform: scale(0.5);
    }
    .particle:nth-child(7) {
        top: 90%;
        left: 90%;
        animation-duration: 8s;
        transform: translateX(15px);
    }
    .particle:nth-child(8) {
        top: 15%;
        left: 95%;
        animation-duration: 2s;
        transform: translateY(-15px);
    }
    .particle:nth-child(9) {
        top: 55%;
        left: 30%;
        animation-duration: 9s;
        transform: rotate(45deg);
    }
    .particle:nth-child(10) {
        top: 85%;
        left: 80%;
        animation-duration: 5s;
        transform: scale(0.7);
    }
    path {
        stroke: #fff;
        stroke-width: 5;
        fill: none;
    }
    .neural-web path:nth-child(1) {
        d: M 20 20 h 20 v 20;
        animation-duration: 3s;
    }
    .neural-web path:nth-child(2) {
        d: M 50 50 h 10 v 10;
        animation-duration: 5s;
    }
    .neural-web path:nth-child(3) {
        d: M 10 70 h 20 v 30;
        animation-duration: 4s;
    }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
        <div class="core"></div>
        <svg class="neural-web">
            <path d="M 20 20 h 20 v 20"></path>
            <path d="M 50 50 h 10 v 10"></path>
            <path d="M 10 70 h 20 v 30"></path>
        </svg>
        <div class="particle" style="top: 20%;left: 5%;animation-duration: 5s;"></div>
        <div class="particle" style="top: 10%;left: 80%;animation-duration: 3s;transform: translateX(10px);"></div>
        <div class="particle" style="top: 40%;left: 20%;animation-duration: 4s;transform: translateY(-10px);"></div>
        <div class="particle" style="top: 60%;left: 70%;animation-duration: 6s;transform: translateX(-10px);"></div>
        <div class="particle" style="top: 25%;left: 50%;animation-duration: 7s;transform: translateY(10px);"></div>
        <div class="particle" style="top: 80%;left: 40%;animation-duration: 1s;transform: scale(0.5);"></div>
        <div class="particle" style="top: 90%;left: 90%;animation-duration: 8s;transform: translateX(15px);"></div>
        <div class="particle" style="top: 15%;left: 95%;animation-duration: 2s;transform: translateY(-15px);"></div>
        <div class="particle" style="top: 55%;left: 30%;animation-duration: 9s;transform: rotate(45deg);"></div>
        <div class="particle" style="top: 85%;left: 80%;animation-duration: 5s;transform: scale(0.7);"></div>
    </div>
        </div>
        </body>
        </html>
