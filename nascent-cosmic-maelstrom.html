<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Nascent Cosmic Maelstrom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes core-pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  
  @keyframes particle-dance {
    0% { transform: translate(0, 0) rotate(0deg); }
    50% { transform: translate(-20px, 0) rotate(180deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }
  
  @keyframes neural-flicker {
    0% { transform: rotate(0deg); }
    50% { transform: rotate(10deg); }
    100% { transform: rotate(0deg); }
  }
  
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  }
  
  .vortex-container::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #ff69b4, #66b3ff);
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  }
  
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(90deg, #ffffff, #ffff00);
    box-shadow: 0 0 10px #ffffff, 0 0 10px #ffff00, 0 0 10px #66b3ff, 0 0 10px #ff69b4, 0 0 10px #33cc33, 0 0 10px #6633cc;
  }
  
  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(90deg, #ffffff, #66b3ff);
    animation: particle-dance infinite;
  }
  
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #ffffff;
    stroke-width: 2px;
  }
  
  .neural-web path {
    stroke-dasharray: 100, 100;
    stroke-dashoffset: 0;
  }
  
  @-webkit-keyframes particle-dance {
    0% { -webkit-transform: translate(0, 0) rotate(0deg); }
    50% { -webkit-transform: translate(-20px, 0) rotate(180deg); }
    100% { -webkit-transform: translate(0, 0) rotate(0deg); }
  }
  
  @-webkit-keyframes core-pulse {
    0% { -webkit-transform: scale(1); }
    50% { -webkit-transform: scale(1.2); }
    100% { -webkit-transform: scale(1); }
  }
  
  @-webkit-keyframes neural-flicker {
    0% { -webkit-transform: rotate(0deg); }
    50% { -webkit-transform: rotate(10deg); }
    100% { -webkit-transform: rotate(0deg); }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core">
      <div class="particle" style="top: 20px; left: 20px; animation-delay: 0s;"></div>
      <div class="particle" style="top: 40px; left: 40px; animation-delay: 1s;"></div>
      <div class="particle" style="top: 60px; left: 60px; animation-delay: 2s;"></div>
      <div class="particle" style="top: 80px; left: 70px; animation-delay: 3s;"></div>
    </div>
    <svg class="neural-web">
      <path d="M 100 0 L 200 100 L 300 0 L 200 100 Z" stroke-dasharray="100, 100" stroke-dashoffset="0" />
      <path d="M 300 100 L 400 0 L 500 100 L 400 0 Z" stroke-dasharray="100, 100" stroke-dashoffset="0" />
      <path d="M 500 0 L 100 100 L 0 0 L 100 100 Z" stroke-dasharray="100, 100" stroke-dashoffset="0" />
    </svg>
    <div class="particle" style="top: 10px; left: 10px; animation-delay: 4s;"></div>
    <div class="particle" style="top: 30px; left: 30px; animation-delay: 5s;"></div>
    <div class="particle" style="top: 50px; left: 50px; animation-delay: 6s;"></div>
  </div>
        </div>
        </body>
        </html>
