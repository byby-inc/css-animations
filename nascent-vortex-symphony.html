<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Nascent Vortex Symphony</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            /* Main container */
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  }
  
  /* The core */
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: linear-gradient(to bottom, #6495ED 0%, #A1C9F2 100%);
    box-shadow: 
      0 0 5px #6495ED, 
      0 0 10px #6495ED, 
      0 0 15px #6495ED, 
      0 0 20px #6495ED, 
      0 0 25px #6495ED, 
      0 0 30px #6495ED;
    animation: core-pulse infinite 2s;
  }
  
  /* The particles */
  .particle {
    position: absolute;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    background: linear-gradient(to bottom, #6495ED 0%, #A1C9F2 100%);
  }
  .particle.p1 {
    top: 20%;
    left: 20%;
    animation: particle-dance infinite 4s;
  }
  .particle.p2 {
    top: 30%;
    left: 40%;
    animation: particle-dance infinite 5s;
  }
  .particle.p3 {
    top: 40%;
    left: 60%;
    animation: particle-dance infinite 6s;
  }
  .particle.p4 {
    top: 50%;
    left: 80%;
    animation: particle-dance infinite 7s;
  }
  .particle.p5 {
    top: 60%;
    left: 20%;
    animation: particle-dance infinite 8s;
  }
  .particle.p6 {
    top: 70%;
    left: 40%;
    animation: particle-dance infinite 9s;
  }
  .particle.p7 {
    top: 80%;
    left: 60%;
    animation: particle-dance infinite 10s;
  }
  .particle.p8 {
    top: 90%;
    left: 80%;
    animation: particle-dance infinite 11s;
  }
  .particle.p9 {
    top: 10%;
    left: 10%;
    animation: particle-dance infinite 12s;
  }
  .particle.p10 {
    top: 20%;
    left: 30%;
    animation: particle-dance infinite 13s;
  }
  
  /* The neural web */
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: #fff;
  }
  .neural-web path {
    stroke: #fff;
    stroke-width: 1;
  }
  .neural-web path.line1 {
    animation: neural-flicker infinite 3s;
  }
  .neural-web path.line2 {
    animation: neural-flicker infinite 4s;
  }
  .neural-web path.line3 {
    animation: neural-flicker infinite 5s;
  }
  
  /* Keyframes */
  @keyframes particle-dance {
    0% {
      transform: scale(1) rotate(0deg);
    }
    50% {
      transform: scale(1.5) rotate(360deg);
    }
    100% {
      transform: scale(1) rotate(0deg);
    }
  }
  
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.2);
    }
    100% {
      transform: scale(1);
    }
  }
  
  @keyframes neural-flicker {
    0% {
      transform: rotate(0deg);
    }
    50% {
      transform: rotate(180deg);
    }
    100% {
      transform: rotate(0deg);
    }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path class="line1" d="M 50 50 L 70 70" />
      <path class="line2" d="M 50 50 L 30 80" />
      <path class="line3" d="M 50 50 L 60 60" />
    </svg>
    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>
    <div class="particle p5"></div>
    <div class="particle p6"></div>
    <div class="particle p7"></div>
    <div class="particle p8"></div>
    <div class="particle p9"></div>
    <div class="particle p10"></div>
  </div>
        </div>
        </body>
        </html>
