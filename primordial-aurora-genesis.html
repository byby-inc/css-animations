<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Primordial Aurora Genesis</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.1);
    }
    100% {
      transform: scale(1);
    }
  }
  @keyframes particle-dance {
    0% {
      transform: rotate(0deg) translateX(0) translateY(0);
    }
    50% {
      transform: rotate(360deg) translateX(20%) translateY(10%);
    }
    100% {
      transform: rotate(360deg) translateX(0) translateY(0);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.2);
    }
    100% {
      transform: scale(1);
    }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: linear-gradient(to right, #00FF00, #00F0FF);
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: linear-gradient(to bottom, #FF8000, #FF0000);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.1),
      0 0 10px 10px rgba(255, 255, 255, 0.5),
      0 3px 10px 10px rgba(255, 255, 255, 0.2),
      0 10px 10px 10px rgba(255, 255, 255, 0.3),
      0 10px 10px 10px rgba(255, 255, 255, 0.4),
      0 10px 30px 10px rgba(255, 255, 255, 0.6);
    animation: core-pulse infinite 2s;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    background: linear-gradient(to bottom, #FF00FF, #F0FFFF);
    animation: particle-dance infinite 3s;
  }
  .particle:nth-child(1) {
    top: 30%;
    left: 30%;
    transform: rotate(45deg) translateX(10%) translateY(10%);
  }
  .particle:nth-child(2) {
    top: 50%;
    left: 20%;
    transform: rotate(90deg) translateX(20%) translateY(15%);
  }
  .particle:nth-child(3) {
    top: 70%;
    left: 40%;
    transform: rotate(135deg) translateX(15%) translateY(8%);
  }
  .particle:nth-child(4) {
    top: 10%;
    left: 60%;
    transform: rotate(180deg) translateX(18%) translateY(12%);
  }
  .particle:nth-child(5) {
    top: 20%;
    left: 80%;
    transform: rotate(225deg) translateX(5%) translateY(10%);
  }
  .particle:nth-child(6) {
    top: 40%;
    left: 70%;
    transform: rotate(270deg) translateX(12%) translateY(6%);
  }
  .particle:nth-child(7) {
    top: 10%;
    left: 90%;
    transform: rotate(315deg) translateX(20%) translateY(7%);
  }
  .particle:nth-child(8) {
    top: 60%;
    left: 80%;
    transform: rotate(0deg) translateX(15%) translateY(9%);
  }
  .particle:nth-child(9) {
    top: 80%;
    left: 90%;
    transform: rotate(90deg) translateX(10%) translateY(11%);
  }
  .particle:nth-child(10) {
    top: 80%;
    left: 60%;
    transform: rotate(180deg) translateX(18%) translateY(5%);
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #FFFFFF;
  }
  .neural-web path {
    stroke-width: 2px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .neural-web path:nth-child(1) {
    d: M 50 50 L 100 80 L 90 90;
  }
  .neural-web path:nth-child(2) {
    d: M 50 50 L 100 20 L 90 30;
  }
  .neural-web path:nth-child(3) {
    d: M 50 50 L 20 80 L 30 90;
  }
  .neural-web path:nth-child(4) {
    d: M 50 50 L 20 20 L 30 30;
  }
  .neural-web path:nth-child(5) {
    d: M 50 50 L 80 80 L 70 90;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core">
      <svg class="neural-web">
        <path d="M 50 50 L 100 80 L 90 90" />
        <path d="M 50 50 L 100 20 L 90 30" />
        <path d="M 50 50 L 20 80 L 30 90" />
        <path d="M 50 50 L 20 20 L 30 30" />
        <path d="M 50 50 L 80 80 L 70 90" />
      </svg>
    </div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
