<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Primordial Eruption of the Cosmic Dawn</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            /* keyframes for animations */
  @keyframes particle-dance {
    0% {
      transform: rotate(0deg) translate(0px, 0px);
    }
    100% {
      transform: rotate(360deg) translate(40px, 0px);
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.05);
    }
    100% {
      transform: scale(1);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: rotate(0deg) translate(0px, 0px);
    }
    100% {
      transform: rotate(360deg) translate(10px, 10px);
    }
  }

  /* styles for elements */
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%,75% 0%,100% 25%,50% 100%,0% 25%);
    background: linear-gradient(to bottom, #fff, #444);
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: linear-gradient(to bottom, #ff9900, #ff6600);
    box-shadow: 0 0 10px #ff6600, 10px 0 10px #ff9900, 0 10px 10px #ff9900, -10px 0 10px #ff9900, 0 -10px 10px #ff6600, -10px -10px 10px #ff6600;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(to bottom, #fff, #444);
    animation: particle-dance 4s infinite;
  }
  .particle-1 {
    top: 200px;
    left: 200px;
    width: 50px;
    height: 50px;
    transition: transform 1s ease;
  }
  .particle-2 {
    top: 300px;
    left: 400px;
    width: 75px;
    height: 75px;
    animation: particle-dance 3s infinite forwards;
  }
  .particle-3 {
    top: 100px;
    left: 100px;
    width: 25px;
    height: 25px;
    transform: rotate(45deg);
  }
  .particle-4 {
    top: 500px;
    left: 500px;
    width: 150px;
    height: 150px;
  }
  .particle-5 {
    top: 300px;
    left: 300px;
    width: 100px;
    height: 100px;
    animation: particle-dance 2s infinite;
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
  }
  .neural-web path {
    stroke-width: 2px;
    opacity: 0.5;
  }
  .neural-web path:nth-child(1) {
    stroke-dasharray: 100, 150;
    animation: neural-flicker 6s infinite;
  }
  .neural-web path:nth-child(2) {
    stroke-dasharray: 150, 200;
    animation: neural-flicker 5s infinite;
  }
  .neural-web path:nth-child(3) {
    stroke-dasharray: 200, 250;
    animation: neural-flicker 4s infinite;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core">
      <div class="particle particle-1"></div>
      <div class="particle particle-2"></div>
      <div class="particle particle-3"></div>
      <div class="particle particle-4"></div>
      <div class="particle particle-5"></div>
      <svg class="neural-web">
        <path d="M100,100 L200,100 L200,200 L100,200 Z" />
        <path d="M200,100 L300,100 L300,200 L200,200 Z" />
        <path d="M100,100 L200,100 L200,200 L100,200 Z" />
      </svg>
    </div>
  </div>
        </div>
        </body>
        </html>
