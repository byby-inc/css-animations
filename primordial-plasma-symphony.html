<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Primordial Plasma Symphony</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            /* absolute main container */
.vortex-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  background-image: linear-gradient(90deg, #2c2f33, #4c535b);
  clip-path: polygon(25% 0%,75% 0%,100% 25%,50% 100%,0% 25%);
}
 /* core element */
.core {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background-image: linear-gradient(to bottom right, #ff99cc, #ff99cc);
  background-image: linear-gradient(to top left, #ffffcc, #ffffcc);
  background-image: linear-gradient(to right, #33ccff, #33ccff);
  background-image: linear-gradient(to left, #ff0066, #ff0066);
  background-image: linear-gradient(to bottom, #ccccff, #ccccff);
  background-image: linear-gradient(to top, #ff66cc, #ff66cc);
  border-radius: 50%;
  padding: 100px;
}
/* box shadows */
.core::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 300px;
  height: 300px;
  border-radius: 50%;
  box-shadow: 0 0 100px #33ccff;
  box-shadow: 0 0 150px #ff9966;
  box-shadow: 0 0 200px #ffffcc;
  box-shadow: 0 0 250px #ff6633;
  box-shadow: 0 0 300px #cc0033;
  box-shadow: 0 0 350px #33cccc;
}

 /* free particles */
.particle {
  position: absolute;
  top: 50%;
  left: 50%;
  transform-origin: center;
  animation: particle-dance 12s infinite linear;
  border-radius: 50%;
  width: 20px;
  height: 20px;
}
.particle:nth-child(2) {
  animation-duration: 10s;
}
.particle:nth-child(3) {
  animation-duration: 8s;
}
.particle:nth-child(4) {
  animation-duration: 6s;
}
.particle:nth-child(5) {
  animation-duration: 4s;
}
.particle:nth-child(6) {
  animation-duration: 3s;
}
.particle:nth-child(7) {
  animation-duration: 2s;
}

@keyframes particle-dance {
  0% {
    transform: rotate(0deg) translate(0px, 50px);
  }
  20% {
    transform: rotate(-10deg) translate(20px, 40px);
  }
  40% {
    transform: rotate(5deg) translate(10px, 30px);
  }
  60% {
    transform: rotate(-15deg) translate(30px, 20px);
  }
  80% {
    transform: rotate(10deg) translate(5px, 10px);
  }
  100% {
    transform: rotate(0deg) translate(0px, 50px);
  }
}

 /* free svg */
.neural-web {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}
.neural-web path {
  stroke: #fff;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
 
.neural-web path:nth-child(1) {
  transform: rotate(45deg);
}
.neural-web path:nth-child(2) {
  transform: rotate(-10deg);
}
.neural-web path:nth-child(3) {
  transform: rotate(30deg);
}
 
.neural-web {
  animation: neural-flicker 10s infinite ease-in-out;
}
 
 @keyframes neural-flicker {
  0% {
    transform: translate(0px, 0px);
  }
  50% {
    transform: translate(50px, -50px);
  }
  100% {
    transform: translate(0px, 0px);
  }
}

 /* core pulse */
.core {
  animation: core-pulse 8s infinite ease-out;
}
 
@keyframes core-pulse {
  0% {
    transform: scale(1, 1);
  }
  50% {
    transform: scale(1.1, 1.1);
  }
  100% {
    transform: scale(1, 1);
  }
}
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
  <div class="core"></div>
  <svg class="neural-web">
    <path d="M 50 50 L 150 50 L 150 150 L 250 150 L 250 250 L 50 250 L 50 150 Z" />
    <path d="M 150 150 L 250 150 L 250 200 L 350 200 L 350 150 Z" />
    <path d="M 250 250 L 350 250 L 350 350 L 450 350 L 450 250 Z" />
  </svg>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
</div>
        </div>
        </body>
        </html>
