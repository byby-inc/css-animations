<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Primordial Quantum Bloom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            /* Styles for .vortex-container */
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    z-index: -1;
  }
  .vortex-container::after {
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    background: linear-gradient(90deg, #ff69b4, #ff99cc, #ffff66, #ccccff);
  }

  /* Styles for .core */
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    box-shadow: 0 0 10px 20px #0003;
    box-shadow: 0 0 10px 30px #0006;
    box-shadow: 0 0 10px 40px #0009;
    box-shadow: 0 0 10px 50px #0000C;
    box-shadow: 0 0 10px 60px #0000F;
    box-shadow: 0 0 10px 70px #00012;
  }
  .core::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: linear-gradient(90deg, #ff69b4, #ff99cc);
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    100% {
      transform: scale(1.1);
    }
  }

  /* Styles for .particle */
  .particle {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: linear-gradient(90deg, #ff69b4, #ff99cc, #ffff66, #ccccff);
    animation: particle-dance 10s infinite;
  }
  @keyframes particle-dance {
    0% {
      transform: translate(0, 0) rotate(0deg);
    }
    50% {
      transform: translate(-100px, -100px) rotate(360deg);
    }
    100% {
      transform: translate(0, 0) rotate(0deg);
    }
  }

  /* Styles for .neural-web */
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    fill: none;
    stroke: #fff;
  }
  .neural-web path:nth-child(1) {
    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;
    animation: neural-flicker 2s infinite;
  }
  @keyframes neural-flicker {
    0% {
      transform: translate(0, 0);
      stroke-dashoffset: 1000;
    }
    100% {
      transform: translate(100px, 100px);
      stroke-dashoffset: 0;
    }
  }
  .neural-web path:nth-child(2) {
    stroke-dasharray: 800;
    stroke-dashoffset: 800;
    animation: neural-flicker 3s infinite;
  }
  @keyframes neural-flicker {
    0% {
      transform: translate(0, 0);
      stroke-dashoffset: 800;
    }
    100% {
      transform: translate(50px, 50px);
      stroke-dashoffset: 0;
    }
  }
  .neural-web path:nth-child(3) {
    stroke-dasharray: 600;
    stroke-dashoffset: 600;
    animation: neural-flicker 4s infinite;
  }
  @keyframes neural-flicker {
    0% {
      transform: translate(0, 0);
      stroke-dashoffset: 600;
    }
    100% {
      transform: translate(200px, 200px);
      stroke-dashoffset: 0;
    }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M0 100 L2000 1000 S 500 -500 0 0 Z" />
      <path d="M600 100 L200 -1000 S 700 -1500 0 0 Z" />
      <path d="M200 900 L100 700 S 500 0 0 0 Z" />
    </svg>
    <div class="particle" style="top: 10px; left: 10px;"></div>
    <div class="particle" style="top: 20px; left: 20px;"></div>
    <div class="particle" style="top: 30px; left: 30px;"></div>
    <div class="particle" style="top: 40px; left: 40px;"></div>
    <div class="particle" style="top: 50px; left: 50px;"></div>
    <div class="particle" style="top: 60px; left: 60px;"></div>
    <div class="particle" style="top: 70px; left: 70px;"></div>
    <div class="particle" style="top: 80px; left: 80px;"></div>
  </div>
        </div>
        </body>
        </html>
