<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Primordial Transcendent Vortex</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: translateY(0px) rotate(0deg);
    }
    25% {
      transform: translateY(-20px) rotate(10deg);
    }
    50% {
      transform: translateY(0px) rotate(0deg);
    }
    75% {
      transform: translateY(20px) rotate(-10deg);
    }
    100% {
      transform: translateY(0px) rotate(0deg);
    }
  }
  
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.2);
    }
    100% {
      transform: scale(1);
    }
  }
  
  @keyframes neural-flicker {
    0% {
      transform: translate(0px, 0px) rotate(0deg);
    }
    25% {
      transform: translate(-5px, 0px) rotate(10deg);
    }
    50% {
      transform: translate(0px, 0px) rotate(0deg);
    }
    75% {
      transform: translate(5px, 0px) rotate(-10deg);
    }
    100% {
      transform: translate(0px, 0px) rotate(0deg);
    }
  }
  
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: linear-gradient(to bottom right, #ff9900, #ff0066);
  }
  
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: linear-gradient(to bottom, #ffff99, #9999ff);
    box-shadow: 0px 0px 10px #66ccff;
    box-shadow: 0px 0px 10px #00ff66;
    box-shadow: 0px 0px 10px #cc6600;
    box-shadow: 0px 0px 10px #66ffcc;
    box-shadow: 0px 0px 10px #ff0066;
    box-shadow: 0px 0px 10px #ffcc00;
  }
  
  .particle {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: linear-gradient(to bottom, #ffff99, #9999ff);
    animation: particle-dance 3s infinite;
  }
  
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
    stroke-width: 2px;
  }
  
  .neural-web path {
    stroke-linecap: round;
    stroke-linejoin: round;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core" style="animation: core-pulse 2s infinite;"></div>
    <svg class="neural-web">
      <path d="M50 50 L150 50 L150 150 L50 150 Z" style="animation: neural-flicker 1s infinite;"></path>
      <path d="M150 50 L250 50 L250 150 L150 150 Z" style="animation: neural-flicker 1s infinite;"></path>
      <path d="M50 50 L250 50 L250 0 L50 0 Z" style="animation: neural-flicker 1s infinite;"></path>
      <path d="M100 0 L250 0 L250 100 L100 100 Z" style="animation: neural-flicker 2s infinite;"></path>
      <path d="M50 150 L250 150 L250 250 L50 250 Z" style="animation: neural-flicker 2s infinite;"></path>
      <path d="M250 50 L100 50 L100 200 L250 200 Z" style="animation: neural-flicker 2s infinite;"></path>
      <path d="M0 0 L250 0 L250 250 L0 250 Z" style="animation: neural-flicker 2s infinite;"></path>
      <path d="M0 50 L250 50 L250 150 L0 150 Z" style="animation: neural-flicker 2s infinite;"></path>
      <path d="M50 0 L0 0 L0 50 L50 50 Z" style="animation: neural-flicker 2s infinite;"></path>
      <path d="M150 150 L250 150 L250 100 L150 100 Z" style="animation: neural-flicker 2s infinite;"></path>
    </svg>
    <div class="particle" style="top: 10px; left: 10px;"></div>
    <div class="particle" style="top: 20px; left: 20px;"></div>
    <div class="particle" style="top: 30px; left: 30px;"></div>
    <div class="particle" style="top: 40px; left: 40px;"></div>
    <div class="particle" style="top: 50px; left: 50px;"></div>
    <div class="particle" style="top: 60px; left: 60px;"></div>
    <div class="particle" style="top: 70px; left: 70px;"></div>
    <div class="particle" style="top: 80px; left: 80px;"></div>
    <div class="particle" style="top: 90px; left: 90px;"></div>
    <div class="particle" style="top: 100px; left: 100px;"></div>
  </div>
        </div>
        </body>
        </html>
