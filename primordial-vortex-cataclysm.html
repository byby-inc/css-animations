<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Primordial Vortex Cataclysm</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            /* keyframes */
  @keyframes particle-dance {
    0% { transform: translate(0, 0) rotate(0); }
    50% { transform: translate(5px, 5px) rotate(10deg); }
    100% { transform: translate(0, 0) rotate(0); }
  }
  
  @keyframes core-pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  
  @keyframes neural-flicker {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(2px, 2px) scale(1.1); }
    100% { transform: translate(0, 0) scale(1); }
  }
  
  /* main wrapper */
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  }
  
  /* core */
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    background: linear-gradient(to bottom, #333, #666, #333);
    border-radius: 50%;
    box-shadow:
      0 0 20px #000,
      0 0 50px #000,
      0 10px 20px #000,
      10px 10px 30px #000,
      -10px -20px 30px #000,
      20px 10px 20px #000,
      -30px -20px 40px #000,
      -10px -30px 40px #000;
    animation: core-pulse 2s infinite;
  }
  
  /* particles */
  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(to bottom, #999, #aaa, #999);
  }
  
  /* neural web */
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
  }
  
  /* animation */
  @keyframes particle-dance {
    0% { transform: translate(0, 0) rotate(0); }
    50% { transform: translate(5px, 5px) rotate(10deg); }
    100% { transform: translate(0, 0) rotate(0); }
  }
  
  @keyframes core-pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  
  @keyframes neural-flicker {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(2px, 2px) scale(1.1); }
    100% { transform: translate(0, 0) scale(1); }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 50 50 l 100 0 c 30 -50 -50 50 -100 50 c -50 0 -100 -50 -100 -50"></path>
      <path d="M 50 50 l -100 0 c 20 -40 -30 30 -80 70"></path>
      <path d="M 50 50 l 0 100 l -80 0"></path>
    </svg>
    <div class="particle" style="top: 10%; left: 30%; animation: particle-dance 1s infinite;"></div>
    <div class="particle" style="top: 20%; left: 20%; animation: particle-dance 1s infinite;"></div>
    <div class="particle" style="top: 15%; left: 40%; animation: particle-dance 1s infinite;"></div>
    <div class="particle" style="top: 30%; left: 25%; animation: particle-dance 1s infinite;"></div>
    <div class="particle" style="top: 40%; left: 35%; animation: particle-dance 1s infinite;"></div>
    <div class="particle" style="top: 25%; left: 50%; animation: particle-dance 1s infinite;"></div>
    <div class="particle" style="top: 10%; left: 60%; animation: particle-dance 1s infinite;"></div>
    <div class="particle" style="top: 5%; left: 45%; animation: particle-dance 1s infinite;"></div>
  </div>
        </div>
        </body>
        </html>
