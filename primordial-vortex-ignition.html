<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Primordial Vortex Ignition</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: translate(0, 0) rotate(0) scale(1);
    }
    100% {
      transform: translate(50px, -50px) rotate(360deg) scale(0.9);
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    100% {
      transform: scale(2);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: rotate(0) translate(0, 0);
    }
    100% {
      transform: rotate(360deg) translate(0, 5px);
    }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    clip-path: circle(50% at 50% 50%);
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(270deg, #ff69b4, #33ccff);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    box-shadow:
      0 0 10px #ff69b4,
      0 0 15px #33ccff,
      0 0 20px rgba(0, 0, 0, 0.2),
      0 0 10px rgba(0, 0, 0, 0.3),
      0 0 5px rgba(0, 0, 0, 0.5),
      0 0 2px rgba(0, 0, 0, 0.7);
  }
  .core:hover {
    animation: core-pulse 5s infinite;
  }
  .particle {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: linear-gradient(300deg, #ff69b4, #33ccff);
  }
  @keyframes particle-dance {
    0% {
      transform: translate(0, 0) rotate(0) scale(1);
    }
    100% {
      transform: translate(50px, -50px) rotate(360deg) scale(0.9);
    }
  }
  .particle:hover {
    animation: particle-dance 2s infinite;
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  .neural-web path {
    fill: none;
    stroke: #fff;
  }
  @keyframes neural-flicker {
    0% {
      transform: rotate(0) translate(0, 0);
    }
    100% {
      transform: rotate(360deg) translate(0, 5px);
    }
  }
  .neural-web:hover {
    animation: neural-flicker 10s infinite;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M50 0 L75 25 L50 50 L25 25 L50 0" />
      <path d="M75 0 L100 25 L75 50 L50 25 L75 0" />
      <path d="M25 0 L0 25 L25 50 L50 25 L25 0" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
