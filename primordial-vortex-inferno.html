<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Primordial Vortex Inferno</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            /* Clip-path */
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: circle(50% at 50% 50%);
  }
 
  /* Core */
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    width: 200px;
    height: 200px;
    background: linear-gradient(to bottom, #33CCFF, #FF99CC);
    box-shadow: 
      0 0 20px #99CCFF,
      0 0 30px #FF66CC,
      0 0 40px #CC66FF,
      0 0 50px #66CCFF,
      0 0 60px #CC6666,
      0 0 70px #FF66CC,
      0 0 80px #33CCFF;
  }
 
  /* Particles */
  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(to bottom, #66CCFF, #FF99CC);
  }
 
  /* Neural Web */
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
 
  /* Particles Animation */
  @keyframes particle-dance {
    0% {
      transform: translate(0, 0) rotate(0);
    }
    20% {
      transform: translate(-20px, 10px) rotate(15deg);
    }
    30% {
      transform: translate(20px, -10px) rotate(-15deg);
    }
    50% {
      transform: translate(0, 0) rotate(0);
    }
    80% {
      transform: translate(10px, 20px) rotate(45deg);
    }
    100% {
      transform: translate(-10px, -20px) rotate(-45deg);
    }
  }
 
  /* Core Animation */
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    20% {
      transform: scale(1.2);
    }
    30% {
      transform: scale(0.8);
    }
    50% {
      transform: scale(1.1);
    }
    80% {
      transform: scale(0.9);
    }
    100% {
      transform: scale(1);
    }
  }
 
  /* Neural Web Animation */
  @keyframes neural-flicker {
    0% {
      transform: translate(0px, 0px);
    }
    20% {
      transform: translate(0px, 20px);
    }
    30% {
      transform: translate(0px, -20px);
    }
    50% {
      transform: translate(0px, 0px);
    }
    80% {
      transform: translate(0px, 10px);
    }
    100% {
      transform: translate(0px, -10px);
    }
  }
 
  .vortex-container {
    animation: core-pulse 4s infinite;
  }
 
  .particle {
    animation: particle-dance 10s infinite;
  }
 
  .neural-web {
    animation: neural-flicker 1s infinite;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <div class="particle" style="top: 100px; left: 100px;"></div>
    <div class="particle" style="top: 50px; left: 50px;"></div>
    <div class="particle" style="top: 200px; left: 200px;"></div>
    <div class="particle" style="top: 300px; left: 300px;"></div>
    <div class="particle" style="top: 150px; left: 250px;"></div>
    <div class="particle" style="top: 250px; left: 150px;"></div>
    <div class="particle" style="top: 400px; left: 400px;"></div>
    <svg class="neural-web">
      <path d="M 100 100 L 200 200 L 300 100" stroke="#fff" />
      <path d="M 100 100 L 50 50 L 300 100" stroke="#fff" />
      <path d="M 100 100 L 200 300 L 0 0" stroke="#fff" />
    </svg>
  </div>
        </div>
        </body>
        </html>
