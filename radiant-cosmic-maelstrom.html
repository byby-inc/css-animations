<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Radiant Cosmic Maelstrom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    100% {
      transform: scale(1.2);
    }
  }

  @keyframes particle-dance {
    0% {
      transform: translate(0px, -30px) rotate(0deg);
    }
    100% {
      transform: translate(0px, 20px) rotate(360deg);
    }
  }

  @keyframes neural-flicker {
    0% {
      transform: translateY(-15px) scale(1);
    }
    100% {
      transform: translateY(15px) scale(1.1);
    }
  }

  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: linear-gradient(#3C3C3C, #565656);
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: linear-gradient(rgba(255, 0, 0, 0.5), rgba(0, 255, 255, 0.5));
  }

  .core::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    box-shadow: 0 0 10px 0 rgba(255, 0, 0, 0.2);
    box-shadow: 0 0 20px 0 rgba(255, 255, 255, 0.2);
    box-shadow: 0 0 30px 0 rgba(0, 255, 255, 0.2);
    box-shadow: 0 0 40px 0 rgba(0, 0, 255, 0.2);
    box-shadow: 0 0 50px 0 rgba(255, 255, 0, 0.2);
    box-shadow: 0 0 60px 0 rgba(255, 0, 255, 0.2);
    box-shadow: 0 0 70px 0 rgba(0, 255, 0, 0.2);
    background: linear-gradient(#FF0000, #00FF00);
    animation: core-pulse 10s infinite;
  }

  .particle {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: linear-gradient(rgba(255, 0, 0, 0.5), rgba(0, 255, 255, 0.5));
    animation: particle-dance 2s infinite;
  }

  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
    stroke-width: 2;
  }

  .neural-web path {
    stroke-dasharray: 100;
    stroke-dashoffset: 0;
    animation: neural-flicker 5s infinite;
  }

  .neural-web path:nth-child(1) {
    transform: translateY(-15px);
  }
  .neural-web path:nth-child(2) {
    transform: translateY(15px);
  }
  .neural-web path:nth-child(3) {
    transform: translateY(30px);
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 0 50 0 100 50 150 100 150 150 200 150 150 100 100 50 50z"></path>
      <path d="M 50 0 50 50 0 100 150 100 100 50 0 0z"></path>
      <path d="M 0 0 0 50 50 150 0 150 150 100 150 50 0 0z"></path>
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
