<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Stellar Vortex Harmonics</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

            /* Code snippet container */
            .codigo {
            position: absolute;
            top:15%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background:url("/gold_snippet") no-repeat center center;
            color: white;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 45px;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.9);
            text-align: center;
            border-radius: 12px;
            line-height: 1.6;
            max-height: 25%;
            max-width: 75%;
            width: 75%;
            height: 25%;
            overflow-y: hidden;
            border: 6px solid;
            border-image: linear-gradient(
                135deg,
                #D4AF37 0%,
                #F9E79F 15%,
                #B8860B 30%,
                #CFB53B 45%,
                #E6C35C 60%,
                #B8860B 75%,
                #D4AF37 90%,
                #C9A961 100%
            ) 1;
            box-shadow: 
                inset 0 2px 4px rgba(212, 175, 55, 0.3),
                inset 0 -2px 4px rgba(139, 101, 8, 0.4),
                0 4px 12px rgba(184, 134, 11, 0.5),
                0 8px 25px rgba(0, 0, 0, 0.6);
            }

            /* Animation container */
            .animation-container {
            position: absolute;
            top:70%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: rotate(0deg) translate(0px, 0px);
    }
    50% {
      transform: rotate(180deg) translate(10px, 10px);
    }
    100% {
      transform: rotate(360deg) translate(0px, 0px);
    }
  }

  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.2);
    }
    100% {
      transform: scale(1);
    }
  }

  @keyframes neural-flicker {
    0% {
      transform: translateY(0px);
    }
    50% {
      transform: translateY(5px);
    }
    100% {
      transform: translateY(0px);
    }
  }

  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: linear-gradient(to bottom right, #03055B, #5A005E);
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(to bottom right, #FFFFFF, #AAAAAA);
    box-shadow: 0 0 10px #FFFFFF, 0 0 20px #AAAAAA, 0 0 30px #888888, 0 0 40px #666666, 0 0 50px #444444, 0 0 60px #222222;
    animation: core-pulse 5s infinite;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    background: linear-gradient(to bottom right, #FFFFFF, #AAAAAA);
    animation: particle-dance 10s infinite;
  }

  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: none;
    animation: neural-flicker 7s infinite;
  }

  .neural-web path {
    stroke: #FFFFFF;
    stroke-width: 2;
  }
        </style>
        </head>
        <body>
        <div class="codigo">
            <div>.vortex-container { background: linear-gradient(to bottom right, #03055B, #5A005E); }</div>
        </div>
        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M10 10 C 20 20, 40 20, 50 10" />
      <path d="M50 10 C 60 20, 80 20, 90 10" />
      <path d="M90 10 C 100 20, 120 20, 130 10" />
    </svg>
    <div class="particle" style="top: 10%; left: 10%;"></div>
    <div class="particle" style="top: 20%; left: 30%;"></div>
    <div class="particle" style="top: 30%; left: 50%;"></div>
    <div class="particle" style="top: 40%; left: 70%;"></div>
    <div class="particle" style="top: 50%; left: 90%;"></div>
  </div>
        </div>
        </body>
        </html>
