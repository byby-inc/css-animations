<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Timeless Aurora Surge</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            .vortex-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  background: linear-gradient(to bottom, #000bff, #33ccff);
}
.core {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background: linear-gradient(to bottom, #ffffff, #0000ff);
  box-shadow:
  0 0 10px #0000ff,
  0 0 20px #0000ff,
  0 0 30px #0000ff,
  0 0 40px #0000ff,
  0 0 50px #0000ff,
  0 0 60px #0000ff;
  animation: core-pulse infinite;
}
.particle {
  position: absolute;
  border-radius: 50%;
  width: 30px;
  height: 30px;
  background: linear-gradient(to right, #ffffff, #0000ff);
}
.particle1 {
  top: 30%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(45deg);
  animation: particle-dance 10s infinite;
}
.particle2 {
  top: 50%;
  left: 70%;
  transform: translate(-50%, -50%) rotate(30deg);
  animation: particle-dance 8s infinite;
}
.particle3 {
  top: 20%;
  left: 80%;
  transform: translate(-50%, -50%) rotate(60deg);
  animation: particle-dance 12s infinite;
}
.neural-web {
  position: absolute;
  top: 30%;
  left: 30%;
  width: 40%;
  height: 60%;
  fill: #ffffff;
  stroke: #ffffff;
  stroke-width: 2;
  animation: neural-flicker infinite;
}
.neural-web path:nth-child(1) {
  d: M 0 20 L 40 60 80 0;
}
.neural-web path:nth-child(2) {
  d: M 20 40 L 60 80 40 60;
}
.neural-web path:nth-child(3) {
  d: M 80 20 L 20 60 40 40;
}
@keyframes core-pulse {
  0% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.2);
  }
  100% {
    transform: scale(1);
  }
}
@keyframes particle-dance {
  0% {
    transform: translate(-50%, -50%) rotate(45deg);
  }
  50% {
    transform: translate(-50%, -50%) rotate(90deg);
  }
  100% {
    transform: translate(-50%, -50%) rotate(45deg);
  }
}
@keyframes neural-flicker {
  0% {
    transform: translate(20px, 20px) scale(1);
  }
  50% {
    transform: translate(10px, 10px) scale(0.9);
  }
  100% {
    transform: translate(20px, 20px) scale(1);
  }
}
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <div class="particle1"></div>
    <div class="particle2"></div>
    <div class="particle3"></div>
    <div class="particle4"></div>
    <div class="particle5"></div>
    <div class="particle6"></div>
    <div class="particle7"></div>
    <div class="particle8"></div>
    <div class="particle9"></div>
    <div class="particle10"></div>
    <svg class="neural-web">
      <path d="M 0 20 L 40 60 80 0" />
      <path d="M 20 40 L 60 80 40 60" />
      <path d="M 80 20 L 20 60 40 40" />
    </svg>
  </div>
        </div>
        </body>
        </html>
