<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Timeless Cosmic Dawn</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: rotate(0deg) translateX(0vw)
      }
    50% {
      transform: rotate(30deg) translateX(10vw)
      }
    100% {
      transform: rotate(0deg) translateX(-15vw)
      }
  }

  @keyframes core-pulse {
    0% {
      transform: scale(1)
      }
    50% {
      transform: scale(1.2)
      }
    100% {
      transform: scale(1)
      }
  }

  @keyframes neural-flicker {
    0% {
      transform: rotate(0deg) scale(1)
      }
    50% {
      transform: rotate(3deg) scale(1.05)
      }
    100% {
      transform: rotate(0deg) scale(1)
      }
  }

  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%,75% 0%,100% 25%,50% 100%,0% 25%);
    background-image: linear-gradient(to bottom right, rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 1));
    background-size: 300% 300%;
    animation: pulsate 15s ease infinite;
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background-image: linear-gradient(to bottom right, #fff, #666);
    background-size: 300% 300%;
    animation: core-pulse 5s ease infinite;
  }

  .core::before,
  .core::after {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    content: '';
    width: 20px;
    height: 20px;
    background-image: linear-gradient(to bottom right, #fff, #666);
    background-size: 300% 300%;
    border-radius: 50%;
  }

  .core::after {
    top: 60%;
    left: 40%;
    width: 30px;
    height: 30px;
  }

  .core::before {
    top: 40%;
    left: 60%;
    width: 30px;
    height: 30px;
  }

  .core::before,
  .core::after {
    animation: pulse 5s ease infinite;
  }
  @keyframes pulse {
    0% {
      animation: rotate 1s linear infinite;
      transform: scale(1);
      box-shadow: 0 0 0 5px #fff, 0 0 0 10px #666, 0 0 0 15px #fff, 0 0 0 20px #666;
    }
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    background-image: linear-gradient(to bottom right, #fff, #666);
    animation: particle-dance 3s ease infinite;
  }

  .particle:nth-child(1) {
    top: 20%;
    left: 30%;
    background: linear-gradient(to bottom right, #ccc, #666);
  }

  .particle:nth-child(2) {
    top: 40%;
    left: 50%;
    background-image: radial-gradient(rgba(255, 255, 255, 0.3), rgba(0, 0, 0, 0)),
      radial-gradient(rgba(255, 0, 255, 0.3), rgba(0, 0, 0, 0));
  }

  .particle:nth-child(3) {
    top: 60%;
    left: 20%;
    background: linear-gradient(to bottom right, #666, #ccc);
  }

  .particle:nth-child(4) {
    top: 80%;
    left: 40%;
    background-image: conic-gradient(rgb(255, 255, 255, 0.5), rgb(0, 0, 0, 0));
  }

  .neural-web {
    position: absolute;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
  }

  .neural-web path {
    stroke: #fff;
  }

  .neural-web path:nth-child(1) {
    d: M 50%, 25% C 25%, 50% 75%, 50% 50% 25%, 25%;
  }

  .neural-web path:nth-child(2) {
    d: M 50%, 50% C 25%, 75% 75%, 75% 50% 25%, 25%;
  }

  .neural-web path:nth-child(3) {
    d: M 50%, 75% C 25%, 25% 75%, 25% 75% 25%, 75%;
  }

  .neural-web path:nth-child(4) {
    d: M 25%, 50% L 50%, 25% L 75%, 50%;
  }

  .neural-web path:nth-child(5) {
    d: M 75%, 50% L 50%, 25% L 25%, 50%;
  }

  .neural-web path:nth-child(6) {
    d: M 50%, 50% C 25%, 25% 75%, 25% 25%, 75%;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 50%, 25% C 25%, 50% 75%, 50% 50%, 25% 25%, 50%" />
      <path d="M 50%, 50% C 25%, 75% 75%, 75% 50%, 50% 25%, 25%" />
      <path d="M 50%, 75% C 25%, 25% 75%, 25% 25%, 75% 75%, 25%" />
      <path d="M 25%, 50% L 50%, 25% L 75%, 50%" />
      <path d="M 75%, 50% L 50%, 25% L 25%, 50%" />
      <path d="M 50%, 50% C 25%, 25% 75%, 25% 25%, 75% 75%, 25%" />
    </svg>
    <div class="particle" style="top: 10%; left: 30%;"></div>
    <div class="particle" style="top: 30%; left: 50%;"></div>
    <div class="particle" style="top: 50%; left: 20%;"></div>
    <div class="particle" style="top: 70%; left: 40%;"></div>
  </div>
        </div>
        </body>
        </html>
