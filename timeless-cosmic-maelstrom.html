<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Timeless Cosmic Maelstrom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% { transform: translate(50%, 50%) rotate(0deg) scale(1); }
    50% { transform: translate(-100%, 0px) rotate(360deg) scale(0.5); }
    100% { transform: translate(50%, 50%) rotate(0deg) scale(1); }
  }
  @keyframes core-pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }
  @keyframes neural-flicker {
    0% { transform: translate(50%, 50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.5); }
    100% { transform: translate(50%, 50%) scale(1); }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background-image: linear-gradient(135deg, #3b3f4e #1a2235);
  }
  .core {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: linear-gradient(135deg, #f0db4f, #fff);
    border-radius: 50%;
    box-shadow: 0 0 20px #fff, 
                 0 0 15px #fff, 
                 0 0 10px #fff, 
                 0 0 5px #fff, 
                 0 0 25px #fff,
                 0 0 35px #fff;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    background-image: linear-gradient(135deg, #1a2235, #3b3f4e);
  }
  .particle:nth-child(2) {
    animation: particle-dance 2s infinite;
    transform: translate(50%, 50%) rotate(0deg) scale(1);
  }
  .particle:nth-child(3) {
    animation: particle-dance 3s infinite;
    transform: translate(50%, 50%) rotate(0deg) scale(1);
  }
  .particle:nth-child(4) {
    animation: particle-dance 4s infinite;
    transform: translate(50%, 50%) rotate(0deg) scale(1);
  }
  .particle:nth-child(5) {
    animation: particle-dance 5s infinite;
    transform: translate(50%, 50%) rotate(0deg) scale(1);
  }
  .particle:nth-child(6) {
    animation: particle-dance 6s infinite;
    transform: translate(50%, 50%) rotate(0deg) scale(1);
  }
  .particle:nth-child(7) {
    animation: particle-dance 7s infinite;
    transform: translate(50%, 50%) rotate(0deg) scale(1);
  }
  .particle:nth-child(8) {
    animation: particle-dance 8s infinite;
    transform: translate(50%, 50%) rotate(0deg) scale(1);
  }
  .particle:nth-child(9) {
    animation: particle-dance 1s infinite;
    transform: translate(50%, 50%) rotate(0deg) scale(1);
  }
  .particle:nth-child(10) {
    animation: particle-dance 2s infinite;
    transform: translate(50%, 50%) rotate(0deg) scale(1);
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  .neural-web path {
    stroke: #fff;
    stroke-width: 2;
  }
  .neural-web path:nth-child(1) {
    stroke-dasharray: 100 100;
    stroke-dashoffset: 50;
  }
  .neural-web path:nth-child(2) {
    stroke-dasharray: 150 150;
    stroke-dashoffset: 75;
  }
  .neural-web path:nth-child(3) {
    stroke-dasharray: 200 200;
    stroke-dashoffset: 100;
  }
  .neural-web {
    animation: neural-flicker 6s infinite;
  }
  .core {
    animation: core-pulse 4s infinite;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            
        </div>
        </body>
        </html>
