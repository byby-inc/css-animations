<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Timeless Nebula Genesis</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            /* Styles */

  /* Keyframes */
  @keyframes particle-dance {
    0% {
      transform: translate(0, 0) rotate(0);
    }
    50% {
      transform: translate(30px, -10px) rotate(10deg);
    }
    100% {
      transform: translate(0, 0) rotate(0);
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.2);
    }
    100% {
      transform: scale(1);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: translate(0, 0);
    }
    50% {
      transform: translate(10px, -5px);
    }
    100% {
      transform: translate(0, 0);
    }
  }

  /* Styles */
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: linear-gradient(to bottom, #ff9900, #ff8800);
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    background: linear-gradient(to bottom, #fff, #ccc);
    box-shadow: 0 0 10px #fff, 0 0 10px #fff, 0 0 10px #fff, 0 0 10px #fff, 0 0 10px #fff, 0 0 10px #fff;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(to bottom, #fff, #ccc);
    animation: particle-dance infinite 5s ease-in-out;
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
    stroke-width: 2;
  }
  .neural-web path {
    animation: neural-flicker infinite 3s ease-in-out;
  }

  /* Initialize particles */
  .particle1 {
    top: 20%;
    left: 20%;
    background: linear-gradient(to bottom, #ff0000, #ff0033);
  }
  .particle2 {
    top: 30%;
    left: 40%;
    background: linear-gradient(to bottom, #00ff00, #33ff00);
  }
  .particle3 {
    top: 15%;
    left: 60%;
    background: linear-gradient(to bottom, #0000ff, #0033ff);
  }
  .particle4 {
    top: 50%;
    left: 80%;
    background: linear-gradient(to bottom, #ffff00, #ffff33);
  }
  .particle5 {
    top: 60%;
    left: 10%;
    background: linear-gradient(to bottom, #ff00ff, #ff33ff);
  }
  .particle6 {
    top: 80%;
    left: 30%;
    background: linear-gradient(to bottom, #ff9900, #ff6600);
  }
  .particle7 {
    top: 40%;
    left: 70%;
    background: linear-gradient(to bottom, #00ffff, #0033ff);
  }
  .particle8 {
    top: 70%;
    left: 50%;
    background: linear-gradient(to bottom, #ff00ff, #ff0099);
  }
  .particle9 {
    top: 10%;
    left: 90%;
    background: linear-gradient(to bottom, #ffff00, #ffcc00);
  }
  .particle10 {
    top: 90%;
    left: 20%;
    background: linear-gradient(to bottom, #9900ff, #6633ff);
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 100 100 L 200 200 L 100 200 Z" />
      <path d="M 300 50 L 350 150 L 300 50 Z" />
      <path d="M 200 150 L 220 220 L 180 150 Z" />
    </svg>
    <div class="particle particle1"></div>
    <div class="particle particle2"></div>
    <div class="particle particle3"></div>
    <div class="particle particle4"></div>
    <div class="particle particle5"></div>
    <div class="particle particle6"></div>
    <div class="particle particle7"></div>
    <div class="particle particle8"></div>
    <div class="particle particle9"></div>
    <div class="particle particle10"></div>
  </div>
        </div>
        </body>
        </html>
