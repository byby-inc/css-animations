<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Timeless Quantum Maelstrom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            .vortex-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100vh;
  clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  z-index: -1;
  background: linear-gradient(90deg, #3b9eff, #7fc9ff);
}

.core {
  position: absolute;
  top: 10%;
  left: 10%;
  transform: translate(-50%, -50%);
  width: 20vh;
  height: 20vh;
  border-radius: 50%;
  background: linear-gradient(0deg, #ff9900, #ff9900 70%, #fff 70%, #fff);
  box-shadow: 
  1px 1px 10px #ff6600,
  5px 5px 20px #ff9900,
  10px 10px 30px #ffcc00,
  15px 15px 40px #ffff00,
  20px 20px 50px #ccff00,
  25px 25px 60px #99ff00;
  animation: core-pulse 2s infinite linear;
}

.particle {
  position: absolute;
  top: 40%;
  left: 50%;
  border-radius: 50%;
  width: 5vh;
  height: 5vh;
  z-index: 1;
  background: linear-gradient(90deg, #3b9eff, #7fc9ff);
  box-shadow: 
  1px 1px 5px #33ccff,
  2px 2px 10px #66ffff,
  3px 3px 15px #33fff8;
  animation: particle-dance 3s infinite linear;
}

.neural-web {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 100%;
  height: 100%;
  fill: transparent;
  stroke: #fff;

  animation: neural-flicker 1s infinite linear;
}

#path1 {
  stroke-width: 10px;
  stroke-linecap: round;
  stroke-linejoin: round;
}
#path2 {
  stroke-width: 5px;
  stroke-linecap: round;
  stroke-linejoin: round;
  transform: rotate(-10deg);
}
#path3 {
  stroke-width: 2px;
  stroke-linecap: round;
  stroke-linejoin: round;
  transform: rotate(5deg);
}

@keyframes particle-dance {
  0% {
    transform: translate(-50%, -50%) rotate(0deg);
  }
  100% {
    transform: translate(-50%, -50%) rotate(360deg);
  }
}
@keyframes core-pulse {
  0% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.2);
  }
  100% {
    transform: scale(1);
  }
}
@keyframes neural-flicker {
  0% {
    transform: translate(-50%, -50%) rotate(0deg);
    stroke-opacity: 1;
  }
  50% {
    transform: translate(-50%, -50%) rotate(20deg);
    stroke-opacity: 0.5;
  }
  100% {
    transform: translate(-50%, -50%) rotate(0deg);
    stroke-opacity: 1;
  }
}

.vortex-container::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  background: linear-gradient(90deg, #333, #777);
  opacity: 0.5;
}
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web" viewBox="0 0 100 100" preserveAspectRatio="xMinYMin meet">
      <path id="path1" d="M 5 5 L 50 95 L 95 5" />
      <path id="path2" d="M 5 95 L 50 5 L 95 95" />
      <path id="path3" d="M 5 5 L 95 95 L 95 5" />
    </svg>
    <div class="particle"
      style="
      transform: translate(-50%, -50%) rotate(10deg);
      animation: particle-dance 3s infinite linear, box-shadow 2s infinite linear;
      box-shadow: 
      1px 1px 5px #33ccff,
      2px 2px 10px #66ffff,
      3px 3px 15px #33fff8;"
    ></div>
    <div class="particle"
      style="
      transform: translate(-50%, -50%) rotate(-20deg);
      animation: particle-dance 3.5s infinite linear, box-shadow 2.5s infinite linear;
      box-shadow: 
      1px 1px 5px #33ccff,
      2px 2px 10px #66ffff,
      3px 3px 15px #33fff8;"
    ></div>
    <div class="particle"
      style="
      transform: translate(-50%, -50%) rotate(15deg);
      animation: particle-dance 4s infinite linear, box-shadow 3s infinite linear;
      box-shadow: 
      1px 1px 5px #33ccff,
      2px 2px 10px #66ffff,
      3px 3px 15px #33fff8;"
    ></div>
    <div class="particle"
      style="
      transform: translate(-50%, -50%) rotate(-5deg);
      animation: particle-dance 4.5s infinite linear, box-shadow 3.5s infinite linear;
      box-shadow: 
      1px 1px 5px #33ccff,
      2px 2px 10px #66ffff,
      3px 3px 15px #33fff8;"
    ></div>
    <div class="particle"
      style="
      transform: translate(-50%, -50%) rotate(25deg);
      animation: particle-dance 5s infinite linear, box-shadow 4s infinite linear;
      box-shadow: 
      1px 1px 5px #33ccff,
      2px 2px 10px #66ffff,
      3px 3px 15px #33fff8;"
    ></div>
  </div>
        </div>
        </body>
        </html>
