<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Timeless Quantum Vortex</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: translate(-50%, -50%) rotate(0deg);
    }
    50% {
      transform: translate(-50%, -50%) rotate(360deg);
    }
    100% {
      transform: translate(-50%, -50%) rotate(720deg);
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.1);
    }
    100% {
      transform: scale(1);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: scale(1) translate(0px, 0px);
    }
    50% {
      transform: scale(1.2) translate(-10px, -10px);
    }
    100% {
      transform: scale(1) translate(0px, 0px);
    }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: linear-gradient(to bottom right, #6495ED, #03A9F4);
    background-blend-mode: overlay;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    background: linear-gradient(to bottom right, #8E44AD, #2ECC71);
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: linear-gradient(to bottom right, #E74C3C, #2ecc71);
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 0, 0, 0.5), 0 0 25px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 0, 0, 0.5), 0 0 35px rgba(0, 0, 0, 0.5);
    animation: core-pulse 5s infinite;
  }
  .particle {
    animation: particle-dance 3s infinite;
  }
  path {
    stroke: #fff;
    stroke-width: 2;
    fill: none;
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  .neural-web path:first-child {
    transform: scale(1) translate(0px, 100px);
  }
  .neural-web path:last-child {
    transform: scale(1) translate(0px, -100px);
  }
  .neural-web path:nth-child(2) {
    transform: scale(1) translate(50px, 0px);
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.1);
    }
    100% {
      transform: scale(1);
    }
  }
  @keyframes particle-dance {
    0% {
      transform: translate(-50%, -50%) rotate(0deg);
    }
    50% {
      transform: translate(-50%, -50%) rotate(360deg);
    }
    100% {
      transform: translate(-50%, -50%) rotate(720deg);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: scale(1) translate(0px, 0px);
    }
    50% {
      transform: scale(1.2) translate(-10px, -10px);
    }
    100% {
      transform: scale(1) translate(0px, 0px);
    }
  }
  .neural-web path {
    animation: neural-flicker 2s infinite;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core">
    </div>
    <svg class="neural-web">
      <path d="M0 100 L0 0 L400 200 L0 400" />
      <path d="M0 200 L0 0 L200 400 L0 200" />
      <path d="M0 300 L0 0 L300 500 L0 300" />
      <path d="M0 400 L0 0 L400 600 L0 400" />
      <path d="M0 500 L0 0 L500 700 L0 500" />
      <path d="M0 600 L0 0 L600 800 L0 600" />
      <path d="M100 100 L0 0 L200 200 L100 100" />
      <path d="M200 200 L0 0 L300 300 L200 200" />
      <path d="M300 300 L0 0 L400 400 L300 300" />
      <path d="M400 400 L0 0 L500 500 L400 400" />
    </svg>
    <div class="particle" style="top: 50px; left: 0px;"></div>
    <div class="particle" style="top: 0px; left: 50px;"></div>
    <div class="particle" style="top: 0px; left: 100px;"></div>
    <div class="particle" style="top: 20px; left: 150px;"></div>
    <div class="particle" style="top: 25px; left: 200px;"></div>
    <div class="particle" style="top: 15px; left: 250px;"></div>
  </div>
        </div>
        </body>
        </html>
