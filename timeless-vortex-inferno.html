<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Timeless Vortex Inferno</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            /* KEYFRAMES */
  @keyframes particle-dance {
    0% { transform: scale(1) translateX(0) translateY(0); }
    50% { transform: scale(1.2) translateX(-5px) translateY(-5px); }
    100% { transform: scale(1) translateX(0) translateY(0); }
  }
  @keyframes core-pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  @keyframes neural-flicker {
    0% { transform: rotate(0deg); }
    50% { transform: rotate(5deg); }
    100% { transform: rotate(0deg); }
  }
  
  /* STYLES */
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  }
  
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: linear-gradient(to bottom, #ff9900, #ff0033, #ff0033, #ff9900);
    box-shadow: 0 0 10px rgba(255, 0, 0, 0.5), 0 0 20px rgba(255, 0, 0, 0.7), 0 0 30px rgba(255, 0, 0, 0.9), 0 0 40px rgba(255, 0, 0, 1), 0 0 50px rgba(255, 0, 0, 1), 0 0 60px rgba(255, 0, 0, 1);
    animation: core-pulse 2s infinite;
  }
  
  .particle {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: linear-gradient(to right, #ff0000, #ff9900);
    animation: particle-dance 1s infinite;
  }
  
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: transparent;
  }
  
  .neural-web path {
    stroke: #fff;
    opacity: 0.5;
  }
  
  @media ( prefers-reduced-motion: no-preference ) {
    .particle {
      animation: particle-dance 1s infinite;
    }
    .neural-web path {
      animation: neural-flicker 2s infinite;
    }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core">
      
    </div>
    <svg class="neural-web">
      <path d="M 0,-50 A 75,75 0 0,1 150,50 A 75,75 0 0,1 300,0 A 75,75 0 0,1 300,150 A 75,75 0 0,1 150,200 A 75,75 0 0,1 0,200" />
      <path d="M 0,-75 A 75,75 0 0,1 150,25 A 75,75 0 0,1 300,50 A 75,75 0 0,1 300,175 A 75,75 0 0,1 150,250 A 75,75 0 0,1 0,250" />
      <path d="M 0,-90 A 75,75 0 0,1 150,-25 A 75,75 0 0,1 300,10 A 75,75 0 0,1 300,185 A 75,75 0 0,1 150,260 A 75,75 0 0,1 0,260" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
