<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Transcendent Aurora Genesis</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% { transform: translate(50px, 50px) rotate(0deg); }
    100% { transform: translate(-50px, -50px) rotate(360deg); }
  }

  @keyframes core-pulse {
    0% { transform: scale(1); }
    100% { transform: scale(1.5); }
  }

  @keyframes neural-flicker {
    0% { transform: translate(0,0); }
    100% { transform: translate(20px, 20px); }
  }

  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: circle(50% at 50% 50%);
    background: linear-gradient(to bottom right, #4cd1ff, #f9f2ff);
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(to bottom right, #f7d2c4, #f5e9e5);
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1),
                0 0 20px rgba(0, 0, 0, 0.1),
                0 0 30px rgba(0, 0, 0, 0.1),
                0 0 40px rgba(0, 0, 0, 0.1),
                0 0 50px rgba(0, 0, 0, 0.1),
                0 0 60px rgba(0, 0, 0, 0.1);
  }

  .particle {
    position: absolute;
    background: linear-gradient(to bottom right, #5c78ff, #ff99cc);
    border-radius: 50%;
  }

  .neural-web {
    position: absolute;
    fill: none;
    stroke: #fff;
    stroke-width: 2px;
  }
  
  .particle:nth-child(1) {
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: particle-dance 5s infinite;
  }

  .particle:nth-child(2) {
    top: 10%;
    left: 50%;
    animation: particle-dance 5s infinite;
  }

  .particle:nth-child(3) {
    top: 80%;
    left: 50%;
    animation: particle-dance 5s infinite;
  }

  .particle:nth-child(4) {
    top: 50%;
    left: 10%;
    animation: particle-dance 5s infinite;
  }

  .particle:nth-child(5) {
    top: 50%;
    left: 80%;
    animation: particle-dance 5s infinite;
  }

  .particle:nth-child(6) {
    top: 30%;
    left: 60%;
    animation: particle-dance 5s infinite;
  }

  .particle:nth-child(7) {
    top: 70%;
    left: 30%;
    animation: particle-dance 5s infinite;
  }

  .particle:nth-child(8) {
    top: 60%;
    left: 20%;
    animation: particle-dance 5s infinite;
  }

  .particle:nth-child(9) {
    top: 40%;
    left: 70%;
    animation: particle-dance 5s infinite;
  }

  .particle:nth-child(10) {
    top: 20%;
    left: 40%;
    animation: particle-dance 5s infinite;
  }

  .core {
    animation: core-pulse 10s infinite;
  }

  .neural-web {
    animation: neural-flicker 3s infinite;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M100 100 L300 100 L200 300 Z"></path>
      <path d="M300 300 L200 100 L100 300 Z"></path>
      <path d="M200 200 L300 300 L100 100 Z"></path>
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
