<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Transcendent Celestial Maelstrom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: rotate(0deg) translateX(0%) translateY(0%);
    }
    100% {
      transform: rotate(360deg) translateX(20%) translateY(-20%);
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    100% {
      transform: scale(1.2);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: rotate(0deg) translateX(0%) translateY(0%);
    }
    100% {
      transform: rotate(-5deg) translateX(-5%) translateY(5%);
    }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: linear-gradient(to right, #1a1d23, #000);
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: linear-gradient(to bottom, #fff, #ccc);
    box-shadow: 
      0px 0px 10px #333, 
      0px 0px 5px #555, 
      2px 0px 10px #666, 
      -5px 2px 15px #777, 
      -10px -5px 20px #888, 
      5px -10px 25px #999;
    animation: core-pulse infinite 2s;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    width: 10px;
    height: 10px;
    background: linear-gradient(to right, #ff69b4, #ff99cc);
    animation: particle-dance infinite 4s;
  }
  @for $i from 1 through 10 {
    .particle:nth-child(#{$i}) {
      transform: rotate(0deg) translateX(#{rand(100)}%) translateY(#{rand(100)}%);
    }
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: #fff;
  }
  .neural-web path {
    stroke: #fff;
    stroke-width: 1px;
  }
  @keyframes neural-flicker {
    0% {
      transform: rotate(0deg) translateX(0%) translateY(0%);
    }
    100% {
      transform: rotate(-5deg) translateX(-5%) translateY(5%);
    }
  }
  .neural-web path {
    animation: neural-flicker infinite 1s;
  }
  @for $i from 1 through 3 {
    .neural-web path:nth-child(#{$i}) {
      transform: rotate(#{random(360)}deg);
    }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 0,0 L 50,100 L 100,0 Z"></path>
      <path d="M 0,100 L 50,200 L 100,100 Z"></path>
      <path d="M 100,100 L 50,150 L 0,100 Z"></path>
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
