<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Transcendent Cosmic Ascension</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            .vortex-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  clip-path: polygon(25% 0%,75% 0%,100% 25%,50% 100%,0% 25%);
  background: conic-gradient(from 90deg at 50% 50%, #3498db, #2980b9);
  animation: neural-flicker 8s infinite;
}

.particle {
  position: absolute;
  border-radius: 50%;
  background: linear-gradient(45deg, #3498db, #2980b9);
  animation: particle-dance 1.5s infinite;
}
.particle:nth-child(1) {
  top: 10%;
  left: calc(50% - 50px);
  background: radial-gradient(50% 50%, #66d9ef, #66d9ef, #3498db);
}
.particle:nth-child(2) {
  top: 30%;
  left: calc(50% - 50px);
  background: radial-gradient(50% 50%, #66d9ef, #3498db);
}
.particle:nth-child(3) {
  top: 50%;
  left: 20%;
  background: radial-gradient(50% 50%, #66d9ef, #3498db);
}
.particle:nth-child(4) {
  top: 60%;
  left: calc(50% - 50px);
  background: radial-gradient(50% 50%, #66d9ef, #2980b9);
}
.particle:nth-child(5) {
  top: 80%;
  left: 50%;
  background: linear-gradient(45deg, #66d9ef, #3498db);
}
.particle:nth-child(6) {
  top: 10%;
  left: calc(50% - 50px);
  background: radial-gradient(50% 50%, #66d9ef, #66d9ef, #2980b9);
}
.particle:nth-child(7) {
  top: 30%;
  left: calc(50% - 50px);
  background: radial-gradient(50% 50%, #66d9ef, #66d9ef, #2980b9);
}
.particle:nth-child(8) {
  top: 50%;
  left: 20%;
  background: radial-gradient(50% 50%, #66d9ef, #2980b9);
}
.particle:nth-child(9) {
  top: 60%;
  left: calc(50% - 50px);
  background: linear-gradient(45deg, #66d9ef, #2980b9);
}
.particle:nth-child(10) {
  top: 80%;
  left: 50%;
  background: radial-gradient(50% 50%, #66d9ef, #2980b9);
}

@keyframes particle-dance {
  0% {
    transform: translate(-50%, -50%) rotate(0deg);
  }
  25% {
    transform: translate(-50%, -50%) rotate(360deg);
  }
  50% {
    transform: translate(-50%, -50%) rotate(720deg);
  }
  75% {
    transform: translate(-50%, -50%) rotate(1080deg);
  }
  100% {
    transform: translate(-50%, -50%) rotate(1440deg);
  }
}

.core {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 200px;
  height: 200px;
  background: conic-gradient(from 90deg at 50% 50%, #3498db, #2980b9);
  clip-path: circle(50% at 50% 50%);
  box-shadow: 0 0 20px #333, 0 0 30px #333, 0 0 40px #333, 0 0 50px #333, 0 0 60px #333, 0 0 70px #333;
  animation: core-pulse 4s infinite;
}
@keyframes core-pulse {
  0% {
    transform: scale(1);
  }
  25% {
    transform: scale(1.1);
  }
  50% {
    transform: scale(1);
  }
  75% {
    transform: scale(1.1);
  }
  100% {
    transform: scale(1);
  }
}

.neural-web {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  fill: none;
  stroke: #fff;
  animation: neural-flicker 8s infinite;
}
.neural-web path {
  stroke-width: 10px;
}
.neural-web path:nth-child(1) {
  stroke-dasharray: 1500;
  stroke-dashoffset: 1500;
}
@keyframes neural-flicker {
  0% {
    transform: scale(1);
  }
  20% {
    transform: scale(1.2);
  }
  40% {
    transform: scale(1);
  }
  60% {
    transform: scale(1.2);
  }
  80% {
    transform: scale(1);
  }
  100% {
    transform: scale(1);
  }
}
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 100 100 C 200 200 300 300 400 400" />
      <path d="M 200 200 C 400 400 600 600 800 800" />
      <path d="M 300 300 C 700 700 1000 1000 1300 1300" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
