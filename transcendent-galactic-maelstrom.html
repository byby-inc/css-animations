<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Transcendent Galactic Maelstrom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    from {
      transform: rotate(0deg) translateX(50px);
    }
    to {
      transform: rotate(360deg) translateX(-50px);
    }
  }
  @keyframes core-pulse {
    from {
      transform: scale(1);
      opacity: 1;
    }
    to {
      transform: scale(1.2);
      opacity: 0.8;
    }
  }
  @keyframes neural-flicker {
    from {
      transform: translate(0, 0);
    }
    to {
      transform: translate(0, 10px);
    }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(to bottom, #33ccff, #66ffff);
    border-radius: 50%;
    box-shadow:
      0 0 10px rgba(255, 255, 255, 0.2),
      0 0 20px rgba(255, 255, 255, 0.4),
      0 0 30px rgba(255, 255, 255, 0.6),
      0 0 40px rgba(255, 255, 255, 0.8),
      0 0 50px rgba(255, 255, 255, 1);
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(to bottom, #66ffff, #33ccff);
    animation: particle-dance infinite 2s;
  }
  .particle:nth-child(1) {
    top: 20%;
    left: 20%;
  }
  .particle:nth-child(2) {
    top: 30%;
    left: 40%;
  }
  .particle:nth-child(3) {
    top: 50%;
    left: 10%;
  }
  .particle:nth-child(4) {
    top: 60%;
    left: 60%;
  }
  .particle:nth-child(5) {
    top: 80%;
    left: 20%;
  }
  .particle:nth-child(6) {
    top: 90%;
    left: 40%;
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: #fff;
  }
  .neural-web path {
    stroke: #fff;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-dasharray: 10;
    stroke-dashoffset: -50;
    animation: neural-flicker infinite 1s;
  }
  .neural-web path:nth-child(1) {
    d: M 0 50 A 50 50 0 0 1 50 50 A 50 50 0 0 1 100 50;
    transform: translate(10px, 10px);
  }
  .neural-web path:nth-child(2) {
    d: M 0 50 A 50 50 0 0 1 50 50 A 50 50 0 0 1 100 50;
    transform: translate(30px, 20px);
    stroke-dasharray: 15;
    stroke-dashoffset: 0;
  }
  .neural-web path:nth-child(3) {
    d: M 0 50 A 50 50 0 0 1 50 50 A 50 50 0 0 1 100 50;
    transform: translate(50px, 30px);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-dasharray: 10;
    stroke-dashoffset: 0;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 0 50 A 50 50 0 0 1 50 50 A 50 50 0 0 1 100 50"></path>
      <path d="M 0 50 A 50 50 0 0 1 50 50 A 50 50 0 0 1 100 50"></path>
      <path d="M 0 50 A 50 50 0 0 1 50 50 A 50 50 0 0 1 100 50"></path>
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
