<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Transcendent Gravity Convergence</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% { transform: translate(0, 0) rotate(0); }
    100% { transform: translate(50px, -50px) rotate(360deg); }
  }
  @keyframes core-pulse {
    0% { transform: scale(1); }
    100% { transform: scale(1.2); }
  }
  @keyframes neural-flicker {
    0% { transform: translate(-10px, -10px) scale(0.9); }
    100% { transform: translate(10px, 10px) scale(1.1); }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%,75% 0%,100% 25%,50% 100%,0% 25%);
    background-image: linear-gradient(to bottom, #141414, #0a0a0a);
  }
  .vortex-container::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: linear-gradient(to top, #1c1c1c, #2f2f2f);
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background-image: linear-gradient(to top, #333, #1a1a1a);
    box-shadow:
      0 0 20px -5px #4e4e4e,
      0 0 20px 5px #4e4e4e,
      0 0 50px -10px #6b6b6b,
      0 0 50px 10px #6b6b6b,
      0 0 100px -15px #939393,
      0 0 100px 15px #939393;
    animation: core-pulse 2s infinite;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    background-image: linear-gradient(to bottom, #0a0a0a, #141414);
    animation: particle-dance 5s infinite;
  }
  .particle.p1 {
    top: 50%;
    left: 70%;
    background-image: linear-gradient(to bottom, #1c1c1c, #2f2f2f);
    animation-duration: 3s;
  }
  .particle.p2 {
    top: 30%;
    left: 40%;
    background-image: linear-gradient(to bottom, #333, #1a1a1a);
    animation-duration: 2s;
  }
  .particle.p3 {
    top: 20%;
    left: 10%;
    background-image: linear-gradient(to bottom, #333, #1a1a1a);
    animation-duration: 4s;
  }
  .particle.p4 {
    top: 60%;
    left: 90%;
    background-image: linear-gradient(to bottom, #333, #1a1a1a);
    animation-duration: 1s;
  }
  .particle.p5 {
    top: 80%;
    left: 40%;
    background-image: linear-gradient(to bottom, #333, #1a1a1a);
    animation-duration: 2s;
  }
  .particle.p6 {
    top: 10%;
    left: 80%;
    background-image: linear-gradient(to bottom, #333, #1a1a1a);
    animation-duration: 4s;
  }
  .particle.p7 {
    top: 40%;
    left: 20%;
    background-image: linear-gradient(to bottom, #333, #1a1a1a);
    animation-duration: 3s;
  }
  .particle.p8 {
    top: 90%;
    left: 50%;
    background-image: linear-gradient(to bottom, #333, #1a1a1a);
    animation-duration: 1s;
  }
  .particle.p9 {
    top: 20%;
    left: 60%;
    background-image: linear-gradient(to bottom, #333, #1a1a1a);
    animation-duration: 4s;
  }
  .particle.p10 {
    top: 60%;
    left: 10%;
    background-image: linear-gradient(to bottom, #333, #1a1a1a);
    animation-duration: 3s;
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .neural-web path {
    stroke-dasharray: 500, 500;
    animation: neural-flicker 10s infinite;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>
    <div class="particle p5"></div>
    <div class="particle p6"></div>
    <div class="particle p7"></div>
    <div class="particle p8"></div>
    <div class="particle p9"></div>
    <div class="particle p10"></div>
    <svg class="neural-web">
      <path d="M 50 50 L 50 100 L 100 100 L 100 200 L 50 200 Z" />
      <path d="M 150 150 L 150 200 L 200 200 L 200 150 L 150 150 Z" />
      <path d="M 250 250 L 250 300 L 300 300 L 300 250 L 250 250 Z" />
    </svg>
  </div>
        </div>
        </body>
        </html>
