<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Transcendent Maelstrom Genesis</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% { transform: translate(0, 0); }
    100% { transform: translate(100px, 100px); }
  }
  @keyframes core-pulse {
    0% { transform: scale(1); }
    100% { transform: scale(1.2); }
  }
  @keyframes neural-flicker {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(to bottom, #333, #555);
    animation: core-pulse 2s infinite;
  }
  .core::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    height: 100%;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    background: linear-gradient(to bottom, #f00, #ff0);
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(to bottom, #0f0, #f0f);
  }
  .particle:nth-child(even) {
    background: linear-gradient(to bottom, #00f, #0ff);
  }
  @for $i from 1 through 10 {
    .particle:nth-child($i) {
      animation: particle-dance 3s #{$i*0.3}s infinite;
      top: #{random(500)}px;
      left: #{random(500)}px;
    }
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
  }
  .neural-web path {
    stroke: #fff;
    stroke-width: 2;
  }
  .neural-web path:nth-child(1) {
    stroke-dasharray: 100 200;
    animation: neural-flicker 1s infinite;
  }
  .neural-web path:nth-child(2) {
    stroke-dasharray: 200 300;
    animation: neural-flicker 2s infinite;
  }
  .neural-web path:nth-child(3) {
    stroke-dasharray: 300 400;
    animation: neural-flicker 3s infinite;
  }
  .neural-web path {
    transition: stroke-dasharray 0.5s;
  }
  @keyframes neural-flicker {
    0% { stroke-dashoffset: 100; }
    100% { stroke-dashoffset: -100; }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M50 0 A50 50 0 0 0 0 0" />
      <path d="M0 50 A50 50 0 0 0 50 0" />
      <path d="M50 100 A50 50 0 0 0 0 100" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
