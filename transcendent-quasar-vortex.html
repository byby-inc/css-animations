<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Transcendent Quasar Vortex</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
      transform: translate(0, 0) rotate(0);
    }
    50% {
      transform: translate(20%, 20%) rotate(20deg);
    }
    100% {
      transform: translate(0, 0) rotate(0);
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.1);
    }
    100% {
      transform: scale(1);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: rotate(0deg);
      transform: scale(1);
    }
    50% {
      transform: rotate(10deg);
      transform: scale(1.05);
    }
    100% {
      transform: rotate(0deg);
      transform: scale(1);
    }
  }
  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background: linear-gradient(to bottom, #3b3f4f, #28282b);
  }
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(to bottom, #ff69b4, #ff00ff);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    box-shadow: 0px 0px 10px rgba(255, 0, 0, 0.5),
                0px 0px 20px rgba(255, 0, 0, 0.5),
                0px 0px 30px rgba(255, 0, 0, 0.5),
                0px 0px 40px rgba(255, 0, 0, 0.5),
                0px 0px 50px rgba(255, 0, 0, 0.5),
                0px 0px 60px rgba(255, 0, 0, 0.5);
    animation: core-pulse 2s infinite;
  }
  .particle {
    position: absolute;
    background: linear-gradient(to bottom, #ff00ff, #ff69b4);
    border-radius: 50%;
    box-shadow: 0px 0px 10px rgba(255, 0, 0, 0.5);
    width: 20px;
    height: 20px;
    animation: particle-dance 3s infinite;
  }
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
  }
  .neural-web path {
    stroke-width: 2;
  }
  @keyframes particle-dance {
    0% {
      transform: translate(0, 0) rotate(0);
    }
    50% {
      transform: translate(20%, 20%) rotate(20deg);
    }
    100% {
      transform: translate(0, 0) rotate(0);
    }
  }
  @keyframes core-pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.1);
    }
    100% {
      transform: scale(1);
    }
  }
  @keyframes neural-flicker {
    0% {
      transform: rotate(0deg);
      transform: scale(1);
    }
    50% {
      transform: rotate(10deg);
      transform: scale(1.05);
    }
    100% {
      transform: rotate(0deg);
      transform: scale(1);
    }
  }
  .neural-web rect {
    stroke-width: 2;
  }
  .neural-web rect:nth-child(1) {
    transform: rotate(10deg);
  }
  .neural-web rect:nth-child(2) {
    transform: rotate(-20deg);
  }
  .neural-web rect:nth-child(3) {
    transform: rotate(30deg);
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M 50 50 Q 70 20 90 50" />
      <path d="M 60 50 Q 80 30 100 50" />
      <path d="M 70 50 Q 90 40 110 50" />
      <rect x="10" y="10" width="20" height="20" fill="#fff" />
      <rect x="15" y="15" width="25" height="25" fill="#fff" />
      <rect x="20" y="20" width="30" height="30" fill="#fff" />
      <rect x="25" y="25" width="35" height="35" fill="#fff" />
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
