<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Transcendent Singularity Genesis</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 50% 100%, 0% 25%);
    background-image: linear-gradient(135deg, #2c3e50, #2d7eb8);
  }
  .vortex-container::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: radial-gradient(white, #f1c40f, #3498db);
  }
  
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background-image: linear-gradient(135deg, #2d7eb8, #2c3e50);
    width: 20vh;
    height: 20vh;
    border-radius: 50%;
    box-shadow:
      0 0 2px #fff,
      0 0 2px #fff,
      0 0 2px #fff,
      0 0 2px #fff,
      0 0 2px #fff,
      0 0 10px #fff;
  }
  
  .particle {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background-image: linear-gradient(135deg, #2c3e50, #2d7eb8);
    width: 8vh;
    height: 8vh;
    border-radius: 50%;
  }
  
  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  .neural-web path {
    stroke: #fff;
    stroke-width: 2;
    stroke-linecap: round;
  }
  @keyframes particle-dance {
    0% { transform: rotate(0deg) translate(0vh, 0vh); }
    50% { transform: rotate(360deg) translate(5vh, 0vh); }
    100% { transform: rotate(720deg) translate(0vh, 0vh); }
  }
  @keyframes core-pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  @keyframes neural-flicker {
    0% { transform: rotate(0deg) translate(0vh, 0vh); }
    20% { transform: rotate(45deg) translate(2vh, 1vh); }
    50% { transform: rotate(90deg) translate(0vh, 3vh); }
    80% { transform: rotate(135deg) translate(2vh, 2vh); }
    100% { transform: rotate(180deg) translate(0vh, 0vh); }
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M0 0v100h100v-100h-100zM100 0v100h100v-100h-100zM0 100v100h100v-100h-100zm100 0v100h100v-100h-100">
      </path>
      <path d="M50 0v100h50v-100h-50zM50 50v100h50v-100h-50zm50 0v100h50v-100h-50">
      </path>
      <path d="M75 25v100h25v-100h-25zM75 50v100h25v-100h-25zm50 0v100h25v-100h-25">
      </path>
    </svg>
    <div class="particle" style="animation-duration: 4s;"></div>
    <div class="particle" style="animation-duration: 6s;"></div>
    <div class="particle" style="animation-duration: 8s;"></div>
    <div class="particle" style="animation-duration: 2s;"></div>
    <div class="particle" style="animation-duration: 3s;"></div>
    <div class="particle" style="animation-duration: 1s;"></div>
    <div class="particle" style="animation-duration: 5s;"></div>
    <div class="particle" style="animation-duration: 9s;"></div>
  </div>
        </div>
        </body>
        </html>
