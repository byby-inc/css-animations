<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Transcendent Supernova Horizon</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
    0% {
    transform: rotate(0deg) translate(0px, 0px);
    }
    50% {
    transform: rotate(359deg) translate(-100px, -100px);
    }
    100% {
    transform: rotate(359deg) translate(100px, 100px);
    }
  }

  @keyframes core-pulse {
    0% {
    transform: scale(1);
    }
    50% {
    transform: scale(1.1);
    }
    100% {
    transform: scale(1);
    }
  }

  @keyframes neural-flicker {
    0% {
    transform: matrix(1, 0, 0, 1, 0, 0);
    }
    50% {
    transform: matrix(1.2, 0, 0, 1.2, 0, 0);
    }
    100% {
    transform: matrix(1, 0, 0, 1, 0, 0);
    }
  }

  .vortex-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    clip-path: circle(50% at 50% 50%);
    background: linear-gradient(90deg, #ff9900 0, #cc6600 100%);
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: linear-gradient(90deg, #33ccff 0, #0099ff 100%);
    box-shadow:
    0 0 0 0 rgba(0, 153, 204, 0.5),
    0 0 0 5px rgba(0, 102, 153, 0.3),
    0 0 0 10px rgba(51, 204, 255, 0.2),
    0 0 0 15px rgba(51, 204, 255, 0.1),
    0 0 0 20px rgba(51, 204, 255, 0.05);
  }

  .core::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: linear-gradient(90deg, #33ccff 0, #0099ff 100%);
    box-shadow:
    0 0 0 0 rgba(0, 153, 204, 0.5),
    0 0 0 5px rgba(0, 102, 153, 0.3),
    0 0 0 10px rgba(51, 204, 255, 0.2),
    0 0 0 15px rgba(51, 204, 255, 0.1),
    0 0 0 20px rgba(51, 204, 255, 0.05);
    animation: core-pulse 2s infinite;
  }

  .particle {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: linear-gradient(90deg, #cc9900 0, #ff6600 100%);
    animation: particle-dance 1s infinite;
  }

  .particle:nth-child(1) {
    top: 10%;
    left: 10%;
  }

  .particle:nth-child(2) {
    top: 70%;
    left: 80%;
  }

  .particle:nth-child(3) {
    top: 40%;
    left: 30%;
  }

  .particle:nth-child(4) {
    top: 20%;
    left: 90%;
  }

  .particle:nth-child(5) {
    top: 80%;
    left: 40%;
  }

  .particle:nth-child(6) {
    top: 60%;
    left: 10%;
  }

  .particle:nth-child(7) {
    top: 50%;
    left: 50%;
  }

  .particle:nth-child(8) {
    top: 30%;
    left: 70%;
  }

  .particle:nth-child(9) {
    top: 90%;
    left: 20%;
  }

  .particle:nth-child(10) {
    top: 40%;
    left: 80%;
  }

  .particle:nth-child(11) {
    top: 10%;
    left: 60%;
  }

  .particle:nth-child(12) {
    top: 80%;
    left: 30%;
  }

  .neural-web {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .neural-web path {
    stroke: #fff;
    stroke-width: 1px;
  }
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
    <div class="core"></div>
    <svg class="neural-web">
      <path d="M50 50 L 50 0 L 100 50 L 50 100 Z" />
      <path d="M50 50 L 0 100 L 100 50 L 50 0 Z" />
      <path d="M100 50 L 100 0 L 150 50 L 100 100 Z" />
    </svg>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
        </div>
        </body>
        </html>
