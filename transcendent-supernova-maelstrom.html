<!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <title>Transcendent Supernova Maelstrom</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            /* Background color and style */
            body {
                background-image: url("/thumb"); 
                background-repeat: no-repeat;   
                background-position: center center;              
                background-size: cover;    
                background-attachment: fixed;          
                background-color: black; 
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 100vw; 
                overflow: hidden;
            }

           

            /* Animation container */
            .animation-container {
            position: absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: transparent;
            }

            @keyframes particle-dance {
  0% { transform: translate(-200%, -200%) rotate(0deg); }
  50% { transform: translate(-50%, -75%) rotate(360deg); }
  100% { transform: translate(-200%, -200%) rotate(720deg); }
}

@keyframes core-pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); }
}

@keyframes neural-flicker {
  0% { transform: scale(1) translate(0, 0); }
  50% { transform: scale(0.9) translate(0, 10px); }
  100% { transform: scale(1) translate(0, 0); }
}

.vortex-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  clip-path: polygon(25% 0%,75% 0%,100% 25%,50% 100%,0% 25%);
  background: linear-gradient(180deg, #03055B, #3B32C4);
}

.core {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: radial-gradient(#B3F4FF, #E7F0F7);
  box-shadow: 0 0 10px rgba(0,0,0,0.2);
  box-shadow: 10px 10px 20px rgba(0,0,0,0.1);
  box-shadow: -10px 10px 20px rgba(0,0,0,0.1);
  box-shadow: 10px -10px 20px rgba(0,0,0,0.1);
  box-shadow: -10px -10px 20px rgba(0,0,0,0.1);
  box-shadow: 5px 5px 20px rgba(0,0,0,0.3);
  box-shadow: -5px 5px 20px rgba(0,0,0,0.3);
  box-shadow: 5px -5px 20px rgba(0,0,0,0.3);
  box-shadow: -5px -5px 20px rgba(0,0,0,0.3);
  animation: core-pulse 2s infinite;
}

.particle {
  position: absolute;
  border-radius: 50%;
  background: linear-gradient(90deg, #E5E5EA, #A9A9A9);
  animation: particle-dance 1.5s infinite;
}

.particle:nth-child(1) { top: 20%; left: 20%; }
.particle:nth-child(2) { top: 70%; left: 70%; }
.particle:nth-child(3) { top: 30%; left: 90%; }
.particle:nth-child(4) { top: 50%; left: 10%; }
.particle:nth-child(5) { top: 80%; left: 80%; }
.particle:nth-child(6) { top: 40%; left: 20%; }
.particle:nth-child(7) { top: 60%; left: 90%; }
.particle:nth-child(8) { top: 20%; left: 80%; }
.particle:nth-child(9) { top: 80%; left: 10%; }
.particle:nth-child(10) { top: 50%; left: 60%; }

.neural-web {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  fill: #fff;
}

.neural-web path {
  stroke: #fff;
  stroke-width: 2px;
}

.neural-web path:nth-child(1) {
  d: M 10 10 v 50 h 150 v 50 h -150 v -20;
}
.neural-web path:nth-child(2) {
  d: M 150 20 v 10 h 50 v 10 h -50 v -20;
}
.neural-web path:nth-child(3) {
  d: M 150 90 h 20 v 50 h 20 v -50;
}

.neural-web {
  animation: neural-flicker 1.2s infinite;
}
        </style>
        </head>
        <body>

        <div class="animation-container">
            <div class="vortex-container">
  <div class="core"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <svg class="neural-web"></svg>
</div>
        </div>
        </body>
        </html>
